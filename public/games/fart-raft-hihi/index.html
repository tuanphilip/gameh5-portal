<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#6fb84f;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#3a2410;-webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none}
canvas{display:block}
#safe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.ov{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center;background:rgba(20,50,30,.35);z-index:10;padding:calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom));overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.hide{display:none!important}
.panel{margin:auto;background:#fff8e6;border:5px solid #7a4a1d;border-radius:24px;box-shadow:0 10px 0 #5a3412,0 18px 40px rgba(0,0,0,.35);padding:16px 20px;max-width:760px;width:100%;text-align:center;position:relative}
.mtop{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.mtop select{font:inherit;font-weight:bold;font-size:14px;border:3px solid #7a4a1d;border-radius:12px;background:#ffe39a;color:#5a3412;padding:5px 6px;max-width:250px}
.logo{font-size:44px;line-height:1.05;color:#ff7b29;text-shadow:3px 3px 0 #7a4a1d,-2px -2px 0 #fff;letter-spacing:1px;margin:4px 0 2px}
.logo span{color:#38b000}
.tag{font-weight:bold;color:#7a4a1d;margin-bottom:8px;font-size:15px}
.sec{margin:9px 0}
.lbl{font-weight:900;font-size:14px;color:#a0521a;text-transform:uppercase;margin-bottom:6px;letter-spacing:.5px}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.btn{font:inherit;font-weight:900;font-size:16px;border:3px solid #7a4a1d;border-radius:14px;background:#ffe39a;color:#5a3412;padding:8px 14px;cursor:pointer;box-shadow:0 4px 0 #7a4a1d;transition:transform .08s;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #7a4a1d}
.btn.on{background:#ff9f43;color:#fff;text-shadow:1px 1px 0 #7a4a1d}
.big{font-size:22px;padding:12px 26px;background:#38b000;color:#fff;text-shadow:2px 2px 0 #1f6b00;border-color:#1f6b00;box-shadow:0 5px 0 #1f6b00;margin-top:8px}
.slot{background:#fff;border:3px solid #7a4a1d;border-radius:16px;padding:6px 6px 8px;width:150px}
.slot .pt{font-weight:900;font-size:13px;color:#fff;border-radius:8px;padding:2px 6px;display:inline-block}
.slot .nm{font-weight:900;font-size:16px;margin-top:2px}
.slot .ds{font-size:12px;color:#7a5a3a;min-height:30px}
.slot .ky{font-size:12px;font-weight:bold;background:#f1e3c4;border-radius:6px;padding:2px 4px;margin-top:4px}
.slot .ar{display:flex;align-items:center;justify-content:space-between}
.slot .ar button{font:inherit;font-weight:900;font-size:18px;width:34px;height:34px;border-radius:50%;border:2px solid #7a4a1d;background:#ffe39a;cursor:pointer;color:#5a3412;touch-action:manipulation;flex:none}
.slot canvas{width:90px;height:100px}
.lv{min-width:0}
#levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.lv.locked{opacity:.55;filter:grayscale(.7)}
.lv.locked small{color:#7a5a3a}
.lv small{display:block;font-size:12px;font-weight:bold;color:#8a5a2a}
.stars{color:#ffb703;font-size:16px;text-shadow:1px 1px 0 #7a4a1d}
details{margin-top:12px;text-align:start;background:#fdebc4;border-radius:12px;padding:8px 12px;font-size:14px}
summary{font-weight:900;cursor:pointer;color:#a0521a}
details li{margin:4px 0 4px 18px}
#topbtns{position:fixed;top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));z-index:12;display:flex;gap:6px}
#topbtns .btn{font-size:18px;padding:4px 10px}
#touch{position:fixed;inset:0;z-index:4;touch-action:none}
.res h2{font-size:38px;color:#38b000;text-shadow:2px 2px 0 #1f6b00}
.res .bigstars{font-size:54px;color:#ffb703;text-shadow:3px 3px 0 #7a4a1d;letter-spacing:6px}
.res table{margin:8px auto;border-collapse:collapse;font-weight:bold}
.res td{padding:3px 10px;text-align:start}
.res .award{background:#fdebc4;border-radius:12px;padding:8px;margin:8px 0;font-weight:900;color:#a0521a}
@media (max-width:640px),(max-height:500px){
 .panel{padding:10px 10px 12px;border-width:4px;border-radius:18px}
 .logo{font-size:30px}.tag{font-size:13px}.sec{margin:6px 0}.lbl{font-size:12px;margin-bottom:4px}
 .btn{font-size:14px;padding:7px 10px}
 .slot{width:calc(50% - 6px);padding:4px}.slot .ds{font-size:11px;min-height:0}.slot .nm{font-size:14px}
 .slot canvas{width:72px;height:80px}
 #levels{grid-template-columns:repeat(2,1fr);gap:6px}.lv small{font-size:11px}.big{font-size:19px;padding:10px 18px}
 details{font-size:13px}
 #topbtns .btn{font-size:15px;padding:3px 8px;border-radius:11px}
 .res h2{font-size:28px}.res .bigstars{font-size:40px}.res td{font-size:13px;padding:2px 6px}
}
@media (max-height:500px) and (orientation:landscape){#levels{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.slot{width:130px}.slot .ds{display:none}}
</style>
</head>
<body>
<div id="safe"></div>
<canvas id="c"></canvas>
<div id="touch" class="hide"></div>

<div id="topbtns" class="hide">

  <button class="btn" id="bMusic">🎵</button>
  <button class="btn" id="bSfx">🔊</button>
  <button class="btn" id="bFull">⛶</button>
</div>

<div id="menu" class="ov">

    <button id="play" class="btn big"></button>
    <details><summary id="howSum"></summary><ul id="howList"></ul></details>
  </div>
</div>

<div id="pause" class="ov hide">
  <div class="panel" style="max-width:380px">
    <h2 id="pTitle" style="font-size:32px;color:#ff7b29;text-shadow:2px 2px 0 #7a4a1d"></h2>
    <div class="row" style="flex-direction:column;margin-top:12px">
      <button class="btn big" id="pResume"></button>
      <button class="btn" id="pRestart"></button>
      <button class="btn" id="pMenu"></button>
    </div>
  </div>
</div>

<div id="result" class="ov hide">
  <div class="panel res" style="max-width:460px">
    <h2 id="rTitle"></h2>
    <div class="bigstars" id="rStars">★★★</div>
    <table id="rTable"></table>
    <div class="award" id="rAward"></div>
    <div class="row">
      <button class="btn" id="rRetry"></button>
      <button class="btn big" id="rNext"></button>
      <button class="btn" id="rMenu"></button>
    </div>
  </div>
</div>

<script>
'use strict';
/* =========================================================
   FART RAFT HiHi – original co-op physics raft game
   All art drawn in code, all sounds synthesized. No external assets.
   ========================================================= */
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const IS_TOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0;
let W=0,H=0,DPR=1;const SAFE={t:0,b:0,l:0,r:0};
function resize(){DPR=Math.min(window.devicePixelRatio||1,IS_TOUCH?1.5:2);W=innerWidth;H=innerHeight;cv.width=(W*DPR)|0;cv.height=(H*DPR)|0;cv.style.width=W+'px';cv.style.height=H+'px';
  try{const cs=getComputedStyle(document.getElementById('safe'));SAFE.t=parseFloat(cs.paddingTop)||0;SAFE.b=parseFloat(cs.paddingBottom)||0;SAFE.l=parseFloat(cs.paddingLeft)||0;SAFE.r=parseFloat(cs.paddingRight)||0;}catch(e){}}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,250));resize();
const FONT='"Trebuchet MS","Segoe UI",system-ui,sans-serif';
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, TAU=Math.PI*2;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let LANG='en';
function t(k){const L=I18N[LANG]||I18N.en;return L[k]!==undefined?L[k]:I18N.en[k];}
function tf(k,o){let x=t(k);for(const p in o)x=x.split('{'+p+'}').join(o[p]);return x;}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem('bexihoi_'+k));localStorage.setItem('bexihoi_'+k,JSON.stringify(v));}catch(e){return null;}}

/* ================= AUDIO ================= */
let AC=null, master, sfxGain, musGain, noiseBuf, sfxOn=store('sfx')!==false, musOn=store('mus')!==false;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  const comp=AC.createDynamicsCompressor();comp.connect(AC.destination);
  master=AC.createGain();master.gain.value=0.9;master.connect(comp);
  sfxGain=AC.createGain();sfxGain.gain.value=sfxOn?1:0;sfxGain.connect(master);
  musGain=AC.createGain();musGain.gain.value=musOn?0.22:0;musGain.connect(master);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*1,AC.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  startMusic();
}
function env(g,t,a,peak,dec){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec);}
function tone(type,f0,f1,dur,vol,dest,delay){
  if(!AC)return;const t=AC.currentTime+(delay||0);const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);
  if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);const g=AC.createGain();env(g,t,0.01,vol,dur);o.connect(g);g.connect(dest||sfxGain);o.start(t);o.stop(t+dur+0.05);
}
function noise(dur,f0,f1,vol,type,delay){
  if(!AC)return;const t=AC.currentTime+(delay||0);const s=AC.createBufferSource();s.buffer=noiseBuf;
  const f=AC.createBiquadFilter();f.type=type||'lowpass';f.frequency.setValueAtTime(f0,t);if(f1)f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=AC.createGain();env(g,t,0.01,vol,dur);s.connect(f);f.connect(g);g.connect(sfxGain);s.start(t);s.stop(t+dur+0.05);
}
const SND={
  splash(v=1){noise(0.6,2500,250,0.5*v);noise(0.25,900,300,0.3*v,'bandpass',0.05);},
  bonk(v=1){tone('sine',220,70,0.18,0.5*v);noise(0.05,3000,800,0.25*v,'highpass');},
  quack(){[0,0.12].forEach(d=>{if(!AC)return;const t=AC.currentTime+d;const o=AC.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(620,t);o.frequency.exponentialRampToValueAtTime(380,t+0.09);const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=1300;f.Q.value=4;const g=AC.createGain();env(g,t,0.005,0.35,0.09);o.connect(f);f.connect(g);g.connect(sfxGain);o.start(t);o.stop(t+0.15);});},
  pickup(){[523,659,784,1046].forEach((f,i)=>tone('triangle',f,0,0.12,0.3,null,i*0.06));},
  cp(){tone('sine',880,0,0.7,0.3);tone('sine',1320,0,0.7,0.2,null,0.08);tone('sine',1760,0,0.6,0.12,null,0.16);},
  fall(){tone('sine',900,180,0.5,0.3);setTimeout(()=>SND.splash(1.3),350);},
  win(){[523,659,784,659,784,1046].forEach((f,i)=>tone('square',f,0,0.16,0.14,null,i*0.13));tone('triangle',1046,0,0.9,0.25,null,0.8);},
  click(){tone('triangle',700,500,0.06,0.2);},
  empty(){tone('square',140,90,0.15,0.15);}
};
/* continuous fart voice per player */
function fartStart(pl){
  if(!AC||!sfxOn)return;const t=AC.currentTime,base=pl.ch.pitch;
  const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=base;
  const o2=AC.createOscillator();o2.type='square';o2.frequency.value=base*0.5;
  const nz=AC.createBufferSource();nz.buffer=noiseBuf;nz.loop=true;
  const nf=AC.createBiquadFilter();nf.type='bandpass';nf.frequency.value=320;nf.Q.value=0.9;
  const ng=AC.createGain();ng.gain.value=0.5;
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=650;lp.Q.value=7;
  const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.32,t+0.03);
  const lfo=AC.createOscillator();lfo.type='square';lfo.frequency.value=28;const lg=AC.createGain();lg.gain.value=0.2;lfo.connect(lg);lg.connect(g.gain);
  const o2g=AC.createGain();o2g.gain.value=0.5;
  o.connect(lp);o2.connect(o2g);o2g.connect(lp);nz.connect(nf);nf.connect(ng);ng.connect(lp);lp.connect(g);g.connect(sfxGain);
  o.start(t);o2.start(t);nz.start(t,Math.random()*0.5);lfo.start(t);
  pl.voice={o,o2,nz,lp,g,lfo,base};
}
function fartTick(pl){
  const v=pl.voice;if(!v)return;const t=AC.currentTime;const b=v.base*(pl.super?1.25:1);
  v.o.frequency.setTargetAtTime(b*(0.7+Math.random()*0.6),t,0.02);
  v.o2.frequency.setTargetAtTime(b*0.5*(0.8+Math.random()*0.4),t,0.03);
  v.lfo.frequency.setTargetAtTime(16+Math.random()*30,t,0.04);
  v.lp.frequency.setTargetAtTime(420+Math.random()*700,t,0.03);
}
function fartStop(pl){
  const v=pl.voice;if(!v)return;pl.voice=null;const t=AC.currentTime;
  v.g.gain.cancelScheduledValues(t);v.g.gain.setValueAtTime(v.g.gain.value,t);v.g.gain.linearRampToValueAtTime(0,t+0.12);
  v.o.frequency.setTargetAtTime(v.base*0.6,t,0.05);
  [v.o,v.o2,v.nz,v.lfo].forEach(n=>{try{n.stop(t+0.15);}catch(e){}});
}
/* background music: cheerful pentatonic loop */
let musTimer=null,musStep=0,musNext=0;
const MEL=[72,74,76,79,76,74,72,69, 72,74,76,79,81,79,76,74, 76,79,81,84,81,79,76,74, 72,76,74,69,72,0,72,0];
const BAS=[48,0,55,0,57,0,55,0, 48,0,55,0,53,0,55,0];
function mtof(m){return 440*Math.pow(2,(m-69)/12);}
function startMusic(){
  if(musTimer)return;musNext=AC.currentTime+0.1;
  musTimer=setInterval(()=>{
    if(!AC)return;const spb=60/118/2;
    while(musNext<AC.currentTime+0.25){
      const m=MEL[musStep%MEL.length];if(m){const o=AC.createOscillator();o.type='triangle';o.frequency.value=mtof(m);const g=AC.createGain();env(g,musNext,0.01,0.35,spb*1.6);o.connect(g);g.connect(musGain);o.start(musNext);o.stop(musNext+spb*2);}
      const b=BAS[musStep%BAS.length];if(b){const o=AC.createOscillator();o.type='sine';o.frequency.value=mtof(b);const g=AC.createGain();env(g,musNext,0.01,0.5,spb*1.8);o.connect(g);g.connect(musGain);o.start(musNext);o.stop(musNext+spb*2);}

}

const STEP=12;
let zones=[],course=[],paths=null,decor=[],ripples=[],obs=[],cps=[],tips=[],finishIdx=0,lvl=null,lvlIndex=0;
function buildCourse(segs){
  const pts=[];let x=0,y=0,h=-Math.PI/2,w=segs[0][2];pts.push({x,y,w,h});
  for(const [len,turn,wid] of segs){
    const n=Math.max(1,Math.round(len/STEP)),w0=w,tr=turn*Math.PI/180;
    for(let k=1;k<=n;k++){
      h+=tr*(Math.PI/2)*Math.sin(Math.PI*(k-0.5)/n)/n;
      w=w0+(wid-w0)*(0.5-0.5*Math.cos(Math.PI*k/n));
      x+=Math.cos(h)*STEP;y+=Math.sin(h)*STEP;pts.push({x,y,w,h});
    }
  }
  for(const p of pts){p.tx=Math.cos(p.h);p.ty=Math.sin(p.h);p.nx=-p.ty;p.ny=p.tx;}
  return pts;
}
const idxS=s=>clamp(Math.round(s/STEP),0,course.length-1);
function at(i,u){const p=course[i];return{x:p.x+p.nx*u,y:p.y+p.ny*u};}
function nearest(x,y,guess,win){
  let best=guess,bd=1e18;const a=Math.max(0,guess-win),b=Math.min(course.length-1,guess+win);
  for(let i=a;i<=b;i++){const p=course[i],dx=x-p.x,dy=y-p.y,d=dx*dx+dy*dy;if(d<bd){bd=d;best=i;}}
  return best;
}
function ribbon(scale,extra){
  const P=new Path2D();const n=course.length;
  for(let i=0;i<n;i++){const p=course[i],h=p.w/2*scale+extra;const x=p.x-p.nx*h,y=p.y-p.ny*h;i?P.lineTo(x,y):P.moveTo(x,y);}
  for(let i=n-1;i>=0;i--){const p=course[i],h=p.w/2*scale+extra;P.lineTo(p.x+p.nx*h,p.y+p.ny*h);}
  P.closePath();return P;
}
function distToCourse(x,y,gi){const j=nearest(x,y,gi,90);const p=course[j];return{d:Math.hypot(x-p.x,y-p.y)-p.w/2,j};}

function buildLevel(li){
  lvlIndex=li;lvl=LEVELS[li];course=buildCourse(lvl.segs);
  paths={bank:ribbon(1,26),sand:ribbon(1,14),water:ribbon(1,0),deep:ribbon(0.55,0)};
  finishIdx=course.length-1-Math.round(260/STEP);

  decor=[];
  for(let i=0;i<course.length;i+=4){
    for(const side of [-1,1]){

      const p=course[i],off=p.w/2+45+R()*320;
      const x=p.x+p.nx*off*side+(R()-0.5)*40,y=p.y+p.ny*off*side+(R()-0.5)*40;
      const dc=distToCourse(x,y,i);
      let r=R(),type;
      if(r<0.32)type='tree';else if(r<0.5)type='bamboo';else if(r<0.64)type='palm';else if(r<0.8)type='bush';else if(r<0.88&&dc.d>150)type='house';else if(r<0.96&&dc.d>170)type='rice';else type='flower';
      const need=type==='house'?110:type==='rice'?130:type==='bush'||type==='flower'?30:55;
      if(dc.d<need)continue;

  }
  // grass tufts
  for(let i=0;i<course.length;i+=2){
    const p=course[i];for(const side of [-1,1]){if(R()<0.5)continue;const off=p.w/2+30+R()*520;const x=p.x+p.nx*off*side,y=p.y+p.ny*off*side;if(distToCourse(x,y,i).d<24)continue;decor.push({type:'tuft',x,y,s:0.7+R()*0.6,c:R()});}
  }
  decor.sort((a,b)=>a.y-b.y);
  // ripples & lilies
  ripples=[];for(let i=0;i<course.length;i+=3){ripples.push({i,u:(R()*2-1)*0.8,ph:R()*10,len:10+R()*16});if(R()<0.12){const side=R()<0.5?-1:1;ripples.push({i,u:side*(0.82+R()*0.12),lily:true,ph:R()*TAU,len:12+R()*8});}}
  genObstacles(R);
  tips=(lvl.tips||[]).map(([s,k])=>({i:idxS(s),k,shown:false}));
}

      case 'beo':{const r=90+R()*40,sd=R()<0.5?-1:1,q=at(i,sd*(hf-r*0.45));add({t:'beo',x:q.x,y:q.y,r,i,seed:R()*1000});break;}
      case 'chong':{const sd=R()<0.5?-1:1;for(let k=0;k<3;k++){const ii=idxS(s+k*75),h2=course[ii].w/2-24,q=at(ii,sd*(h2-18-R()*14));add({t:'chong',x:q.x,y:q.y,r:30,i:ii,seed:R()*1000});}

      case 'spin':{if(hf<150){const r=38+R()*12;rock(s,(R()*2-1)*(hf-r)*0.6,r);break;}
        add({t:'log',spin:true,i,u0:0,hl:hf-14,spd:(0.55+R()*0.35)*(R()<0.5?-1:1)*(lvl.current>65?1.15:1),ph:R()*TAU,x:p.x,y:p.y,parts:[]});break;}
      case 'rapid':{const sd=R()<0.5?-1:1,len=360+R()*140,F=75+R()*30+(lvl.current>70?10:0),i0=idxS(s),i1=idxS(s+len),im=idxS(s+len/2);
        zones.push({t:'rapid',i0,i1,i:im,sd,F,x:course[im].x,y:course[im].y});
        for(let k=0;k<3;k++){const ii=idxS(s+len*(0.35+k*0.28)),h2=course[ii].w/2-24,q=at(ii,sd*(h2-16));add({t:'chong',x:q.x,y:q.y,r:30,i:ii,seed:R()*1000});}

  const r=raft;r.x+=nx*pen*0.9;r.y+=ny*pen*0.9;
  const rx=px-r.x,ry=py-r.y;const vpx=r.vx-r.w*ry,vpy=r.vy+r.w*rx;
  const vrx=vpx-ovx,vry=vpy-ovy,vn=vrx*nx+vry*ny;if(vn>=0)return 0;
  const rn=rx*ny-ry*nx,j=-(1+e)*vn/(1/M+rn*rn/I);
  r.vx+=j*nx/M;r.vy+=j*ny/M;r.w+=rn*j/I;
  const tx=-ny,ty=nx,vt=vrx*tx+vry*ty,rt=rx*ty-ry*tx,jt=-vt/(1/M+rt*rt/I)*0.2;
  r.vx+=jt*tx/M;r.vy+=jt*ty/M;r.w+=rt*jt/I;
  return -vn;
}
function obbCircle(cx,cy,cr){
  const r=raft,sa=Math.sin(r.a),ca=Math.cos(r.a),dx=cx-r.x,dy=cy-r.y;
  const lx=dx*ca+dy*sa,ly=-dx*sa+dy*ca;const qx=clamp(lx,-HW,HW),qy=clamp(ly,-HH,HH);
  const ddx=lx-qx,ddy=ly-qy,d=Math.hypot(ddx,ddy);if(d>=cr)return null;
  let nlx,nly,pen;
  if(d>1e-4){nlx=ddx/d;nly=ddy/d;pen=cr-d;}
  else{const ox=HW-Math.abs(lx),oy=HH-Math.abs(ly);if(ox<oy){nlx=Math.sign(lx)||1;nly=0;pen=ox+cr;}else{nlx=0;nly=Math.sign(ly)||1;pen=oy+cr;}}
  return{px:qx*ca-qy*sa+r.x,py:qx*sa+qy*ca+r.y,nx:-(nlx*ca-nly*sa),ny:-(nlx*sa+nly*ca),pen};
}
let bonkCd=0;
function bonk(v){if(v>55&&bonkCd<=0){SND.bonk(clamp(v/250,0.25,1));bonkCd=0.15;shake=Math.min(10,v/30);for(const pl of players)pl.strain=Math.max(pl.strain,0.5);}}
function physStep(h){
  const r=raft,sa=Math.sin(r.a),ca=Math.cos(r.a);let ax=0,ay=0,al=0;
  const thrust=250/players.length;
  for(const pl of players)if(pl.farting){
    const fa=r.a+pl.f,fx=Math.sin(fa),fy=-Math.cos(fa),F=thrust*(pl.super>0?1.7:1);
    const rx=pl.slot.x*ca-pl.slot.y*sa,ry=pl.slot.x*sa+pl.slot.y*ca;
    ax+=fx*F;ay+=fy*F;al+=(rx*fy-ry*fx)*F/I;
  }
  // water current & drag
  const p=course[r.idx],lat=(r.x-p.x)*p.nx+(r.y-p.y)*p.ny,hf=p.w/2;
  let cur=lvl.current*(1-0.6*Math.min(1,(lat/hf)**2)),k=1.1,ka=1.8;
  for(const o of obs){if(Math.abs(o.i-r.idx)>25)continue;
    if(o.t==='beo'){const d=Math.hypot(r.x-o.x,r.y-o.y);if(d<o.r+40){k=3.4;cur*=0.2;ka=3;}}
    else if(o.t==='whirl'){const dx=o.x-r.x,dy=o.y-r.y,d=Math.hypot(dx,dy)||1;if(d<o.R){const f=1-d/o.R;ax+=dx/d*f*150+(-dy/d)*f*190;ay+=dy/d*f*150+(dx/d)*f*190;al+=f*1.8;if(d<o.core+22)r.coreT+=h;}}
  }
  for(const z of zones){if(r.idx<z.i0||r.idx>z.i1)continue;const e=Math.min(1,(r.idx-z.i0)/6,(z.i1-r.idx)/6);
    if(z.t==='rapid'){ax+=p.nx*z.sd*z.F*e;ay+=p.ny*z.sd*z.F*e;}else{ax-=p.tx*z.F*e;ay-=p.ty*z.F*e;}}
  ax+=k*(p.tx*cur-r.vx);ay+=k*(p.ty*cur-r.vy);al+=-ka*r.w;
  r.vx+=ax*h;r.vy+=ay*h;r.w+=al*h;r.x+=r.vx*h;r.y+=r.vy*h;r.a+=r.w*h;
  r.coreT=Math.max(0,(r.coreT||0)-h*0.35);
  if(r.coreT>1.1){fall('whirl');return;}
  r.idx=nearest(r.x,r.y,r.idx,30);
  // banks
  const sa2=Math.sin(r.a),ca2=Math.cos(r.a);let maxV=0;
  for(const [lx,ly] of SAMPLES){
    const px=r.x+lx*ca2-ly*sa2,py=r.y+lx*sa2+ly*ca2;const j=nearest(px,py,r.idx,18),c=course[j];
    const lt=(px-c.x)*c.nx+(py-c.y)*c.ny,half=c.w/2-6;
    if(lt>half)maxV=Math.max(maxV,hit(px,py,-c.nx,-c.ny,0,0,0.35,lt-half));
    else if(lt<-half)maxV=Math.max(maxV,hit(px,py,c.nx,c.ny,0,0,0.35,-half-lt));
    if(j<=2){const c0=course[0],al2=(px-c0.x)*c0.tx+(py-c0.y)*c0.ty;if(al2<0)maxV=Math.max(maxV,hit(px,py,c0.tx,c0.ty,0,0,0.3,-al2));}
  }
  // obstacles
  for(const o of obs){
    if(Math.abs(o.i-r.idx)>22)continue;
    if(o.t==='rock'){const c=obbCircle(o.x,o.y,o.r);if(c)maxV=Math.max(maxV,hit(c.px,c.py,c.nx,c.ny,0,0,0.45,c.pen));}
    else if(o.t==='log'){for(const q of o.parts){const c=obbCircle(q.x,q.y,22);if(c)maxV=Math.max(maxV,hit(c.px,c.py,c.nx,c.ny,q.vx,q.vy,0.4,c.pen));}}
    else if(o.t==='chong'){const c=obbCircle(o.x,o.y,o.r-6);if(c){fall('chong');return;}}
    else if(o.t==='duck'&&!o.fly){const c=obbCircle(o.x,o.y,16);if(c){o.fly=0.001;const d=Math.hypot(o.x-r.x,o.y-r.y)||1;o.vx=(o.x-r.x)/d*260;o.vy=(o.y-r.y)/d*260-80;SND.quack();addText(o.x,o.y-30,t('quack'),'#fff3b0',24);r.vx*=0.85;r.vy*=0.85;}}
    else if(o.t==='khoai'&&!o.got){const c=obbCircle(o.x,o.y,o.r);if(c){o.got=true;SND.pickup();for(const pl of players){pl.gas=100;pl.empty=false;pl.super=4;}addText(o.x,o.y-40,t('sup'),'#ffd166',34);
        for(let k=0;k<24;k++){const a=Math.random()*TAU;parts.push({x:o.x,y:o.y,vx:Math.cos(a)*150,vy:Math.sin(a)*150,life:0,max:0.7,r:4,col:'#ffd166',type:'spark'});}}}
  }
  bonk(maxV);
}

/* ================= UPDATE ================= */
function update(dt){
  T+=dt;bonkCd-=dt;shake=Math.max(0,shake-dt*30);
  if(state==='menu'){menuCam(dt);updateParticles(dt);return;}
  if(state==='pause')return;
  // kinematic obstacles
  for(const o of obs){
    if(o.t==='log')updLog(o);
    else if(o.t==='duck'){if(!o.fly){const p=course[o.i],u=o.u0+o.amp*Math.sin(T*o.spd+o.ph);o.x=p.x+p.nx*u;o.y=p.y+p.ny*u;o.dir=Math.cos(T*o.spd+o.ph)*p.nx>0?1:-1;}else{o.fly+=dt;o.x+=o.vx*dt;o.y+=o.vy*dt;o.vy-=120*dt;}}
  }
  if(state==='play'){
    playTime+=dt;
    for(const pl of players){
      if(down(pl.keys.l))pl.f-=3.3*dt;
      if(down(pl.keys.r))pl.f+=3.3*dt;
      let joyF=false;
      if(IS_TOUCH&&pl.idx<2){const j=getJoy(pl.idx);if(j&&j.mag>12){const ta=Math.atan2(j.dx,-j.dy);let d=ta-raft.a-pl.f;d=Math.atan2(Math.sin(d),Math.cos(d));pl.f+=clamp(d,-7*dt,7*dt);joyF=j.mag>26;}}
      const want=down(pl.keys.f)||joyF;
      if(pl.super>0)pl.super-=dt;
      if(pl.empty&&pl.gas>=25)pl.empty=false;
      const can=want&&!pl.empty;
      if(can&&!pl.farting){pl.farting=true;fartStart(pl);pl.txtT=0;if(Math.random()<0.75)comic(pl);}
      if(!can&&pl.farting){pl.farting=false;fartStop(pl);pl.regenWait=0.5;}
      if(want&&pl.empty&&!pl.warned){pl.warned=true;SND.empty();addText(...charPos(pl,-60),t('noGas'),'#ffb3b3',20);}
      if(!want)pl.warned=false;
      if(pl.farting){
        if(pl.super<=0)pl.gas-=28*(lvl.gasMul||1)*dt;pl.fartTime+=dt;pl.txtT+=dt;if(pl.txtT>1.3){pl.txtT=0;if(Math.random()<0.5)comic(pl);}
        if(pl.gas<=0){pl.gas=0;pl.empty=true;pl.farting=false;fartStop(pl);pl.regenWait=0.8;SND.empty();}
        fartTick(pl);pl.puffT-=dt;if(pl.puffT<=0){pl.puffT=IS_TOUCH?0.06:0.035;emitPuff(pl);}
        pl.strain=Math.min(1,pl.strain+dt*6);
      }else{
        pl.regenWait-=dt;if(pl.regenWait<=0)pl.gas=Math.min(100,pl.gas+15*(lvl.regen||1)*dt);
        pl.strain=Math.max(0,pl.strain-dt*3);
      }
    }
    const sub=4,h=dt/sub;for(let k=0;k<sub&&state==='play';k++)physStep(h);
    // checkpoints & tips
    for(const c of cps){if(!c.on&&raft.idx>=c.i){c.on=true;cpIdx=c.i;SND.cp();showToast(t('cp'),2.2);const p=course[c.i];addText(p.x,p.y-60,t('cpWord'),'#9cff9c',30);}}
    for(const tp of tips){if(!tp.shown&&raft.idx>=tp.i){tp.shown=true;showToast(t('tips')[tp.k],4.5);}}
    if(raft.idx>=finishIdx)win();
    // wake
    const sp=Math.hypot(raft.vx,raft.vy);if(sp>60&&Math.random()<sp/400){const a=raft.a+Math.PI+(Math.random()-0.5)*1.2;parts.push({x:raft.x+Math.sin(a)*60,y:raft.y-Math.cos(a)*60,vx:(Math.random()-0.5)*30,vy:(Math.random()-0.5)*30,life:0,max:1.2,r:5+Math.random()*6,col:'#ffffff',type:'foam'});}
  }else if(state==='fall'){
    fallT+=dt;if(fallT>1.5){respawn(cpIdx);state='play';showToast(t(fallMsg)+'  '+t('backSuffix'),2.5);}
  }else if(state==='win'){
    winT+=dt;raft.vx*=0.97;raft.vy*=0.97;raft.x+=raft.vx*dt;raft.y+=raft.vy*dt;
    if(Math.random()<0.4){const p=course[finishIdx];parts.push({x:p.x+(Math.random()-0.5)*p.w,y:p.y-80,vx:(Math.random()-0.5)*80,vy:-60-Math.random()*90,life:0,max:2,r:5,col:['#ff4d4d','#ffd166','#3d9bff','#2fbf4f','#ff9f43'][(Math.random()*5)|0],type:'confetti',rot:Math.random()*TAU});}
  }
  raft.bob+=dt;
  updateParticles(dt);
  if(toast){toast.life+=dt;if(toast.life>toast.max)toast=null;}
  // camera
  const portrait=H>W,tz=IS_TOUCH?clamp((portrait?W:H)/560,0.5,1.3):clamp(Math.min(W,H)/720,0.45,1.3);
  const pc=course[raft.idx],look=(IS_TOUCH?(portrait?H*0.12:W*0.07):Math.min(W,H)*0.06)/tz;
  const tx=raft.x+pc.tx*look+raft.vx*0.3,ty=raft.y+pc.ty*look+raft.vy*0.3;
  const kk=1-Math.exp(-4*dt);cam.x=lerp(cam.x,tx,kk);cam.y=lerp(cam.y,ty,kk);cam.z=lerp(cam.z,tz,kk);
}
let menuS=200;
function menuCam(dt){
  menuS+=dt*70;if(menuS>course.length*STEP-300)menuS=200;const i=idxS(menuS),p=course[i];
  cam.x=lerp(cam.x,p.x,0.05);cam.y=lerp(cam.y,p.y,0.05);cam.z=clamp(Math.min(W,H)/(IS_TOUCH?600:800),0.4,1.1);
  for(const o of obs){if(o.t==='log')updLog(o);
    else if(o.t==='duck'){const q=course[o.i],u=o.u0+o.amp*Math.sin(T*o.spd+o.ph);o.x=q.x+q.nx*u;o.y=q.y+q.ny*u;o.dir=Math.cos(T*o.spd+o.ph)*q.nx>0?1:-1;}}
}
function updLog(o){const p=course[o.i];let dx,dy;
  if(o.spin){o.ang=o.ph+T*o.spd;dx=Math.cos(o.ang);dy=Math.sin(o.ang);o.x=p.x+p.nx*o.u0;o.y=p.y+p.ny*o.u0;o.vx=o.vy=0;}
  else{const u=o.amp*Math.sin(T*o.spd+o.ph),du=o.amp*o.spd*Math.cos(T*o.spd+o.ph);o.x=p.x+p.nx*u;o.y=p.y+p.ny*u;o.vx=p.nx*du;o.vy=p.ny*du;dx=p.nx;dy=p.ny;o.ang=Math.atan2(dy,dx);}
  o.parts.length=0;const n=Math.max(2,Math.round((2*o.hl-44)/40)+1);
  for(let k=0;k<n;k++){const off=-o.hl+22+(2*o.hl-44)*k/(n-1),rx=dx*off,ry=dy*off;o.parts.push({x:o.x+rx,y:o.y+ry,vx:o.spin?-o.spd*ry:o.vx,vy:o.spin?o.spd*rx:o.vy});}}
function charPos(pl,dy){const r=raft,sa=Math.sin(r.a),ca=Math.cos(r.a);return[r.x+pl.slot.x*ca-pl.slot.y*sa,r.y+pl.slot.x*sa+pl.slot.y*ca+(dy||0)];}
function comic(pl){const[x,y]=charPos(pl,-70);const WORDS=t('words');addText(x+(Math.random()-0.5)*30,y,WORDS[(Math.random()*WORDS.length)|0],pl.ch.gas,24+Math.random()*10);}
function emitPuff(pl){
  const r=raft,fa=r.a+pl.f,fx=Math.sin(fa),fy=-Math.cos(fa);const[x,y]=charPos(pl,0);
  const bx=x-fx*12,by=y-fy*12-14,sp=140+Math.random()*80,j=(Math.random()-0.5)*0.6;
  const dx=-fx*Math.cos(j)+fy*Math.sin(j),dy=-fy*Math.cos(j)-fx*Math.sin(j);
  parts.push({x:bx,y:by,vx:dx*sp+r.vx*0.4,vy:dy*sp+r.vy*0.4,life:0,max:0.9+Math.random()*0.5,r:5+Math.random()*4,grow:26,col:pl.super>0?'#ffd166':pl.ch.gas,type:'puff'});
  if(Math.random()<0.4)parts.push({x:bx-fx*40,y:by-fy*40+14,vx:dx*60+(Math.random()-0.5)*60,vy:dy*60+(Math.random()-0.5)*60,life:0,max:0.5,r:3,col:'#fff',type:'drop'});
}
function updateParticles(dt){
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.life+=dt;if(q.life>=q.max){parts.splice(i,1);continue;}q.x+=q.vx*dt;q.y+=q.vy*dt;const d=q.type==='puff'?1.8:q.type==='confetti'?0.3:2.5;q.vx*=Math.exp(-d*dt);q.vy*=Math.exp(-d*dt);if(q.type==='confetti'){q.vy+=60*dt;q.rot+=dt*6;}}
  for(let i=texts.length-1;i>=0;i--){const q=texts[i];q.life+=dt;q.y+=q.vy*dt;q.vy*=Math.exp(-1.5*dt);if(q.life>q.max)texts.splice(i,1);}
  const PMAX=IS_TOUCH?320:700;if(parts.length>PMAX)parts.splice(0,parts.length-PMAX);
}
function win(){
  if(state!=='play')return;state='win';winT=0;
  for(const pl of players){if(pl.farting){pl.farting=false;fartStop(pl);}}
  SND.win();
  const st=playTime<=lvl.stars[0]?3:playTime<=lvl.stars[1]?2:1;
  const best=store('best')||{};const key='L'+lvlIndex;const prev=best[key];
  if(!prev||st>prev.s||(st===prev.s&&playTime<prev.t))best[key]={s:st,t:playTime};store('best',best);
  setTimeout(()=>showResult(st),1600);
}

/* ================= DRAWING ================= */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function ell(x,y,rx,ry,col){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,TAU);ctx.fillStyle=col;ctx.fill();}
function circ(x,y,r,col){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle=col;ctx.fill();}

/* chibi human. (x,y)=feet. dirx/diry = facing on screen. */
function drawChar(c,ch,x,y,dirx,diry,strain,t,farting,col,label){
  c.save();c.translate(x,y);
  const view=diry<-0.55?'back':'front';const side=Math.abs(dirx)>0.45;const flip=dirx<0?-1:1;
  const bob=farting?Math.sin(t*40)*1.2:Math.sin(t*3)*1;
  // shadow
  c.beginPath();c.ellipse(0,0,15,5,0,0,TAU);c.fillStyle='rgba(0,0,0,.22)';c.fill();
  c.translate(0,bob);
  const sq=farting?1-0.06*strain:1;c.scale(1/sq*0.98+0.02,sq);
  // legs
  const spread=farting?5:3;c.fillStyle=ch.pants;rrC(c,-8-spread/2,-14,7,14,3);rrC(c,1+spread/2,-14,7,14,3);
  c.fillStyle='#3a2410';rrC(c,-9-spread/2,-3,9,4,2);rrC(c,spread/2,-3,9,4,2);
  // body
  const bw=ch.belly?30:24,bh=ch.belly?22:20;
  c.fillStyle=ch.shirt;rrC(c,-bw/2,-14-bh,bw,bh+2,ch.belly?11:7);
  if(ch.belly&&view==='front'){c.beginPath();c.ellipse(side?flip*4:0,-24,11,9,0,0,TAU);c.fillStyle=ch.skin;c.fill();c.beginPath();c.arc(side?flip*4:0,-23,1.5,0,TAU);c.fillStyle='#b5835f';c.fill();}
  if(ch.style==='nonla'&&view==='front'){c.fillStyle=ch.shirt2;c.fillRect(-1,-14-bh,2,bh);[ -8,-2,4].forEach(yy=>{c.beginPath();c.arc(0,-14-bh+bh+yy-6,1.4,0,TAU);c.fillStyle='#fff';c.fill();});}
  if(ch.style==='spiky'&&view==='front'){c.fillStyle='#fff';c.globalAlpha=.85;c.font='bold 9px sans-serif';c.textAlign='center';c.fillText('★',0,-22);c.globalAlpha=1;}
  // arms
  const armUp=farting?-8*strain:0;c.strokeStyle=ch.skin;c.lineWidth=5;c.lineCap='round';
  c.beginPath();c.moveTo(-bw/2+1,-30);c.lineTo(-bw/2-6,-20+armUp+(farting?Math.sin(t*30)*2:0));c.stroke();
  c.beginPath();c.moveTo(bw/2-1,-30);c.lineTo(bw/2+6,-20+armUp+(farting?Math.cos(t*30)*2:0));c.stroke();
  // head
  const hy=-14-bh-12,hr=13;
  if(ch.style==='pigtails'){c.fillStyle=ch.hair;circC(c,-hr-1,hy+2,6);circC(c,hr+1,hy+2,6);c.fillStyle='#ff4d8d';circC(c,-hr+3,hy-2,2.5);circC(c,hr-3,hy-2,2.5);}
  c.fillStyle=ch.skin;circC(c,0,hy,hr);
  const fo=side?flip*4:0;
  if(view==='back'){
    if(ch.style!=='bald'){c.fillStyle=ch.hair;c.beginPath();c.arc(0,hy,hr+0.5,0,TAU);c.fill();}
    else{c.fillStyle='rgba(255,255,255,.35)';circC(c,-4,hy-5,4);}
    if(ch.style==='nonla')drawHat(c,hy,true);
  }else{
    // hair front
    c.fillStyle=ch.hair;
    if(ch.style==='spiky'){c.beginPath();c.arc(0,hy-1,hr+0.5,Math.PI*1.05,Math.PI*1.95);c.lineTo(hr-2,hy-6);c.closePath();c.fill();for(let k=-2;k<=2;k++){c.beginPath();c.moveTo(k*5-3,hy-hr+3);c.lineTo(k*5+fo*0.3,hy-hr-7);c.lineTo(k*5+3,hy-hr+3);c.fill();}}
    else if(ch.style==='pigtails'){c.beginPath();c.arc(0,hy-1,hr+0.8,Math.PI*1.0,Math.PI*2.0);c.closePath();c.fill();c.fillRect(-hr,hy-3,4,6);c.fillRect(hr-4,hy-3,4,6);}
    else if(ch.style==='bald'){c.fillStyle='rgba(255,255,255,.4)';circC(c,-4+fo,hy-7,3.5);c.fillStyle=ch.hair;c.fillRect(-hr,hy-2,3,6);c.fillRect(hr-3,hy-2,3,6);}
    else if(ch.style==='nonla'){c.beginPath();c.arc(0,hy-1,hr+0.5,Math.PI*1.0,Math.PI*2.0);c.closePath();c.fill();}
    // face
    const ex=fo,ey=hy+1;
    if(strain>0.35){
      c.strokeStyle='#2a1a10';c.lineWidth=2;c.lineCap='round';
      c.beginPath();c.moveTo(ex-7,ey-3);c.lineTo(ex-3,ey-1);c.lineTo(ex-7,ey+1);c.stroke();
      c.beginPath();c.moveTo(ex+7,ey-3);c.lineTo(ex+3,ey-1);c.lineTo(ex+7,ey+1);c.stroke();

const jt={};// touchId -> {p,ox,oy,x,y}
const JR=58;

function getJoy(p){for(const id in jt){const j=jt[id];if(j.p===p){const dx=j.x-j.ox,dy=j.y-j.oy;return{dx,dy,mag:Math.hypot(dx,dy)};}}return null;}

tl.addEventListener('touchstart',e=>{e.preventDefault();initAudio();for(const tc of e.changedTouches){const p=joyZone(tc.clientX);if(p>=players.length)continue;let busy=false;for(const id in jt)if(jt[id].p===p)busy=true;if(busy)continue;jt[tc.identifier]={p,ox:tc.clientX,oy:tc.clientY,x:tc.clientX,y:tc.clientY};}},{passive:false});
tl.addEventListener('touchmove',e=>{e.preventDefault();for(const tc of e.changedTouches){const j=jt[tc.identifier];if(!j)continue;j.x=tc.clientX;j.y=tc.clientY;const dx=j.x-j.ox,dy=j.y-j.oy,d=Math.hypot(dx,dy);if(d>JR*1.25){j.ox=j.x-dx/d*JR*1.25;j.oy=j.y-dy/d*JR*1.25;}}},{passive:false});
const jEnd=e=>{e.preventDefault();for(const tc of e.changedTouches)delete jt[tc.identifier];};

  let king=players[0];for(const pl of players)if(pl.fartTime>king.fartTime)king=pl;
  const lazy=players.reduce((a,b)=>b.fartTime<a.fartTime?b:a,players[0]);
  $('rAward').innerHTML=players.length>1?`${t('king')}: <span style="color:${king.col}">${king.ch.name}</span> &nbsp;·&nbsp; ${t('lazy')}: <span style="color:${lazy.col}">${lazy.ch.name}</span>`:tf('soloKing',{n:king.ch.name,s:king.fartTime.toFixed(1)});
  $('rNext').style.display=lvlIndex<LEVELS.length-1?'':'none';
}

function unlocked(i){if(i===0)return true;const b=store('best')||{};return !!b['L'+(i-1)];}
function renderMenu(){
  const pc=$('pcount');pc.innerHTML='';
  for(let k=1;k<=4;k++){const b=document.createElement('button');b.className='btn'+(k===numPlayers?' on':'');b.textContent=tf('pn',{n:k});b.onclick=()=>{SND.click();numPlayers=k;store('np',k);renderMenu();};pc.appendChild(b);}
  const sl=$('slots');sl.innerHTML='';
  for(let k=0;k<numPlayers;k++){
    const ch=CHARS[chosen[k]];const d=document.createElement('div');d.className='slot';
    const keyLbl=IS_TOUCH&&k<2?'👆 '+t('touch'):(numPlayers===1?'A D + W · ← → + ↑':KEYSETS[k].label);
    d.innerHTML=`<span class="pt" style="background:${PCOL[k]}">P${k+1}</span><div class="ar"><button data-d="-1">‹</button><canvas width="180" height="200"></canvas><button data-d="1">›</button></div><div class="nm">${ch.name}</div><div class="ds">${t('desc')[chosen[k]]}</div><div class="ky">${keyLbl}</div>`;
    d.querySelectorAll('button').forEach(b=>b.onclick=()=>{SND.click();chosen[k]=(chosen[k]+(+b.dataset.d)+CHARS.length)%CHARS.length;store('chars',chosen);renderMenu();});
    sl.appendChild(d);
    const c=d.querySelector('canvas').getContext('2d');c.scale(2.9,2.9);drawChar(c,ch,31,64,0,1,0,0,false,PCOL[k],'');
  }
  if(IS_TOUCH&&numPlayers>2){const w=document.createElement('div');w.style.cssText='font-size:12px;color:#c0392b;font-weight:bold;width:100%';w.textContent=t('need34');sl.appendChild(w);}
  const lv=$('levels');lv.innerHTML='';const best=store('best')||{};
  if(!unlocked(selLevel))selLevel=0;
  LEVELS.forEach((L,i)=>{const b=document.createElement('button');const ok=unlocked(i);b.className='btn lv'+(i===selLevel?' on':'')+(ok?'':' locked');const bs=best['L'+i];b.innerHTML=ok?`${i+1}. ${t('lv')[i][0]}<small>${t('lv')[i][1]}</small><span class="stars">${bs?'★'.repeat(bs.s)+'☆'.repeat(3-bs.s):'☆☆☆'}</span>`:`🔒 ${i+1}. ${t('lv')[i][0]}<small>${t('locked')}</small>`;b.onclick=()=>{if(!ok){SND.empty();return;}SND.click();selLevel=i;store('sel',i);buildLevel(i);menuS=200;renderMenu();};lv.appendChild(b);});
}
$('play').onclick=()=>{initAudio();SND.click();startLevel(selLevel);if(IS_TOUCH&&numPlayers===2&&H>W)setTimeout(()=>showToast(t('landscape'),4),3200);};

/* ================= LANGUAGE ================= */
function detectLang(){
  try{const q=new URLSearchParams(location.search).get('lang');if(q&&I18N[q])return q;}catch(e){}
  const saved=store('lang');if(saved&&I18N[saved])return saved;
  const list=navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'en'];
  for(const l of list){const c=(l||'').toLowerCase();if(c.startsWith('fil')||c.startsWith('tl'))return 'fil';const p=c.split('-')[0];if(p==='in')return 'id';if(I18N[p])return p;}
  return 'en';
}
function applyLang(){
  document.documentElement.lang=LANG;document.documentElement.dir=LANG==='ar'?'rtl':'ltr';
  document.title='Fart Raft HiHi';
  $('logo').innerHTML=t('title')+' <span>HiHi</span>';$('tag').textContent=t('tag');
  $('lblPlayers').textContent=t('players');$('lblChars').textContent=t('chars');$('lblLevels').textContent=t('levels');
  $('play').textContent=t('play');$('howSum').textContent=t('howto');$('howList').innerHTML=t('how').map(x=>'<li>'+x+'</li>').join('');
  $('pTitle').textContent=t('paused');$('pResume').textContent=t('resume');$('pRestart').textContent=t('restart');$('pMenu').textContent=t('menu');
  $('rTitle').textContent=t('finish');$('rRetry').textContent=t('retry');$('rNext').textContent=t('next');$('rMenu').textContent=t('menu');
  $('bFull').title=$('mFull').title=t('full');$('langSel').title=t('lang');$('langSel').value=LANG;
  renderMenu();
}
const LANG_ORDER=['vi','id','en','pt','es','ms','th','fil','zh','ja','ko','hi','ar','tr','ru','fr','de','it'];
const LANG_COUNTRY={vi:'Việt Nam',id:'Indonesia',en:'English',pt:'Brasil',es:'España / Latam',ms:'Malaysia',th:'Thailand',fil:'Philippines',zh:'China',ja:'Japan',ko:'Korea',hi:'India',ar:'Arabic',tr:'Türkiye',ru:'Russia',fr:'France',de:'Deutschland',it:'Italia'};
(function(){const sel=$('langSel');for(const k of LANG_ORDER){if(!I18N[k])continue;const o=document.createElement('option');o.value=k;o.textContent=I18N[k].name+(k==='en'?'':' — '+LANG_COUNTRY[k]);sel.appendChild(o);}
  sel.onchange=()=>{LANG=sel.value;store('lang',LANG);applyLang();SND.click();};})();
LANG=detectLang();

/* boot */
buildLevel(0);{const p=course[idxS(200)];cam.x=p.x;cam.y=p.y;}
if(selLevel&&LEVELS[selLevel])buildLevel(selLevel);
applyLang();showUI('menu');requestAnimationFrame(loop);

</script>
