<style>
:root { color-scheme: dark; }
/* BIDA CỎ HIHI 3D — UI styles (original design for Game HiHi) */
:root {
  --hihi: #ffcc2e; --hihi-d: #e0a800; --pink: #ff3fa4; --cyan: #35e0ff; --ok: #5affb4; --bad: #ff5a5a;
  --glass: rgba(18, 12, 26, 0.72); --glass-2: rgba(30, 20, 44, 0.88); --line: rgba(255, 255, 255, 0.14);
  --text: #fff8ea; --muted: #cbbfd8;
  --font: "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", Arial, sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0e0b10; color: var(--text); font-family: var(--font); user-select: none; -webkit-user-select: none; touch-action: none; }
#app { position: fixed; inset: 0; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
.hidden { display: none !important; }
button { font-family: inherit; color: inherit; cursor: pointer; border: 0; }

/* ---------------- loading */
#loading { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #2b1a3a, #0e0b10 70%); z-index: 50; transition: opacity .5s; }
#loading .logo-ball { width: 84px; height: 84px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6c8, var(--hihi) 40%, #b88400); position: relative; animation: spin 1.2s linear infinite; box-shadow: 0 0 40px rgba(255, 204, 46, .5); }
#loading .logo-ball::after { content: "HI"; position: absolute; inset: 22px; border-radius: 50%; background: #fff; color: #1b1030; font-weight: 900; display: grid; place-items: center; font-size: 18px; }
#loading p { margin-top: 18px; color: var(--muted); text-align: center; }
@keyframes spin { to { transform: rotate(360deg); } }
.error-box { max-width: 520px; margin: 0 20px; padding: 24px; border-radius: 18px; background: var(--glass-2); border: 1px solid var(--bad); text-align: center; line-height: 1.5; }

/* ---------------- screens */
.screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; background: linear-gradient(180deg, rgba(10, 6, 16, .25), rgba(10, 6, 16, .7)); }
.panel { width: min(560px, 100%); max-height: calc(100% - 16px); overflow: auto; background: var(--glass-2); border: 1px solid var(--line); border-radius: 22px; padding: 22px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 20px 60px rgba(0, 0, 0, .5); }
.panel.wide { width: min(820px, 100%); }
.panel h2 { margin: 0 0 14px; font-size: 22px; letter-spacing: .5px; }
.title-wrap { text-align: center; margin-bottom: 18px; }
.game-title { font-size: clamp(30px, 6vw, 52px); font-weight: 900; line-height: 1.25; margin: 0; padding-top: 6px; letter-spacing: 1px;
  background: linear-gradient(90deg, var(--hihi), #fff3c4 40%, var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 18px rgba(255, 63, 164, .35)); }
.game-title small { display: block; font-size: .42em; letter-spacing: 6px; margin-top: 6px; color: var(--cyan); -webkit-text-fill-color: var(--cyan); }
.tagline { color: var(--muted); margin: 10px 0 0; font-size: 15px; }
.menu-grid { display: grid; gap: 10px; }
.big-btn { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 16px; border-radius: 16px; background: rgba(255, 255, 255, .06); border: 1px solid var(--line); text-align: left; transition: transform .12s, background .12s, border-color .12s; }
.big-btn:hover, .big-btn:focus-visible { background: rgba(255, 204, 46, .12); border-color: var(--hihi); transform: translateY(-1px); outline: none; }
.big-btn .ico { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; background: rgba(255, 204, 46, .18); flex: none; }
.big-btn b { display: block; font-size: 17px; }
.big-btn span.d { color: var(--muted); font-size: 13px; }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.chip-btn { padding: 10px 14px; border-radius: 12px; background: rgba(255, 255, 255, .08); border: 1px solid var(--line); font-weight: 600; font-size: 14px; }
.chip-btn:hover { border-color: var(--hihi); }
.chip-btn.primary { background: linear-gradient(180deg, var(--hihi), var(--hihi-d)); color: #241600; border: 0; }
.coins-pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: rgba(255, 204, 46, .15); color: var(--hihi); font-weight: 800; font-size: 14px; }
.coin { width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6c8, var(--hihi) 50%, #a87800); display: inline-block; }
.menu-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; }
.lang-toggle { display: inline-flex; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
.lang-toggle button { background: transparent; padding: 6px 10px; font-weight: 700; font-size: 13px; }
.lang-toggle button.on { background: var(--hihi); color: #241600; }

/* opponent cards */
.opp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.opp-card { padding: 14px; border-radius: 16px; background: rgba(255, 255, 255, .06); border: 1px solid var(--line); text-align: center; }
.opp-card:hover { border-color: var(--hihi); background: rgba(255, 204, 46, .1); }
.avatar { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 14px; color: #1b1030; margin: 0 auto 8px; border: 3px solid rgba(255, 255, 255, .7); }
.opp-card b { display: block; }
.opp-card .lvl { font-size: 12px; color: var(--hihi); font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
.opp-card q { display: block; font-size: 12.5px; color: var(--muted); margin-top: 8px; font-style: italic; }
.opp-card .rec { font-size: 12px; margin-top: 6px; color: var(--ok); }

/* levels */
.level-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.level-card { padding: 12px; border-radius: 14px; background: rgba(255, 255, 255, .06); border: 1px solid var(--line); text-align: left; min-height: 96px; }
.level-card:hover:not(:disabled) { border-color: var(--hihi); }
.level-card:disabled { opacity: .45; cursor: not-allowed; }
.level-card .n { font-size: 12px; color: var(--hihi); font-weight: 800; }
.level-card b { display: block; margin: 2px 0 4px; font-size: 15px; }
.level-card .st { color: var(--hihi); letter-spacing: 2px; font-size: 15px; }
.level-card .st i { color: rgba(255, 255, 255, .25); font-style: normal; }

/* shop / achievements / settings */
.shop-sec h3 { margin: 16px 0 8px; font-size: 15px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.shop-item { padding: 12px; border-radius: 14px; background: rgba(255, 255, 255, .06); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.shop-item .sw { height: 26px; border-radius: 8px; }
.shop-item.on { border-color: var(--ok); }
.ach-list { display: grid; gap: 8px; }
.ach { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, .05); border: 1px solid var(--line); }
.ach .medal { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, .1); font-size: 18px; flex: none; }
.ach.got .medal { background: var(--hihi); color: #241600; }
.ach small { color: var(--muted); display: block; }
.set-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.set-row select, .set-row input[type=range] { accent-color: var(--hihi); }
.set-row select { background: #2a1d3a; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-family: inherit; }
.switch { width: 46px; height: 26px; border-radius: 999px; background: rgba(255, 255, 255, .2); position: relative; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .15s; }
.switch.on { background: var(--hihi); }
.switch.on::after { left: 23px; }
.howto-list { line-height: 1.55; padding-left: 0; list-style: none; margin: 0; }
.howto-list li { margin-bottom: 10px; padding: 10px 12px; background: rgba(255, 255, 255, .05); border-radius: 12px; }

/* result */
.result-title { font-size: 34px; font-weight: 900; text-align: center; margin: 4px 0 6px; }
.result-title.win { color: var(--hihi); }
.result-title.lose { color: var(--bad); }
.result-stars { text-align: center; font-size: 40px; color: var(--hihi); letter-spacing: 6px; }
.result-stars i { color: rgba(255, 255, 255, .2); font-style: normal; }
.result-body { text-align: center; color: var(--muted); }

/* ---------------- HUD */
#hud { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
#hud > * { pointer-events: auto; }
#topbar { position: absolute; top: calc(8px + var(--safe-t)); left: 8px; right: 8px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none; }
.pcard { pointer-events: none; display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 6px; border-radius: 14px; background: var(--glass); border: 1px solid var(--line); min-width: 0; max-width: 34vw; transition: box-shadow .2s, border-color .2s; }
.pcard.active { border-color: var(--hihi); box-shadow: 0 0 0 2px rgba(255, 204, 46, .35), 0 0 22px rgba(255, 204, 46, .25); }
.pcard .avatar { width: 38px; height: 38px; margin: 0; font-size: 11px; border-width: 2px; flex: none; }
.pcard .pname { font-weight: 800; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pcard .pgroup { font-size: 11px; color: var(--muted); white-space: nowrap; }
.prack { display: flex; gap: 2px; margin-top: 3px; flex-wrap: wrap; }
.prack .mb { width: 13px; height: 13px; border-radius: 50%; font-size: 7px; font-weight: 900; display: grid; place-items: center; color: #111; box-shadow: inset -2px -2px 3px rgba(0, 0, 0, .35); }
.prack .mb.st { background-image: linear-gradient(180deg, #f6f1e3 25%, transparent 25%, transparent 75%, #f6f1e3 75%) !important; }
.prack .mb.gone { opacity: .22; }
#center-info { text-align: center; pointer-events: none; padding: 6px 14px; border-radius: 14px; background: var(--glass); border: 1px solid var(--line); min-width: 0; }
#turn { font-weight: 900; font-size: 15px; white-space: nowrap; }
#subinfo { font-size: 12px; color: var(--muted); }
#topbtns { position: absolute; top: calc(64px + var(--safe-t)); right: 8px; display: flex; flex-direction: column; gap: 6px; }
.icon-btn { width: 42px; height: 42px; border-radius: 12px; background: var(--glass); border: 1px solid var(--line); font-size: 18px; display: grid; place-items: center; }
.icon-btn:hover { border-color: var(--hihi); }
.icon-btn.on { background: rgba(255, 204, 46, .25); border-color: var(--hihi); }
#toolsLeft { position: absolute; top: calc(64px + var(--safe-t)); left: 8px; display: flex; flex-direction: column; gap: 6px; }
.tool-btn { padding: 9px 12px; border-radius: 12px; background: var(--glass); border: 1px solid var(--line); font-weight: 700; font-size: 13px; text-align: left; }
.tool-btn:hover { border-color: var(--hihi); }

#toast { position: absolute; left: 50%; top: 32%; transform: translate(-50%, -50%) scale(.9); padding: 12px 26px; border-radius: 18px; font-weight: 900; font-size: clamp(20px, 4vw, 34px); text-align: center; background: var(--glass-2); border: 2px solid var(--hihi); color: var(--hihi); opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; text-shadow: 0 2px 10px rgba(0, 0, 0, .5); max-width: 90vw; }

#toast.bad { border-color: var(--bad); color: var(--bad); }

#bubble { position: absolute; padding: 8px 12px; border-radius: 14px; background: #fff8ea; color: #241600; font-size: 13px; font-weight: 600; max-width: 230px; transform: translate(-50%, -100%); pointer-events: none; opacity: 0; transition: opacity .25s; box-shadow: 0 6px 20px rgba(0, 0, 0, .35); }
#bubble::after { content: ""; position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%); border: 8px solid transparent; border-top-color: #fff8ea; border-bottom: 0; }
#bubble.show { opacity: 1; }
#feed { position: absolute; left: 10px; bottom: calc(150px + var(--safe-b)); display: flex; flex-direction: column; gap: 4px; pointer-events: none; max-width: min(360px, 60vw); }
#feed div { padding: 6px 10px; border-radius: 10px; background: var(--glass); font-size: 13px; animation: feedIn .25s ease-out; border-left: 3px solid var(--pink); }
@keyframes feedIn { from { opacity: 0; transform: translateX(-10px); } }

/* controls */
#spinBox { position: absolute; left: 12px; bottom: calc(14px + var(--safe-b)); display: flex; flex-direction: column; align-items: center; gap: 4px; }
#spinBall { width: 86px; height: 86px; border-radius: 50%; background: radial-gradient(circle at 38% 32%, #fff, #e9e3d2 55%, #b9b19c); position: relative; border: 2px solid rgba(255, 255, 255, .6); touch-action: none; box-shadow: 0 6px 20px rgba(0, 0, 0, .4); }

.ctl-label { font-size: 11px; font-weight: 800; letter-spacing: 1px; color: var(--muted); background: var(--glass); padding: 2px 8px; border-radius: 6px; }

#powerPct { font-size: 12px; font-weight: 800; }
#shootBtn { width: 92px; height: 56px; border-radius: 16px; font-size: 18px; font-weight: 900; letter-spacing: 1px; background: linear-gradient(180deg, var(--hihi), var(--hihi-d)); color: #241600; box-shadow: 0 6px 18px rgba(255, 204, 46, .35); }
#shootBtn:disabled { filter: grayscale(1) brightness(.6); cursor: not-allowed; }
#hint { position: absolute; left: 50%; bottom: calc(76px + var(--safe-b)); transform: translateX(-50%); font-size: 13px; padding: 6px 12px; border-radius: 10px; background: var(--glass); color: var(--text); white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
.lock .ctl-disable { opacity: .45; pointer-events: none; }

/* small screens */
@media (max-width: 640px), (max-height: 480px) {
  .pcard { max-width: 30vw; padding: 4px 8px 4px 4px; }
  .pcard .avatar { width: 30px; height: 30px; font-size: 9px; }
  .pcard .pname { font-size: 12px; }
  #center-info { padding: 4px 8px; }
  #turn { font-size: 12px; }
  #subinfo { font-size: 10.5px; }
  #spinBall { width: 70px; height: 70px; }
  #powerBar { height: min(200px, 32vh); width: 44px; }
  #shootBtn { width: 80px; height: 52px; font-size: 16px; }
  #feed { bottom: calc(118px + var(--safe-b)); font-size: 12px; }
  #hint { font-size: 11.5px; bottom: calc(70px + var(--safe-b)); }
  #aimBtns .icon-btn { width: 50px; height: 44px; }
  .panel { padding: 16px; border-radius: 18px; }
  .big-btn { padding: 11px 12px; }
  .big-btn .ico { width: 38px; height: 38px; font-size: 19px; }
  .prack .mb { width: 10px; height: 10px; font-size: 0; }
}
@media (max-height: 480px) and (orientation: landscape) {
  #topbtns, #toolsLeft { top: calc(52px + var(--safe-t)); }
  .icon-btn { width: 36px; height: 36px; font-size: 15px; }
  #powerBar { height: 44vh; }
  #feed { display: none; }
}
@media (pointer: fine) { #aimBtns { display: none; } }

        <button class="big-btn" data-go="opp"><span class="ico">🤖</span><span><b data-t="vsai"></b><span class="d" data-t="vsaiDesc"></span></span></button>

        <button class="chip-btn" data-go="shop">🛒 <span data-t="shop"></span></button>
        <button class="chip-btn" data-go="ach">🏆 <span data-t="achievements"></span></button>
        <button class="chip-btn" data-go="settings">⚙️ <span data-t="settings"></span></button>
        <button class="chip-btn" data-go="howto">❓ <span data-t="howto"></span></button>

  <div id="scrAch" class="screen hidden"><div class="panel"><h2 data-t="achievements"></h2><div class="ach-list" id="achList"></div><div class="row-btns"><button class="chip-btn" data-go="menu" data-t="back"></button></div></div></div>
  <div id="scrSettings" class="screen hidden"><div class="panel"><h2 data-t="settings"></h2><div id="setBody"></div><div class="row-btns"><button class="chip-btn" id="setBack" data-t="back"></button></div></div></div>
  <div id="scrHowto" class="screen hidden"><div class="panel"><h2 data-t="howto"></h2><ul class="howto-list" id="howtoList"></ul><div class="row-btns"><button class="chip-btn" id="howBack" data-t="back"></button></div></div></div>
  <div id="scrPause" class="screen hidden"><div class="panel" style="width:min(380px,100%)"><h2>☰</h2><div class="menu-grid">
    <button class="big-btn" id="pResume"><span class="ico">▶</span><b data-t="resume"></b></button>
    <button class="big-btn" id="pRestart"><span class="ico">↻</span><b data-t="restart"></b></button>
    <button class="big-btn" id="pHowto"><span class="ico">❓</span><b data-t="howto"></b></button>
    <button class="big-btn" id="pSettings"><span class="ico">⚙️</span><b data-t="settings"></b></button>
    <button class="big-btn" id="pMenu"><span class="ico">⌂</span><b data-t="menu"></b></button>
  </div></div></div>
  <div id="scrResult" class="screen hidden"><div class="panel" style="width:min(420px,100%)">
    <div class="result-title" id="resTitle"></div>
    <div class="result-stars" id="resStars"></div>
    <p class="result-body" id="resBody"></p>
    <div class="row-btns" style="justify-content:center" id="resBtns"></div>
  </div></div>

  <div id="loading"><div style="display:grid;place-items:center"><div class="logo-ball"></div><p id="loadingText">Đang dọn bàn...</p></div></div>
