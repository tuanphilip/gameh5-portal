<meta name="description" content="Côn Trùng Tiến Hóa HiHi - ăn mồi, săn con nhỏ hơn và tiến hoá từ con sâu thành Rồng Vàng!">
<style>
:root{--st:env(safe-area-inset-top,0px);--sr:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{position:fixed;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#7ec8f0;font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;pointer-events:none;z-index:5}
#topbar{top:calc(10px + var(--st));left:50%;transform:translateX(-50%);width:min(460px,64vw);text-align:center}
#spName{color:#fff;font-weight:800;font-size:18px;text-shadow:0 2px 0 #2a4a1a,0 0 6px #0006;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:16px;border-radius:9px;background:#0005;border:2px solid #fff;overflow:hidden;margin-top:4px;position:relative}
.bar>i{display:block;height:100%;width:0;border-radius:7px;transition:width .2s}
#xpFill{background:linear-gradient(90deg,#ffd23f,#ff9f1c)}
#hpFill{background:linear-gradient(90deg,#ff5d5d,#ff9a7a)}
.bar>span{position:absolute;inset:0;font-size:11px;line-height:12px;color:#fff;font-weight:700;text-shadow:0 1px 2px #000}
#board{top:calc(10px + var(--st));right:calc(10px + var(--sr));background:#0006;border-radius:12px;padding:8px 10px;color:#fff;font-size:13px;min-width:170px}
#board b{display:block;text-align:center;color:#ffd23f;margin-bottom:3px}
#board div{display:flex;justify-content:space-between;gap:8px;white-space:nowrap}
#board div.me{color:#7dff7d;font-weight:800}
#board.mini div:not(.me){display:none}
#feed{top:215px;left:50%;transform:translateX(-50%);text-align:center;color:#fff;font-size:13px;text-shadow:0 1px 3px #000}
#feed div{animation:fd 4s forwards}
@keyframes fd{0%{opacity:0}8%{opacity:1}80%{opacity:1}100%{opacity:0}}
#diet{margin-top:5px;display:inline-block;background:#0007;color:#fff;border-radius:12px;padding:3px 10px;font-size:17px;letter-spacing:2px;white-space:nowrap}
#hideBadge{margin:5px auto 0;width:max-content;max-width:100%;background:#2f9f4acc;color:#fff;font-weight:800;border-radius:12px;padding:2px 12px;font-size:14px;box-shadow:0 0 0 2px #b6f59a inset;animation:tin .3s}
#hideBadge.bad{background:#7a5a10cc;box-shadow:none}
#diet .hunt{font-size:12px;letter-spacing:0;margin-left:6px;color:#ffd0d0}
#toast{top:146px;left:50%;transform:translateX(-50%);background:linear-gradient(#fffbe6,#ffe9a8);color:#4a3200;border:3px solid #ffb02e;border-radius:16px;padding:8px 16px;font-size:15px;text-align:center;box-shadow:0 6px 18px #0004;max-width:min(520px,92vw);animation:tin .35s}
#toast small{color:#7a5a10}
@keyframes tin{from{transform:translate(-50%,-14px);opacity:0}}
.evoDiet{background:#fff4d6;border:2px dashed #ffb02e;border-radius:14px;padding:6px 10px;margin-top:8px;font-size:14px;color:#5a4200;text-align:left}
.evoDiet .diet{margin:2px 0}
#warn{top:38%;left:50%;transform:translate(-50%,-50%);color:#ff4040;font-weight:900;font-size:26px;text-shadow:0 0 8px #fff,0 2px 0 #600;display:none;white-space:nowrap}
#mini{bottom:calc(10px + var(--sb));left:calc(10px + var(--sl));border-radius:10px;border:2px solid #fff8;background:#0004}
#hint{bottom:12px;left:50%;transform:translateX(-50%);color:#fff;font-size:13px;text-shadow:0 1px 3px #000;opacity:.85;text-align:center}
#btns{position:fixed;top:calc(10px + var(--st));left:calc(10px + var(--sl));z-index:8;display:flex;gap:6px}
#btns button,.lang button{pointer-events:auto;border:none;border-radius:10px;background:#fff;padding:6px 10px;font-size:16px;cursor:pointer;box-shadow:0 3px 0 #0003}
.screen{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#a8e86bcc,#2f7a3fe6);padding:calc(12px + var(--st)) calc(12px + var(--sr)) calc(12px + var(--sb)) calc(12px + var(--sl))}
.card{background:#fffdf3;border-radius:24px;padding:22px 22px 18px;width:min(440px,100%);text-align:center;box-shadow:0 10px 0 #1d5a2a,0 20px 40px #0005;max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.card h1{font-size:34px;line-height:1.05;color:#2f7a3f;text-shadow:0 3px 0 #ffd23f}
.card h1 small{display:block;font-size:22px;color:#ff7b29;text-shadow:none}
.card p{color:#4b5a43;font-size:14px;margin:8px 0}
.card input{width:100%;font:inherit;font-size:18px;padding:10px 14px;border-radius:14px;border:3px solid #9fd26b;outline:none;text-align:center;margin:10px 0 6px;user-select:text;-webkit-user-select:text}
.big{font:inherit;font-weight:800;font-size:22px;color:#fff;background:linear-gradient(#ffb02e,#ff7b29);border:none;border-radius:16px;padding:10px 26px;margin-top:8px;cursor:pointer;box-shadow:0 5px 0 #b84c0d;width:100%;touch-action:manipulation}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #b84c0d}
.big.alt{background:linear-gradient(#6fd36f,#2f9f4a);box-shadow:0 5px 0 #1d6b30}
.lang{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0}
.lang button{font-size:13px;padding:5px 9px;background:#eef6e4;touch-action:manipulation}
.lang button.on{background:#ffd23f;font-weight:800}
#preview{display:block;margin:2px auto;max-width:100%}
.howto{font-size:13px;color:#5a6a50;text-align:left;background:#eef6e4;border-radius:12px;padding:8px 12px;margin-top:10px}
#evo .card{width:min(560px,100%)}
#evoOpts{display:flex;gap:12px;margin-top:10px}
.opt{flex:1;background:#eef6e4;border:3px solid #9fd26b;border-radius:18px;padding:10px 6px;cursor:pointer;transition:transform .1s;touch-action:manipulation}
.opt:hover,.opt:active{transform:scale(1.04);border-color:#ff9f1c}
.opt h3{color:#2f7a3f;font-size:18px}
.opt .tag{display:inline-block;font-size:12px;font-weight:700;background:#fff;border-radius:8px;padding:1px 8px;margin:2px 0}
.opt p{font-size:12px;margin:4px 0 0}
.opt canvas{max-width:100%;height:auto}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.stats div{background:#eef6e4;border-radius:12px;padding:6px;font-size:13px;color:#4b5a43}
.stats b{display:block;font-size:20px;color:#2f7a3f}
/* ---- touch controls ---- */
#touch{display:none;position:fixed;inset:0;z-index:4;touch-action:none}
.joy{position:fixed;left:calc(28px + var(--sl));bottom:calc(30px + var(--sb));width:128px;height:128px;margin:0;border-radius:50%;background:radial-gradient(#ffffff22,#ffffff44);border:3px solid #fff9;pointer-events:none;opacity:.55;transition:opacity .15s}
.joy.on{opacity:1;transition:none}
.joy i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:#fffd;box-shadow:0 3px 8px #0004}
.bite{position:fixed;right:calc(26px + var(--sr));bottom:calc(34px + var(--sb));width:98px;height:98px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffb066,#ff6a1a);border:4px solid #fff;color:#fff;font-weight:900;font-size:17px;display:flex;align-items:center;justify-content:center;pointer-events:none;box-shadow:0 5px 0 #0003;text-shadow:0 1px 2px #0006}
.bite.on{transform:scale(.9);filter:brightness(1.2)}
.bite .cd{position:absolute;inset:-4px;border-radius:50%;background:conic-gradient(#0006 var(--p,0%),transparent 0)}
.zoneHint{position:fixed;bottom:calc(8px + var(--sb));color:#fff;font-size:11px;opacity:.7;text-shadow:0 1px 2px #000;pointer-events:none}
.hidden{display:none!important}
/* ---- phone portrait ---- */
@media (max-width:700px){
 #diet{font-size:14px;padding:2px 8px}#toast{top:calc(148px + var(--st));font-size:13px}
 #topbar{left:calc(58px + var(--sl));right:calc(8px + var(--sr));width:auto;transform:none;top:calc(8px + var(--st))}
 #board{top:calc(100px + var(--st));right:calc(8px + var(--sr));font-size:10px;min-width:118px;padding:4px 7px;pointer-events:auto}
 #board div:nth-child(n+7):not(.me){display:none}#spName{font-size:14px}.card h1{font-size:28px}
 #mini{bottom:auto;top:calc(100px + var(--st));left:calc(8px + var(--sl));width:150px;height:40px}
 #hint{display:none}#feed{top:calc(250px + var(--st));font-size:11px}
 .joy{left:calc(18px + var(--sl));bottom:calc(24px + var(--sb));width:118px;height:118px}
 .bite{right:calc(20px + var(--sr));bottom:calc(30px + var(--sb));width:90px;height:90px}
 #evoOpts{gap:8px}.card{padding:16px 14px 14px}#warn{font-size:20px}
 #btns{flex-direction:column}#btns button{padding:5px 9px;font-size:15px}
}
/* ---- phone landscape (short screens) ---- */
@media (max-height:520px){
 #topbar{top:calc(6px + var(--st));width:min(380px,44vw)}#spName{font-size:13px}.bar{height:12px;margin-top:2px}.bar>span{font-size:9px;line-height:8px}
 #diet{font-size:13px;padding:1px 8px;margin-top:3px}#diet .hunt{font-size:10px}
 #board{top:calc(6px + var(--st));right:calc(6px + var(--sr));font-size:10px;min-width:118px;padding:4px 7px;pointer-events:auto}
 #board div:nth-child(n+6):not(.me){display:none}
 #mini{top:calc(52px + var(--st));bottom:auto;left:calc(8px + var(--sl));width:150px;height:40px}
 #toast{top:auto;bottom:calc(10px + var(--sb));font-size:12px;padding:5px 10px;max-width:46vw}
 #feed{top:calc(84px + var(--st));font-size:11px}#hint{display:none}#warn{font-size:20px;top:30%}
 .card{padding:12px 16px}.card h1{font-size:22px}.card h1 small{font-size:16px;display:inline;margin-left:6px}
 #preview{height:64px;width:auto}.card p{margin:4px 0;font-size:12px}.howto{display:none}
 .card input{padding:6px 10px;margin:6px 0 4px;font-size:16px}.big{font-size:18px;padding:7px 20px;margin-top:6px}
 #evo .card{width:min(640px,100%)}#evo h1{font-size:22px!important}.opt canvas{height:70px;width:auto}.opt p{display:none}.opt h3{font-size:15px}.evoDiet{font-size:12px;padding:4px 8px;margin-top:4px}
 .stats{grid-template-columns:repeat(4,1fr)}.stats b{font-size:16px}
 .joy{width:112px;height:112px;bottom:calc(20px + var(--sb))}.bite{width:86px;height:86px;bottom:calc(24px + var(--sb))}
}
</style>
</head>

  <div id="spName"></div>

</div>

    <button class="big" id="againBtn"></button>
  </div>
</div>

/* ================= COLOR HELPERS ================= */
const _sc=new Map();
function shade(hex,a){const k=hex+a;let v=_sc.get(k);if(v)return v;
  const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  if(a>0){r+=(255-r)*a;g+=(255-g)*a;b+=(255-b)*a;}else{r*=1+a;g*=1+a;b*=1+a;}
  v=`rgb(${r|0},${g|0},${b|0})`;_sc.set(k,v);return v;}
function rg(g,c,x,y,R){const gr=g.createRadialGradient(x-R*0.3,y-R*0.45,R*0.05,x,y,R*1.15);gr.addColorStop(0,shade(c,0.45));gr.addColorStop(0.55,c);gr.addColorStop(1,shade(c,-0.32));return gr;}
function blob(g,c,x,y,rx,ry,rot,noStroke){
  if(LITE){g.fillStyle=c;g.beginPath();g.ellipse(x,y,rx,ry,rot||0,0,7);g.fill();if(!noStroke)g.stroke();g.fillStyle="rgba(255,255,255,.28)";g.beginPath();g.ellipse(x-rx*0.25,y-ry*0.4,rx*0.45,ry*0.28,rot||0,0,7);g.fill();return;}
  g.fillStyle=rg(g,c,x,y,Math.max(rx,ry));g.beginPath();g.ellipse(x,y,rx,ry,rot||0,0,7);g.fill();if(!noStroke)g.stroke();}
const OL="#1d1b16";
function chibiEye(g,x,y,s,col,t,seed){
  g.fillStyle=col||"#fff";g.strokeStyle=OL;g.lineWidth=1.3;g.beginPath();g.ellipse(x,y,4.2*s,5*s,0,0,7);g.fill();g.stroke();
  const bl=(Math.sin(t*0.9+seed)>0.985)?0.15:1;
  g.fillStyle=col&&col!=="#fff"?"#4a0808":"#1b1b1b";g.beginPath();g.ellipse(x+1.2*s,y+0.6*s,2.5*s,3.1*s*bl,0,0,7);g.fill();

<script>

const W=20000,H=4200,GB=3600,G=1300;
const WATERS=[{x0:3000,x1:4000,lv:GB+40},{x0:9600,x1:12000,lv:GB+25}];
const BIOMES=[[0,3000,"garden"],[3000,4000,"pond"],[4000,6500,"mush"],[6500,9600,"grass"],[9600,12000,"lake"],[12000,15400,"forest"],[15400,W,"mount"]];
let seed=12345;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
const R=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const biomeAt=x=>{for(const b of BIOMES)if(x>=b[0]&&x<b[1])return b[2];return"mount";};
function gy(x){
  let y=GB+50*Math.sin(x/420)+25*Math.sin(x/160+1.3);
  if(x>3000&&x<4000)y+=240*Math.sin(Math.PI*(x-3000)/1000);
  else if(x>6500&&x<9600){const e=Math.sin(Math.PI*(x-6500)/3100);y-=e*(110+70*Math.sin(x/330));}
  else if(x>9600&&x<12000)y+=560*Math.pow(Math.sin(Math.PI*(x-9600)/2400),0.8);
  else if(x>15400){const e=Math.sin(Math.PI*Math.min(1,(x-15400)/4600));y-=1050*Math.pow(e,1.3)+e*(130*Math.sin(x/260)+55*Math.sin(x/97));}
  return y;
}
function waterAt(x){for(const w of WATERS)if(x>w.x0&&x<w.x1&&gy(x)>w.lv)return w;return null;}
const nearWater=(x,m)=>WATERS.some(w=>x>w.x0-m&&x<w.x1+m);
const PLATS=[],FLOWERS=[],MUSH=[],BUSHES=[],TREES=[],PADS=[],CLOUDS=[],ROCKS=[],BOULDERS=[],TALLGRASS=[];
const FLCOL=["#ff6fa8","#ffd23f","#ff8a3d","#b98cff","#ffffff","#ff4f5e","#6fc8ff"];
function addTree(tx,h,big){
  const base=gy(tx),top=base-h,tr={x:tx,base,top,br:[],big};
  const n=Math.floor((h-180)/125);
  for(let i=0;i<n;i++){
    const y=base-160-i*125,dir=i%2?1:-1,len=(150+rnd()*110)*(big?1.25:1),tw=big?55:40;
    const x1=dir>0?tx+tw:tx-tw-len,x2=dir>0?tx+tw+len:tx-tw;
    const p={x1,x2,y,type:"branch"};PLATS.push(p);tr.br.push(p);
  }
  TREES.push(tr);
}
function genWorld(){
  seed=777;
  addTree(700,1150,false);
  for(let x=12350;x<15200;x+=480+rnd()*120)addTree(x,1200+rnd()*450,true);
  const okFlower=x=>!nearWater(x,80)&&!TREES.some(t=>Math.abs(t.x-x)<130);
  const flower=(x0,x1,n,hmin,hmax)=>{for(let i=0;i<n;i++){let x,k=0;do{x=x0+rnd()*(x1-x0);k++;}while(!okFlower(x)&&k<40);
    const h=hmin+rnd()*(hmax-hmin),y=gy(x)-h,w=50+rnd()*18+(h>300?14:0);
    const f={x,y,w,col:FLCOL[(rnd()*FLCOL.length)|0],h};FLOWERS.push(f);PLATS.push({x1:x-w/2,x2:x+w/2,y,type:"flower",ref:f});}};
  flower(150,3000,95,70,340);flower(6600,9500,70,90,420);flower(12000,15300,25,80,300);flower(4000,6500,10,70,200);
  for(let i=0;i<48;i++){const x=4080+rnd()*2350,big=rnd()<0.25,h=(big?260:60)+rnd()*(big?220:200),w=(big?230:110)+rnd()*120,y=gy(x)-h;
    const m={x,y,w,h,col:rnd()<0.5?"#e8453c":(rnd()<0.5?"#b56cff":"#ff9b3d")};MUSH.push(m);PLATS.push({x1:x-w/2,x2:x+w/2,y,type:"mush",ref:m});}
  for(const wt of WATERS)for(let x=wt.x0+90;x<wt.x1-60;x+=95+rnd()*(wt.x1-wt.x0>1500?160:70)){if(gy(x)<wt.lv+20)continue;const w=60+rnd()*40;PADS.push({x,w,lotus:rnd()<0.35,lv:wt.lv});PLATS.push({x1:x-w/2,x2:x+w/2,y:wt.lv-3,type:"pad"});}
  for(let i=0;i<130;i++){let x;do{x=100+rnd()*(W-200);}while(nearWater(x,40));BUSHES.push({x,w:70+rnd()*90,h:40+rnd()*45});}
  for(let i=0;i<48;i++){let x;do{x=(i<6?300:3900)+rnd()*(W-(i<6?300:3900)-200);}while(nearWater(x,80));const h=100+rnd()*150;BUSHES.push({x,w:h*(1.5+rnd()*0.6),h});}
  for(const b of BUSHES)b.gy=gy(b.x);
  for(let i=0;i<260;i++){let x;do{x=6550+rnd()*3000;}while(nearWater(x,20));TALLGRASS.push({x,h:60+rnd()*90});}
  for(let i=0;i<34;i++){const x=15600+rnd()*4200,y=gy(x)-120-rnd()*420,w=140+rnd()*160;ROCKS.push({x,y,w});PLATS.push({x1:x-w/2,x2:x+w/2,y,type:"rock"});}
  for(let i=0;i<70;i++){let x;do{x=6000+rnd()*(W-6100);}while(nearWater(x,60));BOULDERS.push({x,s:20+rnd()*(x>15400?70:35)});}

 egg:{xp:45,r:17,min:9,max:14,e:"🥚"},fish:{xp:60,r:22,min:9,max:15,e:"🐟"},watermelon:{xp:90,r:28,min:11,max:16,e:"🍉"},beehive:{xp:140,r:30,min:13,max:16,e:"🐝"}};

function groundX(x0,x1){let x,k=0;do{x=R(x0,x1);k++;}while(waterAt(x)&&k<40);return x;}
function placeFood(f){
  f.active=true;f.bob=Math.random()*6;
  switch(f.type){
    case"nectar":{const fl=pick(FLOWERS);f.x=fl.x+R(-12,12);f.y=fl.y-8;break;}

    case"dew":{const x=R(80,W-80);f.x=x;f.y=R(300,gy(x)-260);break;}

    case"apple":{const t=pick(TREES);const x=t.x+R(-420,420);f.x=x;f.y=gy(x)-14;break;}
    case"mushroom":{const x=Math.random()<0.7?groundX(4050,6450):groundX(12000,15400);f.x=x;f.y=gy(x)-16;break;}
    case"egg":{if(Math.random()<0.6){const t=pick(TREES.filter(t=>t.big)),b=pick(t.br);f.x=R(b.x1+20,b.x2-20);f.y=b.y-16;}else{const r=pick(ROCKS);f.x=r.x+R(-r.w/3,r.w/3);f.y=r.y-16;}break;}
    case"fish":{const w=pick(WATERS);let x,k=0;do{x=R(w.x0+60,w.x1-60);k++;}while(gy(x)<w.lv+90&&k<40);f.x=x;f.y=R(w.lv+40,gy(x)-30);f.w=w;f.vx=R(40,90)*(Math.random()<0.5?1:-1);break;}
    case"watermelon":{const x=Math.random()<0.75?groundX(6550,9550):groundX(15400,17000);f.x=x;f.y=gy(x)-26;break;}
    case"beehive":{const t=pick(TREES.filter(t=>t.big)),b=pick(t.br);f.x=R(b.x1+30,b.x2-30);f.y=b.y+48;break;}
  }
}
function genFood(){
  const counts={nectar:230,leaf:170,seed:150,dew:210,berry:130,honey:55,apple:55,mushroom:65,egg:45,fish:60,watermelon:40,beehive:28};

/* ================= PHYSICS ================= */
function physics(c,dt){
  const sp=c.sp,fly=sp.move==="f";
  const wt=waterAt(c.x);c.inW=!!wt&&c.y>wt.lv;

    let dx=c.ix,dy=c.iy;const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m;}
    const k=Math.min(1,dt*4),s=sp.spd*wf*(swimming&&!fly?0.9:1);
    c.vx+=(dx*s-c.vx)*k;c.vy+=(dy*s-c.vy)*k;
    if(m<0.1&&!c.onG&&!swimming)c.vy+=90*dt;
    if(swimming&&!fly&&c.y<wt.lv+sp.r*0.3&&dy<-0.3&&c.wantJump){c.vy=-sp.jump*0.8;}
  }else{
    const k=Math.min(1,dt*(c.onG?12:5));
    c.vx+=(c.ix*sp.spd*wf-c.vx)*k;
    if(c.inW){c.vy+=G*0.22*dt;c.vy*=0.97;if(c.iy<-0.3)c.vy-=700*dt;if(c.iy>0.3)c.vy+=300*dt;}
    else c.vy+=G*dt;
    if(c.wantJump&&c.onG){c.vy=-sp.jump;c.onG=false;if(c.isP)SFX.jump();}
  }
  const foot=sp.r*0.85,py=c.y;
  c.x+=c.vx*dt;c.y+=c.vy*dt;
  c.x=clamp(c.x,sp.r,W-sp.r);if(c.y<70+sp.r){c.y=70+sp.r;c.vy=Math.max(0,c.vy);}
  c.onG=false;c.drop-=dt;
  const g0=gy(c.x)-foot;
  if(c.y>=g0){c.y=g0;if(c.vy>0)c.vy=0;c.onG=true;}
  else if(c.vy>=0&&c.drop<=0&&!(fly&&c.iy<-0.2)&&sp.r<110){
    for(const p of PLATS){
      if(c.x<p.x1||c.x>p.x2)continue;const top=p.y-foot;
      if(py<=top+2&&c.y>=top){c.y=top;c.vy=0;c.onG=true;break;}
    }
  }
  if(Math.abs(c.ix)>0.15)c.face=c.ix>0?1:-1;
}

/* ================= COMBAT ================= */
function relation(a,b){return b.sp.tier<a.sp.tier?1:b.sp.tier===a.sp.tier?0:-1;}

  else c.vx+=c.face*c.sp.spd*0.9;
  if(c.isP){c.sp.tier>=13?SFX.roar():SFX.bite();}else if(near(c,player,900))SFX.bite();
}
function bushAt(c){for(const b of BUSHES){if(Math.abs(c.x-b.x)<b.w*0.45&&c.y>b.gy-b.h*1.05&&c.y<b.gy+8)return b;}return null;}

function nearestBush(c,maxDx,awayFrom){let best_=null,bd=maxDx;for(const b of BUSHES){if(!fits(c,b))continue;const d=Math.abs(b.x-c.x);if(d>=bd)continue;if(awayFrom&&d>60&&Math.sign(b.x-c.x)===Math.sign(awayFrom.x-c.x)&&Math.abs(awayFrom.x-c.x)<d+80)continue;bd=d;best_=b;}return best_;}
const near=(a,b,d)=>b&&Math.abs(a.x-b.x)<d&&Math.abs(a.y-b.y)<d;

/* ================= AI ================= */
function botAI(b,dt){
  const ai=b.ai;ai.next-=dt;

    ai.next=R(0.22,0.45)/b.skill;
    let threat=null,td=(330+b.sp.r*2)*b.skill,prey=null,pd=(480+b.sp.r*4)*b.skill;
    for(const o of ents){if(o===b||!o.alive||o.inv>0||o.hidden)continue;const dx=o.x-b.x,dy=o.y-b.y;if(Math.abs(dx)>1500)continue;const d=Math.hypot(dx,dy);
      const rel=relation(b,o);
      if(rel<0&&d<td+o.sp.r*2){if(o.sp.move==="g"&&b.sp.move==="f"&&o.y-b.y>260)continue;td=d;threat=o;}
      else if(rel>0&&d<pd){if(b.sp.move==="g"&&b.y-o.y>360)continue;pd=d;prey=o;}}
    if(bird&&b.sp.tier<=5&&Math.hypot(bird.x-b.x,bird.y-b.y)<450){threat=bird;}
    if(threat&&Math.random()<0.45*b.skill&&(ai.hb=nearestBush(b,450,threat))){ai.mode="hide";ai.tx=ai.hb.x;ai.ty=b.sp.move==="f"?ai.hb.gy-ai.hb.h*0.45:ai.hb.gy;ai.next=R(1.8,3.5);}
    else if(threat){ai.mode="flee";ai.tx=b.x-(threat.x-b.x)*3;ai.ty=b.y-(threat.y-b.y)*2;if(b.sp.move==="f"&&threat!==bird)ai.ty=Math.min(ai.ty,gy(b.x)-450);if(threat===bird)ai.ty=gy(b.x);}
    else if(prey&&Math.random()<0.85){ai.mode="hunt";ai.tgt=prey;}
    else{
      const bf=nearestFood(b,1500);
      if(bf){ai.mode="food";ai.tx=bf.x;ai.ty=bf.y;}
      else if(ai.mode!=="wander"||Math.hypot(ai.tx-b.x,ai.ty-b.y)<80){ai.mode="wander";ai.tx=clamp(b.x+R(-2500,2500),150,W-150);ai.ty=b.sp.move==="f"?R(Math.max(300,gy(ai.tx)-1200),gy(ai.tx)-200):gy(ai.tx);}
    }
  }
  if(ai.mode==="hunt"){const p=ai.tgt;if(!p||!p.alive||p.hidden){ai.next=0;ai.mode="wander";}else{ai.tx=p.x;ai.ty=p.y;
    const d=Math.hypot(p.x-b.x,p.y-b.y);if(d<b.sp.r*(b.sp.kind==="dragon"?1.6:1)+p.sp.r+22&&Math.sign(p.x-b.x)===b.face&&Math.random()<dt*6*b.skill)b.wantBite=true;}}

  b.ix=Math.abs(dx)>12?clamp(dx/(sc*2),-1,1):0;
  const free=b.sp.move==="f"||(b.inW&&b.sp.swim);
  b.iy=free?clamp(dy/(sc*2),-1,1):(dy<-50?-1:dy>80?1:0);
  b.wantJump=b.sp.move==="g"&&(dy<-50||(ai.mode==="flee"&&Math.random()<0.02));
  if(b.sp.move==="g"&&dy>60&&b.onG)b.drop=0.25;
}

/* ================= PREDATORS ================= */
function updateBird(dt){
  birdTimer-=dt;
  if(!bird&&birdTimer<=0){
    const dir=Math.random()<0.5?1:-1;const cx=player&&player.alive?player.x:R(500,W-500);
    bird={x:cx-dir*1600,y:clamp(gy(cx)-R(500,1400),200,H),dir,vx:dir*480,vy:0,t:0,eat:0};birdTimer=R(30,55);
    if(player&&player.alive&&player.sp.tier<=5){showWarn(tr("bird"));SFX.warn();}
  }
  if(!bird)return;
  bird.t+=dt;
  let tgt=null,bd=650;
  for(const c of ents){if(!c.alive||c.sp.tier>5||c.inv>0||c.hidden)continue;if(Math.sign(c.x-bird.x)!==bird.dir)continue;const d=Math.hypot(c.x-bird.x,c.y-bird.y);if(d<bd){bd=d;tgt=c;}}
  const ty=tgt?tgt.y:gy(bird.x)-800+Math.sin(bird.t)*300;
  bird.vy+=(clamp((ty-bird.y)*2.2,-420,420)-bird.vy)*Math.min(1,dt*3);
  bird.x+=bird.vx*dt;bird.y+=bird.vy*dt;bird.y=Math.min(bird.y,gy(bird.x)-40);
  for(const c of ents){if(!c.alive||c.sp.tier>5||c.inv>0||c.hidden)continue;if(Math.hypot(c.x-bird.x,c.y-bird.y)<44+c.sp.r*0.5){bird.eat=0.3;killC(c,null,tr("bird_n"));}}

function updateFrog(dt){

  frog.cd-=dt;
  if(frog.tongue>0){frog.tongue-=dt;
    if(frog.tgt&&frog.tongue<0.12&&frog.tgt.alive&&!frog.tgt.hidden){const c=frog.tgt;if(Math.hypot(c.x-frog.tx,c.y-frog.ty)<c.sp.r+26){killC(c,null,tr("frog_n"));}frog.tgt=null;}
    return;}
  if(frog.cd<=0){
    let best_=null,bd=300;
    for(const c of ents){if(!c.alive||c.sp.tier>4||c.inv>0||c.hidden)continue;const d=Math.hypot(c.x-frog.x,c.y-frog.y);if(d<bd&&c.y<lv+10){bd=d;best_=c;}}
    if(best_){frog.tgt=best_;frog.tx=best_.x;frog.ty=best_.y;frog.tongue=0.3;frog.cd=R(2,3.2);frog.face=best_.x>frog.x?1:-1;}

/* ================= UPDATE ================= */
function update(dt){
  gameT+=dt;dayT+=dt;
  if(player&&player.alive)playerInput(player);
  for(const c of ents){
    if(!c.alive)continue;c.t+=dt;
    if(!c.isP)botAI(c,dt);
    if(c.wantBite){doBite(c);c.wantBite=false;}
    c.biteCd-=dt;c.biteA-=dt;c.inv-=dt;c.lastHit+=dt;
    physics(c,dt);
    c.revealT=(c.revealT||0)-dt;const bu=bushAt(c);c.bush=bu;const wasH=c.hidden;const inB=!!bu&&fits(c,bu)&&c.revealT<=0&&Math.hypot(c.vx,c.vy)<c.sp.spd*0.35;c.hideT=inB?(c.hideT||0)+dt:0;c.hidden=c.hideT>0.35;
    if(c.isP&&c.hidden&&!wasH){burst(c.x,c.y-c.sp.r*0.3,"#5cbf3a",8,120+c.sp.r);tone(1800,600,0.12,"triangle",0.03);vib(15);}
    biteCheck(c);
    if(c.lastHit>3&&c.hp<c.sp.hp)c.hp=Math.min(c.sp.hp,c.hp+c.sp.hp*0.025*dt);
    const t=c.sp.tier,rr0=c.sp.r;
    for(const f of FOODS){
      if(!f.active)continue;const dx=f.x-c.x;if(dx>rr0+40||dx<-rr0-40)continue;const dy=f.y-c.y,rr=rr0+f.r;
      if(dx*dx+dy*dy<rr*rr&&canEat(t,f.type)){const ft=FOODT[f.type];
        f.active=false;f.respawn=R(5,11);const v=Math.round(ft.xp*(1+(t-ft.min)*0.12));giveXP(c,v);
        if(c.isP){SFX.eat();floatTxt(f.x,f.y-10,"+"+v,"#ffe14d");burst(f.x,f.y,"#fff59a",5,90);}}
    }
    tryEvolve(c);
  }
  for(const f of FOODS){
    if(!f.active){f.respawn-=dt;if(f.respawn<=0)placeFood(f);continue;}
    if(f.type==="fish"){f.x+=f.vx*dt;f.y+=Math.sin(gameT*2+f.bob)*10*dt;if(f.x<f.w.x0+60||f.x>f.w.x1-60||gy(f.x)<f.y+20){f.vx*=-1;f.x+=f.vx*dt*2;}f.y=clamp(f.y,f.w.lv+30,gy(f.x)-20);}
  }
  updateBird(dt);updateFrog(dt);
  for(const p of parts){p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;}parts=parts.filter(p=>p.l>0);
  for(const f of floats){f.l-=dt;f.y-=40*dt;}floats=floats.filter(f=>f.l>0);
  for(const cl of CLOUDS){cl.x+=12*cl.s*dt;if(cl.x>W+300)cl.x=-300;}
  if(player){

<script>
/* ================= RENDER ================= */
function nightF(){const p=(dayT%240)/240;return clamp((Math.cos(p*Math.PI*2)*-1+0.2)*0.9,0,0.75);}

const GRASSC={garden:"#5cbf3a",pond:"#5cbf3a",mush:"#4fae46",grass:"#93cf3d",lake:"#63c04a",forest:"#3e9a3a",mount:"#7f9a6a"};
function render(){

  if(n>0.4){g.fillStyle="#fff";for(let i=0;i<70;i++){const x=(i*137.5)%VW,y=(i*71.3)%(VH*0.55);g.globalAlpha=(n-0.4)*1.8*((i%3)/3+0.3);g.fillRect(x,y,2,2);}g.globalAlpha=1;}
  // parallax layers

  ridge(g,0.2,lerpC("#8cc3a6","#1a3040",n),yb(0.6,0.25),90,0.003,false,lerpC("#7ab593","#172a38",n));

  for(let i=0,np=LITE?14:40;i<np;i++){const fx=L+((i*397+gameT*18*(i%3+1))%(Rr-L)),fy=Tp+((i*233+Math.sin(gameT+i)*40)%(Bt-Tp));
    if(n>0.3){g.fillStyle=`rgba(230,255,120,${(n-0.3)*(0.5+0.5*Math.sin(gameT*4+i))})`;g.beginPath();g.arc(fx,fy,3/cam.z*0.8,0,7);g.fill();}

function ridge(g,par,col,base,amp,f,peaks,col2){
  const off=cam.x*par*cam.z;g.fillStyle=col;g.beginPath();g.moveTo(0,VH);
  for(let x=0;x<=VW+20;x+=16){const wx=(x+off)/Math.max(0.5,cam.z);let h=Math.sin(wx*f)*amp+Math.sin(wx*f*2.7+1)*amp*0.4;if(peaks)h+=Math.abs(Math.sin(wx*f*0.5))*amp*1.2;g.lineTo(x,base-h);}

  if(col2){g.fillStyle=col2;for(let x=-40;x<=VW+40;x+=46){const wx=(x+off)/Math.max(0.5,cam.z);const h=Math.sin(wx*f)*amp+Math.sin(wx*f*2.7+1)*amp*0.4;const k=((Math.floor(wx/46)*7919)%13)/13;g.beginPath();g.arc(x,base-h-6,14+k*14,0,7);g.fill();}}
}
function drawCloud(g,c,n){const s=c.s*60;if(LITE)g.fillStyle=n>0.4?"rgba(180,190,225,.3)":"rgba(246,251,255,.92)";else{const gr=g.createLinearGradient(0,c.y-s,0,c.y+s);
  gr.addColorStop(0,n>0.4?"rgba(200,210,240,.35)":"rgba(255,255,255,.95)");gr.addColorStop(1,n>0.4?"rgba(120,130,170,.25)":"rgba(215,232,248,.9)");g.fillStyle=gr;}
  g.beginPath();g.arc(c.x,c.y,s,0,7);g.arc(c.x+s*0.95,c.y+s*0.15,s*0.75,0,7);g.arc(c.x-s*0.95,c.y+s*0.2,s*0.7,0,7);g.arc(c.x+s*0.2,c.y-s*0.5,s*0.72,0,7);g.arc(c.x-s*0.4,c.y-s*0.3,s*0.6,0,7);g.fill();}
function drawGround(g,L,Rr,Bt){
  const x0=Math.max(0,Math.floor(L/20)*20),x1=Math.min(W,Rr+20);
  g.beginPath();g.moveTo(x0,Bt+600);for(let x=x0;x<=x1;x+=20)g.lineTo(x,gy(x));g.lineTo(x1,Bt+600);g.closePath();
  const dg=g.createLinearGradient(0,2600,0,H+400);dg.addColorStop(0,"#a7764a");dg.addColorStop(0.45,"#8a5a32");dg.addColorStop(1,"#4b2f18");g.fillStyle=dg;g.fill();
  if(Rr>15400){g.save();g.clip();const sg=g.createLinearGradient(15400,0,16400,0);sg.addColorStop(0,"rgba(130,136,142,0)");sg.addColorStop(1,"rgba(130,136,142,1)");g.fillStyle=sg;g.fillRect(Math.max(x0,15400),Tp_(),x1-Math.max(x0,15400),H+800);g.restore();}
  // strata

    if(col!==cur){if(cur)g.stroke();cur=col;if(col){g.strokeStyle=col;g.beginPath();g.moveTo(x,gy(x));}}else if(col)g.lineTo(x,gy(x));}

  // tufts (batched per biome colour)

  for(let x=Math.floor(x0/step)*step;x<x1;x+=step){if(waterAt(x))continue;const bm=biomeAt(x);if(bm==="mount"&&gy(x)<GB-640)continue;
    const col=shade(GRASSC[bm],0.25);if(col!==tc){if(tc)g.stroke();tc=col;g.strokeStyle=col;g.beginPath();}
    const h=((x*9301+49297)%233)/233,y=gy(x)-4,sw=Math.sin(gameT*1.5+x*0.01)*2;
    g.moveTo(x,y);g.lineTo(x-4+sw,y-10-h*12);g.moveTo(x+4,y);g.lineTo(x+7+sw,y-8-h*10);

  g.fillStyle="rgba(70,45,25,.55)";for(let x=Math.floor(x0/90)*90;x<x1;x+=90){const h=((x*7919)%97)/97;g.beginPath();g.ellipse(x+h*40,gy(x)+40+h*90,8+h*10,5+h*5,0,0,7);g.fill();}
}
const Tp_=()=>cam.y-VH/2/cam.z-200;
function drawTree(g,t){if(!t.cv)cacheTree(t);g.drawImage(t.cv,t.bx,t.by,t.bw,t.bh);}

function drawFood(g,f,pt){

    case"mushroom":g.fillStyle="#f6ebd2";g.fillRect(f.x-4,y-2,8,16);g.fillStyle=rg(g,"#e8453c",f.x,y-4,16);g.beginPath();g.ellipse(f.x,y,16,11,0,Math.PI,0);g.closePath();g.fill();g.stroke();g.fillStyle="#fff";g.beginPath();g.arc(f.x-6,y-5,2.5,0,7);g.arc(f.x+5,y-7,2.2,0,7);g.fill();break;
    case"egg":g.fillStyle="#8a6a3a";g.beginPath();g.ellipse(f.x,y+10,18,6,0,0,7);g.fill();g.fillStyle=rg(g,"#f4efe3",f.x,y,13);g.beginPath();g.ellipse(f.x-5,y,7,10,-0.2,0,7);g.ellipse(f.x+5,y+1,7,10,0.2,0,7);g.fill();g.stroke();g.fillStyle="#a9c7e8";g.beginPath();g.arc(f.x+6,y-2,1.6,0,7);g.arc(f.x-4,y+3,1.4,0,7);g.fill();break;

function drawCreature(g,c,hid){
  const sp=c.sp,r=sp.r;
  const gyy=gy(c.x),hgt=gyy-(c.y+r*0.85);
  if(hgt<700&&!c.inW){const a=0.28*(1-hgt/700);g.fillStyle=`rgba(0,0,0,${a})`;g.beginPath();g.ellipse(c.x,gyy-2,r*1.15*(1-hgt/1400),r*0.22,0,0,7);g.fill();}

  g.save();g.translate(c.x,c.y);

  g.rotate(tilt);
  if(c.lastHit<0.12&&!LITE)g.filter="brightness(2)";
  drawCreatureSprite(g,sp,r,c.t,c.face,{moving:Math.abs(c.vx)>20,air:!c.onG&&!(c.inW&&sp.swim&&sp.move==="g"),biting:c.biteA>0});
  if(!LITE)g.filter="none";
  if(c.lastHit<0.12&&LITE){g.fillStyle="rgba(255,255,255,.55)";g.beginPath();g.arc(0,0,r*0.9,0,7);g.fill();}g.restore();g.globalAlpha=1;if(hid&&!c.isP)return;
  let col="#fff";
  if(player&&!c.isP){const rel=relation(player,c);col=rel>0?"#8dff6a":rel===0?"#ffe14d":"#ff6060";}
  const fs=Math.round(13/Math.max(0.45,cam.z));g.font=`bold ${fs}px sans-serif`;g.textAlign="center";g.lineWidth=fs/4;g.strokeStyle="#000a";
  const ly=c.y-r*1.4-fs*0.8,label=(hid?"🌿 ":"")+c.name+"  "+sp.tier;
  g.strokeText(label,c.x,ly);g.fillStyle=c.isP?"#fff":col;g.fillText(label,c.x,ly);
  if(c.isP){g.fillStyle="#ffd23f";g.beginPath();g.moveTo(c.x-fs*0.4,ly-fs*1.2);g.lineTo(c.x+fs*0.4,ly-fs*1.2);g.lineTo(c.x,ly-fs*0.6);g.closePath();g.fill();}
  if(c.hp<sp.hp){const bw=Math.max(r*2,fs*3);g.fillStyle="#0007";g.fillRect(c.x-bw/2,ly+fs*0.3,bw,fs*0.4);g.fillStyle="#ff5d5d";g.fillRect(c.x-bw/2,ly+fs*0.3,bw*clamp(c.hp/sp.hp,0,1),fs*0.4);}
}
function drawWater(g,w){
  const x0=w.x0,x1=w.x1,lv=w.lv;let bot=lv;for(let x=x0;x<=x1;x+=40)bot=Math.max(bot,gy(x));
  const wg=g.createLinearGradient(0,lv,0,bot+40);wg.addColorStop(0,"rgba(110,190,240,.62)");wg.addColorStop(1,"rgba(20,70,130,.78)");
  g.fillStyle=wg;g.beginPath();g.moveTo(x0,lv);
  for(let x=x0;x<=x1;x+=16)g.lineTo(x,lv+Math.sin(x/30+gameT*2)*3);
  for(let x=x1;x>=x0;x-=16)g.lineTo(x,Math.max(lv,gy(x)+40));g.closePath();g.fill();
  g.save();g.clip();g.strokeStyle="rgba(255,255,255,.12)";g.lineWidth=3;
  for(let i=0;i<14;i++){const y=lv+30+i*38;g.beginPath();for(let x=x0;x<=x1;x+=30){const yy=y+Math.sin(x/60+gameT*1.4+i)*6;x===x0?g.moveTo(x,yy):g.lineTo(x,yy);}g.stroke();}
  g.restore();
  g.strokeStyle="rgba(255,255,255,.7)";g.lineWidth=3;g.beginPath();let st=false;for(let x=x0;x<=x1;x+=16){if(gy(x)<lv){st=false;continue;}const y=lv+Math.sin(x/30+gameT*2)*3;st?g.lineTo(x,y):g.moveTo(x,y);st=true;}g.stroke();
  for(const p of PADS){if(p.lv!==lv)continue;g.fillStyle=rg(g,"#3fa34d",p.x,lv,p.w/2);g.strokeStyle="#246b2e";g.lineWidth=2;g.beginPath();g.ellipse(p.x,lv,p.w/2,9,0,0.25,Math.PI*2-0.05);g.lineTo(p.x,lv);g.closePath();g.fill();g.stroke();
    if(p.lotus){g.fillStyle="#ff9fc8";for(let i=0;i<5;i++){g.beginPath();g.ellipse(p.x+(i-2)*6,lv-10,5,12,(i-2)*0.35,0,7);g.fill();}g.fillStyle="#ffd23f";g.beginPath();g.arc(p.x,lv-8,4,0,7);g.fill();}}
}
function drawFrog(g){
  const f=frog,s=f.face;g.save();g.translate(f.x,f.y);
  if(f.tongue>0){const k=f.tongue>0.15?(0.3-f.tongue)/0.15:f.tongue/0.15;g.strokeStyle="#ff6b8a";g.lineWidth=7;g.beginPath();g.moveTo(16*s,-8);g.lineTo((f.tx-f.x)*k,(f.ty-f.y)*k);g.stroke();g.fillStyle="#ff4f73";g.beginPath();g.arc((f.tx-f.x)*k,(f.ty-f.y)*k,8,0,7);g.fill();}

function drawBird(g){

}
function drawArrow(g){
  if(!player||!player.alive||!arrowTgt)return;
  const px=(player.x-cam.x)*cam.z+VW/2,py=(player.y-cam.y)*cam.z+VH/2,fx=(arrowTgt.x-cam.x)*cam.z+VW/2,fy=(arrowTgt.y-cam.y)*cam.z+VH/2;

  g.beginPath();g.moveTo(16,0);g.lineTo(-8,-12);g.lineTo(-3,0);g.lineTo(-8,12);g.closePath();g.fill();g.stroke();g.restore();
  g.font="18px sans-serif";g.textAlign="center";g.fillText(FOODT[arrowTgt.type].e,px+Math.cos(a)*(rad+30),py+Math.sin(a)*(rad+30)+6);
}
function drawMini(){
  const mw=mini.width,mh=mini.height,sx=mw/W,y0=2300,sy=mh/(H-y0);
  mctx.clearRect(0,0,mw,mh);
  for(let x=0;x<=W;x+=100){mctx.fillStyle=waterAt(x)?"#4fa3e8":GRASSC[biomeAt(x)];const y=(gy(x)-y0)*sy;mctx.fillRect(x*sx,y,100*sx+0.6,mh-y);}
  for(const w of WATERS){mctx.fillStyle="#4fa3e8";mctx.fillRect(w.x0*sx,(w.lv-y0)*sy,(w.x1-w.x0)*sx,6);}
  for(const c of ents){if(!c.alive||c.isP)continue;const rel=player?relation(player,c):0;mctx.fillStyle=rel>0?"#8dff6a":rel===0?"#ffe14d":"#ff5050";const s=c.sp.tier>10?4:3;if(c.hidden)continue;mctx.fillRect(c.x*sx-s/2,clamp((c.y-y0)*sy,0,mh)-s/2,s,s);}
  if(arrowTgt){mctx.fillStyle="#ffd23f";mctx.beginPath();mctx.arc(arrowTgt.x*sx,clamp((arrowTgt.y-y0)*sy,0,mh),2.5,0,7);mctx.fill();}
  if(player&&player.alive){mctx.fillStyle="#fff";mctx.strokeStyle="#000";mctx.beginPath();mctx.arc(player.x*sx,clamp((player.y-y0)*sy,0,mh),4,0,7);mctx.fill();mctx.stroke();}
  const vw=VW/cam.z*sx;mctx.strokeStyle="#fff8";mctx.strokeRect(cam.x*sx-vw/2,0,vw,mh);

<script>
/* ================= UI ================= */
const $=id=>document.getElementById(id);
const NBOTS=MOBILE?38:46;
const HUDS=["topbar","board","mini","btns","hint"];
function showHUD(on){HUDS.forEach(h=>$(h).classList.toggle("hidden",!on||(h==="hint"&&isTouch)));$("touch").style.display=on&&isTouch?"block":"none";resetTouch();}
function applyLang(){
  document.documentElement.lang=LANG;
  $("tSub").textContent=tr("sub");$("nameIn").placeholder=tr("name");$("playBtn").textContent=tr("play");$("tHow").innerHTML=tr("how")+"<br>"+tr("hideTip");
  $("tBest").textContent=tr("best")+best;$("biteTxt").textContent=tr("bite");$("hint").textContent=tr("hint");
  $("tEvo").textContent=tr("evo");$("tEvoSub").textContent=tr("evoSub");$("againBtn").textContent=tr("again");$("reviveBtn").textContent=tr("revive");$("tDead").textContent=tr("dead");
  const lb=$("langBox");lb.innerHTML="";
  LANGS.forEach(([k,lab])=>{const b=document.createElement("button");b.textContent=lab;if(k===LANG)b.className="on";b.onclick=()=>{LANG=k;try{localStorage.setItem("ctth_lang",k);}catch(e){}applyLang();};lb.appendChild(b);});
  updateDiet();updateHUD();
}
const dietHTML=(tier,names)=>dietOf(tier).map(k=>`<span title="${foodName(k)}">${FOODT[k].e}${names?" "+foodName(k):""}</span>`).join(names?", ":" ");

  if(sp.tier>=MAXTIER){$("xpFill").style.width="100%";$("xpTxt").textContent=tr("maxed")+" · "+tr("score")+" "+Math.round(p.score);}
  else{const need=XPNEED[sp.tier];$("xpFill").style.width=clamp(p.xp/need*100,0,100)+"%";$("xpTxt").textContent=Math.floor(p.xp)+" / "+need+" XP";}

  list.slice(0,8).forEach((e,i)=>{h+=`<div class="${e.isP?"me":""}"><span>${i+1}. ${esc(e.name)}</span><span>${fmt(e.score)}</span></div>`;});
  if(pi>=8)h+=`<div class="me"><span>${pi+1}. ${esc(p.name)}</span><span>${fmt(p.score)}</span></div>`;
  $("board").innerHTML=h;

const fmt=v=>v>=10000?(v/1000).toFixed(1)+"k":Math.round(v);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function openEvo(){
  paused=true;resetTouch();const nt=player.sp.tier+1,opts=byTier(nt),box=$("evoOpts");box.innerHTML="";
  const diet=`<div class="diet"><b>${tr("eats")}</b> ${dietHTML(nt,true)}</div><div class="diet">⚔️ ${tr("hunt").replace("{n}",nt-1)}</div>`;
  opts.forEach(sp=>{
    const d=document.createElement("div");d.className="opt";
    const c=document.createElement("canvas");c.width=200;c.height=130;const g=c.getContext("2d");g.translate(sp.kind==="dragon"||sp.flame?112:100,74);drawCreatureSprite(g,sp,34,1,1,{air:sp.move==="f"});
    d.appendChild(c);
    d.insertAdjacentHTML("beforeend",`<h3>${spName(sp.id)}</h3><span class="tag">${sp.move==="f"?tr("fly"):tr("ground")}</span>${sp.swim?` <span class="tag">${tr("swim")}</span>`:""} <span class="tag">❤ ${sp.hp}</span> <span class="tag">⚡ ${sp.spd}</span><p>${tr("desc")[sp.id]}</p>`);

function evolveTo(sp){
  const old=dietOf(player.sp.tier);player.xp-=XPNEED[player.sp.tier];setSpecies(player,sp);

  html+=nw.length?`${tr("newFood")} ${nw.map(k=>FOODT[k].e+" "+foodName(k)).join(", ")}`:`🍽️ ${tr("eats")} ${dietHTML(sp.tier,true)}`;
  const lost=old.filter(k=>!canEat(sp.tier,k));if(lost.length)html+=`<br><s style="opacity:.7">${lost.map(k=>FOODT[k].e+" "+foodName(k)).join(", ")}</s>`;
  html+=`<br><small>${tr("follow")}</small>`;

let deathInfo=null;
function onPlayerDead(kname){
  const p=player,secs=Math.round((performance.now()-p.born)/1000);
  if(p.score>best){best=Math.round(p.score);try{localStorage.setItem("ctth_best",best);}catch(e){}}

    state="dead";showHUD(false);
    $("tKiller").textContent=tr("killer").replace("{k}",kname);

    $("reviveBtn").classList.toggle("hidden",reviveUsed||p.sp.tier<2);

  },1100);
}
function startGame(keep){
  $("menu").classList.add("hidden");$("dead").classList.add("hidden");
  let nm=($("nameIn").value||"").trim().slice(0,14);if(!nm)nm=tr("you");
  try{localStorage.setItem("ctth_name",nm);}catch(e){}

  while(ents.length<NBOTS)ents.push(makeBot());
  if(keep&&deathInfo){player=makeCreature(deathInfo.sp,nm,true);player.xp=deathInfo.xp*0.5;player.score=deathInfo.score;player.maxTier=deathInfo.maxTier;player.born=deathInfo.born;player.kills=deathInfo.kills;reviveUsed=true;}
  else{player=makeCreature(SP.sau_non,nm,true);reviveUsed=false;}
  ents.push(player);cam.x=player.x;cam.y=player.y;cam.z=zoomFor(player.sp);arrowT=0;
  state="play";paused=false;showHUD(true);updateDiet();updateHUD();initAudio();
  toast(`🍽️ ${tr("eats")} ${dietHTML(player.sp.tier,true)}<br><small>${tr("follow")}</small>`,6000);
}
const fsOK=!!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
function goFS(on){try{const d=document,el=d.documentElement;const cur=d.fullscreenElement||d.webkitFullscreenElement;
  if(on&&!cur)(el.requestFullscreen||el.webkitRequestFullscreen).call(el,{navigationUI:"hide"})?.catch?.(()=>{});
  else if(!on&&cur)(d.exitFullscreen||d.webkitExitFullscreen).call(d);}catch(e){}}
if(fsOK&&MOBILE)$("fsBtn").classList.remove("hidden");
$("fsBtn").onclick=()=>goFS(!(document.fullscreenElement||document.webkitFullscreenElement));
$("board").addEventListener("click",()=>{if(isTouch)$("board").classList.toggle("mini");});
$("playBtn").onclick=()=>{if(MOBILE&&fsOK)goFS(true);startGame(false);};
$("nameIn").addEventListener("keydown",e=>{if(e.key==="Enter")startGame(false);e.stopPropagation();});
$("againBtn").onclick=()=>startGame(false);
$("reviveBtn").onclick=()=>{
  // Gắn quảng cáo thưởng của portal tại đây: window.HIHI_rewardedAd(callback)
  if(typeof window.HIHI_rewardedAd==="function")window.HIHI_rewardedAd(()=>startGame(true));else startGame(true);
};
$("muteBtn").onclick=()=>{muted=!muted;$("muteBtn").textContent=muted?"🔇":"🔊";try{localStorage.setItem("ctth_mute",muted?"1":"0");}catch(e){}};
$("muteBtn").textContent=muted?"🔇":"🔊";
try{$("nameIn").value=localStorage.getItem("ctth_name")||"";}catch(e){}

/* menu preview */
const pv=$("preview"),pg=pv.getContext("2d");
const PVL=["sau_non","ong_mat","ech","cao","rong"];
function drawPreview(t){pg.clearRect(0,0,320,120);
  const PX=[28,78,132,196,272],PS=[11,14,17,20,24];PVL.forEach((id,i)=>{const sp=SP[id];pg.save();pg.translate(PX[i],78+Math.sin(t*2+i)*(sp.move==="f"?5:0));drawCreatureSprite(pg,sp,PS[i],t,1,{moving:i===0,air:sp.move==="f"});pg.restore();});}

/* ================= BOOT / LOOP ================= */
genWorld();genFood();
for(let i=0;i<NBOTS;i++)ents.push(makeBot());
cam.x=1800;cam.y=3250;cam.z=baseZoom();
applyLang();
let last=performance.now(),perfAcc=0,perfN=0;
function loop(now){
  let dt=(now-last)/1000;last=now;if(!(dt>0))dt=0;if(dt>0.05)dt=0.05;
  if(state==="menu"){update(dt);cam.x+=60*dt;if(cam.x>W-1000)cam.x=1000;cam.y=gy(cam.x)-250;drawPreview(now/1000);}
  else if(!paused)update(dt);
  render();music(dt);
  // tự giảm độ phân giải nếu máy yếu
  perfAcc+=dt;perfN++;if(perfAcc>3){if(perfAcc/perfN>0.026&&DPR>1){lowQ=true;resize();}perfAcc=0;perfN=0;}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
document.addEventListener("visibilitychange",()=>{if(document.hidden){if(AC)AC.suspend();resetTouch();}else if(AC&&!muted)AC.resume();});
addEventListener("orientationchange",()=>setTimeout(resize,250));
</script>
