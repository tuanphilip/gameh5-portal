<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HiHi Fruit Merge — Hợp nhất trái cây</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700;800&display=swap');

  :root{
    --bg:#F1F7EA;
    --ink:#2E4B2F;
    --ink-soft:#5E7A5B;
    --board:#7C513A;
    --board-dark:#6A4430;
    --cell:#96684C;
    --accent:#E8563F;
    --accent-dark:#C93F2A;
    --gap:2.6cqi;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;min-height:100%;margin:0}
  html{height:100%;background:var(--bg)}
  body{
    min-height:100vh;
    min-height:100dvh;
    font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, #E4F2D4 0%, transparent 60%),
      var(--bg);
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:
      max(14px, env(safe-area-inset-top))
      max(12px, env(safe-area-inset-right))
      max(14px, env(safe-area-inset-bottom))
      max(12px, env(safe-area-inset-left));
    overflow-x:hidden;
    user-select:none;-webkit-user-select:none;
  }
  .wrap{
    width:min(100%,480px);
    margin:auto;
    container-type:inline-size;
  }

  /* ---------- Header ---------- */
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
  .title h1{font-size:clamp(24px,6.4vw,32px);font-weight:800;letter-spacing:-.5px;line-height:1.05}
  .title p{font-size:13px;color:var(--ink-soft);margin-top:4px;font-weight:500}
  .scores{display:flex;gap:8px}
  .chip{
    background:#fff;border:2px solid #DDEBD2;border-radius:12px;
    padding:6px 12px;min-width:74px;text-align:center;position:relative;
  }
  .chip small{display:block;font-size:10.5px;font-weight:700;color:var(--ink-soft)}
  .chip strong{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
  .chip .pop{
    position:absolute;left:50%;top:-2px;transform:translateX(-50%);
    font-weight:800;color:var(--accent);font-size:15px;pointer-events:none;
    animation:floatUp .7s ease-out forwards;
  }
  @keyframes floatUp{from{opacity:1;translate:0 0}to{opacity:0;translate:0 -26px}}

  .bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .bar .hint{font-size:12.5px;color:var(--ink-soft);font-weight:500}
  button.btn{
    font-family:inherit;font-weight:700;font-size:14px;color:#fff;
    background:var(--accent);border:none;border-radius:12px;
    padding:9px 16px;cursor:pointer;box-shadow:0 3px 0 var(--accent-dark);
    transition:transform .08s, box-shadow .08s;
  }
  button.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent-dark)}
  button.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 3px 0 #D8E6CC;border:2px solid #DDEBD2}
  button.btn:focus-visible{outline:3px solid #9CC98F;outline-offset:2px}

  /* ---------- Board (fruit crate) ---------- */
  .board{
    position:relative;width:100%;aspect-ratio:1;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.045) 0 2px, transparent 2px 25%),
      linear-gradient(var(--board), var(--board-dark));
    border-radius:var(--radius);
    padding:var(--gap);
    box-shadow:inset 0 0 0 3px rgba(0,0,0,.12), 0 8px 22px rgba(46,75,47,.18);
    touch-action:none;
  }
  .cells{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:var(--gap);width:100%;height:100%}
  .cells div{background:var(--cell);border-radius:10px;box-shadow:inset 0 2px 4px rgba(0,0,0,.14)}

  .tiles{position:absolute;inset:var(--gap)}
  .tile{
    position:absolute;top:0;left:0;
    width:calc((100cqi - 5*var(--gap))/4);
    height:calc((100cqi - 5*var(--gap))/4);
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:12.5cqi;line-height:1;
    transition:transform .12s ease-in-out;
    will-change:transform;
    box-shadow:0 2px 4px rgba(0,0,0,.18);
  }
  .tile span{filter:drop-shadow(0 2px 2px rgba(0,0,0,.15))}
  .tile.new{animation:spawn .18s ease-out}
  .tile.merged{animation:squish .22s ease-out}
  @keyframes spawn{from{scale:.3;opacity:0}to{scale:1;opacity:1}}
  @keyframes squish{0%{scale:1}45%{scale:1.22}100%{scale:1}}
  @media (prefers-reduced-motion:reduce){
    .tile{transition:none}
    .tile.new,.tile.merged{animation:none}
  }

  /* per-fruit tile colors */
  .lv1{background:#FFE1E6}.lv2{background:#FFD3DA}.lv3{background:#E9DBF8}
  .lv4{background:#FFF2BE}.lv5{background:#FFE3BC}.lv6{background:#FFD2C9}
  .lv7{background:#E4F3C8}.lv8{background:#FFDFD0}
  .lv9{background:#FDEBB0;box-shadow:0 0 14px rgba(253,214,96,.75),0 2px 4px rgba(0,0,0,.18)}
  .lv10{background:#DFF2D2;box-shadow:0 0 16px rgba(160,220,140,.8),0 2px 4px rgba(0,0,0,.18)}
  .lv11{background:#D6F0DD;box-shadow:0 0 20px rgba(120,215,150,.95),0 2px 4px rgba(0,0,0,.18)}

  /* ---------- Overlay ---------- */
  .overlay{
    position:absolute;inset:0;border-radius:var(--radius);
    background:rgba(241,247,234,.88);backdrop-filter:blur(3px);
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    text-align:center;padding:20px;z-index:5;
  }
  .overlay.show{display:flex;animation:spawn .25s ease-out}
  .overlay .big{font-size:56px;line-height:1}
  .overlay h2{font-size:24px;font-weight:800}
  .overlay p{font-size:14px;color:var(--ink-soft);font-weight:500}
  .overlay .row{display:flex;gap:10px}

  /* ---------- Fruit chain ---------- */
  .chain{
    margin-top:16px;background:#fff;border:2px solid #DDEBD2;border-radius:12px;
    padding:10px 12px;
  }
  .chain small{font-size:11px;font-weight:700;color:var(--ink-soft)}
  .chain-row{display:flex;align-items:center;flex-wrap:wrap;gap:2px;margin-top:6px;font-size:19px}
  .chain-row .fr{opacity:.32;transition:opacity .3s}
  .chain-row .fr.on{opacity:1}
  .chain-row .arw{font-size:11px;color:#B9CDAE;font-weight:700}

  @media (max-width:520px){
    body{align-items:flex-start;padding-top:max(12px,env(safe-area-inset-top))}
    .wrap{width:100%}
    header{align-items:center;gap:10px;margin-bottom:12px}
    .title{min-width:0;flex:1}
    .title h1{font-size:clamp(21px,6.7vw,28px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .title p{font-size:12px;line-height:1.35}
    .scores{flex:0 0 auto;gap:5px}
    .chip{min-width:62px;padding:5px 8px}
    .chip strong{font-size:17px}
    .bar{gap:10px}
    .bar .hint{font-size:11.5px;line-height:1.35;flex:1}
    button.btn{font-size:13px;padding:8px 12px;white-space:nowrap}
    .chain{margin-top:12px;padding:9px 10px}
    .chain-row{font-size:17px;gap:1px}
  }

  @media (max-width:390px){
    header{align-items:flex-start;flex-direction:column}
    .scores{width:100%}
    .chip{flex:1}
    .bar{align-items:center}
    .title h1{white-space:normal}
  }

  @media (min-width:768px){
    .wrap{width:min(86vw,500px)}
  }

  @media (min-width:1200px){
    .wrap{width:min(72vw,520px)}
  }

  /*
   * Short landscape / embedded game frames.
   * IMPORTANT: keep this block AFTER the desktop min-width rules.
   * At 800x400 the old min-width:768 rule was overriding the landscape
   * width and forcing the board back to 500px, so the bottom was clipped.
   */
  @media (orientation:landscape) and (max-height:700px){
    body{
      min-height:100vh;
      min-height:100dvh;
      align-items:center;
      justify-content:center;
      padding:6px 10px;
      overflow:hidden;
    }

    .wrap{
      width:min(94vw, calc(100vh - 88px), 420px);
      width:min(94vw, calc(100dvh - 88px), 420px);
      margin:auto;
    }

    header{
      align-items:center;
      gap:7px;
      margin-bottom:5px;
    }

    .title{
      min-width:0;
      flex:1;
    }

    .title h1{
      font-size:18px;
      line-height:1.05;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .title p{display:none}

    .scores{
      flex:0 0 auto;
      gap:4px;
    }

    .chip{
      min-width:50px;
      padding:3px 6px;
      border-radius:9px;
    }

    .chip small{font-size:8.5px}
    .chip strong{font-size:14px}

    .bar{
      gap:6px;
      margin-bottom:5px;
    }

    .bar .hint{
      min-width:0;
      flex:1;
      font-size:9.5px;
      line-height:1.2;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    button.btn{
      flex:0 0 auto;
      padding:5px 9px;
      border-radius:9px;
      font-size:11px;
      white-space:nowrap;
    }

    /* Hide non-essential legend on short screens so the board is never covered. */
    .chain{display:none}
  }

  /* Extra-tight landscape frames such as 800x400 inside the WordPress player. */
  @media (orientation:landscape) and (max-height:430px){
    .wrap{
      width:min(94vw, calc(100vh - 82px), 330px);
      width:min(94vw, calc(100dvh - 82px), 330px);
    }

    header{margin-bottom:4px}
    .bar{margin-bottom:4px}
  }

  /* Short portrait frames inside the GameHiHi player (e.g. ~378x491).
     The bottom player toolbar sits above the iframe, so reserve vertical room
     and scale the whole game by viewport height instead of width only. */
  @media (orientation:portrait) and (max-width:430px) and (max-height:600px){
    body{
      min-height:100vh;
      min-height:100dvh;
      align-items:flex-start;
      justify-content:center;
      padding:6px 8px;
      overflow:hidden;
    }

    .wrap{
      width:min(calc(100% - 4px), calc(100vh - 125px), 320px);
      width:min(calc(100% - 4px), calc(100dvh - 125px), 320px);
      margin:0 auto;
    }

    header{
      flex-direction:column;
      align-items:stretch;
      gap:5px;
      margin-bottom:6px;
    }

    .title h1{
      font-size:20px;
      line-height:1.05;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .title p{display:none}

    .scores{
      width:100%;
      gap:5px;
    }

    .chip{
      flex:1;
      min-width:0;
      padding:3px 6px;
      border-radius:9px;
    }

    .chip small{font-size:8.5px;line-height:1.1}
    .chip strong{font-size:15px;line-height:1.1}

    .bar{
      gap:6px;
      margin-bottom:6px;
    }

    .bar .hint{
      min-width:0;
      flex:1;
      font-size:9.5px;
      line-height:1.2;
    }

    button.btn{
      flex:0 0 auto;
      padding:6px 10px;
      border-radius:9px;
      font-size:11px;
      white-space:nowrap;
    }

    .chain{display:none}
  }

  /* Extra-tight portrait player heights. */
  @media (orientation:portrait) and (max-width:430px) and (max-height:520px){
    .wrap{
      width:min(calc(100% - 4px), calc(100vh - 130px), 295px);
      width:min(calc(100% - 4px), calc(100dvh - 130px), 295px);
    }
    header{gap:4px;margin-bottom:5px}
    .bar{margin-bottom:5px}
  }

  if(cfg.gameSlug==='pho-ha-noi'||cfg.gameSlug==='o-to-bay'||cfg.gameSlug==='mot-ngay-lam-cho-hihi'||cfg.gameSlug==='chao-long-anh-beo'||cfg.gameSlug==='tiem-pho-dau-ngo'){

  document.addEventListener('visibilitychange',function(){accrue(); if(document.hidden)flush(true);},{passive:true});
  window.addEventListener('blur',accrue,{passive:true}); window.addEventListener('focus',function(){last=performance.now();},{passive:true});
  function payload(){

  function flush(beacon){

    }

})();(function(){
  'use strict';
  var cfg=window.GameHiHiDirectEventScoreConfig||{};
  function validMid(v){v=String(v||'').trim().toUpperCase();return /^G-[A-Z0-9]{4,20}$/.test(v)?v:'';}
  var gameMid=validMid(cfg.ga4MeasurementId), masterMid=Number(cfg.ga4MasterEnabled)?validMid(cfg.ga4MasterMeasurementId):'';
  var targets=[];
  [gameMid,masterMid].forEach(function(id){if(id&&targets.indexOf(id)<0)targets.push(id);});
  if(!targets.length) return;

  window.dataLayer=window.dataLayer||[];
  window.gtag=window.gtag||function(){window.dataLayer.push(arguments);};
  var script=document.createElement('script');
  script.async=true;
  script.src='https://www.googletagmanager.com/gtag/js?id='+encodeURIComponent(targets[0]);
  document.head.appendChild(script);

  function platform(){
    var ua=navigator.userAgent||'';
    if(/ipad|tablet|playbook|silk/i.test(ua)||(/android/i.test(ua)&&!/mobile/i.test(ua))) return 'tablet';
    if(/mobi|iphone|ipod|android/i.test(ua)) return 'mobile';
    return 'desktop';
  }
  function visitorId(){
    var key='gh_visitor_v1',v='';
    try{
      v=localStorage.getItem(key)||'';
      if(!v){v='v_'+sessionId().replace(/^gs_/,'');localStorage.setItem(key,v);}
    }catch(e){v='v_'+sessionId().replace(/^gs_/,'');}
    return String(v||'').slice(0,64);
  }
  function sessionId(){
    var a=new Uint8Array(12),h='';
    try{crypto.getRandomValues(a);}catch(e){for(var i=0;i<a.length;i++)a[i]=Math.floor(Math.random()*256);}
    for(var j=0;j<a.length;j++)h+=('0'+a[j].toString(16)).slice(-2);

  function cleanMeta(meta){

      if(count>=20)return;

      if(!key)return;
      var val=meta[raw];

  var uid=Math.max(0,Math.floor(Number(cfg.analyticsUserId)||0));

  var gameSession=sessionId();
  var common={
    game_id:String(Number(cfg.gameId)||0),
    game_slug:String(cfg.gameSlug||''),
    game_name:String(cfg.gameName||document.title||''),
    player_type:cfg.loggedIn?'logged_in':'guest',
    player_ref:String(cfg.analyticsPlayerRef||''),
    user_total_score:userScore,
    source_site:String(cfg.analyticsSourceSite||location.hostname||'').slice(0,80),
    platform:platform(),
    language:String(navigator.language||'').slice(0,16),
    game_session_id:gameSession,

    common.user_has_email=Number(cfg.analyticsHasEmail)?1:0;
    common.user_has_phone=Number(cfg.analyticsHasPhone)?1:0;

  function logLocal(name,data){

    var payload={
      event_key:(gameSession+'_'+localSeq+'_'+name).slice(0,96),
      event_name:name,
      session_key:gameSession,
      visitor_key:String(common.game_visitor_id||''),
      game_id:Number(cfg.gameId)||0,
      game_slug:String(common.game_slug||''),
      game_name:String(common.game_name||''),
      player_type:String(common.player_type||''),
      source_site:String(common.source_site||''),
      platform:String(common.platform||''),
      language:String(common.language||''),
      game_url:String(common.game_url||''),
      page_path:String(common.page_path||''),
      score:Math.max(0,Math.floor(Number(data.score)||0)),

  function send(name,params){

  send('page_view',{page_location:location.href,page_title:document.title,page_referrer:document.referrer||''});

  var started=false,startAt=0,exitSent=false,lastSubmitScore=null,lastSubmitAt=0;

  if(cfg.gameSlug==='pho-ha-noi'||cfg.gameSlug==='o-to-bay'||cfg.gameSlug==='mot-ngay-lam-cho-hihi'||cfg.gameSlug==='chao-long-anh-beo'||cfg.gameSlug==='tiem-pho-dau-ngo'){
    window.addEventListener('gamehihi:game-start',function(){start('game_started');},{once:true});
  }else{
  ['pointerdown','touchstart','keydown'].forEach(function(ev){

  }

  function submitScore(score,mode,meta,source){

<body>
<div class="wrap">
  <header>
    <div class="title">
      <h1>🍉 HiHi Fruit Merge</h1>
      <p>Ghép hai trái giống nhau để lên cấp trái to hơn!</p>
    </div>
    <div class="scores">
      <div class="chip" id="scoreChip"><small>ĐIỂM</small><strong id="score">0</strong></div>
      <div class="chip"><small>KỶ LỤC</small><strong id="best">0</strong></div>
    </div>
  </header>

  <div class="bar">
    <div class="hint" id="hint">Vuốt hoặc dùng phím mũi tên để di chuyển</div>
    <button class="btn" id="newGame">Chơi mới</button>
  </div>

  <div class="board" id="board">
    <div class="cells">
      <div></div><div></div><div></div><div></div>
      <div></div><div></div><div></div><div></div>
      <div></div><div></div><div></div><div></div>
      <div></div><div></div><div></div><div></div>
    </div>
    <div class="tiles" id="tiles"></div>
    <div class="overlay" id="overlay">
      <div class="big" id="ovEmoji">🍉</div>
      <h2 id="ovTitle"></h2>
      <p id="ovText"></p>
      <div class="row">
        <button class="btn ghost" id="ovContinue" style="display:none">Chơi tiếp</button>
        <button class="btn" id="ovRestart">Chơi lại</button>
      </div>
    </div>
  </div>

  <div class="chain">
    <small>HÀNH TRÌNH TRÁI CÂY</small>
    <div class="chain-row" id="chainRow"></div>
  </div>
</div>

<script>
(() => {
  const FRUITS = ['','🍒','🍓','🍇','🍋','🍊','🍎','🍐','🍑','🍍','🍈','🍉'];
  const NAMES  = ['','anh đào','dâu tây','nho','chanh','cam','táo','lê','đào','dứa','dưa lưới','dưa hấu'];
  const MAX = 11;
  const SIZE = 4;

  /* ---------- GameHiHi Event Score bridge ---------- */
  const GameHiHiFruitBridge = (() => {
    let lastSent = -1;
    let timer = 0;

    function post(payload){
      if (payload && payload.type === 'gamehihi:event-score' && typeof window.GameHiHiDirectEventScore === 'function') {
        try { window.GameHiHiDirectEventScore(payload); } catch(e) {}
      }
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage(payload, '*'); } catch(e) {}
      }
    }

    function ready(){
      post({ type:'gamehihi:event-ready', game:'hihi-fruit-merge' });
    }

    function send(value, final){
      const current = Math.max(0, Math.floor(Number(value) || 0));
      if (!final && current <= lastSent) return;
      clearTimeout(timer);
      timer = setTimeout(() => {
        lastSent = Math.max(lastSent, current);
        post({
          type:'gamehihi:event-score',
          game:'hihi-fruit-merge',
          score:current,
          mode:'classic',
          final:!!final
        });
      }, final ? 0 : 250);
    }

    function end(value, result){
      const payload = {
        type:'gamehihi:event-end-game',
        game:'hihi-fruit-merge',
        score:Math.max(0, Math.floor(Number(value) || 0)),
        result:String(result || 'game-over'),
        mode:'classic',
        meta:{ maxLevel:Number(maxLevel) || 1 }
      };
      if (typeof window.GameHiHiEndGame === 'function') {
        try { window.GameHiHiEndGame(payload).catch(() => {}); } catch(e) {}
      } else if (window.parent && window.parent !== window) {
        try { window.parent.postMessage(payload, '*'); } catch(e) {}
      }
    }

    return { ready, send, end };
  })();

  const tilesEl = document.getElementById('tiles');
  const scoreEl = document.getElementById('score');
  const bestEl  = document.getElementById('best');
  const scoreChip = document.getElementById('scoreChip');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovText  = document.getElementById('ovText');
  const ovEmoji = document.getElementById('ovEmoji');
  const ovContinue = document.getElementById('ovContinue');
  const chainRow = document.getElementById('chainRow');

  let grid, score, best = 0, maxLevel, won, over, idSeq, animating = false;

  const eventCfg = window.GameHiHiDirectEventScoreConfig || {};
  const bestStorageKey = eventCfg.seasonKey
    ? 'hihiFruitBest:' + String(eventCfg.seasonKey)
    : 'hihiFruitBest';

  try { best = +localStorage.getItem(bestStorageKey) || 0; } catch(e){}
  try {
    const serverBest = Number(eventCfg.initialScore) || 0;
    if (serverBest > best) {
      best = serverBest;
      localStorage.setItem(bestStorageKey, best);
    }
  } catch(e){}
  bestEl.textContent = best;

  window.addEventListener('gamehihi:event-score-saved', e => {
    const serverBest = Math.max(0, Math.floor(Number(e && e.detail && e.detail.score) || 0));
    if (serverBest > best) {
      best = serverBest;
      bestEl.textContent = best;
      try { localStorage.setItem(bestStorageKey, best); } catch(err){}
    }
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', GameHiHiFruitBridge.ready, {once:true});
  } else {
    GameHiHiFruitBridge.ready();
  }

  // fruit chain legend
  for (let i = 1; i <= MAX; i++) {
    const s = document.createElement('span');
    s.className = 'fr'; s.dataset.lv = i; s.textContent = FRUITS[i]; s.title = NAMES[i];
    chainRow.appendChild(s);
    if (i < MAX) {
      const a = document.createElement('span');
      a.className = 'arw'; a.textContent = '›';
      chainRow.appendChild(a);
    }
  }
  function updateChain(){
    chainRow.querySelectorAll('.fr').forEach(s => s.classList.toggle('on', +s.dataset.lv <= maxLevel));
  }

  function newTileEl(t, isNew, isMerged){
    const el = document.createElement('div');
    el.className = 'tile lv' + t.level + (isNew ? ' new' : '') + (isMerged ? ' merged' : '');
    el.innerHTML = '<span>' + FRUITS[t.level] + '</span>';
    setPos(el, t.x, t.y);
    el.dataset.id = t.id;
    tilesEl.appendChild(el);
    t.el = el;
  }
  function setPos(el, x, y){
    el.style.transform = `translate(calc(${x} * (100% + var(--gap))), calc(${y} * (100% + var(--gap))))`;
  }

  function spawn(){
    const empty = [];
    for (let y=0;y<SIZE;y++) for (let x=0;x<SIZE;x++) if(!grid[y][x]) empty.push({x,y});
    if (!empty.length) return;
    const {x,y} = empty[Math.random()*empty.length|0];
    const t = { id: idSeq++, x, y, level: Math.random() < 0.9 ? 1 : 2 };
    grid[y][x] = t;
    newTileEl(t, true, false);
  }

  function reset(){
    grid = Array.from({length:SIZE}, () => Array(SIZE).fill(null));
    tilesEl.innerHTML = '';
    score = 0; maxLevel = 1; won = false; over = false; idSeq = 1;
    scoreEl.textContent = 0;
    overlay.classList.remove('show');
    spawn(); spawn();
    updateChain();
  }

  function addScore(n){
    score += n;
    scoreEl.textContent = score;
    const p = document.createElement('span');
    p.className = 'pop'; p.textContent = '+' + n;
    scoreChip.appendChild(p);
    setTimeout(() => p.remove(), 700);
    if (score > best){
      best = score; bestEl.textContent = best;
      try { localStorage.setItem(bestStorageKey, best); } catch(e){}
    }
    GameHiHiFruitBridge.send(score, false);
  }

  function move(dx, dy){
    if (animating || over) return;
    const xs = [...Array(SIZE).keys()]; if (dx === 1) xs.reverse();
    const ys = [...Array(SIZE).keys()]; if (dy === 1) ys.reverse();

    let moved = false;
    const merges = [];   // {a, b, target:{x,y}, level}
    const slides = [];   // tiles that just move

    for (const y of ys) for (const x of xs) {
      const t = grid[y][x];
      if (!t) continue;
      let nx = x, ny = y;
      while (true) {
        const tx = nx + dx, ty = ny + dy;
        if (tx < 0 || tx >= SIZE || ty < 0 || ty >= SIZE) break;
        const nxt = grid[ty][tx];
        if (!nxt) { nx = tx; ny = ty; continue; }
        if (nxt.level === t.level && !nxt.lock && t.level < MAX) {
          // merge into nxt's cell
          grid[y][x] = null;
          grid[ty][tx] = { id: idSeq++, x: tx, y: ty, level: t.level + 1, lock: true };
          merges.push({ a: t, b: nxt, target: {x: tx, y: ty}, tile: grid[ty][tx] });
          moved = true;
          nx = -99;
        }
        break;
      }
      if (nx === -99) continue;
      if (nx !== x || ny !== y) {
        grid[y][x] = null;
        t.x = nx; t.y = ny;
        grid[ny][nx] = t;
        slides.push(t);
        moved = true;
      }
    }

    if (!moved) return;
    animating = true;

    // animate slides
    slides.forEach(t => setPos(t.el, t.x, t.y));
    // slide merging pair into target
    merges.forEach(m => { setPos(m.a.el, m.target.x, m.target.y); setPos(m.b.el, m.target.x, m.target.y); });

    setTimeout(() => {
      let gain = 0;
      merges.forEach(m => {
        m.a.el.remove(); m.b.el.remove();
        delete m.tile.lock;
        newTileEl(m.tile, false, true);
        gain += Math.pow(2, m.tile.level);
        if (m.tile.level > maxLevel) maxLevel = m.tile.level;
        if (m.tile.level === MAX && !won) { won = true; showWin(); }
      });
      if (gain) addScore(gain);
      updateChain();
      spawn();
      animating = false;
      if (!canMove()) { over = true; showLose(); }
    }, 130);
  }

  function canMove(){
    for (let y=0;y<SIZE;y++) for (let x=0;x<SIZE;x++){
      const t = grid[y][x];
      if (!t) return true;
      if (x+1 < SIZE && grid[y][x+1] && grid[y][x+1].level === t.level) return true;
      if (y+1 < SIZE && grid[y+1][x] && grid[y+1][x].level === t.level) return true;
    }
    return false;
  }

  function showWin(){
    ovEmoji.textContent = '🍉🎉';
    ovTitle.textContent = 'Bạn đã ghép được Dưa Hấu!';
    ovText.textContent = 'Tuyệt vời! Bạn có muốn tiếp tục phá kỷ lục điểm số?';
    ovContinue.style.display = '';
    overlay.classList.add('show');
  }
  function showLose(){
    ovEmoji.textContent = '🧺';
    ovTitle.textContent = 'Hết nước đi rồi!';
    ovText.textContent = 'Bạn đạt ' + score + ' điểm. Thử lại để ghép trái cây to hơn nhé!';
    ovContinue.style.display = 'none';
    overlay.classList.add('show');
    GameHiHiFruitBridge.send(score, true);
    GameHiHiFruitBridge.end(score, 'game-over');
  }

  // ---------- Input ----------
  const KEYS = {
    ArrowLeft:[-1,0], ArrowRight:[1,0], ArrowUp:[0,-1], ArrowDown:[0,1],
    a:[-1,0], d:[1,0], w:[0,-1], s:[0,1],
    A:[-1,0], D:[1,0], W:[0,-1], S:[0,1]
  };
  window.addEventListener('keydown', e => {
    const v = KEYS[e.key];
    if (!v) return;
    e.preventDefault();
    if (overlay.classList.contains('show')) return;
    move(v[0], v[1]);
  });

  let sx = 0, sy = 0, touching = false;
  const board = document.getElementById('board');
  board.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    touching = true;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, {passive:true});
  board.addEventListener('touchend', e => {
    if (!touching) return;
    touching = false;
    if (overlay.classList.contains('show')) return;
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : -1, 0);
    else move(0, dy > 0 ? 1 : -1);
  }, {passive:true});

  document.getElementById('newGame').onclick = reset;
  document.getElementById('ovRestart').onclick = reset;
  ovContinue.onclick = () => overlay.classList.remove('show');

  // mobile hint
  if ('ontouchstart' in window) document.getElementById('hint').textContent = 'Vuốt lên / xuống / trái / phải để di chuyển';

  reset();
})();
</script>
