<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:#f3e6d0;overflow:hidden;font-family:'Mali',system-ui,sans-serif;color:#4a3426;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#f3e6d0}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#ui{position:absolute;inset:0;pointer-events:none}
#ui>*{pointer-events:auto}
.hidden{display:none!important}
button{font-family:'Baloo 2','Mali',sans-serif;cursor:pointer;border:0}
/* ---------- HUD ---------- */
.pill{position:absolute;background:#fffaf0;border:.14em solid #e9d9bd;border-radius:.8em;box-shadow:0 .2em 0 #d9c4a2;display:flex;align-items:center;gap:.45em;padding:.3em .8em .3em .35em;font-family:'Baloo 2';font-weight:800;font-size:1.25em;color:#5a3d22}
.pill .ic{width:1.6em;height:1.6em;border-radius:50%;display:grid;place-items:center;flex:none}
.pill small{display:block;font-family:'Mali';font-weight:600;font-size:.55em;color:#9b8466;line-height:1}
#hudMoney{left:.8em;top:.7em}
#hudRep{left:10.3em;top:.7em}
#hudDay{right:.8em;top:.7em;padding-left:.5em}
.rbtns{position:absolute;right:.8em;top:4.6em;display:flex;flex-direction:column;gap:.55em}
.rbtns .row{display:flex;gap:.55em;justify-content:flex-end}
.cbtn{width:3.1em;height:3.1em;border-radius:50%;background:#fffaf0;border:.14em solid #e9d9bd;box-shadow:0 .18em 0 #d9c4a2;display:grid;place-items:center;position:relative}
.cbtn:active{transform:translateY(.12em);box-shadow:none}
.cbtn svg{width:1.55em;height:1.55em}
.dot{position:absolute;top:-.15em;right:-.15em;width:1.3em;height:1.3em;border-radius:50%;background:#e04f3f;color:#fff;font:800 .72em/1.3em 'Baloo 2';text-align:center;border:.12em solid #fff}
.bigbtn{position:absolute;left:50%;bottom:1.1em;transform:translateX(-50%);background:#fffaf0;border:.18em solid #e2cfaf;border-radius:.9em;box-shadow:0 .3em 0 #cdb38b;padding:.45em 1.4em .45em 1em;display:flex;align-items:center;gap:.5em;font:800 1.55em 'Baloo 2';color:#3f6b3a}
.bigbtn:active{transform:translateX(-50%) translateY(.15em);box-shadow:0 .1em 0 #cdb38b}
.bigbtn .badge{position:absolute;top:-.55em;right:-.55em}
#toast{position:absolute;left:50%;top:5.2em;transform:translateX(-50%);background:#fffaf0;border:.14em solid #b9d9a5;color:#3f6b3a;border-radius:.7em;padding:.35em 1em;font:700 1em 'Mali';box-shadow:0 .2em 0 #a9c995;white-space:nowrap;transition:opacity .4s,transform .4s;pointer-events:none}
#toast.off{opacity:0;transform:translateX(-50%) translateY(-1em)}
#quest{position:absolute;left:.8em;top:4.7em;background:#fffaf0e8;border:.12em dashed #d6be97;border-radius:.6em;padding:.3em .7em;font:600 .82em 'Mali';max-width:21em;color:#6a4d33;pointer-events:none}
#quest b{color:#c0492f}
/* ---------- caption ---------- */
#caption{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,#2a1f1acc 35%);color:#fff;text-align:center;font:700 1.15em 'Mali';padding:2.2em 3em 1.2em;pointer-events:none;text-shadow:0 .1em .2em #0008}
#skip{position:absolute;right:.8em;top:.7em;background:#5b4330;color:#fff;border-radius:.6em;padding:.3em .9em;font:700 .95em 'Baloo 2';box-shadow:0 .18em 0 #3a2a1d}
/* ---------- modal ---------- */
.veil{position:absolute;inset:0;background:#2a1f1a66;display:grid;place-items:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.card{background:#fffaf0;border-radius:1.2em;box-shadow:0 .4em 0 #d8c09c,0 1em 3em #0005;padding:1.3em 1.5em;max-width:46em;width:min(46em,92%);max-height:88%;overflow:auto;position:relative;animation:pop .22s ease-out}
.card.sm{width:min(30em,90%)}
.card h2{margin:0 0 .3em;font:800 1.75em/1.15 'Baloo 2';color:#5a3018}
.card h3{margin:.6em 0 .3em;font:800 1.15em 'Baloo 2';color:#7a4a28}
.card p{margin:.35em 0;font-weight:600;line-height:1.45}
.card .sub{color:#9b7f5f;font-weight:600;font-size:.92em}
.xbtn{position:absolute;right:.9em;top:.8em;width:2.2em;height:2.2em;border-radius:.6em;background:#e04f3f;color:#fff;font:800 1.2em/1 'Baloo 2';display:grid;place-items:center;box-shadow:0 .15em 0 #a8352a}
.btn{background:#4f8a45;color:#fff;border-radius:.75em;padding:.45em 1.3em;font:800 1.15em 'Baloo 2';box-shadow:0 .22em 0 #335f2c}
.btn:active{transform:translateY(.15em);box-shadow:0 .07em 0 #335f2c}
.btn.gray{background:#a5927b;box-shadow:0 .22em 0 #7a6a56}
.btn.blue{background:#3f7fc4;box-shadow:0 .22em 0 #2b5a8e}
.btn.orange{background:#e88a2c;box-shadow:0 .22em 0 #b0631a}
.btn.red{background:#c9473a;box-shadow:0 .22em 0 #8e2f26}
.btn[disabled]{background:#cfc3b2;box-shadow:0 .22em 0 #b0a493;cursor:not-allowed}
.btns{display:flex;gap:.7em;justify-content:center;margin-top:1em;flex-wrap:wrap}
input.name{width:100%;font:700 1.5em 'Mali';padding:.35em .6em;border-radius:.6em;border:.14em solid #e3d2b4;background:#fff;color:#4a3426;outline:none}
/* tabs */
.tabs{display:flex;gap:.4em;margin:.4em 0 .8em;flex-wrap:wrap}
.tab{background:#fff;border:.12em solid #e6d5b8;border-radius:1em;padding:.2em .9em;font:700 .95em 'Mali';color:#6a4d33}
.tab.on{background:#d9534a;border-color:#d9534a;color:#fff}
/* grid items */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(10.5em,1fr));gap:.7em}
.item{background:#fff;border:.15em solid #eadbc2;border-radius:.9em;padding:.6em;text-align:center;position:relative}
.item.on{border-color:#6aa65d;box-shadow:0 0 0 .15em #cfe7c8}
.item.lock{opacity:.55}
.item .t{font:800 1em 'Baloo 2';color:#5a3018;line-height:1.15}
.item .d{font-size:.78em;color:#8d7458;font-weight:600;margin:.2em 0 .45em;min-height:2.2em}
.item canvas{width:100%;height:5em;display:block}
.item .btn{font-size:.95em;padding:.25em .9em}
.chip{display:inline-block;border-radius:1em;padding:.05em .6em;font:700 .78em 'Mali';background:#f3e6d0;color:#7a5a3a;margin:.1em}
/* offers */
.offer{display:flex;align-items:center;gap:.8em;background:#fff;border:.15em solid #eadbc2;border-radius:.9em;padding:.55em .8em;margin:.45em 0}
.offer.on{border-color:#6aa65d;background:#f5fbf2}
.offer .slot{font:800 .85em 'Baloo 2';background:#f3e6d0;border-radius:.6em;padding:.2em .6em;color:#7a4a28;width:4.6em;text-align:center;flex:none}
.offer .info{flex:1}
.offer .info b{font:800 1.08em 'Baloo 2';color:#5a3018}
.offer .info div{font-size:.82em;font-weight:600;color:#8d7458}
.offer .pay{font:800 1.15em 'Baloo 2';color:#3f6b3a;flex:none}
/* show HUD */
#showHud{position:absolute;left:50%;top:.6em;transform:translateX(-50%);display:flex;gap:1em;align-items:center;background:#fffaf0;border:.14em solid #e9d9bd;border-radius:.9em;padding:.4em .9em;box-shadow:0 .2em 0 #d9c4a2}
.meter{width:10em}
.meter .lb{font:700 .78em 'Mali';color:#7a5a3a;display:flex;justify-content:space-between}
.meter .bar{height:.75em;border-radius:.5em;background:#eadcc6;overflow:hidden;margin-top:.15em}
.meter .bar i{display:block;height:100%;border-radius:.5em;transition:width .5s}
.segs{display:flex;gap:.3em}
.segs i{width:.75em;height:.75em;border-radius:50%;background:#e3d3ba}
.segs i.done{background:#6aa65d}.segs i.cur{background:#e88a2c}
#segTitle{position:absolute;left:50%;top:4.6em;transform:translateX(-50%);background:#5b4330;color:#fff;padding:.25em 1em;border-radius:.7em;font:800 1.05em 'Baloo 2';white-space:nowrap}
#choices{position:absolute;left:0;right:0;bottom:.8em;display:flex;justify-content:center;gap:.8em;padding:0 1em}
.ch{background:#fffaf0;border:.16em solid #e2cfaf;border-radius:1em;box-shadow:0 .3em 0 #cdb38b;width:18em;padding:.6em .8em .7em;text-align:left;font:600 .98em/1.35 'Mali';color:#4a3426;animation:pop .25s backwards}
.ch:hover{border-color:#e88a2c}
.ch:active{transform:translateY(.15em);box-shadow:0 .1em 0 #cdb38b}
.ch .tag{display:inline-block;font:800 .78em 'Baloo 2';border-radius:.6em;padding:0 .55em;color:#fff;margin-bottom:.25em}
.ask{position:absolute;left:50%;bottom:12.2em;transform:translateX(-50%);background:#fff;border:.15em solid #e2cfaf;border-radius:.8em;padding:.4em 1em;font:700 1.05em 'Mali';max-width:40em;text-align:center;box-shadow:0 .2em 0 #d9c4a2}
.timer{position:absolute;left:50%;bottom:11.3em;transform:translateX(-50%);width:22em;height:.5em;border-radius:.3em;background:#eadcc6;overflow:hidden}
.timer i{display:block;height:100%;background:#e88a2c;width:100%}
.timer.in{position:relative;left:auto;bottom:auto;transform:none;width:100%;margin:.15em 0 .55em}
.float{position:absolute;font:800 1.3em 'Baloo 2';pointer-events:none;text-shadow:0 .1em 0 #fff,0 0 .3em #fff;animation:flt 1.4s ease-out forwards;white-space:nowrap}
@keyframes flt{to{transform:translateY(-2.5em);opacity:0}}
/* minigame */
.mg{position:absolute;left:50%;bottom:1em;transform:translateX(-50%);background:#fffaf0;border-radius:1.1em;padding:.8em 1.2em 1em;box-shadow:0 .35em 0 #d8c09c,0 .6em 2em #0004;width:min(40em,94%);text-align:center;animation:pop .2s}
.mg h4{margin:0 0 .4em;font:800 1.25em 'Baloo 2';color:#5a3018}
.track{position:relative;height:2.6em;border-radius:1.3em;background:#eadcc6;margin:.6em 0;overflow:hidden}
.track .zone{position:absolute;top:0;bottom:0;background:#9fd18f}
.track .zone.p{background:#5fb34f}
.track .mk{position:absolute;top:-.2em;bottom:-.2em;width:.5em;background:#d9534a;border-radius:.25em;box-shadow:0 0 0 .12em #fff}
.beats{display:flex;justify-content:center;gap:.6em;font:800 1.5em 'Baloo 2'}
.beats span{width:2.2em;height:2.2em;border-radius:50%;background:#eadcc6;display:grid;place-items:center;color:#fff}
.beats span.ok{background:#5fb34f}.beats span.bad{background:#d9534a}.beats span.now{background:#e88a2c}
.names{display:grid;grid-template-columns:1fr 1fr;gap:.6em;margin-top:.5em}
.names .btn{font-size:1.1em}
.names .btn.hint{box-shadow:0 0 0 .2em #ffd34d,0 .22em 0 #335f2c}
.feed{height:8.5em;overflow:hidden;text-align:left;background:#fff;border-radius:.7em;padding:.4em .7em;font:600 .92em 'Mali';border:.12em solid #eadbc2;display:flex;flex-direction:column;justify-content:flex-end}
.feed div{animation:pop .2s}
.feed div.want{color:#c0492f;font-weight:800}
.prods{display:grid;grid-template-columns:repeat(4,1fr);gap:.5em;margin-top:.6em}
.prods .btn{font-size:.95em;padding:.4em .3em;background:#3f7fc4;box-shadow:0 .22em 0 #2b5a8e}
/* result */
.stars{font-size:2.4em;color:#f2b632;letter-spacing:.05em;text-shadow:0 .06em 0 #c98a1c}
.stars .e{color:#e2d5c0;text-shadow:none}
.rows{margin:.6em 0;border-top:.1em dashed #e2cfaf}
.rows div{display:flex;justify-content:space-between;padding:.28em .2em;border-bottom:.1em dashed #e2cfaf;font-weight:700}
.rows .plus{color:#3f6b3a}.rows .minus{color:#c0492f}
/* book */
.full{position:absolute;inset:0;background:#f3e6d0;padding:1em 1.5em;overflow:auto;animation:fade .2s}
.full .top{display:flex;align-items:center;gap:.7em}
.full .back{width:2.3em;height:2.3em;border-radius:.6em;background:#d9534a;color:#fff;font:800 1.3em/1 'Baloo 2';display:grid;place-items:center}
.full h2{margin:0;font:800 1.5em 'Baloo 2';color:#b8452c}
.q{display:flex;gap:.6em;align-items:flex-start;background:#fffaf0;border-radius:.7em;padding:.5em .8em;margin:.4em 0;font-weight:600}
.q .ck{width:1.4em;height:1.4em;border-radius:50%;border:.15em solid #cdb38b;flex:none;display:grid;place-items:center;font-size:.85em;color:#fff}
.q.done .ck{background:#5fb34f;border-color:#5fb34f}
.q .h{font-size:.82em;color:#9b7f5f}
.contact{display:flex;gap:.8em;align-items:center;background:#fffaf0;border-radius:.9em;padding:.5em .8em;margin:.45em 0}
.contact canvas{width:3.6em;height:3.6em;flex:none}
.hearts{color:#e04f3f;letter-spacing:.1em}.hearts .e{color:#e2d5c0}
.ach{display:inline-flex;flex-direction:column;align-items:center;width:8.4em;margin:.3em;padding:.5em;background:#fffaf0;border-radius:.8em;text-align:center;vertical-align:top}
.ach .m{width:2.6em;height:2.6em;border-radius:50%;background:#e3d3ba;display:grid;place-items:center;font:800 1.2em 'Baloo 2';color:#fff}
.ach.ok .m{background:#e8a92c}
.ach .t{font:800 .85em 'Baloo 2';color:#5a3018;margin-top:.25em;line-height:1.1}
.ach .d{font-size:.7em;color:#9b7f5f;font-weight:600}
.ledger{width:100%;border-collapse:collapse;font-weight:600;font-size:.92em}
.ledger td,.ledger th{padding:.3em .5em;border-bottom:.1em dashed #e2cfaf;text-align:left}
.ledger th{font:800 .9em 'Baloo 2';color:#7a4a28}
.ledger .n{text-align:right}
.ev{display:grid;grid-template-columns:repeat(3,1fr);gap:.7em}
.ev .item{padding:.7em .5em}
.ev .ico{font:800 1.6em 'Baloo 2'}
.pbar{height:.55em;border-radius:.3em;background:#eadcc6;margin-top:.4em;overflow:hidden}
.pbar i{display:block;height:100%;background:#5fb34f}
.pbar.hi i{background:#d9534a}
#rotate{position:fixed;inset:0;background:#2b2320;color:#fff;display:none;place-items:center;text-align:center;font:700 18px 'Mali';z-index:99;padding:2em}
@media (orientation:portrait) and (max-width:700px){#rotate{display:grid}}

/* MC landscape fill: auto-expand on phones/tablets in landscape without any extra button. */

/* Language menu stays outside the scaled game canvas. */
#mc-language-control{position:fixed;left:max(8px,env(safe-area-inset-left));bottom:max(8px,env(safe-area-inset-bottom));z-index:100;display:flex;align-items:center;gap:4px;padding:5px 7px;background:#fffaf0f5;border:2px solid #d8c09c;border-radius:12px;box-shadow:0 2px 0 #b99c73;font:600 13px system-ui,sans-serif;max-width:200px}
#mc-language{font:inherit;color:#5a3018;background:transparent;border:0;max-width:165px;min-height:28px;cursor:pointer}
#mc-language:focus-visible{outline:2px solid #3f7fc4;border-radius:4px}
html:not([lang="vi"]) .ch{font-size:.9em;overflow:auto;max-height:11.5em}
html:not([lang="vi"]) #segTitle{max-width:74%;white-space:normal;text-align:center}
html:not([lang="vi"]) .offer .slot{width:6em}
@media(max-height:500px){#mc-language-control{font-size:11px;padding:2px 5px;max-width:165px}#mc-language{max-width:135px;min-height:24px}}

share a home.", "Dulu mereka berbagi meja dan penggaris di SMA… kini berbagi rumah.", "Dividiam a carteira e uma régua na escola… agora dividem um lar."], ["Nghe nói hồi tán {codau}, {chure} chở chè mỗi tối suốt 3 năm. Tính ra hơn ngàn ly chè!", "While courting {codau}, {chure} brought dessert every night for three years. Over a thousand sweet treats!", "Saat mendekati {codau}, {chure} mengantar makanan manis tiap malam selama tiga tahun. Lebih dari seribu porsi!", "Para conquistar {codau}, {chure} levou sobremesa toda noite por três anos. Mais de mil doces!"], ["Chuyện tình hai bạn nhiều sóng gió lắm, nhất là cái hồi cô người yêu cũ của chú rể…", "Their love story had plenty of drama, especially when the groom's ex…", "Kisah cinta mereka penuh drama, terutama saat mantan si pengantin pria…", "A história deles teve muito drama, principalmente quando a ex do noivo…"], ["Mời người đại diện lên phát biểu:", "Invite a family representative to speak:", "Undang perwakilan keluarga untuk berbicara:", "Convide um representante da família para falar:"], ["Kính mời ông nội chú rể lên nói đôi lời gửi gắm con cháu.", "Please welcome the groom's grandfather to share a few words.", "Mari sambut kakek pengantin pria untuk menyampaikan pesan.", "Convidamos o avô do noivo para dizer algumas palavras."], ["Xin mời bác đại diện nhà trai, ngắn thôi bác nha, đồ ăn sắp nguội!", "A word from the groom's family—keep it short, the food is getting cold!", "Silakan wakil keluarga pria—singkat saja, makanannya hampir dingin!", "Uma palavra da família do noivo—seja breve, a comida está esfriando!"], ["Ai muốn phát biểu thì giơ tay, giành micro đi bà con!", "Who wants to speak? Raise your hand and grab the mic!", "Siapa mau bicara? Angkat tangan dan rebut mikrofonnya!", "Quem quer falar? Levante a mão e pegue o microfone!"], ["Phần cuối buổi lễ:", "Time to close the ceremony:", "Saatnya menutup acara:", "Hora de encerrar a cerimônia:"], ["Mời bàn thanh niên lên quẩy một bài, hát hay có thưởng!", "Young guests, come sing and dance! A prize for the best singer!", "Anak muda, ayo nyanyi dan menari! Penyanyi terbaik dapat hadiah!", "Jovens, venham cantar e dançar! Tem prêmio para quem cantar melhor!"], ["Chúc hai bạn trăm năm hạnh phúc, có giận thì nhớ… nhường nhau một chút.", "May you share a lifetime of happiness. When you argue… remember to compromise.", "Semoga bahagia selamanya. Saat bertengkar… ingat untuk saling mengalah.", "Que sejam felizes para sempre. Quando discutirem… lembrem-se de ceder um pouco."], ["Buổi lễ xin khép lại. Kính chúc quý khách dùng tiệc ngon miệng.", "The ceremony is now over. Please enjoy the banquet.", "Upacara telah selesai. Selamat menikmati hidangan.", "Encerramos a cerimônia. Aproveitem o jantar."], ["Nghi thức cắt bánh và tháp ly:", "The cake cutting and champagne tower:", "Pemotongan kue dan menara sampanye:", "O corte do bolo e a torre de champanhe:"], ["Tháp ly như tình yêu hai bạn: rót từ trên xuống, ngọt tới tận cùng.", "This champagne tower is like your love: sweetness flowing all the way down.", "Menara sampanye ini seperti cinta kalian: manis mengalir hingga ke bawah.", "Esta torre de champanhe é como o amor de vocês: doçura até a última gota."], ["Kính mời cô dâu chú rể tiến hành nghi thức cắt bánh và rót rượu.", "Please welcome the couple to cut the cake and pour the champagne.", "Silakan kedua mempelai memotong kue dan menuangkan sampanye.", "Convidamos os noivos para cortar o bolo e servir o champanhe."], ["Bánh 5 tầng, ai giành được tầng trên cùng thì… năm sau cưới!", "Five tiers! Whoever gets the top one… gets married next year!", "Lima tingkat! Siapa dapat bagian paling atas… menikah tahun depan!", "Cinco andares! Quem pegar o de cima… se casa no ano que vem!"], ["Các bạn nhỏ đang chạy khắp phòng. Bạn mở màn:", "Children are running around. How do you start?", "Anak-anak berlarian. Bagaimana kamu membuka acara?", "As crianças estão correndo. Como você começa?"], ["Các bạn nhỏ ơi, ai muốn cùng chú tổ chức sinh nhật cho {be} nào?!", "Kids! Who wants to help me celebrate {be}'s birthday?!", "Anak-anak! Siapa mau merayakan ulang tahun {be} bersama?!", "Crianças! Quem quer comemorar o aniversário de {be} comigo?!"], ["Chú MC năm nay mới… 18 tuổi thôi nha các con!", "Your MC is only… eighteen this year, kids!", "MC kalian baru… delapan belas tahun, lho!", "O MC de vocês tem só… dezoito anos, crianças!"], ["Kính thưa quý phụ huynh, hôm nay là ngày sinh nhật lần thứ năm của cháu {be}.", "Dear parents, today is {be}'s fifth birthday.", "Para orang tua yang terhormat, hari ini ulang tahun kelima {be}.", "Prezados pais, hoje é o quinto aniversário de {be}."], ["Tổ chức trò chơi cho các bé:", "Choose a game for the children:", "Pilih permainan untuk anak-anak:", "Escolha uma brincadeira para as crianças:"], ["Trò \"Ai nhanh hơn\": bạn nào chạy lên ôm {be} trước được quà!", "Let's race! The first to give {be} a hug wins a prize!", "Ayo lomba! Yang pertama memeluk {be} dapat hadiah!", "Vamos apostar corrida! Quem abraçar {be} primeiro ganha um presente!"], ["Thi xem ba bạn nào làm mặt xấu nhất!", "Let's see whose dad makes the funniest face!", "Ayo lihat ayah siapa yang bisa membuat wajah paling lucu!", "Vamos ver qual pai faz a careta mais engraçada!"], ["Giờ các bạn ngồi im nghe chú đọc thơ 10 phút nhé.", "Now sit still while I read poetry for ten minutes.", "Sekarang duduk diam, dengarkan puisi selama sepuluh menit.", "Agora fiquem quietinhos enquanto leio poesia por dez minutos."], ["Bánh kem đã thắp nến:", "The candles are lit:", "Lilin sudah menyala:", "As velas estão acesas:"], ["Mời ba mẹ gửi lời chúc tới {be} trước khi thổi nến.", "Mom and Dad, share your wishes for {be} before we blow out the candles.", "Ayah dan Ibu, sampaikan harapan untuk {be} sebelum meniup lilin.", "Papai e mamãe, deixem seus votos para {be} antes de apagar as velas."], ["Đếm tới ba là thổi nha! Một… hai… ba!", "Blow on three! One… two… three!", "Tiup hitungan ketiga! Satu… dua… tiga!", "Soprem no três! Um… dois… três!"], ["Thổi nến rồi cắt bánh lẹ cho các bạn ăn.", "Blow out the candles and cut the cake quickly so everyone can eat.", "Tiup lilin dan cepat potong kuenya agar semua bisa makan.", "Apaguem as velas e cortem logo o bolo para todos comerem."], ["Nhà trai vừa tới cổng. Bạn mở lễ:", "The groom's family has arrived. Open the ceremony:", "Keluarga pria tiba. Buka upacaranya:", "A família do noivo chegou. Abra a cerimônia:"], ["Kính thưa hai họ, hôm nay nhà trai xin phép mang lễ vật sang thưa chuyện.", "Dear families, the groom's family brings gifts and asks for your blessing.", "Keluarga terhormat, pihak pria membawa seserahan dan memohon restu.", "Queridas famílias, a família do noivo traz presentes e pede sua bênção."], ["Nhà trai tới rồi! Mâm quả nặng quá, mấy thanh niên bưng run tay luôn!", "They're here! Those gift trays are so heavy the boys' hands are shaking!", "Mereka tiba! Seserahannya berat sekali sampai tangan para pemuda gemetar!", "Chegaram! Os presentes pesam tanto que os rapazes estão tremendo!"], ["Chào cả nhà! Ai sẵn sàng đón rể chưa nè?!", "Hello everyone! Ready to welcome the groom?!", "Halo semua! Siap menyambut pengantin pria?!", "Olá, pessoal! Prontos para receber o noivo?!"], ["Giới thiệu sính lễ nhà trai mang tới:", "Introduce the groom's family's gifts:", "Perkenalkan seserahan dari keluarga pria:", "Apresente os presentes da família do noivo:"], ["Sáu mâm quả: trầu cau, bánh phu thê, trà rượu… tượng trưng cho sự đủ đầy.", "Six gift trays: betel, wedding cakes, tea and wine… symbols of prosperity.", "Enam nampan: sirih, kue pernikahan, teh dan arak… lambang kemakmuran.", "Seis bandejas: bétel, bolos de casamento, chá e vinho… símbolos de prosperidade."], ["Mỗi mâm quả là một lời hứa nhà trai sẽ thương {codau} như con ruột.", "Each tray is a promise to love {codau} as their own daughter.", "Setiap nampan adalah janji menyayangi {codau} seperti putri sendiri.", "Cada bandeja é uma promessa de amar {codau} como filha."], ["Mâm này heo quay, mời nhà gái cắt thử xem nhà trai nướng có giòn không!", "Here's roast pork! Bride's family, taste it and judge how crispy it is!", "Ini babi panggang! Keluarga wanita, cicipi apakah cukup renyah!", "Aqui tem porco assado! Família da noiva, provem para ver se está crocante!"], ["Đến phần trao nhận lễ vật:", "Time to exchange the gifts:", "Saatnya menyerahkan seserahan:", "Hora de trocar os presentes:"], ["Xin mời đại diện hai họ trao nhận sính lễ.", "Family representatives, please exchange the gifts.", "Silakan perwakilan kedua keluarga menyerahkan seserahan.", "Representantes das famílias, por favor, troquem os presentes."], ["Kính mời ông bà hai bên đứng lên trao nhận lễ vật theo phong tục ông bà ta.", "Please rise and exchange these gifts following our ancestral traditions.", "Silakan berdiri dan serahkan seserahan sesuai adat leluhur.", "Levantem-se para trocar os presentes conforme a tradição de nossos antepassados."], ["Lễ vật hơi ít ha, chắc nhà trai để dành tiền… cưới lần hai!", "Not many gifts! Maybe they're saving up… for a second wedding!", "Hadiahnya sedikit! Mungkin menabung… untuk pernikahan kedua!", "Poucos presentes! Devem estar economizando… para um segundo casamento!"], ["Phần cuối của lễ đám hỏi:", "The final part of the engagement ceremony:", "Bagian akhir acara pertunangan:", "A parte final da cerimônia de noivado:"], ["Cô dâu chú rể thắp nén hương báo cáo ông bà, xin phép nên duyên.", "The couple lights incense to honor their ancestors and ask for their blessing.", "Kedua mempelai menyalakan dupa untuk menghormati leluhur dan memohon restu.", "Os noivos acendem incenso em honra aos antepassados e pedem sua bênção."], ["Mời cả nhà vô chụp một tấm \"tự sướng\" tập thể nha!", "Everyone, let's take a group selfie!", "Semuanya, ayo swafoto bersama!", "Pessoal, vamos tirar uma selfie em grupo!"], ["Xong rồi đó, mình qua phần ăn uống luôn!", "That's done! Let's get straight to the food!", "Selesai! Langsung makan saja!", "Pronto! Vamos direto para a comida!"], ["Người đi đường bắt đầu dừng lại xem. Bạn nói:", "Passersby are stopping to watch. You say:", "Orang lewat mulai berhenti. Kamu berkata:", "As pessoas param para assistir. Você diz:"], ["Xin chào bà con! Hôm nay {shop} chính thức khai trương, nhạc lên nào!", "Hello everyone! {shop} opens today. Let's have some music!", "Halo semuanya! {shop} resmi buka hari ini. Putar musiknya!", "Olá, pessoal! {shop} inaugura hoje. Solta o som!"], ["Kính thưa quý vị khách quý, hôm nay chúng ta có mặt để chứng kiến…", "Distinguished guests, today we are gathered here to witness…", "Para tamu terhormat, hari ini kita berkumpul untuk menyaksikan…", "Prezados convidados, estamos reunidos hoje para testemunhar…"], ["Ai đi ngang dừng lại 5 phút, tôi hứa là… không bán hàng đa cấp!", "Stop for five minutes, folks! I promise… this isn't a pyramid scheme!", "Mampir lima menit! Saya janji… ini bukan bisnis piramida!", "Parem cinco minutinhos! Prometo… não é esquema de pirâmide!"], ["Giới thiệu sản phẩm của tiệm:", "Introduce the store's products:", "Perkenalkan produk toko:", "Apresente os produtos da loja:"], ["Ba món chủ lực, giá mềm, ngon thiệt — mua 2 tặng 1 trong hôm nay!", "Three bestsellers, great value—buy two, get one free today!", "Tiga produk unggulan, harga terjangkau—beli dua gratis satu hari ini!", "Três campeões de vendas, preço ótimo—leve três e pague dois hoje!"], ["Ai check-in ngay bây giờ nhận liền quà xinh xắn!", "Check in now and get a lovely gift!", "Check-in sekarang dan dapatkan hadiah menarik!", "Faça check-in agora e ganhe um lindo brinde!"], ["Cửa hàng được thành lập dựa trên triết lý kinh doanh bền vững, lấy khách hàng làm…", "This store was founded on sustainable business principles, with the customer at…", "Toko ini didirikan atas prinsip bisnis berkelanjutan, dengan pelanggan sebagai…", "Esta loja foi fundada em princípios sustentáveis, colocando o cliente no…"], ["Khép lại buổi khai trương:", "Close the grand opening:", "Tutup acara pembukaan:", "Encerre a inauguração:"], ["Múa lân lên! Chúc {shop} mua may bán đắt, khách đông như kiến!", "Bring on the lion dance! May {shop} thrive and welcome crowds of customers!", "Mulai barongsainya! Semoga {shop} laris dan ramai pelanggan!", "Que comece a dança do leão! Muito sucesso e clientes para {shop}!"], ["Từ một ước mơ nhỏ, hôm nay {chutiem} đã có cửa hàng riêng. Cảm ơn mọi người!", "From a small dream, {chutiem} now has a shop. Thank you all!", "Dari mimpi kecil, kini {chutiem} punya toko sendiri. Terima kasih semua!", "De um pequeno sonho, {chutiem} agora tem sua loja. Obrigado a todos!"], ["Chúc tiệm… cầm cự được qua tháng đầu nha!", "Hope this shop… survives its first month!", "Semoga toko ini… bertahan melewati bulan pertama!", "Espero que a loja… sobreviva ao primeiro mês!"], ["Đèn livestream đã bật. Chào người xem:", "You're live. Welcome the viewers:", "Sudah live. Sambut penonton:", "Você está ao vivo. Cumprimente o público:"], ["Chào cả nhà yêu! Hôm nay {shop} xả kho, thả tim cho em lên xu hướng nào!", "Hello, lovelies! {shop} is clearing stock today. Send hearts and help us trend!", "Halo semua! {shop} cuci gudang hari ini. Kirim hati agar kita trending!", "Olá, amores! {shop} está em liquidação. Mandem corações para bombar a live!"], ["Kính chào quý khách đang theo dõi buổi phát sóng trực tiếp của chúng tôi.", "Welcome to everyone watching our live broadcast.", "Selamat datang kepada semua yang menyaksikan siaran langsung kami.", "Boas-vindas a todos que acompanham nossa transmissão ao vivo."], ["Ai đang nấu cơm thì để bếp nhỏ lửa, xem live với em 5 phút thôi!", "If you're cooking, lower the heat and join me for five minutes!", "Yang sedang masak, kecilkan api dan nonton lima menit!", "Quem está cozinhando, abaixe o fogo e fique comigo cinco minutinhos!"], ["Giới thiệu sản phẩm đầu tiên:", "Introduce the first product:", "Perkenalkan produk pertama:", "Apresente o primeiro produto:"], ["Hàng thật, giá thật, đổi trả 7 ngày — em nói ngắn, chị chốt nhanh!", "Real products, fair prices, seven-day returns—short pitch, quick purchase!", "Barang asli, harga jujur, retur tujuh hari—singkat saja, langsung pesan!", "Produto de verdade, preço justo, troca em sete dias—falo pouco, você compra rápido!"], ["Mặc vô đi chợ người ta tưởng hoa hậu đi chợ luôn!", "Wear this shopping and everyone will think you're a beauty queen!", "Pakai ini ke pasar, dikira ratu kecantikan!", "Vista isto no mercado e vão achar que você é uma miss!"], ["Hàng y chang hàng hiệu, nói nhỏ thôi… là hàng fake loại một!", "Looks just like the designer version—quietly now… it's a top-quality fake!", "Mirip merek terkenal—pelan-pelan… ini barang palsu kelas satu!", "Igualzinho ao de grife—fala baixo… é falsificação de primeira!"], ["Có người bình luận: \"Hàng xấu, lừa đảo!\"", "Someone comments: \"Awful products! It's a scam!\"", "Ada komentar: \"Barang jelek, penipuan!\"", "Alguém comenta: \"Produto horrível, é golpe!\""], ["Dạ em cảm ơn góp ý, chị nhắn shop em gửi video thật cho chị xem nha!", "Thanks for the feedback! Message us and we'll send you a real product video.", "Terima kasih masukannya! Kirim pesan, kami akan kirim video produk asli.", "Obrigado pelo comentário! Mande mensagem e enviaremos um vídeo real do produto."], ["Ai chê thì… mua về chê tiếp cho kỹ nha!", "If you don't like it… buy one so you can complain properly!", "Kalau tidak suka… beli saja supaya bisa mengkritik lebih teliti!", "Quem não gostou… compre para reclamar com mais propriedade!"], ["Chặn! Chặn liền! Ai cho nói vậy!", "Block them! Right now! Who said they could say that?!", "Blokir! Sekarang! Siapa izinkan bicara begitu?!", "Bloqueia! Agora! Quem deixou falar assim?!"], ["Sắp hết giờ live:", "The stream is nearly over:", "Live hampir selesai:", "A live está acabando:"], ["Còn 10 suất flash sale cuối, ai nhanh tay người đó có!", "Only ten flash-sale deals left—first come, first served!", "Tinggal sepuluh promo kilat—siapa cepat dia dapat!", "Só restam dez ofertas relâmpago—quem chegar primeiro leva!"], ["Cảm ơn cả nhà đã ở lại tới giờ này, mai em lên live tiếp nha!", "Thanks for staying! See you live again tomorrow!", "Terima kasih sudah menonton! Sampai live besok!", "Obrigado por ficarem! Amanhã tem mais live!"], ["Hết giờ, em tắt live đây.", "Time's up. Ending the stream now.", "Waktu habis. Live saya tutup.", "Acabou o tempo. Vou encerrar a live."], ["{name} lên Sài Gòn với 100 nghìn trong túi và cái áo sơ mi mẹ ủi thẳng tưng. Thầy Long nhận dạy nghề, Cô Bảy cho đi phụ dẫn mấy đám nhỏ. Học trước, kiếm tiền sau!", "{name} arrives in Saigon with 100,000 dong and a shirt freshly ironed by Mom. Teacher Long offers training, and Co Bay has small weddings to assist at. Learn first, earn later!", "{name} tiba di Saigon dengan 100.000 dong dan kemeja yang disetrika Ibu. Pak Long mengajar, Co Bay memberi tugas membantu pesta kecil. Belajar dulu, cari uang kemudian!", "{name} chega a Saigon com 100 mil dong e uma camisa passada pela mãe. Long oferece aulas, e Co Bay precisa de ajuda em pequenos casamentos. Primeiro aprender, depois ganhar!"], ["Thi đậu rồi! Giờ {name} là MC nghiệp dư có thẻ hành nghề. Đám hỏi, khai trương, livestream, cả show lễ hội đều gọi tới.", "You passed! {name} is now a licensed amateur MC. Engagements, openings, livestreams and festivals are calling.", "Lulus! {name} kini MC amatir berlisensi. Pertunangan, pembukaan, livestream dan festival menanti.", "Passou! {name} agora é MC amador com licença. Noivados, inaugurações, lives e festivais estão chamando."], ["Tên tuổi {name} đã có trong danh bạ của mọi nhà hàng tiệc cưới. Đến lúc lập công ty sự kiện riêng và học dẫn truyền hình.", "{name} is in every wedding venue's contacts. Time to start an events company and learn TV hosting.", "{name} dikenal semua tempat pernikahan. Saatnya membuka perusahaan acara dan belajar membawakan acara TV.", "{name} já está na agenda de todos os salões. Hora de abrir uma empresa de eventos e aprender a apresentar na TV."], ["Casting thành công! {name} chính thức lên sóng HiHi TV. Gameshow, talkshow, Gala trực tiếp — cả nước đang xem!", "Audition passed! {name} is on HiHi TV. Game shows, talk shows, live galas—the whole country is watching!", "Audisi berhasil! {name} tampil di HiHi TV. Kuis, talkshow, gala langsung—seluruh negeri menonton!", "Teste aprovado! {name} está na HiHi TV. Programas de jogos, entrevistas, galas ao vivo—o país inteiro está assistindo!"], ["Mẹ dúi vào tay 100 nghìn, gói thêm vắt xôi…", "Mom presses 100,000 dong into your hand and packs some sticky rice…", "Ibu memberikan 100.000 dong dan membungkus nasi ketan…", "Mamãe coloca 100 mil dong na sua mão e embrulha um pouco de arroz…"], ["Lên Sài Gòn học nghề MC đi con, đừng lo cho ba mẹ!", "Go to Saigon and learn to be an MC. Don't worry about us!", "Pergilah ke Saigon belajar jadi MC. Jangan khawatirkan kami!", "Vá para Saigon aprender a ser MC. Não se preocupe com a gente!"], ["Ba vỗ vai, không nói nhiều.", "Dad pats your shoulder, saying little.", "Ayah menepuk bahumu tanpa banyak bicara.", "Papai dá um tapinha no seu ombro, sem falar muito."], ["Đi đi con. Nhớ ăn uống đàng hoàng.", "Go on. Remember to eat well.", "Pergilah. Jangan lupa makan yang cukup.", "Pode ir. Lembre-se de se alimentar bem."], ["Alo alo, một hai ba!", "Hello, testing, one two three!", "Halo, tes, satu dua tiga!", "Alô, testando, um dois três!"], ["Cầm mic là phải duyên nha con!", "An MC needs charm, kid!", "MC harus punya pesona!", "Um MC precisa de carisma!"], ["Thầy Long mở lớp MC đầu hẻm, nhận học trò nghèo — học trước, trả học phí sau.", "Teacher Long runs an MC class for students in need—study now, pay later.", "Pak Long membuka kelas MC untuk murid kurang mampu—belajar dulu, bayar nanti.", "Long dá aulas de MC para alunos sem recursos—estude agora, pague depois."], ["Quảng Ngãi. Nhà", "Quang Ngai. The family of", "Quang Ngai. Keluarga", "Quang Ngai. A família de"], ["nghèo lắm: ba chạy xe ôm, mẹ gánh xôi bán từ 4 giờ sáng.", "is poor: Dad drives /* ================== GAMEHIHI EVENT SCORE + GA4 BRIDGE ================== */
const GameHiHiMCBridge = (() => {
  let lastDaySent = 0;
  function normalize(v) { return Math.max(0, Math.floor(Number(v) || 0)); }
  function emitDay(day, netProfit, extra = {}) {
    day = Math.max(1, Math.floor(Number(day) || 1));
    if (day <= lastDaySent) return Promise.resolve(null);
    lastDaySent = day;
    const rawProfit = Math.floor(Number(netProfit) || 0);
    const score = normalize(rawProfit);
    const meta = Object.assign({
      day,
      net_profit: rawProfit,
      cash: Math.floor(Number(S && S.money) || 0),
      reputation: Math.floor(Number(S && S.rep) || 0),
      chapter: Math.floor(Number(S && S.chapter) || 0),
      shows_total: Math.floor(Number(S && S.stats && S.stats.shows) || 0),
      score_rule: 'daily_net_profit_non_negative'
    }, extra || {});

    const scorePayload = {
      type: 'gamehihi:event-score',
      score,
      final: false,
      mode: 'daily_profit',
      meta
    };
    try {
      if (typeof window.GameHiHiDirectEventScore === 'function') {
        window.GameHiHiDirectEventScore(scorePayload);
      } else if (window.parent && window.parent !== window) {
        window.parent.postMessage(scorePayload, '*');
      }
    } catch (e) {}

    const endPayload = {
      type: 'gamehihi:event-end-game',
      score,
      result: rawProfit >= 0 ? 'profit' : 'loss',
      mode: 'daily_profit',
      meta
    };
    try {
      if (typeof window.GameHiHiEndGame === 'function') {
        return Promise.resolve(window.GameHiHiEndGame(endPayload)).catch(() => null);
      }
      if (window.parent && window.parent !== window) window.parent.postMessage(endPayload, '*');
    } catch (e) {}
    return Promise.resolve(null);
  }
  return { emitDay };
})();

// Detect physical screen orientation at the WordPress parent level, not the
// iframe aspect ratio. A portrait phone can still contain a wide iframe.
function mcFillViewport(vw, vh) {
  const touch = matchMedia('(pointer:coarse)').matches || navigator.maxTouchPoints > 0;
  if (!touch) return (vw > vh && vw / vh > 2.05 && vh < 650);
  try {
    if (window.parent && window.parent !== window) {
      return window.parent.matchMedia('(orientation: landscape)').matches &&
        window.parent.innerWidth > window.parent.innerHeight && vw > vh;
    }
  } catch (e) { /* cross-origin parent: use local screen orientation */ }
  return matchMedia('(orientation: landscape)').matches && vw > vh;
}
function fit() {
  const vw = Math.max(0, document.documentElement.clientWidth || innerWidth);
  const vh = Math.max(0, innerHeight);
  if (!vw || !vh) { SC = SCX = SCY = 0; return; }
  const fill = mcFillViewport(vw, vh);
  SC = Math.min(vw / W, vh / H);
  SCX = fill ? vw / W : SC;
  SCY = fill ? vh / H : SC;
  const w = fill ? vw : Math.round(W * SC), h = fill ? vh : Math.round(H * SC);
  stage.style.width = w + 'px'; stage.style.height = h + 'px';
  stage.style.left = fill ? '0px' : Math.round((vw - w) / 2) + 'px';
  stage.style.top = fill ? '0px' : Math.round((vh - h) / 2) + 'px';
  stage.style.fontSize = (16 * SC) + 'px';
  const dpr = Math.min(2, devicePixelRatio || 1);
  const cw = Math.max(1, Math.round(w * dpr)), ch = Math.max(1, Math.round(h * dpr));

  }
  ctx.restore();
}

const SND = {
  ac: null, on: true,
  init() { if (!this.ac) { try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } } if (this.ac && this.ac.state === 'suspended') this.ac.resume(); },
  tone(f, d = .12, type = 'sine', v = .15, slide = 0) {
    if (!this.on || !this.ac) return; const a = this.ac, o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + .02);
  },
  noise(d = .6, v = .18, f = 1500) {
    if (!this.on || !this.ac) return; const a = this.ac, n = a.sampleRate * d, b = a.createBuffer(1, n, a.sampleRate), ch = b.getChannelData(0);
    for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (Math.random() < .3 ? 1 : .3);
    const s = a.createBufferSource(), fl = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime; s.buffer = b; fl.type = 'bandpass'; fl.frequency.value = f; fl.Q.value = .7;
    g.gain.setValueAtTime(.001, t); g.gain.linearRampToValueAtTime(v, t + .08); g.gain.exponentialRampToValueAtTime(.001, t + d); s.connect(fl).connect(g).connect(a.destination); s.start(t);
  },
  click() { this.tone(660, .06, 'triangle', .08); },
  good() { this.tone(523, .1, 'triangle', .12); setTimeout(() => this.tone(784, .16, 'triangle', .12), 90); },
  bad() { this.tone(220, .3, 'sawtooth', .07, .7); },
  cheer() { this.noise(1.1, .16, 1800); },
  coin() { this.tone(988, .08, 'square', .06); setTimeout(() => this.tone(1319, .14, 'square', .06), 70); },
  boo() { this.noise(.7, .1, 400); this.tone(160, .5, 'sawtooth', .05, .8); },

};

const $ = (sel, root = document) => root.querySelector(sel);
function el(html) { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; }
function fmt(k) { const neg = k < 0; k = Math.round(Math.abs(k)); return (neg ? '-' : '') + k.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.') + 'k'; }
function fill(str, sh) { return str.replace(/\{(\w+)\}/g, (_, k) => k === 'name' ? S.name : (sh && sh[k]) || k); }
const sleep = ms => new Promise(r => setTimeout(r, ms));
function modal(html, opts = {}) {
  const v = el(`<div class="veil"><div class="card ${opts.cls || ''}">${opts.close === false ? '' : '<button class="xbtn">×</button>'}${html}</div></div>`);
  UI.appendChild(v);
  const close = () => { v.remove(); opts.onClose && opts.onClose(); };
  const x = $('.xbtn', v); if (x) x.onclick = () => { SND.click(); close(); };
  v.close = close; return v;
}
function ask(html, buttons, opts = {}) {
  return new Promise(res => {
    const v = modal(html + `<div class="btns">${buttons.map((b, i) => `<button class="btn ${b.cls || ''}" data-i="${i}" ${b.dis ? 'disabled' : ''}>${b.t}</button>`).join('')}</div>`, { close: false, cls: opts.cls });
    v.querySelectorAll('.btns .btn').forEach(b => b.onclick = () => { SND.click(); v.remove(); res(+b.dataset.i); });
  });
}

  const pool = [...DAILY_T].sort(() => Math.random() - .5).filter(q => !(q.key === 'orders' && S.chapter < 2)).slice(0, 3);
  S.daily = { day: S.day, q: pool.map(q => ({ id: q.id, done: false })), spun: false };
  S.td = { shows: 0, star4: 0, inc: 0, names: 0, sound: 0, orders: 0, post: 0, fam: 0 };
}
function tdAdd(key, n = 1) { S.td[key] = (S.td[key] || 0) + n; checkDaily(); }
function checkDaily() {
  if (!S.daily) return;

    if (q.done) continue; const T = DAILY_T.find(x => x.id === q.id);
    if ((S.td[T.key] || 0) >= T.goal) { q.done = true; giveReward(T.rw); setTimeout(() => toast('Nhiệm vụ ngày xong: ' + T.t), 600); }

}
function openDaily() {

  $('#bSpin', v).onclick = () => { v.remove(); openWheel(); };
}
function openWheel() {
  ensureDaily(); if (S.daily.spun) { toast('Mai quay tiếp nhé!'); return; }
  const v = modal(`<h2 style="text-align:center">Vòng quay may mắn</h2><div style="text-align:center"><canvas width="340" height="340" style="width:15em;height:15em"></canvas></div><div class="btns"><button class="btn orange" id="bQ">Quay!</button></div>`, { cls: 'sm', close: false });
  const c = $('canvas', v), x = c.getContext('2d'), n = WHEEL.length, cols = ['#e65a54', '#f6c94a', '#6fb3d8', '#8fc27a', '#d98fc0', '#f0b54a', '#b6a1e0', '#7fc6b5'];
  let ang = 0;
  const draw = () => {
    x.clearRect(0, 0, 340, 340); x.save(); x.translate(170, 175); x.rotate(ang);
    for (let i = 0; i < n; i++) { x.beginPath(); x.moveTo(0, 0); x.arc(0, 0, 150, i / n * 6.283, (i + 1) / n * 6.283); x.fillStyle = cols[i]; x.fill(); x.strokeStyle = INK; x.lineWidth = 3; x.stroke(); x.save(); x.rotate((i + .5) / n * 6.283); x.fillStyle = '#fff'; x.font = "800 15px 'Baloo 2'"; x.textAlign = 'right'; x.textBaseline = 'middle'; x.lineWidth = 4; x.strokeStyle = INK; x.strokeText(WHEEL[i][0], 138, 0); x.fillText(WHEEL[i][0], 138, 0); x.restore(); }
    x.restore(); x.beginPath(); x.moveTo(158, 2); x.lineTo(182, 2); x.lineTo(170, 32); x.closePath(); x.fillStyle = '#c9473a'; x.fill(); x.stroke();
  };
  const repaintWheel = () => { if(c.isConnected) draw(); else window.removeEventListener('mc-language-change',repaintWheel); };
  window.addEventListener('mc-language-change',repaintWheel);
  draw();
  $('#bQ', v).onclick = () => {
    $('#bQ', v).disabled = true; S.daily.spun = true; save();
    const target = Math.floor(Math.random() * n), total = 6.283 * 5 + (-Math.PI / 2 - (target + .5) / n * 6.283) - ang % 6.283;
    const a0 = ang, t0 = performance.now(), D = 3200;
    const step = now => { const u = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - u, 3); ang = a0 + total * e; draw(); if (u < 1) { if (Math.random() < .3) SND.tone(900, .02, 'square', .02); requestAnimationFrame(step); } else { const W_ = WHEEL[target]; if (W_[1] !== 'none') { SND.cheer(); giveReward([W_[1], W_[2]]); } else toast('Mai quay tiếp nhé!'); setTimeout(() => v.remove(), 1400); save(); } };
    requestAnimationFrame(step);
  };
}

/* ---- thi lên cấp ---- */
function levelReq(i) {
  const L = LEVELS[i]; if (!L || !L.req) return null; const r = L.req, out = [];
  if (r.shows) out.push([`Dẫn ${r.shows} show`, S.stats.shows >= r.shows, `${S.stats.shows}/${r.shows}`]);
  if (r.rep) out.push([`${r.rep} danh tiếng`, S.rep >= r.rep, `${S.rep}/${r.rep}`]);
  if (r.outfits) out.push([`Có ${r.outfits} bộ đồ biểu diễn`, S.outfits.length >= r.outfits, `${S.outfits.length}/${r.outfits}`]);
  if (r.fives) out.push([`${r.fives} show đạt 5 sao`, (S.stats.fives || 0) >= r.fives, `${S.stats.fives || 0}/${r.fives}`]);
  if (r.skill) out.push([`Học kỹ năng ${SKILLS[r.skill].n}`, S.skills[r.skill] > 0, S.skills[r.skill] > 0 ? 'Đã học' : 'Chưa']);
  if (r.fans) out.push([`${fmtN(r.fans)} người theo dõi HiTok`, S.fans >= r.fans, `${fmtN(S.fans)}/${fmtN(r.fans)}`]);
  return out;
}
function fmtN(n) { return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function canExam() { const r = levelReq(S.chapter); return r && r.every(x => x[1]); }
function examHTML() {
  const next = LEVELS[S.chapter];
  let h = `<h3>Cấp hiện tại: ${LEVELS[lvIdx()].t}</h3>`;
  if (!next) return h + '<p>Bạn đã ở đỉnh cao sự nghiệp — MC truyền hình!</p>';
  h += `<p><b>Kỳ thi tiếp theo:</b> ${next.t}${S.chapter === 3 ? ' (Casting HiHi TV)' : ''}<br><span class="sub">Mở khoá: ${next.unlock}</span></p>`;
  h += levelReq(S.chapter).map(x => `<div class="q ${x[1] ? 'done' : ''}"><span class="ck">✓</span><div style="flex:1">${x[0]}<div class="h">${x[2]}</div></div></div>`).join('');
  return h;
}
async function runExam() {
  const next = LEVELS[S.chapter], fee = next.req.fee;
  if (S.examDay === S.day) { toast('Hôm nay thi rồi, mai thi lại nhé!'); return; }
  if (S.money < fee) { toast('Không đủ tiền lệ phí thi'); return; }
  money(-fee, 'Lệ phí thi ' + next.badge); S.examDay = S.day;
  const qs = [...EXAM_Q].sort(() => Math.random() - .5).slice(0, 5); let ok = 0;
  for (let i = 0; i < qs.length; i++) {
    const [q, ans] = qs[i], order = ans.map((a, k) => [a, k]).sort(() => Math.random() - .5);
    const r = await ask(`<p class="sub">${S.chapter === 3 ? 'Casting HiHi TV' : 'Thi lên ' + next.badge} · Câu ${i + 1}/5</p><h2 style="font-size:1.4em">${q}</h2>`, order.map(o => ({ t: o[0], cls: 'blue' })), { cls: 'sm' });
    if (order[r][1] === 0) { ok++; SND.good(); } else SND.bad();
  }
  if (ok >= 4) {
    S.chapter++; SND.cheer(); confetti(100);
    await ask(`<h2>ĐẬU RỒI! ${ok}/5 câu đúng</h2><p>${S.name} chính thức trở thành <b>${LEVELS[lvIdx()].badge}</b>!</p><p>${fill(LEVELS[lvIdx()].story)}</p><p class="sub">Mở khoá: ${LEVELS[lvIdx()].unlock}</p>`, [{ t: 'Tuyệt vời!' }], { cls: 'sm' });
    S.offers = genOffers(); S.picked = {}; save(); checkProgress(); refreshHUD();
  } else { await ask(`<h2>Chưa đậu… ${ok}/5</h2><p>Cần đúng ít nhất 4 câu. Thầy Long dặn: "Đọc kỹ Hướng dẫn trong Sổ tay, mai thi lại!"</p>`, [{ t: 'Cố lên!' }], { cls: 'sm' }); save(); }
}

async function buyAsset(kind, k) {
  const D = kind === 'car' ? VEHICLES[k] : HOUSES[k];
  const cur = kind === 'car' ? S.vehicle : S.house, curD = kind === 'car' ? VEHICLES[cur] : HOUSES[cur];
  const sellBack = Math.round(curD.price * .5);
  const net = D.price - sellBack;
  const down = Math.round(net * .3), total = Math.round((net - down) * 1.1), days = 20, per = Math.ceil(total / days);
  const canCash = S.money >= net, canLoan = S.money >= down && S.loans.length < 2;
  const r = await ask(`<h2>Mua ${D.n}?</h2><p>Giá: <b>${fmt(D.price)}</b>${sellBack ? ` · bán lại ${curD.n}: <b>+${fmt(sellBack)}</b>` : ''}</p>
    <div class="rows"><div><span>Mua đứt</span><span>${fmt(net)}</span></div><div><span>Trả góp: trả trước 30%</span><span>${fmt(down)}</span></div><div><span>Rồi mỗi ngày trừ (lãi 10%, ${days} ngày)</span><span>${fmt(per)}</span></div></div>
    ${S.loans.length >= 2 ? '<p class="sub">Bạn đang có 2 khoản góp, trả bớt rồi mới vay thêm được.</p>' : ''}`,
    [{ t: 'Mua đứt', dis: !canCash }, { t: 'Trả góp', cls: 'blue', dis: !canLoan }, { t: 'Để sau', cls: 'gray' }], { cls: 'sm' });
  if (r === 2) return false;
  if (sellBack) money(sellBack, `Bán ${curD.n}`);
  if (r === 0) money(-net, `Mua ${D.n}`);
  else { money(-down, `Trả trước ${D.n}`); S.loans.push({ n: D.n, left: total, per }); }
  if (kind === 'car') { S.vehicle = k; SND.cheer(); confetti(60); toast(`Tậu ${D.n} mới cứng!`); }
  else {
    const first = cur === 'tro';
    if (S.furni.length > D.slots) S.furni = S.furni.slice(0, D.slots);
    S.house = k; SND.cheer(); confetti(80); toast(`Dọn về ${D.n}!`);
    for (const key in BG.cache) if (key.startsWith('hub') || key.startsWith('home')) delete BG.cache[key];
    if (first && !S.parents) {
      S.parents = true;
      await ask(`<h2>Ba mẹ lên thăm nhà mới!</h2><p>Nghe tin ${S.name} có nhà riêng ở Sài Gòn, ba mẹ dưới quê bắt xe đò lên liền trong đêm, xách theo bao gạo với con gà.</p><p>"Hồi đó cầm cái mic đọc thơ ở trường, giờ có nhà luôn rồi. Ba mẹ mừng quá con ơi!"</p>`, [{ t: 'Vào nhà xem!' }], { cls: 'sm' });
      save(); enterHome(); checkProgress(); return true;
    }
  }
  save(); checkProgress(); return true;
}

    const loop = () => {

      for (let l = 0; l < 3; l++) { x.fillStyle = `rgba(255,255,255,${.04 + flash[l]})`; x.fillRect(20 + l * 150, 0, 140, 260); flash[l] = Math.max(0, flash[l] - .02); }
      x.strokeStyle = '#ffd85c'; x.lineWidth = 4; x.beginPath(); x.moveTo(10, HIT); x.lineTo(470, HIT); x.stroke();
      for (const n of notes) {
        const y = HIT - (n.t - tn) * SPEED; if (y < -20 || y > 280) continue;
        if (!n.hit && tn - n.t > .22) { n.hit = -1; combo = 0; }

      }

function wobText(str, x, y, size, c1, c2, ow, o = {}) {
  const originalText = str; str = MC_I18N.t(str);
  if(str !== originalText) { const ratio = Math.min(1, originalText.length / str.length); size *= ratio; ow *= ratio; }
  ctx.save();

  const chars = [...str], sp = o.sp || 0, ws = chars.map(c => c === ' ' ? size * .28 : ctx.measureText(c).width);
  const total = ws.reduce((a, b) => a + b, 0) + sp * (chars.length - 1), t = o.t || 0;
  let cx = x - total / 2;
  const g = ctx.createLinearGradient(0, y - size * .5, 0, y + size * .45); g.addColorStop(0, c1); g.addColorStop(1, c2);
  chars.forEach((c, i) => {

      const rot = (o.rot ?? .05) * Math.sin(i * 2.1 + t * 3) + (o.arc ? k * .06 : 0);
      const dy = (o.bounce || 0) * Math.sin(i * 1.3 + t * 5) + (o.arc ? o.arc * k * k : 0);
      ctx.save(); ctx.translate(cx + w / 2, y + dy); ctx.rotate(rot); ctx.lineJoin = 'round'; ctx.miterLimit = 2;
      ctx.fillStyle = INK; ctx.strokeStyle = INK; ctx.lineWidth = ow; ctx.strokeText(c, 0, size * .09); ctx.fillText(c, 0, size * .09);
      ctx.strokeText(c, 0, 0);
      if (o.inner !== false) { ctx.strokeStyle = '#fffaf0'; ctx.lineWidth = Math.max(3, ow * .28); ctx.strokeText(c, 0, 0); }
      ctx.fillStyle = g; ctx.translate(0, -y - dy); ctx.fillText(c, 0, y + dy);
      ctx.restore();
    }
    cx += w + sp;

  ctx.restore();
}

    sb.innerHTML = examHTML();
    const next = LEVELS[S.chapter];
    if (next) { const b = el(`<div class="btns"><button class="btn orange" ${canExam() && S.examDay !== S.day ? '' : 'disabled'}>${S.examDay === S.day ? 'Mai thi lại nhé' : `Dự thi · lệ phí ${fmt(next.req.fee)}`}</button></div>`); b.firstChild.onclick = () => { v.remove(); runExam(); }; sb.appendChild(b); }
    return;
  }
  const g = el('<div class="grid"></div>'); sb.appendChild(g);
  for (const [k, sk] of Object.entries(SKILLS)) {
    const lv = S.skills[k] || 0, max = lv >= 3, price = sk.price[lv];
    const it = el(`<div class="item ${lv ? 'on' : ''}"><div class="t">${sk.n}</div><div class="d">${sk.d}</div><div class="stars" style="font-size:1.4em">${'★'.repeat(lv)}<span class="e">${'★'.repeat(3 - lv)}</span></div></div>`);
    const b = el(max ? `<button class="btn gray" disabled>Đã thành thạo</button>` : `<button class="btn" ${S.money < price ? 'disabled' : ''}>Học cấp ${lv + 1} · ${fmt(price)}</button>`);
    b.onclick = () => { SND.click(); money(-price, `Học ${sk.n} cấp ${lv + 1}`); S.skills[k] = lv + 1; SND.good(); toast(`Đã học ${sk.n} cấp ${lv + 1}!`); save(); v.remove(); openSchool('kn'); checkProgress(); };
    it.appendChild(b); g.appendChild(it);
  }
}
function openHome() {
  const v = modal(`<h2>Nhà trọ 27</h2><p>Phòng trọ nhỏ xíu, có cái gương soi tập nói mỗi tối.</p><div class="btns"><button class="btn orange" id="bRest">Nghỉ một ngày</button><button class="btn blue" id="bSave">Lưu ván</button><button class="btn gray" id="bMenu">Về màn hình chính</button></div>`, { cls: 'sm' });
  $('#bRest', v).onclick = () => { v.remove(); restDay(); };
  $('#bSave', v).onclick = () => { save(); toast('Đã lưu ván!'); };
  $('#bMenu', v).onclick = () => { save(); v.remove(); showTitle(); };
}

/* ================== BOOK ================== */
function openBook(tab) {
  const v = el(`<div class="full"><div class="top"><button class="back">←</button><h2>Sổ tay MC</h2><span class="chip" style="margin-left:auto">MC ${S.name} · ${LEVELS[S.chapter - 1].t}</span></div><div class="tabs"></div><div id="bk"></div></div>`);
  UI.appendChild(v); $('.back', v).onclick = () => { SND.click(); v.remove(); };
  const tabs = [['nv', 'Nhiệm vụ'], ['db', 'Danh bạ'], ['tt', 'Thành tựu'], ['ts', 'Tài sản'], ['ss', 'Sổ sách'], ['hd', 'Hướng dẫn']];
  const tb = $('.tabs', v);
  const show = t => {
    tb.innerHTML = ''; tabs.forEach(([k, n]) => { const b = el(`<button class="tab ${k === t ? 'on' : ''}">${n}</button>`); b.onclick = () => { SND.click(); show(k); }; tb.appendChild(b); });
    const bk = $('#bk', v); bk.innerHTML = '';
    if (t === 'nv') {
      bk.appendChild(el(`<div class="q" style="display:block">${examHTML()}</div>`));
      for (const c of LEVELS.map((L, i) => ({ id: i + 1, t: L.t }))) {
        if (c.id > S.chapter) { bk.appendChild(el(`<h3 style="font:800 1.1em 'Baloo 2';color:#b9a58a">${c.t} — chưa mở</h3>`)); continue; }
        bk.appendChild(el(`<h3 style="font:800 1.1em 'Baloo 2';color:#7a4a28;margin:.6em 0 .2em">${c.t}</h3>`));
        for (const q of QUESTS.filter(q => q.ch === c.id)) bk.appendChild(el(`<div class="q ${S.quests[q.id] ? 'done' : ''}"><span class="ck">✓</span><div>${q.t}${q.reward ? ` <span class="chip">thưởng ${fmt(q.reward)}</span>` : ''}<div class="h">${q.h}</div></div></div>`));
      }
    } else if (t === 'db') {
      for (const [k, c] of Object.entries(CONTACTS)) {
        const known = S.rep >= c.rep, lv = S.rel[k];
        const d = el(`<div class="contact"><div style="flex:1"><b style="font:800 1.1em 'Baloo 2';color:#5a3018">${known ? c.n : '???'}</b><div style="font-size:.85em;font-weight:600;color:#8d7458">${known ? c.role : `Cần ${c.rep} danh tiếng để quen`}</div></div><div class="hearts">${'♥'.repeat(lv)}<span class="e">${'♥'.repeat(5 - lv)}</span></div></div>`);
        if (known) { const th = personThumb(c.look, { bg: '#fffaf0' }); th.style.cssText = 'width:4.8em;height:3em;flex:none'; d.insertBefore(th, d.firstChild); }
        bk.appendChild(d);
      }
      bk.appendChild(el(`<p class="sub">Show 4–5 sao làm người quen thân hơn, cát-xê họ trả cũng cao hơn.</p>`));
    } else if (t === 'tt') {
      const n = Object.keys(S.achs).length;
      bk.appendChild(el(`<p style="font-weight:800">Đã đạt ${n}/${ACHS.length}</p>`));
      const w = el('<div></div>'); for (const a of ACHS) w.appendChild(el(`<div class="ach ${S.achs[a.id] ? 'ok' : ''}"><div class="m">${S.achs[a.id] ? '★' : '?'}</div><div class="t">${a.t}</div><div class="d">${a.d}</div></div>`)); bk.appendChild(w);
    } else if (t === 'ts') {
      const V = VEHICLES[S.vehicle], HO = HOUSES[S.house], debt = loanLeft(), worth = S.money + assetValue() - debt;
      bk.appendChild(el(`<div class="q" style="display:block"><div class="rows" style="margin:0"><div><span>Tiền mặt</span><span>${fmt(S.money)}</span></div><div><span>Xe: ${V.n}</span><span>${fmt(V.price)}</span></div><div><span>Nhà: ${HO.n}</span><span>${fmt(HO.price)}</span></div><div><span>Nội thất (${S.furni.length} món · tiện nghi ${comfort()})</span><span>${fmt(S.furni.reduce((a, k) => a + FURNI[k].price, 0))}</span></div><div><span>Nợ trả góp còn lại</span><span class="minus">${fmt(-debt)}</span></div><div><span><b>Tổng tài sản ròng</b> (đồ dùng tính 60%)</span><span class="plus"><b>${fmt(worth)}</b></span></div></div></div>`));
      for (const l of S.loans) bk.appendChild(el(`<div class="q"><span class="ck" style="background:#e88a2c;border-color:#e88a2c">₫</span><div>Góp ${l.n}: còn ${fmt(l.left)}<div class="h">Mỗi ngày trừ ${fmt(l.per)} lúc đi ngủ</div></div></div>`));
      const b = el(`<div class="btns" style="justify-content:flex-start"><button class="btn orange">Tới Nhà đất & Xe</button></div>`); b.firstChild.onclick = () => { v.remove(); openEstate(); }; bk.appendChild(b);
    } else if (t === 'ss') {
      const days = [...S.ledger, { day: S.day, items: S.today, cur: true }].reverse().filter(d => d.items.length);
      if (!days.length) bk.appendChild(el(`<p>Chưa có khoản thu chi nào.</p>`));
      for (const d of days) {
        const sum = d.items.reduce((a, b) => a + b[1], 0);
        bk.appendChild(el(`<div class="q" style="display:block"><b>Ngày ${d.day}${d.cur ? ' (hôm nay)' : ''}</b> · <span style="color:${sum >= 0 ? '#3f6b3a' : '#c0492f'}">${sum >= 0 ? 'Lời' : 'Lỗ'} ${fmt(sum)}</span><table class="ledger">${d.items.map(i => `<tr><td>${i[0]}</td><td class="n" style="color:${i[1] >= 0 ? '#3f6b3a' : '#c0492f'}">${i[1] >= 0 ? '+' : ''}${fmt(i[1])}</td></tr>`).join('')}</table></div>`));
      }
    } else {
      bk.appendChild(el(`<div class="q" style="display:block;line-height:1.55">
        <b>Sự nghiệp:</b> 4 cấp Học nghề → Nghiệp dư → Chuyên nghiệp → MC nổi tiếng. Đủ điều kiện thì thi lên cấp ở Lớp MC Thầy Long.<br><b>Mỗi show:</b> lên kịch bản theo lời dặn chủ nhà → chạy tới nơi → kiểm tra âm thanh → gặp hai bên gia đình → dẫn chương trình.<br><b>Điện thoại 📱:</b> HiTok, người thương, công ty, đồ ăn hồi thể lực/giọng, bản đồ khu vực, nhiệm vụ ngày, vòng quay, bộ sưu tập, chế độ chơi.<br><br><b>Một ngày làm MC</b> có 3 buổi: Sáng · Chiều · Tối. Mở <b>Lịch diễn</b>, nhận tối đa một show mỗi buổi rồi bấm <b>Lên đường</b>.<br><br>
        <b>Trong show</b>, mỗi phần chọn một câu thoại. Mỗi câu có kiểu: <span class="chip">Trang trọng</span><span class="chip">Hài hước</span><span class="chip">Ngắn gọn</span><span class="chip">Cảm động</span><span class="chip">Sôi động</span>.<br>
        Ông bà thích trang trọng, cảm động · Thanh niên thích hài hước, sôi động · Con nít thích sôi động · Chủ nhà thích ngắn gọn và đúng nghi thức.<br><br>
        <b>Không khí</b> = khán giả vui cỡ nào. <b>Chủ nhà hài lòng</b> = bạn có dẫn đúng ý không. Hai thanh này quyết định số sao, tiền cát-xê và danh tiếng.<br><br>
        <b>Trò nhỏ:</b> nhớ đúng tên (đọc kỹ kịch bản đầu show!), bấm đúng nhịp "1-2-3 dzô", chốt đơn livestream, quay số trúng thưởng.<br>
        <b>Sự cố</b> có thể xảy ra bất cứ lúc nào — xem trước khả năng ở nút chuông.<br><br><b>Tài sản:</b> kiếm tiền rồi ghé <b>Nhà đất & Xe</b> mua xe (ít kẹt xe, chủ nhà nể), mua nhà (bớt tiền trọ, chứa nội thất, đón ba mẹ). Nội thất tăng tiện nghi → khán giả vui hơn từ đầu show. Có thể trả góp 20 ngày.<br><br>
        Ghé <b>Tiệm may</b> mua đồ hợp kiểu show, <b>Cà phê Ê-kíp</b> thuê người hỗ trợ, <b>Lớp MC</b> học thêm kỹ năng.</div>`));
    }
  };
  show(tab);
}

/* ================== INPUT & BOOT ================== */
cv.addEventListener('pointerdown', e => {
  SND.init();
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  if (G.mode === 'hub' && !UI.querySelector('.veil,.full')) {
    for (const s of HUB_SPOTS) if (x >= s.x && x <= s.x + s.w && y >= 280 && y <= 480) return openSpot(s.id);
    if (Math.hypot(x - G.mc.x, y - (G.mc.y - 60)) < 60) { say(G.mc, pick(['Hôm nay dẫn gì ta?', 'Alo alo, thử mic!', 'Phải duyên lên!', 'Tập nói trước gương nè…']), 1800); SND.click(); }
    for (const p of G.walkers) if (Math.abs(x - p.x) < 22 && y < p.y && y > p.y - 95) { say(p, pick(STREET_TALK), 2000); break; }
  }
});
fit();
requestAnimationFrame(frame);
showTitle();

</script>
