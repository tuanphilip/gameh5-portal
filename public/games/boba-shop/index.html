*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#bfe9ff;font-family:'Baloo 2',system-ui,-apple-system,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;color:#3d2c4e}

#goal{flex:1;max-width:460px;margin:0 auto;background:#ffffffee;border-radius:16px;padding:5px 12px;font-weight:700;font-size:15px;line-height:1.25;text-align:center;box-shadow:0 4px 0 #ff8fab66,0 8px 18px #0002;border:3px solid #ff8fab;display:none}

#topBtns button:active{transform:translateY(2px)}
#labels{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.lbl{position:absolute;left:0;top:0;width:max-content;pointer-events:none;will-change:transform;white-space:nowrap}

.pad .pn{font-size:12px;color:#6b5b7b}
.pad .pc{font-size:16px;font-weight:800;color:#d62828}
.pad.ok{border-color:#52b788}.pad.ok .pc{color:#2d6a4f}
.bubble{background:#fff;border-radius:14px;padding:3px 10px 6px;font-weight:800;font-size:17px;box-shadow:0 3px 0 #0002;border:2px solid #ffc8dd;position:relative;text-align:center;min-width:58px}
.bubble:after{content:'';position:absolute;left:50%;bottom:-8px;margin-left:-7px;border:7px solid transparent;border-top-color:#fff;border-bottom:0}
.bubble .bar{height:5px;border-radius:3px;background:#eee;margin-top:2px;overflow:hidden}
.bubble .bar i{display:block;height:100%;background:#52b788;border-radius:3px}
.emo{font-size:26px}
.float{font-weight:800;font-size:20px;color:#2d6a4f;text-shadow:0 2px 0 #fff,0 -2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff}
.float.big{font-size:26px;color:#ff5d8f}
.zl{font-size:12px;font-weight:800;background:#3d2c4ecc;color:#fff;border-radius:8px;padding:0 7px}
#joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:#ffffff55;border:3px solid #ffffffaa;z-index:4;pointer-events:none;display:none}
#joyKnob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px #0003}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);width:min(440px,94vw);background:#fff;border-radius:22px;padding:12px 14px 14px;z-index:8;box-shadow:0 10px 30px #0004;border:3px solid #b8a1e3;display:none;max-height:72vh;overflow:auto;touch-action:pan-y}
.sheet.show{display:block;animation:sheetIn .25s}
@keyframes sheetIn{from{transform:translate(-50%,30px);opacity:0}to{transform:translateX(-50%);opacity:1}}
.sheet h3{font-size:21px;text-align:center;margin-bottom:6px}
.x{position:absolute;right:10px;top:8px;width:34px;height:34px;border-radius:50%;background:#f1e9ff;font-size:18px;font-weight:800;color:#5e548e}
.uprow{display:flex;align-items:center;gap:10px;padding:7px 4px;border-top:2px dashed #f1e9ff}
.uprow .ui{font-size:28px;width:38px;text-align:center}
.uprow .ut{flex:1;line-height:1.15}
.uprow .ut b{font-size:16px}.uprow .ut small{display:block;font-size:12.5px;color:#7d6e8d}
.lvl{display:flex;gap:3px;margin-top:3px}.lvl i{width:14px;height:6px;border-radius:3px;background:#eee}.lvl i.on{background:#ff8fab}
.ub{min-width:86px;padding:7px 8px;border-radius:14px;background:#52b788;color:#fff;font-weight:800;font-size:16px;box-shadow:0 4px 0 #2d6a4f}
.ub:disabled{background:#cfcfcf;box-shadow:0 4px 0 #a5a5a5;cursor:default}
.ub:not(:disabled):active{transform:translateY(2px);box-shadow:0 2px 0 #2d6a4f}
.lbrow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:12px;margin:3px 0;background:#faf7ff}
.lbrow.me{background:#ffe5ec;border:2px solid #ff8fab;font-weight:800}
.lbrow .rk{width:30px;text-align:center;font-weight:800;color:#5e548e}
.lbrow .av{font-size:22px}
.lbrow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.lbrow .sc{font-weight:800;color:#2d6a4f}
.lbme{display:flex;gap:6px;margin:4px 0 8px}
.lbme input{flex:1;min-width:0;font-family:inherit;font-size:16px;font-weight:700;padding:6px 10px;border-radius:12px;border:2px solid #b8a1e3;outline:none;color:#3d2c4e}
.lbsub{text-align:center;font-size:13px;color:#7d6e8d;font-weight:600;margin-bottom:4px}
.lbnext{text-align:center;font-size:14px;font-weight:700;color:#ff5d8f;margin:6px 0 2px}
.langs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 10px}
.langs button{padding:6px 12px;border-radius:12px;background:#f1e9ff;font-weight:700;font-size:15px;color:#5e548e}
.langs button.on{background:#b8a1e3;color:#fff}
.srow{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;border-top:2px dashed #f1e9ff;font-weight:700}
.pill{padding:6px 14px;border-radius:12px;background:#f1e9ff;font-weight:800;color:#5e548e}
.danger{background:#ffe1e1;color:#c1121f}
#start{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#ffd6e0f5,#c9efe0f5 60%,#bfe9fff5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);padding:20px;text-align:center;overflow:hidden}
#start>*{max-width:100%}
#start .logo{font-size:min(15vw,78px);font-weight:800;line-height:1;color:#ff5d8f;-webkit-text-stroke:7px #fff;paint-order:stroke fill;filter:drop-shadow(0 4px 0 #ff8fab66);letter-spacing:0}
#start .logo span{color:#2a9d8f;display:block;font-size:.6em;margin-top:2px;filter:drop-shadow(0 3px 0 #2a9d8f44)}
#start .cupart{font-size:min(18vw,84px);line-height:1;animation:bob 1.6s ease-in-out infinite;margin-bottom:4px}
@keyframes bob{50%{transform:translateY(-10px) rotate(4deg)}}
#start p{font-weight:700;font-size:17px;margin:10px 0 16px;color:#5e548e}
#playBtn{position:relative;z-index:1;margin-bottom:22px;font-size:26px;font-weight:800;color:#fff;background:#ff5d8f;padding:10px 46px;border-radius:22px;box-shadow:0 6px 0 #c9184a,0 12px 24px #ff5d8f55;animation:pulse 1.4s infinite}
#playBtn:active{transform:translateY(3px);box-shadow:0 3px 0 #c9184a}
@keyframes pulse{50%{transform:scale(1.03)}}
#start .langs{position:relative;z-index:2;margin:0 0 6px}
#start .hint{font-size:13px;margin-top:10px;color:#6b5b7b;font-weight:600}
@media (max-height:520px){#start .cupart{font-size:48px}#start .logo{font-size:52px}#start p{margin:4px 0 10px}}
#playBtn:disabled{background:#cfcfcf;box-shadow:0 6px 0 #a5a5a5;animation:none}
#err{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;background:#fff;border-radius:18px;padding:18px;max-width:86vw;text-align:center;font-weight:700;border:3px solid #ff8fab;display:none}
#toast{position:fixed;left:50%;top:32%;transform:translate(-50%,-50%);z-index:9;font-size:30px;font-weight:800;color:#fff;text-shadow:0 3px 0 #c9184a,0 0 18px #ff5d8f;pointer-events:none;opacity:0;transition:opacity .3s,transform .3s;text-align:center;white-space:nowrap}

/* ===== Tối ưu điện thoại ===== */
html,body{overscroll-behavior:none;-webkit-touch-callout:none}
#btnFs{display:none}
@media (max-width:640px),(max-height:500px){

  .sheet{max-height:62vh;padding:10px 10px 12px;border-radius:18px;bottom:calc(env(safe-area-inset-bottom) + 8px)}
  .sheet h3{font-size:18px}

  .ub{min-width:74px;font-size:14px;padding:6px}
  #joy{width:104px;height:104px;margin:-52px 0 0 -52px}
  #joyKnob{width:46px;height:46px;margin:-23px 0 0 -23px}

@media (max-height:500px) and (orientation:landscape){

  .sheet.show{animation:none}
}
#rush{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translateX(-50%);z-index:5;background:linear-gradient(90deg,#ff5d8f,#ff9f1c);color:#fff;font-weight:800;font-size:15px;padding:3px 14px;border-radius:999px;box-shadow:0 3px 0 #c9184a;display:none;pointer-events:none;white-space:nowrap}
.maprow{display:flex;align-items:center;gap:10px;padding:8px 6px;border-top:2px dashed #f1e9ff}
.maprow .mi{font-size:30px;width:40px;text-align:center}.maprow .mt{flex:1;line-height:1.15}.maprow .mt b{font-size:16px}.maprow .mt small{display:block;font-size:12px;color:#7d6e8d}
.maprow.off{opacity:.55}
#offPanel .big{font-size:34px;font-weight:800;color:#2d6a4f;text-align:center;margin:6px 0 10px}
@media (max-width:640px){ #rush{top:calc(env(safe-area-inset-top) + 92px);font-size:13px} }

class Pile{
  constructor(parent,type,max,cols,rows,base,sx,sz){
    this.type=type; this.m=[]; this.count=0;
    for(let i=0;i<max;i++){ const per=cols*rows,layer=Math.floor(i/per),r=i%per,c=r%cols,ro=Math.floor(r/cols);
      const m=new THREE.Mesh(GEO[type],MAT); m.position.set(base[0]+(c-(cols-1)/2)*sx,base[1]+layer*HGT[type],base[2]+(ro-(rows-1)/2)*sz); m.rotation.y=(Math.random()-.5)*.35; m.visible=false; parent.add(m); this.m.push(m); }
  }
  set(n){ n=Math.max(0,Math.min(n,this.m.length)); if(n===this.count) return; for(let i=0;i<this.m.length;i++) this.m[i].visible=i<n; this.count=n; }
  top(i=this.count-1){ return this.m[Math.max(0,Math.min(i,this.m.length-1))].getWorldPosition(new V3()); }
}

class Agent{
  constructor(kind,look,x=0,z=0){
    this.kind=kind; this.c=makeChar(look); this.root=this.c.root; this.root.position.set(x,0,z); scene.add(this.root);
    this.pos=this.root.position; this.carry=[]; this.carryType=null; this.path=[]; this.t={}; this.walk=0; this.moving=false; this.face=0; this.sit=false; this.wait=0;
    this.stack=new THREE.Group(); this.stack.position.set(0,.9,.43); this.root.add(this.stack);
  }
  capacity(){ return this.kind==='player'?4+2*S.up.capacity:this.kind==='staff'?3+S.up.staff:3; }
  speed(){ return this.kind==='player'?4.4*(1+.12*S.up.speed):this.kind==='staff'?3*(1+.15*S.up.staff):2.6; }
  addCarry(type,from){ this.carryType=type; const m=new THREE.Mesh(GEO[type],MAT); m.position.y=this.carry.length*HGT[type]; m.rotation.y=(Math.random()-.5)*.3; this.stack.add(m); this.carry.push(m);
    if(from){ m.visible=false; fly(type,from,()=>m.getWorldPosition(new V3()),()=>{m.visible=true;}); } }
  popCarry(toFn,onLand){ const m=this.carry.pop(); if(!m) return; const p=m.getWorldPosition(new V3()); const type=this.carryType; this.stack.remove(m); if(!this.carry.length) this.carryType=null; if(toFn) fly(type,p,toFn,onLand); }
  clearCarry(){ while(this.carry.length) this.popCarry(); }
  follow(dt){
    if(!this.path.length){ this.moving=false; return; }
    const p=this.path[0],dx=p.x-this.pos.x,dz=p.z-this.pos.z,d=Math.hypot(dx,dz);
    if(d<.04){ this.path.shift(); if(!this.path.length) this.moving=false; return; }
    const st=Math.min(d,this.speed()*dt); this.pos.x+=dx/d*st; this.pos.z+=dz/d*st; this.face=Math.atan2(dx,dz); this.moving=true;
  }
  animate(dt){
    const c=this.c;
    if(this.moving) this.walk+=dt*this.speed()*2.6;
    const s=this.moving?Math.sin(this.walk):0, carrying=this.carry.length>0;
    if(this.sit){ c.legL.rotation.x=c.legR.rotation.x=-1.45; c.armL.rotation.x=c.armR.rotation.x=-.5; c.body.position.y=0; }
    else{
      c.legL.rotation.x=THREE.MathUtils.lerp(c.legL.rotation.x,s*.75,.5); c.legR.rotation.x=THREE.MathUtils.lerp(c.legR.rotation.x,-s*.75,.5);
      const ta=carrying?-1.25:-s*.6, tb=carrying?-1.25:s*.6;
      c.armL.rotation.x=THREE.MathUtils.lerp(c.armL.rotation.x,ta,.3); c.armR.rotation.x=THREE.MathUtils.lerp(c.armR.rotation.x,tb,.3);
      c.body.position.y=this.moving?Math.abs(Math.cos(this.walk))*.07:Math.sin(perfT*3+this.pos.x)*.012;
    }
    let d=this.face-this.root.rotation.y; d=Math.atan2(Math.sin(d),Math.cos(d)); this.root.rotation.y+=d*Math.min(1,dt*12);
    this.stack.position.y=.9+c.body.position.y;
  }
  dispose(){ scene.remove(this.root); this.c.torso.geometry.dispose(); }
}
function blocked(x,z,r){
  if(x<WORLD.minX+r||x>9.6-r||z<-9.6+r||z>9.6-r) return true;
  for(const c of colliders) if(c.on&&x>c.x0-r&&x<c.x1+r&&z>c.z0-r&&z<c.z1+r) return true;
  return false;
}
function moveCollide(a,dx,dz){ const r=.32,p=a.pos; if(blocked(p.x,p.z,r)){ p.x=THREE.MathUtils.clamp(p.x+dx,WORLD.minX+.4,9.2); p.z=THREE.MathUtils.clamp(p.z+dz,-9.2,9.2); return; } if(!blocked(p.x+dx,p.z,r)) p.x+=dx; if(!blocked(p.x,p.z+dz,r)) p.z+=dz; }
const dist2=(a,p)=>Math.hypot(a.pos.x-p.x,a.pos.z-p.z);
const at=(a,p)=>dist2(a,p)<.2;
function go(a,pts){ a.path=pts.map(p=>p.clone()); a.wait=0; }

function tick(a,z,dt,iv){ let v=(a.t[z.id]??iv*.6)+dt; if(v>=iv){ a.t[z.id]=v-iv; return true; } a.t[z.id]=v; return false; }
let cashierPresent=false;
const flags={dropped:false,collected:false,trashed:false,binned:false};
function canTake(a,type){ return (a.carryType===null||a.carryType===type)&&a.carry.length<a.capacity(); }
function zoneStay(a,z,dt){
  const isP=a===player;
  switch(z.type){
    case 'machine':{ const m=z.ref; if(m.pile>0&&canTake(a,m.prod)&&tick(a,z,dt,.11)){ m.pile--; a.addCarry(m.prod,m.vis.top(m.pile)); m.vis.set(m.pile); sfx('pick'); } break; }
    case 'counterDrop':{ const L2=z.ref; if(a.carryType===L2.prod&&L2.count<COUNTER_MAX&&tick(a,z,dt,.08)){ const idx=L2.count++; a.popCarry(()=>L2.pile.top(idx),()=>L2.pile.set(L2.count)); if(isP) flags.dropped=true; sfx('drop'); } break; }
    case 'cashier': z.ref.cashier=true; break;
    case 'money':{ if(!isP) break; const mp=z.ref; if(mp.value>0&&tick(a,z,dt,.045)){ let amt=Math.max(1,Math.ceil(mp.value*.18)); amt=Math.min(amt,mp.value); mp.value-=amt; S.money+=amt; bumpMoney();
        if(mp.pile.count>0) fly('bill',mp.pile.top(),()=>a.pos.clone().setY(1.2),null,.2); sfx('coin'); flags.collected=true; } break; }
    case 'table':{ const T=z.ref; if(T.dirty&&T.trash>0&&canTake(a,'trash')&&tick(a,z,dt,.14)){ T.trash--; a.addCarry('trash',T.trashP.top(T.trash)); T.trashP.set(T.trash); sfx('pick');
        if(T.trash<=0){ T.dirty=false; const tip=2+Math.floor(priceOf(LINES[T.line].prod)/2); S.money+=tip; S.earned+=tip; bumpMoney(); floatText('+$'+tip+' '+t('tip'),new V3(T.x,2,T.z),'big'); sfx('coin'); }
        if(isP) flags.trashed=true; } break; }
    case 'bin': if(a.carryType==='trash'&&tick(a,z,dt,.07)){ const bp=z.ref; a.popCarry(()=>bp); sfx('trash'); if(isP) flags.binned=true; } break;
    case 'packIn': if(a.carryType==='cup'&&R.packIn<PACK_MAX&&tick(a,z,dt,.08)){ const idx=R.packIn++; a.popCarry(()=>pack.inP.top(idx),()=>pack.inP.set(R.packIn)); sfx('drop'); } break;
    case 'bagOut': if(R.bagOut>0&&canTake(a,'bag')&&tick(a,z,dt,.11)){ R.bagOut--; a.addCarry('bag',pack.outP.top(R.bagOut)); pack.outP.set(R.bagOut); sfx('pick'); } break;
    case 'delivery': if(a.carryType==='bag'&&R.shelf<SHELF_MAX&&tick(a,z,dt,.08)){ const idx=R.shelf++; a.popCarry(()=>pack.shelfP.top(idx),()=>pack.shelfP.set(R.shelf)); sfx('drop'); } break;
    case 'pad':{ if(!isP) break; const p=z.ref; const rem=p.cost-(S.padPaid[p.id]||0); if(S.money>.001&&rem>0){ const rate=Math.max(p.cost/1.1,25); const amt=Math.min(rate*dt,S.money,rem); S.money-=amt; S.padPaid[p.id]=(S.padPaid[p.id]||0)+amt; bumpMoney(false);
        if(tick(a,z,dt,.08)){ fly('bill',a.pos.clone().setY(1.2),()=>new V3(p.x,.1,p.z),null,.22); sfx('coin'); }
        if(S.padPaid[p.id]>=p.cost-.5){ S.padPaid[p.id]=p.cost; unlock(p.id,true); } } break; }
  }
}

/* =========================================================
   13. AI NHÂN VIÊN
   ========================================================= */
function bestMachine(from,line=0){ let b=null; for(const m of machines){ if(!m.unlocked||m.line!==line) continue; if(!b||m.pile>b.pile||(m.pile===b.pile&&from&&dist2(from,m.zp)<dist2(from,b.zp))) b=m; } return b; }
const via=(a,to)=>{ const gA=a.pos.x<-10,gB=to.x<-10; if(gA!==gB) return [new V3(-10,0,.0),to]; if(gA) return [to]; return ((a.pos.z<-1)!==(to.z<-1))?[W_CLEAN,to]:[to]; };
function staffAI(a,dt){
  if(a.path.length){ a.follow(dt); return; }
  a.moving=false; a.wait+=dt; const cap=a.capacity();
  const LN=LINES[a.line||0];
  if(a.role==='cashier'){ if(!at(a,LN.cash)) go(a,[LN.cash]); else a.face=Math.PI; }
  else if(a.role==='barista'){
    if(a.job==='drop'){ if(!at(a,LN.drop)) go(a,[LN.drop]); else { a.face=Math.PI; if(!a.carry.length){ a.job='pick'; a.mach=null; } } }
    else{
      let m=a.mach; if(!m||!at(a,m.zp)){ m=a.mach=bestMachine(a,LN.i); if(m&&!at(a,m.zp)){ go(a,[m.zp]); return; } }
      if(!m) return; a.face=Math.PI;
      if(a.carry.length>=cap||(a.carry.length>0&&((m.pile===0&&a.wait>.6)||a.wait>4))){ if(LN.count<COUNTER_MAX){ a.job='drop'; go(a,[LN.drop]); } }
      else if(!a.carry.length&&m.pile===0&&a.wait>1.2){ const b=bestMachine(a,LN.i); if(b&&b!==m&&b.pile>0){ a.mach=b; go(a,[b.zp]); } }
    }
  }
  else if(a.role==='packer'){
    if(a.carryType==='bag'){ if(at(a,P_POUT)&&a.carry.length<cap&&R.bagOut>0) return; if(!at(a,P_DEL)) go(a,[P_DEL]); else a.face=Math.PI/2; }
    else if(a.carryType==='cup'){ const m=machines.find(m=>m.unlocked&&m.line===0&&at(a,m.zp)); if(m&&a.carry.length<cap&&m.pile>0&&R.packIn+a.carry.length<PACK_MAX&&a.wait<3) return; if(!at(a,P_PIN)) go(a,[P_PIN]); else a.face=Math.PI; }
    else{
      if(R.bagOut>0&&R.shelf<SHELF_MAX){ if(!at(a,P_POUT)) go(a,[P_POUT]); }
      else if(R.packIn<PACK_MAX){ const m=bestMachine(a); if(m&&m.pile>0&&!at(a,m.zp)) go(a,[m.zp]); }
    }
  }
  else if(a.role==='cleaner'){
    const LT=tables.filter(T=>T.line===LN.i), rt=to=>LN.i===0?via(a,to):[to];
    const atT=LT.find(T=>at(a,T.ap));
    if(a.carryType==='trash'){ if(atT&&atT.dirty&&a.carry.length<cap) return; if(!at(a,LN.bin)) go(a,rt(LN.bin)); }
    else{ const d=LT.find(T=>T.unlocked&&T.dirty); if(d){ if(!at(a,d.ap)) go(a,rt(d.ap)); } else if(!at(a,LN.cidle)) go(a,rt(LN.cidle)); }
  }
  else if(a.role==='manager'){
    if(!at(a,LN.mgr)){ go(a,[LN.mgr]); return; }
    a.face=-Math.PI/2; a.ct=(a.ct||0)+dt;

function botInput(){
  const tg=botTarget(),px=player.pos.x,pz=player.pos.z; let tx=tg.x,tz=tg.z;
  const fz=z=>z>-3?'F':'B';
  if(fz(pz)!==fz(tz)&&Math.abs(px)<3.2+(fz(pz)==='F'?0:0)){ const az=pz>-3?Math.max(pz,-1.8):Math.min(pz,-4.3); if(Math.hypot(px-3.3,pz-az)>.35&&Math.abs(px-3.3)>.3){tx=3.3;tz=az;} else {tx=3.3;tz=tg.z;} }
  const dx=tx-px,dz=tz-pz,l=Math.hypot(dx,dz); if(l<.08) return [0,0];

   ========================================================= */
let resetting=false;
function save(){ if(!player||resetting) return; try{ if(TEST_BUILD) save.n=(save.n||0)+1; localStorage.setItem(KEY,JSON.stringify({v:1,earned:Math.floor(S.earned),shopName:S.shopName,money:Math.floor(S.money+LINES.reduce((s,L2)=>s+L2.money.value,0)+(moneyDel?moneyDel.value:0)),unlocked:S.unlocked,padPaid:S.padPaid,up:S.up,tut:S.tut,served:S.served,counters:LINES.map(L2=>L2.count),time:Date.now(),lang,muted})); }catch(e){ dbg('save: '+e.message); } }
addEventListener('visibilitychange',()=>{ if(document.hidden) save(); });
addEventListener('pagehide',save);
function load(){
  if(!saved||saved.v!==1) return;
  S.money=saved.money||0; S.earned=saved.earned||0; S.shopName=saved.shopName||''; Object.assign(S.up,saved.up||{}); S.padPaid=saved.padPaid||{}; S.tut=saved.tut||0; S.served=saved.served||0; LINES[0].count=Math.min(COUNTER_MAX,saved.counter||0); LINES[1].count=Math.min(COUNTER_MAX,saved.counter1||0); if(saved.counters) saved.counters.forEach((c,i)=>{ if(LINES[i]) LINES[i].count=Math.min(COUNTER_MAX,c||0); });
  for(const p of PADS) if(saved.unlocked&&saved.unlocked[p.id]){ try{ unlock(p.id,false); }catch(e){ dbg('load '+p.id+': '+e.message); } }
  for(const a of staff){ const LN=LINES[a.line||0]; const tgt=a.role==='cashier'?LN.cash:a.role==='cleaner'?LN.cidle:a.role==='packer'?P_PIN:a.role==='manager'?LN.mgr:LN.drop; a.pos.set(tgt.x,0,tgt.z); }
}

/* =========================================================
   18. VÒNG LẶP
   ========================================================= */
let playing=false,perfT=0,spawnT=1.5,saveT=0,goalT=0,upT=0;
function spawnInterval(L2){ return spawnBase(L2)/((1+.08*S.up.ads)*(RUSH.t>0?2.2:1)); }
function spawnBase(L2){ const tn=tables.filter(T=>T.unlocked&&T.line===L2.i).length,mn=machines.filter(m=>m.unlocked&&m.line===L2.i).length; const f=1+.2*tn+.18*(mn-1)+(S.unlocked.neon?.35:0)+(S.unlocked.plant?.15:0)+(S.unlocked.fountain?.35:0)+(L2.shop&&S.unlocked[L2.shop.key+'_decor']?.4:0)+(L2.shop?((S.unlocked[L2.shop.key+'_cashier']?.25:0)+(S.unlocked[L2.shop.key+'_barista']?.2:0)):0)+(L2.i?((S.unlocked.kcashier?.25:0)+(S.unlocked.kbarista?.2:0)):((S.unlocked.cashier?.25:0)+(S.unlocked.barista?.2:0))); return Math.max(1.5,6.5/f); }
function update(dt){
  perfT+=dt;
  // máy pha
  const mIv=2.3*Math.pow(.8,S.up.machine);
  for(const m of machines){ if(!m.unlocked) continue; if(m.pile<MPILE_MAX){ m.timer+=dt; if(m.timer>=mIv){ m.timer=0; m.pile++; m.vis.set(m.pile); m.hop=1; } } m.fullL.show=m.pile>=MPILE_MAX; m.hop=Math.max(0,m.hop-dt*4); const h=Math.sin(m.hop*Math.PI)*m.hop; m.g.scale.set(1+.05*h,1-.06*h,1+.05*h); }
  // đóng gói
  if(pack.unlocked){ if(R.packIn>0&&R.bagOut<BAG_MAX){ pack.timer+=dt; if(pack.timer>=1.1*Math.pow(.85,S.up.machine)){ pack.timer=0; R.packIn--; R.bagOut++; pack.inP.set(R.packIn); pack.outP.set(R.bagOut); pack.hop=1; } } pack.hop=Math.max(0,pack.hop-dt*4); const h=Math.sin(pack.hop*Math.PI)*pack.hop; pack.g.scale.set(1+.04*h,1-.05*h,1+.04*h); }
  // khách
  for(const L2 of LINES){ if(!L2.unlocked) continue; L2.spawnT-=dt; if(L2.spawnT<=0){ if(L2.queue.length<(L2.i>=2?7:8)&&customers.length<60) new Customer(L2); L2.spawnT=spawnInterval(L2)*(.75+Math.random()*.5); } }
  if(pack.unlocked){ if(!shipper){ shipT-=dt; if(shipT<=0) shipper=new Shipper(); } else { shipper.update(dt); if(shipper.dead){ shipper.dispose(); shipper=null; shipT=5+Math.random()*5; } } }
  // người chơi & nhân viên
  if(player) playerUpdate(dt);
  for(const a of staff) staffAI(a,dt);
  for(const z of zones){ z.on=z.active(); if(z.marker) z.marker.visible=z.on; }
  for(const L2 of LINES) L2.cashier=false;
  const workers=[player,...staff];
  for(const a of workers){ for(const z of zones){ if(!z.on) continue; if(Math.abs(a.pos.x-z.x)<z.hw&&Math.abs(a.pos.z-z.z)<z.hd){ zoneStay(a,z,dt); if(a===player) z.hot=1; } else if(a.t[z.id]!==undefined) delete a.t[z.id]; } }
  for(const z of zones){ if(z.marker){ z.hot=Math.max(0,z.hot-dt*3); const s=1+.08*z.hot+(z.type==='table'?Math.sin(perfT*6)*.04:0); z.marker.scale.set(s,s,1); } }
  // khu nâng cấp
  const inUp=Math.abs(player.pos.x-W.upZone.x)<W.upZone.hw&&Math.abs(player.pos.z-W.upZone.z)<W.upZone.hd;
  if(inUp&&!upOpen&&!upLatch){ upOpen=true; renderUps(); openSheet('upPanel'); sfx('click'); }
  if(!inUp){ upLatch=false; if(upOpen){ upOpen=false; closeSheet('upPanel'); } }
  if(upOpen){ upT+=dt; if(upT>.4){ upT=0; renderUps(); } }
  if(!$('upPanel').classList.contains('show')) upOpen=upOpen&&inUp&&!upLatch;
  // phục vụ
  for(const L2 of LINES){ const front=L2.queue[0];
    if(front&&L2.cashier&&L2.count>0&&front.state==='queue'&&!front.a.path.length&&front.got<front.want){
      front.st=(front.st||0)+dt;
      if(front.st>.3){ front.st=0; L2.count--; const from=L2.pile.top(L2.count); L2.pile.set(L2.count); front.got++; front.a.addCarry(L2.prod,from); sfx('serve'); if(front.got>=front.want) front.served(); }
    } }
  for(let i=customers.length-1;i>=0;i--){ const c=customers[i]; c.update(dt); if(c.dead){ c.dispose(); customers.splice(i,1); } }
  // pad
  for(const p of PADS){ const av=padAvail(p); if(av&&!p.g.visible){ p.g.visible=true; popIn(p.g); } if(!av) p.g.visible=false; p.lbl.show=av;
    if(av){ const paid=S.padPaid[p.id]||0,rem=Math.ceil(p.cost-paid); p.fill.scale.x=Math.max(.001,paid/p.cost*1.1); const key=rem+'|'+(S.money>=rem)+'|'+lang;
      if(p.lblKey!==key){ p.lblKey=key; p.lbl.el.className='lbl pad'+(S.money>=rem?' ok':''); setHTML(p.lbl,`<div class="pn">${p.icon} ${padName(p)}</div><div class="pc">💵 ${fmt(rem)}</div>`); } } }
  // tiền trên khay
  for(const mp of [...LINES.map(L2=>L2.money),moneyDel]) mp.pile.set(Math.min(40,Math.ceil(mp.value/4)));
  // hoạt ảnh
  player.animate(dt); for(const a of staff) a.animate(dt);
  for(let i=flies.length-1;i>=0;i--){ const f=flies[i]; f.t+=dt; const k=Math.min(1,f.t/f.dur),to=f.toFn(); f.m.position.lerpVectors(f.from,to,k); f.m.position.y+=Math.sin(k*Math.PI)*.9; if(k>=1){ scene.remove(f.m); flies.splice(i,1); f.onLand&&f.onLand(); } }
  for(let i=pops.length-1;i>=0;i--){ const p=pops[i]; p.t+=dt; const k=Math.min(1,p.t/.45); const e=k===1?1:1-Math.pow(2,-10*k)*Math.cos(k*Math.PI*3.2); p.g.scale.setScalar(Math.max(.01,e)); if(k>=1){ p.g.scale.setScalar(1); pops.splice(i,1); } }
  for(let i=confetti.length-1;i>=0;i--){ const c=confetti[i]; c.life-=dt; c.vy-=14*dt; c.m.position.x+=c.vx*dt; c.m.position.y=Math.max(.02,c.m.position.y+c.vy*dt); c.m.position.z+=c.vz*dt; c.m.rotation.x+=dt*8; c.m.rotation.z+=dt*6; if(c.life<=0){ scene.remove(c.m); confetti.splice(i,1); } }
  for(let i=floats.length-1;i>=0;i--){ const f=floats[i]; f.life-=dt; f.l.pos.y+=dt*1.3; f.l.el.style.opacity=Math.min(1,f.life*2); if(f.life<=0){ killLabel(f.l); floats.splice(i,1); } }
  goalT-=dt; if(goalT<=0){ goalT=.15; tutorial(); } else if(arrow.visible){ arrow.position.y=2.4+Math.sin(perfT*5)*.2; pointer.position.set(player.pos.x,.08,player.pos.z); }
  if(TEST_BUILD&&S.money<999999) S.money=999999;
  moneyUI(); lbTick(dt); rushTick(dt);
  saveT+=dt; if(saveT>4){ saveT=0; save(); }
}
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const raw=(now-last)/1000; const dt=Math.min(.05,raw); last=now; if(raw<.5) adaptQuality(raw);
  if(playing){ try{ if(BOT){ update(dt); update(dt); } else update(dt); }catch(e){ if(!frame.errd){ frame.errd=1; dbg('update: '+e.message+'\n'+(e.stack||'').split('\n').slice(0,4).join('\n')); } } } else { perfT+=dt; player.animate(dt); }
  camUpdate(dt);
  updateLabels();
  renderer.render(scene,camera);
}

/* =========================================================
   19. KHỞI ĐỘNG
   ========================================================= */
buildWorld(); buildStations(); unlockMachine0();
player=new Agent('player',{skin:'#ffdbb4',shirt:'#ff8fab',pants:'#3d5a80',shoe:'#ffffff',style:'cap',hat:'#ff5d8f',apron:'#ffffff'},-4,-1); player.face=Math.PI;
queue=LINES[0].queue;
load(); for(const m of machines) if(m.unlocked){ m.pile=3; m.vis.set(3); } LINES.forEach(L2=>L2.pile.set(L2.count));
resize(); camUpdate(0,true);
window.__ready=true; $('err').style.display='none';
if(TEST_BUILD){ const b=document.createElement('div'); b.textContent='TEST ∞'; b.style.cssText='position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 6px);transform:translateX(-50%);z-index:6;background:#e63946;color:#fff;font-weight:800;font-size:12px;padding:2px 10px;border-radius:999px;pointer-events:none'; document.body.appendChild(b);
  const u=document.createElement('button'); u.textContent='⚡ Mở hết'; u.style.cssText='position:fixed;left:calc(env(safe-area-inset-left) + 10px);bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:6;background:#5e548e;color:#fff;font-weight:800;font-size:14px;padding:8px 12px;border-radius:12px;box-shadow:0 3px 0 #3d2c4e';
  u.addEventListener('click',()=>{ let n=0; for(let k=0;k<20;k++) for(const p of PADS) if(padAvail(p)){ unlock(p.id,false); n++; } S.tut=7; sfx('unlock'); toast('⚡ '+n); save(); });
  document.body.appendChild(u); }
applyLang(); $('playBtn').disabled=false;
$('playBtn').addEventListener('click',()=>{ audio(); sfx('unlock'); $('start').style.display='none'; playing=true; offlineEarnings(); $('goal').style.display=''; canvas.focus(); });
requestAnimationFrame(frame);
window.__game={S,R,player,machines,tables,queue,staff,unlock};
</script>
