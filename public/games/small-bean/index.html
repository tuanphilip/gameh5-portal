function detectLang(){
 try{
  const list=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||"en"]).map(s=>String(s).toLowerCase());
  for(const s of list){
   const b=s.split("-")[0];
   if(b==="tl"||b==="fil")return"fil";
   if(b==="in")return"id";
   if(b==="zh")return"zh";
   if(T[b])return b;
  }
 }catch(e){}
 return"en";
}

let AC=null;
function beep(f=440,d=.08,type="sine",v=.12,slide=0){
 if(!save.sound)return;
 try{
  if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==="suspended"&&!paused)AC.resume();
  const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);
 }catch(e){}
}

// ---------- rng / level ----------
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function applyOp(n,g){if(g.op==="+")return n+g.v;if(g.op==="-")return n-g.v;if(g.op==="x")return n*g.v;return Math.floor(n/g.v)}
function genLevel(lv){
 const r=rng(lv*9973+17);
 const len=Math.min(110+lv*8,270);
 const ev=[];let est=startCount(),z=16,first=true;
 const good=()=>{const q=r();if(q<.55)return{op:"+",v:5+Math.floor(r()*(8+lv*2))};if(q<.9)return{op:"x",v:2};return{op:"x",v:3}};
 const bad=()=>r()<.6?{op:"-",v:Math.max(1,Math.min(Math.floor(est*.5),3+Math.floor(r()*(5+lv*2))))}:{op:"/",v:2};
 while(z<len-12){
  let t=first?"gate":(r()<.48?"gate":(r()<.55?"enemy":"hazard"));
  if(lv===1&&t==="hazard")t="gate";
  first=false;
  if(t==="gate"){
   let a=good(),b=(ev.length>0&&r()<.78)?bad():good();if(r()<.5)[a,b]=[b,a];
   ev.push({t:"gate",z,A:a,B:b,used:false});
   est=Math.min(4000,Math.max(applyOp(est,a),applyOp(est,b)));
  }else if(t==="enemy"){
   const n=Math.max(3,Math.round(est*(lv<=2?.18+r()*.15:.28+r()*.25+Math.min(lv,25)*.01)));
   est-=n;ev.push({t:"enemy",z,n,x:(r()-.5)*1.6,dead:false});
  }else{
   if(r()<.55)ev.push({t:"saw",z,amp:ROAD-.9,w:1.4+r()*1.4+lv*.03,ph:r()*6});
   else{const side=r()<.5?-1:1;const x0=side<0?-ROAD:ROAD*-.05,x1=side<0?ROAD*.05:ROAD;ev.push({t:"spike",z,x0,x1,len:2.2})}
   est=Math.round(est*.85);
  }
  z+=15+r()*6;
 }
 const bossHP=Math.max(6,Math.round(est*(.42+Math.min(lv,30)*.012)));
 const stepCost=Math.max(1,Math.round((est-bossHP)/9));
 return{len,ev,bossHP,stepCost};
}

 const target=Math.max(0,Math.min(G.count,MAXV));
 while(G.units.length<target)G.units.push(newUnit());
 while(G.units.length>target){const u=G.units.pop();burst(G.lx+u.x,G.crowdY+.4,G.pz+u.z,curSkin().c,4)}
}
const crowdR=()=>.34*Math.sqrt(Math.max(1,G.units.length));

 for(let i=0;i<n;i++)G.parts.push({x,y,z,vx:(Math.random()-.5)*4,vy:2+Math.random()*3,vz:(Math.random()-.5)*4,life:.5+Math.random()*.3,c,r:.07+Math.random()*.07});

// ---------- update (logic) ----------
function update(dt){
 if(popCD>0)popCD-=dt;
 if(!G)return;
 G.t+=dt;
 if(location.hash==="#demo"&&state==="run")autopilot();
 const R=crowdR();
 if(state==="run"||state==="fight"||state==="boss"){
  if(inputDir)G.lx+=inputDir*9*dt;
  const lim=Math.max(0,ROAD-.35-R*.9);G.lx=Math.max(-lim,Math.min(lim,G.lx));
 }
 let speed=0;
 if(state==="run")speed=9+Math.min(save.level,20)*.08;
 if(state==="steps")speed=6;
 G.pz+=speed*dt;
 G.units.forEach((u,i)=>{let[tx,tz]=spiral(i,.34);if(state==="boss")tz+=1.2;const k=Math.min(1,dt*9);u.x+=(tx-u.x)*k;u.z+=(tz-u.z)*k;u.ph+=dt*(speed>0?14:3)});

 if(state==="run"){
  for(const e of G.d.ev){
   if(e.t==="gate"&&!e.used&&G.pz>=e.z){
    e.used=true;const g=G.lx<0?e.A:e.B;const before=G.count;
    G.count=Math.max(0,Math.min(9999,applyOp(G.count,g)));
    const goodG=G.count>=before;
    floatText((goodG?"+":"")+(G.count-before),goodG?"#2fd15a":"#ff4a4a");
    if(goodG){beep(520,.1,"square",.07,400);beep(780,.12,"triangle",.06,300)}else{beep(240,.2,"sawtooth",.07,-120);buzz(40)}
    if(e.obj)e.obj.visible=false;
    syncUnits();if(G.count<=0)return lose();
   }
   if(e.t==="enemy"&&!e.dead){const eR=.34*Math.sqrt(Math.max(1,e.units.length));if(G.pz+R*.7>=e.z-eR*.7){state="fight";G.fightE=e;G.tick=0}}
   if(e.t==="saw"&&Math.abs(e.z-G.pz)<R+1.5){
    const sx=e.amp*Math.sin(G.t*e.w+e.ph);
    for(let i=G.units.length-1;i>=0;i--){const u=G.units[i];const dx=G.lx+u.x-sx,dz=G.pz+u.z-e.z;if(dx*dx+dz*dz<.45)killUnit(i)}
    if(G.count<=0)return lose();
   }
   if(e.t==="spike"&&G.pz+R>e.z&&G.pz-R<e.z+e.len){
    for(let i=G.units.length-1;i>=0;i--){const u=G.units[i];const wx=G.lx+u.x,wz=G.pz+u.z;if(wz>e.z&&wz<e.z+e.len&&wx>e.x0&&wx<e.x1)killUnit(i)}
    if(G.count<=0)return lose();
   }
  }
  if(G.units.length<Math.min(G.count,MAXV))syncUnits();
  if(G.pz+R+3.4>=G.bossZ){state="boss";G.tick=0;toast(L().boss);beep(110,.5,"sawtooth",.1,-40)}
 }
 else if(state==="fight"){
  const e=G.fightE;G.tick+=dt;G.shake=.15;
  while(G.tick>.05){
   G.tick-=.05;
   let k=Math.max(1,Math.ceil(Math.min(G.count,e.n)/18));k=Math.min(k,G.count,e.n);
   G.count-=k;e.n-=k;
   for(let j=0;j<Math.min(k,3);j++){const u=e.units[e.units.length-1-j];if(u)burst(e.x+u.x,.4,e.z+u.z,ENEMY.c,3)}
   syncGroup(e.units,Math.min(e.n,MAXE));syncUnits();popSnd();
   if(e.n<=0){e.dead=true;state="run";beep(660,.15,"triangle",.08,300);break}
   if(G.count<=0)return lose();
  }
  e.z=Math.max(G.pz+R*.6+.34*Math.sqrt(Math.max(1,e.units.length))*.6,e.z-dt*3);
 }
 else if(state==="boss"){
  G.tick+=dt;G.shake=.12;
  while(G.tick>.06&&G.bossHP>0&&G.count>0){
   G.tick-=.06;
   let k=Math.max(1,Math.ceil(Math.min(G.count,G.bossHP)/22));k=Math.min(k,G.count,G.bossHP);
   G.count-=k;G.bossHP-=k;
   const u=G.units[G.units.length-1];
   if(u)G.parts.push({x:G.lx+u.x,y:.5,z:G.pz+u.z,vx:(-G.lx-u.x)*1.5,vy:6,vz:(G.bossZ-G.pz-u.z)*1.6,life:.55,c:curSkin().c,r:.2});
   syncUnits();popSnd();
  }
  if(G.bossHP<=0){state="steps";G.bossDead=.001;G.step=-1;burst(0,2.5,G.bossZ,"#3a3442",40);burst(0,2.5,G.bossZ,"#ffd23d",30);beep(880,.3,"square",.08,500);buzz(80)}
  else if(G.count<=0)return lose();
 }
 else if(state==="steps"){
  G.bossDead+=dt;
  const s0=G.bossZ+5,idx=Math.floor((G.pz-s0)/2.2);
  if(idx>G.step&&idx>=0&&idx<10){
   G.step=idx;G.count-=G.d.stepCost;
   if(G.count<=0){G.count=0;syncUnits();G.mult=idx===0?1:+(1+idx*.2).toFixed(1);return win()}
   syncUnits();beep(400+idx*60,.08,"triangle",.07);
  }
  if(G.step>=0)G.crowdY+=((G.step+1)*.5-G.crowdY)*Math.min(1,dt*10);
  if(idx>=10){G.mult=3;return win()}
 }
 else if(state==="win"&&G.bossDead)G.bossDead+=dt;

 for(let i=G.parts.length-1;i>=0;i--){const p=G.parts[i];p.life-=dt;if(p.life<=0){G.parts.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.vy-=12*dt;if(p.y<0){p.y=0;p.vy*=-.3}}
 for(let i=G.floats.length-1;i>=0;i--){G.floats[i].life-=dt;if(G.floats[i].life<=0)G.floats.splice(i,1)}
 if(G.shake>0)G.shake-=dt;
 updHud();
}

/* demo autopilot (open the page with #demo) */
function autopilot(){
 let tgt=G.lx;
 const next=G.d.ev.find(e=>e.z>G.pz-1&&!(e.t==="gate"&&e.used)&&!(e.t==="enemy"&&e.dead));
 if(next&&next.z-G.pz<14){
  if(next.t==="gate")tgt=applyOp(G.count,next.A)>applyOp(G.count,next.B)?-3:3;
  if(next.t==="spike")tgt=next.x0<-1?3:-3;
  if(next.t==="saw"){const sx=next.amp*Math.sin(G.t*next.w+next.ph);tgt=sx>0?-2.5:2.5}
 }
 G.lx+=(tgt-G.lx)*.08;moved=true;document.getElementById("hint").style.display="none";
}
// ---------- render 3D ----------
let V3;
function proj(x,y,z){V3.set(X(x),y,z).project(camera);if(V3.z>1||V3.z<-1)return null;return{x:(V3.x+1)/2*W,y:(1-V3.y)/2*H}}
let menuT=0;
function render(dt){
 if(!ready)return;
 beginInst();
 if(G){
  camZ=G.pz-camBack;
  camX+=(G.lx*.35-camX)*Math.min(1,dt*5);
  camYoff+=(G.crowdY-camYoff)*Math.min(1,dt*4);
  const sh=G.shake>0?(Math.random()-.5)*.12:0;
  camera.position.set(X(camX)+sh,camH+camYoff+sh,camZ);
  camera.lookAt(X(camX*.6),camYoff+.5,G.pz+8);
  const run=state==="run"||state==="steps";
  // player squad
  const sk=curSkin();
  for(const u of G.units){
   const mood=state==="win"?"cheer":"happy";
   bean(G.lx+u.x,G.crowdY,G.pz+u.z,state==="win"?Math.PI:0,1,sk,mood,u.ph,run,state==="fight"||state==="boss"?.25:0);
  }
  // enemies
  for(const e of G.d.ev){
   if(e.t==="enemy"&&!e.dead&&e.z<camZ+110&&e.z>camZ-2){
    const fighting=state==="fight"&&G.fightE===e;
    for(const u of e.units){u.ph+=dt*(fighting?14:2.5);bean(e.x+u.x,0,e.z+u.z,Math.PI,1,ENEMY,"angry",u.ph,fighting,fighting?-.25:0)}
   }
   if(e.t==="saw"&&e.blade){e.blade.position.x=X(e.amp*Math.sin(G.t*e.w+e.ph));e.blade.rotation.z+=dt*12}
  }
  // boss
  const bd=G.bossDead?Math.min(1,G.bossDead/1.1):0;
  if(bd<1){
   const s=(3.2+2.2*G.bossHP/G.bossMax)*(1-bd);
   const wob=state==="boss"?Math.sin(G.t*30)*.05:0;
   bean(0,0,G.bossZ,Math.PI+bd*12,s*(1+wob),BOSS,"angry",G.t*3,false,0);
  }
  // particles
  const PI_=IMS.part;
  for(const p of G.parts){if(PI_.n>=600)break;tmpObj.position.set(X(p.x),p.y,p.z);tmpObj.rotation.set(0,0,0);tmpObj.scale.setScalar(p.r);tmpObj.updateMatrix();PI_.m.setMatrixAt(PI_.n,tmpObj.matrix);PI_.m.setColorAt(PI_.n,C(p.c));PI_.n++}
 }else{
  // menu idle scene: a little squad dancing
  menuT+=dt;camZ=-6;
  camera.position.set(0,2.6,-6);camera.lookAt(0,1,0);
  const sk=curSkin();
  for(let i=0;i<7;i++){const a=i/7*Math.PI*2+menuT*.4;bean(Math.cos(a)*2.4,0,Math.sin(a)*2.4+2,Math.PI,1.2,i%3===0?ENEMY:sk,i%3===0?"angry":"happy",menuT*8+i,true,0)}
 }
 // ground & sky follow
 ground.position.z=Math.floor(camZ/8)*8+150;
 for(const c of clouds){if(c.hill){c.o.position.z=camZ+c.dz}else{c.o.position.z=camZ+c.dz;c.o.position.x+=dt*c.sp;if(c.o.position.x>70)c.o.position.x=-70}}
 endInst();
 renderer.render(scene,camera);
 drawUI();
}
// 2D overlay: number bubbles, floats, boss HP
function bubble(p,n,col,fs){
 uctx.font=`900 ${fs}px Trebuchet MS,Arial,sans-serif`;const t=String(n);const w=uctx.measureText(t).width+fs*.9;
 uctx.fillStyle=col;rr(p.x-w/2,p.y-fs*.75,w,fs*1.4,fs*.5);uctx.fill();
 uctx.beginPath();uctx.moveTo(p.x-fs*.25,p.y+fs*.64);uctx.lineTo(p.x+fs*.25,p.y+fs*.64);uctx.lineTo(p.x,p.y+fs*.95);uctx.fill();
 uctx.fillStyle="#fff";uctx.textAlign="center";uctx.textBaseline="middle";uctx.fillText(t,p.x,p.y-fs*.02);uctx.textBaseline="alphabetic";
}
function rr(x,y,w,h,r){uctx.beginPath();uctx.moveTo(x+r,y);uctx.arcTo(x+w,y,x+w,y+h,r);uctx.arcTo(x+w,y+h,x,y+h,r);uctx.arcTo(x,y+h,x,y,r);uctx.arcTo(x,y,x+w,y,r);uctx.closePath()}
function drawUI(){
 uctx.clearRect(0,0,W,H);
 if(!G)return;
 const fsAt=z=>Math.max(16,Math.min(34,330/Math.max(1,z-camZ)));
 for(const e of G.d.ev){
  if(e.t==="enemy"&&!e.dead&&e.z<camZ+90&&e.z>camZ){const p=proj(e.x,1.5,e.z);if(p)bubble(p,e.n,"#e04848",fsAt(e.z))}
 }
 if(G.count>0){const p=proj(G.lx,G.crowdY+1.55,G.pz);if(p)bubble(p,G.count,"#2c9a47",fsAt(G.pz))}
 // boss HP
 if(!G.bossDead&&G.bossZ<camZ+95){
  const s=3.2+2.2*G.bossHP/G.bossMax;const p=proj(0,s*1.12+.6,G.bossZ);
  if(p){const bw=Math.max(90,Math.min(200,1400/(G.bossZ-camZ))),bh=13,bx=p.x-bw/2,by=p.y-18;
   uctx.fillStyle="rgba(0,0,0,.45)";rr(bx-2,by-2,bw+4,bh+4,8);uctx.fill();
   uctx.fillStyle="#ff4a4a";if(G.bossHP>0){rr(bx,by,bw*Math.max(.04,G.bossHP/G.bossMax),bh,6);uctx.fill()}
   uctx.font="900 14px Trebuchet MS,Arial,sans-serif";uctx.textAlign="center";uctx.lineWidth=3;uctx.strokeStyle="#222";uctx.fillStyle="#fff";
   uctx.strokeText(String(G.bossHP),p.x,by+11);uctx.fillText(String(G.bossHP),p.x,by+11);}
 }
 const pc=proj(G.lx,G.crowdY+2.5,G.pz);
 if(pc)for(const f of G.floats){
  uctx.globalAlpha=Math.min(1,f.life*2);uctx.font="900 34px Trebuchet MS,Arial,sans-serif";uctx.textAlign="center";
  const y=pc.y-(1.1-f.life)*60;uctx.lineWidth=6;uctx.strokeStyle="#fff";uctx.strokeText(f.txt,pc.x,y);uctx.fillStyle=f.c;uctx.fillText(f.txt,pc.x,y);uctx.globalAlpha=1;
 }
}

// ---------- HUD / UI ----------
const $=id=>document.getElementById(id);
function updHud(){
 $("lvl").textContent=L().lvl+" "+save.level;$("coins").textContent="🪙 "+save.coins;$("snd").textContent=save.sound?"🔊":"🔇";
 $("bPause").classList.toggle("on",!!G&&["run","fight","boss","steps"].includes(state)&&!paused);
 if(G)$("progf").style.width=Math.min(100,G.pz/G.bossZ*100)+"%";else $("progf").style.width="0%";
}
function show(id){["menu","shop","win","lose","pause"].forEach(o=>$(o).classList.toggle("on",o===id))}
function refreshMenu(){
 const t=L();
 $("bPlay").textContent=ready?t.play:(window.THREE?t.load:t.fail);$("bPlay").style.fontSize=(ready||window.THREE)?"":"14px";$("bShop").textContent=t.shop;$("bUp").textContent=t.up+" 🪙"+upCost();
 $("upInfo").textContent=t.upInfo(startCount(),upCost());$("menuLvl").textContent=t.menuLvl(save.level);
 $("hintTxt").textContent=t.hint;$("shopT").textContent=t.shop;$("bBack").textContent=t.back;
 $("winT").textContent=t.win;$("loseT").textContent=t.lose;$("bNext").textContent=t.next;$("bRetry").textContent=t.retry;$("bHome").textContent=t.home;$("bX2").textContent=t.x2;$("loseTip").textContent=t.tip;
 $("t1").textContent=t.t1;$("t2").textContent=t.t2;$("pauseT").textContent=t.pause;$("bResume").textContent=t.resume;$("bPHome").textContent=t.home;$("rot").textContent="📱 "+t.rotate;
 document.documentElement.lang=save.lang;document.documentElement.dir=save.lang==="ar"?"rtl":"ltr";
 const ls=$("langSel");if(!ls.options.length){LANGS.forEach(([k,lab])=>{const o=document.createElement("option");o.value=k;o.textContent=lab;ls.appendChild(o)});ls.onchange=()=>{save.lang=ls.value;persist();refreshMenu()}}
 ls.value=save.lang;ls.setAttribute("aria-label",t.lang);
 const m=$("mascot").getContext("2d");m.clearRect(0,0,240,220);drawBean(m,120,92,48,curSkin(),"happy");
 updHud();
}
function buildShop(){
 $("shopCoins").textContent="🪙 "+save.coins;
 const box=$("skins");box.innerHTML="";
 SKINS.forEach((s,i)=>{
  const d=document.createElement("div");d.className="sk"+(save.skin===i?" sel":"");
  const c=document.createElement("canvas");c.width=128;c.height=128;drawBean(c.getContext("2d"),64,56,26,s,"happy");
  const lab=document.createElement("div");const own=save.owned.includes(i);
  lab.textContent=save.skin===i?L().equipped:own?L().equip:"🪙"+s.price;
  d.appendChild(c);d.appendChild(lab);
  d.onclick=()=>{
   if(own){save.skin=i}
   else if(save.coins>=s.price){save.coins-=s.price;save.owned.push(i);save.skin=i;toast(L().bought);beep(700,.15,"triangle",.08,400)}
   else{toast(L().nocoin);beep(200,.15,"sawtooth",.06);return}
   persist();buildShop();refreshMenu();
  };
  box.appendChild(d);
 });
}
let winCoins=0,x2used=false;
function win(){
 state="win";winCoins=Math.round((20+save.level*5)*G.mult);
 save.coins+=winCoins;save.level++;persist();x2used=false;
 $("winMult").textContent=L().mult(G.mult.toFixed(1));$("winCoins").textContent="+"+winCoins+" 🪙";$("bX2").style.display="block";
 setTimeout(()=>{show("win");beep(660,.12,"square",.07);setTimeout(()=>beep(880,.2,"square",.07),120)},900);
 $("hint").style.display="none";updHud();
}
function lose(){
 state="lose";G.count=0;syncUnits();buzz(120);beep(200,.4,"sawtooth",.08,-120);
 $("hint").style.display="none";setTimeout(()=>show("lose"),700);
}
/* Rewarded-ad hook: replace window.HiHiAds.rewarded with your ad SDK. Call done() when the ad finishes. */
window.HiHiAds=window.HiHiAds||{rewarded:done=>done()};
const goHome=()=>{state="menu";G=null;if(world){world.visible=false}refreshMenu();show("menu")};
$("bPlay").onclick=()=>{if(!ready)return;show(null);startLevel();beep(520,.1,"triangle",.08,300)};
$("bShop").onclick=()=>{buildShop();show("shop")};
$("bBack").onclick=()=>{refreshMenu();show("menu")};
$("bUp").onclick=()=>{if(save.coins>=upCost()){save.coins-=upCost();save.up++;persist();toast(L().upd);beep(700,.15,"triangle",.08,400);refreshMenu()}else{toast(L().nocoin);beep(200,.15,"sawtooth",.06)}};
$("bNext").onclick=()=>{show(null);startLevel()};
$("bRetry").onclick=()=>{show(null);startLevel()};
$("bHome").onclick=goHome;
$("bX2").onclick=()=>{if(x2used)return;x2used=true;window.HiHiAds.rewarded(()=>{save.coins+=winCoins;persist();$("winCoins").textContent="+"+winCoins*2+" 🪙";$("bX2").style.display="none";updHud();beep(880,.2,"square",.07,400)})};
$("snd").onclick=()=>{save.sound=!save.sound;persist();updHud()};
function setPause(p){
 if(p&&(!G||!["run","fight","boss","steps"].includes(state)))return;
 paused=p;show(p?"pause":null);dragging=false;inputDir=0;
 if(AC){try{p?AC.suspend():AC.resume()}catch(e){}}
 lastT=performance.now();updHud();
}
$("bPause").onclick=()=>setPause(true);
$("bResume").onclick=()=>setPause(false);
$("bPHome").onclick=()=>{paused=false;goHome()};
document.addEventListener("visibilitychange",()=>{if(document.hidden){if(!paused)setPause(true);if(AC){try{AC.suspend()}catch(e){}}}});
addEventListener("blur",()=>{if(!paused)setPause(true)});
addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("gesturestart",e=>e.preventDefault());
document.addEventListener("dblclick",e=>e.preventDefault(),{passive:false});

// ---------- input ----------
ui.addEventListener("pointerdown",e=>{dragging=true;dragX=e.clientX;dragLx=G?G.lx:0;try{ui.setPointerCapture(e.pointerId)}catch(_){}});
ui.addEventListener("pointermove",e=>{if(!dragging||!G)return;G.lx=dragLx+(e.clientX-dragX)/Math.max(260,Math.min(W,H))*9;if(!moved&&Math.abs(e.clientX-dragX)>8){moved=true;$("hint").style.display="none"}});
const endDrag=()=>dragging=false;ui.addEventListener("pointerup",endDrag);ui.addEventListener("pointercancel",endDrag);
const keys={};
const dirK=()=>(keys.ArrowRight||keys.d||keys.D?1:0)-(keys.ArrowLeft||keys.a||keys.A?1:0);
addEventListener("keydown",e=>{keys[e.key]=1;inputDir=dirK();if(inputDir&&!moved){moved=true;$("hint").style.display="none"}});
addEventListener("keyup",e=>{keys[e.key]=0;inputDir=dirK()});

// ---------- boot ----------
let fpsAcc=0,fpsN=0;
function loop(t){
 const raw=Math.max(0,(t-lastT)/1000||0),dt=Math.min(.033,raw);lastT=t;
 if(!paused){
  try{update(dt);render(dt)}catch(err){console.error(err)}
  // adaptive resolution: keep phones smooth
  if(ready&&G&&state==="run"&&raw<.25){fpsAcc+=raw;fpsN++;
   if(fpsN>=90){const fps=fpsN/fpsAcc;
    if(fps<45&&qScale>.6){qScale=Math.max(.6,qScale-.15);applyDpr()}
    else if(fps>58&&qScale<1){qScale=Math.min(1,qScale+.1);applyDpr()}
    fpsAcc=0;fpsN=0}}
 }
 requestAnimationFrame(loop);
}
function boot(){
 try{
  renderer=new THREE.WebGLRenderer({canvas:cv,antialias:!IS_MOBILE,powerPreference:"high-performance",stencil:false});
  V3=new THREE.Vector3();
  initWorld();ready=true;resize();refreshMenu();
 }catch(err){console.error(err);$("bPlay").textContent=L().fail}
}
resize();refreshMenu();
window.__boot3d=()=>{boot();requestAnimationFrame(loop)};
if(window.THREE)window.__boot3d();

</script>
