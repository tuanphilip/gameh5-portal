<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Splash Wars HiHi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;-webkit-touch-callout:none;overscroll-behavior:none;background:#bfe4ff;font-family:'Baloo 2',system-ui,sans-serif;color:#fff}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hide{display:none!important}
#hud{position:fixed;inset:0;pointer-events:none}
#top{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;width:min(560px,92vw)}
#topRow{display:flex;align-items:center;gap:10px;width:100%;justify-content:center}
.roster{display:flex;gap:4px}
.ri{width:30px;height:30px;border-radius:9px;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;box-shadow:0 2px 0 rgba(0,0,0,.25);position:relative}
.ri.dead{filter:grayscale(1) brightness(.6)}
.ri.dead::after{content:'✕';position:absolute;font-size:20px;color:#fff}
.ri.me{outline:3px solid #ffe14d}
#timer{background:#1d2340;border:3px solid #fff;border-radius:14px;padding:0 14px;font-size:26px;font-weight:800;min-width:92px;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.3)}
#timer.warn{background:#d62839;animation:pulse .6s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
#cov{width:100%;height:16px;border-radius:10px;background:#e9e1cf;border:3px solid #fff;overflow:hidden;display:flex;position:relative;box-shadow:0 2px 0 rgba(0,0,0,.25)}
#covA{background:#ff7a12;height:100%;transition:width .3s}
#covMid{flex:1}
#covB{background:#9446ff;height:100%;transition:width .3s}
#covTxt{position:absolute;inset:0;display:flex;justify-content:space-between;padding:0 8px;font-size:12px;font-weight:800;line-height:10px;color:#1d2340}
#mini{position:absolute;top:8px;right:8px;width:180px;height:135px;border:3px solid #fff;border-radius:10px;background:#d8c8a6;box-shadow:0 3px 0 rgba(0,0,0,.25)}
#feed{position:absolute;top:152px;right:8px;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.fi{background:rgba(29,35,64,.85);padding:2px 10px;border-radius:9px;font-size:14px;font-weight:700;animation:fin .25s}
@keyframes fin{from{transform:translateX(30px);opacity:0}}
#stats{position:absolute;left:12px;bottom:12px;display:flex;gap:10px;align-items:flex-end}
.bar{width:150px}
.bar label{font-size:13px;font-weight:800;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.bt{height:16px;border-radius:9px;background:rgba(0,0,0,.35);border:3px solid #fff;overflow:hidden}
.bt i{display:block;height:100%;width:100%;transition:width .1s}
#hpF{background:#3ccf5a}
#inkF{background:#ff7a12}
#spF{background:linear-gradient(90deg,#ffd23f,#ff4fa3)}
#spBox.ready .bt{animation:glow .5s infinite alternate}
@keyframes glow{to{box-shadow:0 0 14px 4px #ffe14d}}
#cross{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border:3px solid rgba(255,255,255,.9);border-radius:50%;box-shadow:0 0 0 2px rgba(0,0,0,.25)}
#cross::after{content:'';position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;background:#fff;border-radius:50%}
#cross.low{border-color:#ff4d4d}
#msg{position:absolute;left:0;right:0;top:30%;text-align:center;font-size:clamp(34px,7vw,72px);font-weight:800;color:#fff;-webkit-text-stroke:3px #1d2340;text-shadow:0 6px 0 rgba(0,0,0,.25);opacity:0;transition:opacity .2s}
#sub{position:absolute;left:0;right:0;top:calc(30% + 80px);text-align:center;font-size:22px;font-weight:800;color:#1d2340;opacity:0;transition:opacity .2s}
#help{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(29,35,64,.75);padding:3px 12px;border-radius:10px;font-size:13px;font-weight:600;white-space:nowrap}
#help b{background:#fff;color:#1d2340;border-radius:4px;padding:0 4px;margin:0 2px}
#inkWarn{position:absolute;left:50%;top:calc(50% + 26px);transform:translateX(-50%);font-weight:800;font-size:16px;color:#fff;-webkit-text-stroke:1px #1d2340}
#deadOv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(transparent 30%,rgba(29,35,64,.55));font-weight:800;text-align:center}
#deadOv h2{font-size:38px;-webkit-text-stroke:2px #1d2340}
#deadOv p{font-size:22px}
.scr{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,24,48,.45);z-index:20;padding:12px}
.card{background:#fffaf0;color:#1d2340;border-radius:22px;border:5px solid #1d2340;box-shadow:0 10px 0 rgba(0,0,0,.25);padding:20px 24px;max-width:560px;width:100%;max-height:96vh;overflow:auto;text-align:center}
.card h1{font-size:clamp(28px,6vw,44px);line-height:1;color:#ff7a12;-webkit-text-stroke:2px #1d2340;margin-bottom:2px}
.card h1 span{color:#9446ff}
.tag{font-weight:700;opacity:.8;margin-bottom:12px}
.card input{font:inherit;font-size:20px;font-weight:700;padding:6px 12px;border-radius:12px;border:3px solid #1d2340;width:100%;text-align:center;margin:4px 0 10px;-webkit-user-select:text;user-select:text}
.lbl{font-weight:800;font-size:15px;text-align:left}
.opts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:4px 0 12px}
.opt{border:3px solid #1d2340;background:#fff;border-radius:12px;padding:3px 10px;font:inherit;font-weight:700;cursor:pointer;color:#1d2340}
.opt.on{background:#ffe14d}
.btn{font:inherit;font-size:24px;font-weight:800;color:#fff;background:#ff7a12;border:4px solid #1d2340;border-radius:16px;padding:6px 26px;cursor:pointer;box-shadow:0 5px 0 #1d2340;margin:4px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #1d2340}
.btn.alt{background:#9446ff}
.how{font-size:14px;text-align:left;background:#f1e8d4;border-radius:12px;padding:8px 12px;margin-top:12px;line-height:1.45}
.how b{color:#c4520a}
#resTitle{font-size:clamp(30px,7vw,52px);font-weight:800;-webkit-text-stroke:2px #1d2340;line-height:1.05}
.rbar{display:flex;height:42px;border-radius:14px;overflow:hidden;border:4px solid #1d2340;margin:10px 0;font-weight:800;font-size:20px}
.rbar div{display:flex;align-items:center;justify-content:center;transition:width 1.4s cubic-bezier(.2,.8,.2,1);width:0;white-space:nowrap;overflow:hidden;color:#fff;-webkit-text-stroke:1px #1d2340}
table{width:100%;border-collapse:collapse;font-size:15px;margin:6px 0 10px}
td,th{padding:3px 4px;border-bottom:2px dashed #e0d5bd}
th{font-size:13px;opacity:.7}
tr.me td{background:#fff3b0;font-weight:800}
.dot{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:4px;vertical-align:middle;border:2px solid #1d2340}
/* touch */
#touch{position:fixed;inset:0;z-index:5;pointer-events:none}
#touch>*{pointer-events:auto}
#lookZone{position:absolute;right:0;top:0;width:58%;height:100%}
#joyZone{position:absolute;left:0;bottom:0;width:42%;height:70%}
#joyBase{position:absolute;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.6);pointer-events:none;display:none}
#joyKnob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:rgba(255,255,255,.75)}
.tb{position:absolute;border-radius:50%;border:4px solid #fff;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1;box-shadow:0 4px 0 rgba(0,0,0,.3);font-size:14px}
#tFire{right:calc(22px + env(safe-area-inset-right,0px));bottom:90px;width:92px;height:92px;background:rgba(255,122,18,.85);font-size:19px}
#tSwim{right:calc(128px + env(safe-area-inset-right,0px));bottom:30px;width:70px;height:70px;background:rgba(0,170,200,.8)}
#tJump{right:calc(22px + env(safe-area-inset-right,0px));bottom:12px;width:62px;height:62px;background:rgba(60,207,90,.8)}
#tBomb{right:calc(124px + env(safe-area-inset-right,0px));bottom:118px;width:62px;height:62px;background:rgba(29,35,64,.8)}
#tSpec{right:calc(36px + env(safe-area-inset-right,0px));bottom:196px;width:62px;height:62px;background:rgba(150,150,150,.7)}
#tSpec.ready{background:linear-gradient(135deg,#ffd23f,#ff4fa3);animation:glow .5s infinite alternate}
#tPause{position:absolute;left:calc(8px + env(safe-area-inset-left,0px));top:8px;width:44px;height:44px;border-radius:12px;border:3px solid #fff;background:rgba(29,35,64,.7);color:#fff;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center}
/* menu preview */
.card.wide{max-width:760px}
.mrow{display:flex;gap:16px;align-items:stretch;text-align:left}
.pvBox{flex:0 0 220px;position:relative;border-radius:18px;border:3px solid #1d2340;background:radial-gradient(circle at 50% 70%,#fff6d8,#ffd9a8 55%,#f7b67a);overflow:hidden;min-height:270px;touch-action:none;cursor:grab}
.pvBox canvas{position:absolute;inset:0;width:100%;height:100%}
.pvHint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:12px;font-weight:800;color:#1d2340;opacity:.6;pointer-events:none}
.pvTeam{position:absolute;left:8px;top:8px;background:#ff7a12;color:#fff;font-weight:800;font-size:12px;border-radius:8px;padding:0 8px;border:2px solid #1d2340}
.mcol{flex:1;min-width:0}
.mcol .opts{justify-content:flex-start}
.hc{width:30px;height:30px;border-radius:50%;border:3px solid #1d2340;cursor:pointer;padding:0}
.hc.on{outline:4px solid #ffe14d;outline-offset:1px}
details.how summary{cursor:pointer;font-weight:800;color:#c4520a}
#rotate{position:fixed;inset:0;z-index:60;background:#1d2340;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:22px;padding:20px;gap:12px}
#rotate .ph{font-size:64px;animation:rot 1.6s infinite ease-in-out}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#tFull{position:absolute;left:calc(58px + env(safe-area-inset-left,0px));top:8px;width:44px;height:44px;border-radius:12px;border:3px solid #fff;background:rgba(29,35,64,.7);color:#fff;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center}
@media (max-width:560px){.mrow{flex-direction:column}.pvBox{flex-basis:auto;min-height:220px}}
@media (max-height:520px){.card{padding:10px 14px}.card h1{font-size:26px}.tag{margin-bottom:6px;font-size:13px}.pvBox{min-height:200px;flex-basis:180px}.card input{font-size:16px;padding:3px 8px;margin:2px 0 6px}.opts{margin:2px 0 6px;gap:4px}.opt{padding:1px 8px;font-size:14px}.btn{font-size:20px;padding:3px 18px}.lbl{font-size:13px}.how{display:none}}
/* mobile HUD */
body.mob #help{display:none}
body.mob #top{width:min(420px,60vw);top:4px}
body.mob .ri{width:22px;height:22px;font-size:10px;border-width:2px;border-radius:6px}
body.mob #timer{font-size:18px;min-width:64px;padding:0 8px;border-radius:10px}
body.mob #cov{height:12px}
body.mob #covTxt{font-size:10px;line-height:7px}
body.mob #mini{width:120px;height:90px;top:4px;right:calc(4px + env(safe-area-inset-right,0px))}
body.mob #feed{top:98px;right:4px}
body.mob .fi{font-size:11px;padding:1px 6px}
body.mob #stats{left:calc(110px + env(safe-area-inset-left,0px));top:6px;bottom:auto;flex-direction:column;gap:2px;align-items:flex-start}
body.mob .bar{width:96px}
body.mob .bar label{font-size:10px;line-height:1}
body.mob .bt{height:9px;border-width:2px}
body.mob #spLbl{white-space:nowrap}
body.mob #msg{top:24%}
body.mob #inkWarn{font-size:13px}
body.mob .tb{user-select:none;-webkit-user-select:none;touch-action:none}
body.mob #tFire{width:104px;height:104px;font-size:21px}
#langRow{display:flex;justify-content:flex-end;margin:-8px -10px 2px 0}
#langSel{font:inherit;font-weight:700;font-size:14px;border:3px solid #1d2340;border-radius:10px;padding:1px 6px;background:#fff;color:#1d2340;cursor:pointer;max-width:200px}
.card h1 small{font-size:.5em;color:#1d2340;-webkit-text-stroke:0;vertical-align:middle}
.sub2{font-weight:800;color:#c4520a;font-size:17px;margin-top:2px}
#joyBase.idle{opacity:.38}
.setRow{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;font-weight:800;flex-wrap:wrap}
.setRow input[type=range]{width:160px;accent-color:#ff7a12}
@media (max-height:420px){body.mob #tFire{width:86px;height:86px;bottom:76px}body.mob #tSpec{bottom:170px}body.mob #tBomb{bottom:104px}}
#loadErr{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1d2340;color:#fff;font-size:20px;text-align:center;padding:20px;z-index:99}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hide">
  <div id="top">
    <div id="topRow"><div class="roster" id="rosA"></div><div id="timer">3:00</div><div class="roster" id="rosB"></div></div>
    <div id="cov"><div id="covA"></div><div id="covMid"></div><div id="covB"></div><div id="covTxt"><span id="pA">0%</span><span id="pB">0%</span></div></div>
  </div>
  <canvas id="mini" width="180" height="135"></canvas>
  <div id="feed"></div>
  <div id="cross"></div>
  <div id="inkWarn" class="hide"></div>
  <div id="stats">
    <div class="bar"><label data-i="hp"></label><div class="bt"><i id="hpF"></i></div></div>
    <div class="bar"><label data-i="ink"></label><div class="bt"><i id="inkF"></i></div></div>
    <div class="bar" id="spBox"><label id="spLbl"></label><div class="bt"><i id="spF"></i></div></div>
  </div>
  <div id="help" data-ih="help"></div>
  <div id="msg"></div><div id="sub"></div>
  <div id="deadOv" class="hide"><h2 id="deadT"></h2><p id="deadC"></p></div>
</div>

<div id="touch" class="hide">
  <div id="lookZone"></div>
  <div id="joyZone"></div>
  <div id="joyBase"><div id="joyKnob"></div></div>
  <div class="tb" id="tFire" data-ih="tFire"></div>
  <div class="tb" id="tSwim" data-ih="tSwim"></div>
  <div class="tb" id="tJump" data-ih="tJump"></div>
  <div class="tb" id="tBomb" data-ih="tBomb"></div>
  <div class="tb" id="tSpec" data-ih="tSpec"></div>
  <div id="tPause">II</div>
  <div id="tFull">⛶</div>
</div>

<div class="scr" id="menu">
  <div class="card wide">
    <div id="langRow"><select id="langSel" aria-label="Language"></select></div>
    <h1>SPLASH <span>WARS</span> <small>HiHi</small></h1>
    <div class="sub2" data-i="subtitle"></div>
    <div class="tag" id="tagline"></div>
    <div class="mrow">
      <div class="pvBox" id="pvBox"><canvas id="pv"></canvas><div class="pvTeam" id="pvTeam"></div><div class="pvHint" data-i="drag"></div></div>
      <div class="mcol">
        <div class="lbl" data-i="name"></div>
        <input id="nameIn" maxlength="12" placeholder="" value="">
        <div class="lbl" data-i="hair"></div>
        <div class="opts" id="hairOpts"></div>
        <div class="lbl" data-i="hairC"></div>
        <div class="opts" id="hairCOpts"></div>
        <div class="lbl" data-i="map"></div>
        <div class="opts" id="mapOpts"></div>
        <div class="lbl" data-i="diff"></div>
        <div class="opts" id="diffOpts"></div>
        <div class="lbl" data-i="mode"></div>
        <div class="opts" id="modeOpts"></div>
      </div>
    </div>
    <button class="btn" id="playBtn" style="margin-top:8px" data-i="play"></button>
    <div class="how" data-ih="how"></div>
  </div>
</div>

<div id="rotate" class="hide"><div class="ph">📱</div><span data-i="rot1"></span><div style="font-size:14px;opacity:.7" data-i="rot2"></div></div>
<div class="scr hide" id="pause">
  <div class="card">
    <h1 data-i="pause"></h1>
    <div class="tag" data-i="pauseSub"></div>
    <button class="btn" id="resumeBtn" data-i="resume"></button>
    <button class="btn alt" id="quitBtn" data-i="toMenu"></button>
    <div style="margin-top:8px"><button class="opt" id="musicBtn"></button> <button class="opt" id="sfxBtn"></button></div>
    <div class="setRow"><span data-i="sens"></span><input type="range" id="sensIn" min="0.4" max="2.4" step="0.1"><b id="sensV"></b></div>
    <div class="setRow"><span data-i="qual"></span><span class="opts" id="qualOpts" style="margin:0"></span><span id="fpsV" style="opacity:.6;font-size:13px"></span></div>
  </div>
</div>

<div class="scr hide" id="result">
  <div class="card">
    <div id="resTitle"></div>
    <div class="tag" id="resSub"></div>
    <div class="rbar"><div id="rA" style="background:#ff7a12"></div><div id="rN" style="background:#d8c8a6;flex:1"></div><div id="rB" style="background:#9446ff"></div></div>
    <table id="resTable"></table>
    <button class="btn" id="againBtn" data-i="again"></button>
    <button class="btn alt" id="menuBtn" data-i="menu"></button>
  </div>
</div>

<script>
const LANGS=[['vi','Tiếng Việt'],['en','English'],['pt','Português (BR)'],['es','Español'],['fr','Français'],['de','Deutsch'],['it','Italiano'],['ru','Русский'],['tr','Türkçe'],['id','Bahasa Indonesia'],['th','ไทย'],['zh','中文'],['ja','日本語'],['ko','한국어'],['hi','हिन्दी'],['ar','العربية']];
const I18N={
vi:{subtitle:'Đại Chiến Bắn Sơn Sân Trường',teamA:'Lớp 9A',teamB:'Lớp 9B',tagline:'{A} 🧡 đại chiến 💜 {B} · 4 đấu 4',name:'Tên của bạn',namePh:'Nhập tên…',hair:'Kiểu tóc',hairC:'Màu tóc',diff:'Độ khó bot',mode:'Chơi trên',pc:'💻 Máy tính',phone:'📱 Điện thoại',lang:'🌐 Ngôn ngữ',play:'VÀO TIẾT CHIẾN! ▶',drag:'👆 Kéo để xoay',
hs:['Tóc ngắn','Tóc mái','Tóc dựng','Đầu đinh','Tóc dài','Mũ lưỡi trai'],hc:['Nâu','Đen','Vàng hoe','Hồng','Xanh dương','Bạc'],df:['Dễ','Vừa','Khó'],
how:'🎯 <b>Mục tiêu:</b> trong 3 phút, tô sơn màu lớp mình lên càng nhiều sân trường càng tốt. Hết giờ, lớp nào phủ nhiều diện tích hơn thì <b>thắng</b>.<br>🎨 Bắn trúng bạn lớp kia để <b>hạ gục</b> (về chỗ hồi sinh). Giữ <b>Lướt sơn</b> trên sơn lớp mình để chạy nhanh, ẩn thân và <b>nạp sơn</b>.<br>💣 <b>Bom sơn</b> tốn nửa bình. Tô đủ sân sẽ nạp đầy <b>Bom Khổng Lồ</b>. Sơn lớp kia làm bạn chậm và mất máu, nên tránh nhé!',
hp:'❤ Máu',ink:'🎨 Sơn',sp:'💥 Bom Khổng Lồ',spPc:'💥 SẴN SÀNG! Nhấn E',spMob:'💥 SẴN SÀNG! Bấm BOM TO',inkWarn:'HẾT SƠN! Giữ {k} trên sơn nhà để nạp',swimMob:'LƯỚT SƠN',
help:'<b>WASD</b> chạy · <b>Chuột</b> ngắm · <b>Click</b> bắn · <b>Shift</b> lướt sơn · <b>Q</b>/<b>Chuột phải</b> bom · <b>E</b> bom khổng lồ · <b>Space</b> nhảy · <b>P</b> tạm dừng · <b>M</b> nhạc',

  if(firing){let a=aimPoint();if(MOBILE){const as=assist();if(as){a=as.p;let d=as.yaw-cam.yaw;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;cam.yaw+=d*Math.min(1,dt*4);}}tryFire(c,a,.022);}
  if(wantBomb){wantBomb=false;if(c.ink>=55){c.ink-=55;const v=camDir.clone().multiplyScalar(15);v.y+=5.5;throwBomb(c,v,false);}else{showMsg(t('noInk'),.9,'#ff4d4d');}}
  if(wantSpec){wantSpec=false;if(c.special>=100){c.special=0;const v=camDir.clone().multiplyScalar(18);v.y+=7;throwBomb(c,v,true);showMsg(t('bigBomb'),1.1,'#ffd23f',true);}}
  if(c.hidden&&Math.random()<dt*6)SFX.swim();}

/* ================= HUD ================= */
let hitMark=0,hurtFlash=0,msgT=0;
function showMsg(t,dur,col,small){const m=$('msg');m.textContent=t;m.style.color=col||'#fff';m.style.fontSize=small?'clamp(26px,5vw,46px)':'';m.style.opacity=1;msgT=dur||1.2;}
function showSub(t){const s=$('sub');s.textContent=t;s.style.opacity=t?1:0;}
function buildRoster(){['A','B'].forEach((k,i)=>{const el=$('ros'+k);el.innerHTML='';chars.filter(c=>c.team===i+1).forEach(c=>{const d=document.createElement('div');d.className='ri'+(c.isPlayer?' me':'');d.style.background=TEAM[c.team].color;d.textContent=c.name[0].toUpperCase();d.title=c.name;c.rosEl=d;el.appendChild(d);});});}
const mctx=$('mini').getContext('2d');let miniT=0;
function drawMini(){const W=180,H=135,sx=W/(HX*2),sz=H/(HZ*2);mctx.drawImage(baseC,0,0,W,H);mctx.drawImage(paintC,0,0,W,H);
  mctx.fillStyle='rgba(40,40,60,.75)';for(const o of OB)mctx.fillRect((o.x-o.w/2+HX)*sx,(o.z-o.d/2+HZ)*sz,o.w*sx,o.d*sz);
  for(const c of chars){if(!c.alive||c===player)continue;const mine=c.team===player.team;if(!mine&&gameTime-c.spotT>1.2)continue;
    mctx.fillStyle=TEAM[c.team].color;mctx.strokeStyle=mine?'#fff':'#1d2340';mctx.lineWidth=2;mctx.beginPath();mctx.arc((c.pos.x+HX)*sx,(c.pos.z+HZ)*sz,4,0,6.28);mctx.fill();mctx.stroke();}
  if(player.alive){const x=(player.pos.x+HX)*sx,y=(player.pos.z+HZ)*sz,a=player.yaw;mctx.save();mctx.translate(x,y);mctx.rotate(-a);mctx.fillStyle='#ffe14d';mctx.strokeStyle='#1d2340';mctx.lineWidth=2;
    mctx.beginPath();mctx.moveTo(0,-7);mctx.lineTo(5,5);mctx.lineTo(-5,5);mctx.closePath();mctx.fill();mctx.stroke();mctx.restore();}}
function fmt(t){t=Math.max(0,Math.ceil(t));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
function updateHUD(dt){const p=player;
  $('hpF').style.width=p.hp+'%';$('hpF').style.background=p.hp<35?'#ff4d4d':'#3ccf5a';$('inkF').style.width=p.ink+'%';$('spF').style.width=p.special+'%';
  const rdy=p.special>=100;$('spBox').classList.toggle('ready',rdy);$('spLbl').textContent=rdy?(MOBILE?t('spMob'):t('spPc')):t('sp');$('tSpec').classList.toggle('ready',rdy);
  $('inkWarn').classList.toggle('hide',!(p.alive&&p.ink<8));$('cross').classList.toggle('low',p.ink<8);
  $('cross').style.transform=hitMark>0?'scale(1.4) rotate(45deg)':'';
  const tm=$('timer');tm.textContent=countdown>0?fmt(timeLeft):fmt(timeLeft);tm.classList.toggle('warn',timeLeft<=30&&timeLeft>0);
  const a=counts[1]/totalCells*100,b=counts[2]/totalCells*100;$('covA').style.width=a+'%';$('covB').style.width=b+'%';$('pA').textContent=a.toFixed(0)+'%';$('pB').textContent=b.toFixed(0)+'%';
  for(const c of chars)if(c.rosEl)c.rosEl.classList.toggle('dead',!c.alive);
  if(!p.alive){$('deadC').textContent=t('respawn',{s:Math.ceil(p.respawnT)});}
  miniT-=dt;if(miniT<=0){miniT=IS_TOUCH?.3:.15;drawMini();}
  if(msgT>0){msgT-=dt;if(msgT<=0)$('msg').style.opacity=0;}}

/* ================= GAME FLOW ================= */
let state='menu',paused=false,timeLeft=MATCH_TIME,countdown=0,gameTime=0,lastCD=0,warned30=false,ended=false;
let selMap=ls.get('sc_map')||'school';if(selMap!=='random'&&!MAPS[selMap])selMap='school';
function menuSplats(){resetPaint();for(let i=0;i<40;i++)paint(rand(-HX,HX),rand(-HZ,HZ),rand(.8,2.6),i%2?1:2,null);}
let selHair=+(ls.get('sc_hair')||0),selDiff=+(ls.get('sc_diff')||1);
function buildMenu(){$('nameIn').value=ls.get('sc_name')||'';
  const ho=$('hairOpts');HAIRS.forEach(([n],i)=>{const b=document.createElement('button');b.className='opt'+(i===selHair?' on':'');b.textContent=n;b.onclick=()=>{selHair=i;[...ho.children].forEach((x,j)=>x.classList.toggle('on',j===i));SFX.click();};ho.appendChild(b);});
  const dop=$('diffOpts');DIFFS.forEach(([n],i)=>{const b=document.createElement('button');b.className='opt'+(i===selDiff?' on':'');b.textContent=n;b.onclick=()=>{selDiff=i;[...dop.children].forEach((x,j)=>x.classList.toggle('on',j===i));SFX.click();};dop.appendChild(b);});
  const hco=$('hairCOpts');HAIRC.forEach(([n,col],i)=>{const b=document.createElement('button');b.className='hc'+(i===selHairC?' on':'');b.title=n;b.style.background='#'+col.toString(16).padStart(6,'0');b.onclick=()=>{selHairC=i;[...hco.children].forEach((x,j)=>x.classList.toggle('on',j===i));SFX.click();rebuildPreview();};hco.appendChild(b);});
  [...ho.children].forEach(b=>b.addEventListener('click',rebuildPreview));
  const mo=$('modeOpts');[['pc',false],['phone',true]].forEach(([n,v])=>{const b=document.createElement('button');b.className='opt'+(v===MOBILE?' on':'');b.textContent=n;b.onclick=()=>{setMode(v);[...mo.children].forEach(x=>x.classList.toggle('on',x===b));SFX.click();};mo.appendChild(b);});
  $('nameIn').addEventListener('input',()=>{if(pvTag)pvTag.set($('nameIn').value.trim()||t('you'),'#ffe14d','#1d2340');});
  const ls2=$('langSel');LANGS.forEach(([c,n])=>{const o=document.createElement('option');o.value=c;o.textContent=n;ls2.appendChild(o);});ls2.value=LANG;
  ls2.onchange=()=>{LANG=ls2.value;ls.set('sc_lang',LANG);applyLang();SFX.click();};
  const si=$('sensIn');si.value=LS;$('sensV').textContent=LS.toFixed(1);si.oninput=()=>{LS=+si.value;$('sensV').textContent=LS.toFixed(1);ls.set('sc_sens',LS);};
  const qo=$('qualOpts');['auto','low','high'].forEach(q=>{const b=document.createElement('button');b.className='opt'+(q===quality?' on':'');b.dataset.q=q;b.onclick=()=>{quality=q;ls.set('sc_q',q);[...qo.children].forEach(x=>x.classList.toggle('on',x===b));applyQuality();SFX.click();};qo.appendChild(b);});
  const mpo=$('mapOpts');[...MAP_IDS,'random'].forEach(id=>{const b=document.createElement('button');b.className='opt'+(id===selMap?' on':'');b.dataset.m=id;b.onclick=()=>{selMap=id;ls.set('sc_map',id);[...mpo.children].forEach(x=>x.classList.toggle('on',x===b));SFX.click();if(id!=='random'&&id!==curMap){buildMap(id);menuSplats();}};mpo.appendChild(b);});
  joyIdle();applyQuality();
  setMode(MOBILE);applyLang();initPreview();}
function applyLang(){const L=I18N[LANG]||I18N.en;document.documentElement.lang=LANG;
  document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));document.querySelectorAll('[data-ih]').forEach(el=>el.innerHTML=t(el.dataset.ih));
  TEAM[1].name=t('teamA');TEAM[2].name=t('teamB');
  $('tagline').textContent='HiHi · '+t('tagline',{A:TEAM[1].name,B:TEAM[2].name});$('pvTeam').textContent=TEAM[1].name.toUpperCase();
  $('nameIn').placeholder=t('namePh');
  [...$('hairOpts').children].forEach((b,i)=>b.textContent=t('hs')[i]);[...$('diffOpts').children].forEach((b,i)=>b.textContent=t('df')[i]);
  [...$('hairCOpts').children].forEach((b,i)=>b.title=t('hc')[i]);const mb=$('modeOpts').children;if(mb.length){mb[0].textContent=t('pc');mb[1].textContent=t('phone');}
  const rtl=LANG==='ar';document.querySelectorAll('.card').forEach(c=>c.dir=rtl?'rtl':'ltr');$('help').dir='ltr';
  [...$('mapOpts').children].forEach(b=>{const id=b.dataset.m;b.textContent=id==='random'?'🎲 '+t('mRandom'):MAPS[id].icon+' '+t(MAPS[id].key);});
  [...$('qualOpts').children].forEach(b=>b.textContent=t({auto:'qAuto',low:'qLow',high:'qHigh'}[b.dataset.q]));
  updAudioBtns();updInkWarn();if(pvTag&&!$('nameIn').value.trim())pvTag.set(t('you'),'#ffe14d','#1d2340');}
function setMode(m){MOBILE=m;document.body.classList.toggle('mob',m);updInkWarn();}
function updInkWarn(){$('inkWarn').textContent=t('inkWarn',{k:MOBILE?t('swimMob'):'Shift'});}
const HAIRC=[['Nâu',0x5a3218],['Đen',0x1a1a1a],['Vàng hoe',0xd9a441],['Hồng',0xff6fa8],['Xanh dương',0x3a8cff],['Bạc',0xd8dde3]];
let selHairC=clamp(+(ls.get('sc_hairc')||0),0,5);
/* ---- 3D preview ---- */
let pvR=null,pvScene=null,pvCam=null,pvModel=null,pvTag=null,pvYaw=Math.PI+.5,pvDrag=null,pvT=0,pvJump=0;
function initPreview(){const c=$('pv');try{pvR=new THREE.WebGLRenderer({canvas:c,alpha:true,antialias:true});}catch(e){return;}pvR.setPixelRatio(Math.min(devicePixelRatio,2));
  pvScene=new THREE.Scene();pvScene.add(new THREE.HemisphereLight(0xffffff,0x9a8a70,.7));pvScene.add(new THREE.AmbientLight(0xffffff,.15));const dl=new THREE.DirectionalLight(0xffffff,.65);dl.position.set(3,6,5);pvScene.add(dl);
  pvCam=new THREE.PerspectiveCamera(30,1,.1,60);
  const pad=new THREE.Mesh(new THREE.CylinderGeometry(1.15,1.25,.22,28),M(0xffffff));pad.position.y=-.11;pvScene.add(pad);
  const sp=new THREE.Mesh(new THREE.CircleGeometry(1,24),new THREE.MeshBasicMaterial({color:TEAM[1].hex}));sp.rotation.x=-Math.PI/2;sp.position.y=.005;pvScene.add(sp);
  for(let i=0;i<7;i++){const d=new THREE.Mesh(new THREE.CircleGeometry(rand(.08,.18),10),sp.material);const a=rand(0,6.28);d.rotation.x=-Math.PI/2;d.position.set(Math.cos(a)*rand(1.05,1.2),.006,Math.sin(a)*rand(1.05,1.2));pvScene.add(d);}
  rebuildPreview();
  const box=$('pvBox');let lx=0;box.addEventListener('pointerdown',e=>{pvDrag=e.pointerId;lx=e.clientX;try{box.setPointerCapture(e.pointerId);}catch(_){}box.style.cursor='grabbing';});
  box.addEventListener('pointermove',e=>{if(pvDrag!==e.pointerId)return;pvYaw+=(e.clientX-lx)*.012;lx=e.clientX;});
  const up=()=>{pvDrag=null;box.style.cursor='';};box.addEventListener('pointerup',up);box.addEventListener('pointercancel',up);
  box.addEventListener('dblclick',()=>{pvJump=.01;});}
function rebuildPreview(){if(!pvScene)return;if(pvModel)pvScene.remove(pvModel.g);pvModel=makeChar(1,selHair,HAIRC[selHairC][1],pvScene);pvModel.g.scale.setScalar(1);
  pvTag=labelSprite($('nameIn').value.trim()||t('you'),'#ffe14d','#1d2340',256,48,2,.38);pvTag.sp.position.y=2.85;pvModel.g.add(pvTag.sp);pvJump=.01;}
function renderPreview(dt){if(!pvR||!pvModel||$('menu').classList.contains('hide'))return;const c=$('pv'),w=c.clientWidth,hh=c.clientHeight;if(!w||!hh)return;
  const dpr=pvR.getPixelRatio();if(c.width!==Math.round(w*dpr)||c.height!==Math.round(hh*dpr))pvR.setSize(w,hh,false);
  pvCam.aspect=w/hh;const fit=w/hh<.75?7.2:6.2;pvCam.position.set(0,1.75,fit);pvCam.lookAt(0,1.2,0);pvCam.updateProjectionMatrix();
  pvT+=dt;if(pvDrag===null)pvYaw+=dt*.55;const m=pvModel;m.g.rotation.y=pvYaw;
  if(pvJump>0){pvJump+=dt;const t=pvJump/.45;m.g.position.y=t<1?Math.sin(t*Math.PI)*.5:0;if(t>=1)pvJump=0;}
  m.armL.rotation.x=Math.sin(pvT*2)*.25;m.body.position.y=Math.abs(Math.sin(pvT*2))*.04;m.legL.rotation.x=0;m.legR.rotation.x=0;
  pvR.render(pvScene,pvCam);}
function setupMatch(){
  chars.forEach(c=>scene.remove(c.model.g));chars=[];
  bullets.forEach(b=>{b.m.visible=false;bPool.push(b.m);});bullets.length=0;bombs.forEach(b=>scene.remove(b.m));bombs.length=0;parts.forEach(p=>{p.m.visible=false;pPool.push(p.m);});parts.length=0;
  resetPaint();[1,2].forEach(t=>paint(TEAM[t].spawn.x,TEAM[t].spawn.z,3.6,t,null));
  const nm=($('nameIn').value.trim()||t('you')).slice(0,12);ls.set('sc_name',nm);ls.set('sc_hair',selHair);ls.set('sc_diff',selDiff);ls.set('sc_hairc',selHairC);
  const pool=NAMES.slice().sort(()=>Math.random()-.5).filter(n=>n[0].toLowerCase()!==nm.toLowerCase());const base=DIFFS[selDiff][1];
  player=createChar(1,nm,selHair,HAIRC[selHairC][1],true,1);
  for(let i=0;i<7;i++){const [n,girl]=pool[i];const team=i<3?1:2;const st=girl?pick([4,4,1]):pick([0,1,2,3,5]);createChar(team,n,st,pick([0x1a1a1a,0x2b1a10,0x3b2414,0x1a1a1a]),false,clamp(base+rand(-.12,.12),.2,.97));}
  chars.forEach(c=>spawnChar(c,true));buildRoster();
  timeLeft=MATCH_TIME;countdown=3.2;lastCD=4;gameTime=0;warned30=false;ended=false;paused=false;nextNote=0;step=0;
  $('deadOv').classList.add('hide');$('feed').innerHTML='';showSub('');
}
function startGame(){initAudio();SFX.click();$('menu').classList.add('hide');$('result').classList.add('hide');$('pause').classList.add('hide');$('hud').classList.remove('hide');$('touch').classList.toggle('hide',!MOBILE);if(MOBILE&&IS_TOUCH&&!document.fullscreenElement)goFull();
  const mid=selMap==='random'?pick(MAP_IDS.filter(x=>x!==curMap)):selMap;if(mid!==curMap)buildMap(mid);
  setupMatch();state='play';checkRotate();SFX.drum();showSub(curMap==='school'?t('startSub'):'📍 '+MAPS[curMap].icon+' '+t(MAPS[curMap].key));}
function togglePause(force){if(state!=='play'||ended)return;paused=force===true?true:!paused;$('pause').classList.toggle('hide',!paused);mouseFire=false;touch.fire=false;
  if(paused&&document.exitPointerLock&&locked)document.exitPointerLock();}
function toggleMusic(){musicOn=!musicOn;ls.set('sc_music',musicOn?'1':'0');updAudioBtns();}
$('playBtn').onclick=startGame;$('againBtn').onclick=startGame;
$('resumeBtn').onclick=()=>{paused=false;$('pause').classList.add('hide');SFX.click();};
$('quitBtn').onclick=()=>{toMenu();};$('menuBtn').onclick=()=>{toMenu();};
$('musicBtn').onclick=toggleMusic;$('sfxBtn').onclick=()=>{sfxOn=!sfxOn;ls.set('sc_sfx',sfxOn?'1':'0');updAudioBtns();};
function updAudioBtns(){$('musicBtn').textContent=t('music')+': '+(musicOn?t('on'):t('off'));$('sfxBtn').textContent=t('sfx')+': '+(sfxOn?t('on'):t('off'));}
function toMenu(){state='menu';checkRotate();paused=false;['pause','result','hud','touch'].forEach(i=>$(i).classList.add('hide'));$('menu').classList.remove('hide');if(locked&&document.exitPointerLock)document.exitPointerLock();}
function endMatch(){ended=true;mouseFire=false;touch.fire=false;if(locked&&document.exitPointerLock)document.exitPointerLock();showMsg(t('timeUp'),2,'#fff');SFX.drum();
  setTimeout(()=>{state='end';checkRotate();$('hud').classList.add('hide');$('touch').classList.add('hide');
    const a=counts[1]/totalCells*100,b=counts[2]/totalCells*100,win=a>=b?1:2,pw=win===player.team;
    $('resTitle').textContent=(a===b?t('draw'):t('win',{t:TEAM[win].name.toUpperCase()}));$('resTitle').style.color=a===b?'#ffd23f':TEAM[win].color;
    $('resSub').textContent=a===b?t('drawSub'):pw?t('winSub'):t('loseSub');
    const rA=$('rA'),rB=$('rB');rA.style.width='0';rB.style.width='0';rA.textContent='';rB.textContent='';
    setTimeout(()=>{rA.style.width=a+'%';rB.style.width=b+'%';rA.textContent=a.toFixed(1)+'%';rB.textContent=b.toFixed(1)+'%';},250);
    const rows=chars.slice().sort((x,y)=>y.points-x.points);const mvp=rows[0];
    $('resTable').innerHTML='<tr>'+t('cols').map(x=>`<th>${esc(x)}</th>`).join('')+'</tr>'+rows.map(c=>`<tr class="${c.isPlayer?'me':''}"><td style="text-align:left"><span class="dot" style="background:${TEAM[c.team].color}"></span>${esc(c.name)}${c===mvp?' ⭐':''}</td><td>${Math.round(c.points*.25)} m²</td><td>${c.kills}</td><td>${c.deaths}</td></tr>`).join('');
    $('result').classList.remove('hide');pw?SFX.win():SFX.lose();},2200);}

/* ================= LOOP ================= */
let last=performance.now(),orbit=0;
function frame(now){requestAnimationFrame(frame);let dt=(now-last)/1000;last=now;perfTick(Math.min(dt,.25));if(dt>.05)dt=.05;
  if(flagMesh){const pa=flagMesh.geometry.attributes.position;for(let i=0;i<pa.count;i++){const x=pa.getX(i);pa.setZ(i,Math.sin(now*.004+x*2.2)*.12*(x+1.05));}pa.needsUpdate=true;}
  renderPreview(dt);
  if(state==='play'&&!paused&&!portrait){gameTime+=dt;
    if(countdown>0){countdown-=dt;const n=Math.ceil(countdown);if(n!==lastCD&&n>0){lastCD=n;showMsg(String(n),.8,'#fff');SFX.tick();}if(countdown<=0){showMsg(t('go'),1,'#ffd23f');showSub('');tone(660,1320,.25,'square',.1);}
      computeCam();}
    else if(!ended){timeLeft-=dt;if(timeLeft<=30&&!warned30){warned30=true;showMsg(t('last30'),1.4,'#ff4d4d');}if(timeLeft<=10&&Math.ceil(timeLeft)!==lastCD){lastCD=Math.ceil(timeLeft);SFX.tick();}
      if(timeLeft<=0){timeLeft=0;endMatch();}
      for(const c of chars){c.lastX=c.pos.x;c.lastZ=c.pos.z;c.fireCd-=dt;if(c.prot>0)c.prot-=dt;
        if(!c.alive){c.respawnT-=dt;if(c.respawnT<=0){spawnChar(c,false);if(c.isPlayer)$('deadOv').classList.add('hide');else if(c.ai.deathQuote){say(c,c.ai.deathQuote);c.ai.deathQuote=null;}else if(Math.random()<.15)say(c,pick(tr('qs')));}continue;}
        if(c.isPlayer)updatePlayer(c,dt);else updateBot(c,dt);}
      updateBullets(dt);}
    else{updateBullets(dt);}
    for(const c of chars)updateModel(c,dt);
    if(player.alive||countdown>0){computeCam();}
    else{// death cam: look from above toward spawn
      camPos.lerp(new THREE.Vector3(player.pos.x,14,player.pos.z+(player.team===1?10:-10)),Math.min(1,dt*2));}
    camera.position.copy(camPos);if(shake>0){shake-=dt;camera.position.x+=rand(-1,1)*shake*.4;camera.position.y+=rand(-1,1)*shake*.4;}
    if(player.alive||countdown>0)camera.lookAt(camPos.x+camDir.x*10,camPos.y+camDir.y*10,camPos.z+camDir.z*10);else camera.lookAt(player.pos.x,0,player.pos.z);
    hitMark-=dt;if(hurtFlash>0){hurtFlash-=dt;}
    updateHUD(dt);musicTick();}
  else if(state==='menu'||state==='end'){orbit+=dt*.08;camera.position.set(Math.sin(orbit)*44,24,Math.cos(orbit)*36);camera.lookAt(0,0,0);
    if(state==='menu')for(const c of chars)updateModel(c,dt);}
  else if(paused){/* frozen */}
  paintUpT-=dt;if(paintDirty&&paintUpT<=0){paintTex.needsUpdate=true;paintDirty=false;paintUpT=IS_TOUCH?.1:.035;}
  renderer.domElement.style.filter=hurtFlash>0?`saturate(1.6) hue-rotate(-10deg)`:'';
  renderer.render(scene,camera);}

/* ================= BOOT ================= */
function boot(){buildMap(selMap==='random'?'school':selMap);buildMenu();menuSplats();
  // decorative paint on menu background

  requestAnimationFrame(t=>{last=t;frame(t);});}
let booted=false;const go=()=>{if(booted)return;booted=true;boot();};
if(document.fonts&&document.fonts.load){Promise.all([document.fonts.load(`800 20px "Baloo 2"`),document.fonts.load(`700 20px "Baloo 2"`)]).then(go,go);setTimeout(go,2500);}else go();
