<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1d2340">
<title>Siêu Thị Bừa Bộn HiHi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#1d2340;font-family:'Baloo 2',system-ui,sans-serif;color:#2b2140;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
#hud{position:fixed;inset:0;pointer-events:none}
.pill{background:rgba(255,255,255,.92);border-radius:999px;padding:4px 14px;font-weight:800;font-size:18px;box-shadow:0 3px 0 rgba(0,0,0,.18);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
#topRight{position:absolute;top:calc(10px + var(--st));right:calc(10px + var(--sr));display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#topRow{display:flex;gap:6px}
#coinPill{color:#b26b00}
#bagPill.full{background:#ff5a5a;color:#fff}
#minimap{width:180px;height:146px;border-radius:14px;background:rgba(255,255,255,.88);box-shadow:0 3px 0 rgba(0,0,0,.18);pointer-events:auto;cursor:pointer}
#zoneName{position:absolute;top:calc(10px + var(--st));left:50%;transform:translateX(-50%);font-size:17px}
#quests{position:absolute;top:calc(10px + var(--st));left:calc(10px + var(--sl));width:280px;background:rgba(255,255,255,.9);border-radius:16px;padding:8px 12px;box-shadow:0 3px 0 rgba(0,0,0,.18);pointer-events:auto;cursor:pointer}
#quests h4{margin:0 0 2px;font-size:15px;color:#7a3cff;display:flex;justify-content:space-between}
#quests h4 i{font-style:normal;color:#999}
#quests.collapsed .q:not(:first-of-type){display:none}
.q{font-size:14px;line-height:1.25;padding:4px 0;border-top:1px dashed #ddd}
.q:first-of-type{border-top:0}
.q b{color:#b26b00}
.qbar{height:6px;background:#eee;border-radius:4px;margin-top:3px;overflow:hidden}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,#33d17a,#1fb5ff)}
#cross{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
#cross.on{background:#ffe23b;width:16px;height:16px;margin:-8px 0 0 -8px}
#prompt{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(30,24,60,.85);color:#fff;border-radius:16px;padding:8px 16px;font-size:17px;text-align:center;max-width:92vw;white-space:nowrap;line-height:1.3}
#prompt .k{display:inline-block;background:#ffe23b;color:#2b2140;border-radius:6px;padding:0 7px;margin:0 3px;font-weight:800}
#prompt .bad{color:#ff8a8a}
#prompt .good{color:#7dffa8}
#keys{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);color:#fff;font-size:13px;opacity:.85;text-shadow:0 1px 2px #000;white-space:nowrap}
#toasts{position:absolute;top:calc(64px + var(--st));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;width:max-content;max-width:94vw}
.toast{background:#fff;border-radius:14px;padding:6px 16px;font-weight:700;font-size:16px;box-shadow:0 4px 0 rgba(0,0,0,.2);animation:tin .25s ease-out;text-align:center}
.toast.bad{background:#ff5a5a;color:#fff}
.toast.good{background:#33d17a;color:#fff}
.toast.gold{background:#ffcf33;color:#5a3a00}
@keyframes tin{from{transform:translateY(-10px) scale(.9);opacity:0}}
.fly{position:absolute;font-weight:800;font-size:22px;color:#ffcf33;text-shadow:0 2px 0 #7a4b00,0 0 6px rgba(0,0,0,.4);animation:fup 1s ease-out forwards}
@keyframes fup{to{transform:translateY(-70px);opacity:0}}
#flash{position:absolute;inset:0;background:radial-gradient(transparent 55%,rgba(255,40,40,.45));opacity:0;transition:opacity .25s}
#lockHint{position:absolute;left:50%;top:58%;transform:translateX(-50%);background:rgba(30,24,60,.8);color:#fff;padding:6px 14px;border-radius:12px;font-size:15px}
.ov{position:fixed;inset:0;background:rgba(20,16,45,.62);display:flex;align-items:center;justify-content:center;z-index:20;padding:calc(10px + var(--st)) calc(10px + var(--sr)) calc(10px + var(--sb)) calc(10px + var(--sl))}
.card{background:#fff8ef;border-radius:24px;padding:20px 22px;max-width:760px;width:100%;max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;box-shadow:0 8px 0 rgba(0,0,0,.25);position:relative}
.card h2{margin:0 0 8px;font-size:28px;color:#7a3cff;line-height:1.1;padding-right:44px}
.btn{pointer-events:auto;font-family:inherit;font-weight:800;font-size:18px;border:0;border-radius:14px;padding:10px 18px;cursor:pointer;background:#ffcf33;color:#3b2500;box-shadow:0 4px 0 #c99300;margin:4px;touch-action:manipulation}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #c99300}
.btn.blue{background:#3fb6ff;color:#fff;box-shadow:0 4px 0 #1b7fc0}
.btn.green{background:#33d17a;color:#fff;box-shadow:0 4px 0 #1d9150}
.btn.red{background:#ff5a5a;color:#fff;box-shadow:0 4px 0 #c03030}
.btn.gray{background:#ddd;color:#777;box-shadow:0 4px 0 #aaa;cursor:not-allowed}
.close{position:absolute;top:10px;right:12px;width:40px;height:40px;padding:0;font-size:20px}
#title{font-size:48px;line-height:1;margin:0;color:#ff5fa2;text-shadow:0 4px 0 #7a3cff}
#title small{display:block;font-size:22px;color:#7a3cff;text-shadow:none;margin-top:6px}
.ctrl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px;margin:12px 0;text-align:left}
.ctrl b{background:#2b2140;color:#fff;border-radius:6px;padding:0 8px;text-align:center;white-space:nowrap}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border-radius:12px;padding:6px 10px;margin:4px;font-weight:700;font-size:16px}
select{font-family:inherit;font-size:16px;font-weight:700;border-radius:10px;border:2px solid #7a3cff;padding:4px 8px;background:#fff;color:#2b2140}
input[type=range]{width:140px;accent-color:#7a3cff}
.langbar{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin:8px 0}
.langbar button{font-family:inherit;font-weight:700;font-size:14px;border:2px solid #e0d6ff;background:#fff;border-radius:999px;padding:2px 10px;cursor:pointer}
.langbar button.on{background:#7a3cff;color:#fff;border-color:#7a3cff}
.upgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.up{background:#fff;border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.up .ic{font-size:28px}
.up h3{margin:0;font-size:18px}
.up p{margin:2px 0;font-size:14px;color:#555}
.lv{display:flex;gap:3px;margin:4px 0}
.lv i{flex:1;height:7px;border-radius:4px;background:#e5e5e5}
.lv i.on{background:#7a3cff}
#bigmap{width:100%;max-width:600px;aspect-ratio:60/48;background:#fff;border-radius:16px;display:block;margin:0 auto}
.zl{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px;margin-top:10px}
.zrow{background:#fff;border-radius:12px;padding:6px 10px;font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.zrow .btn{font-size:14px;padding:4px 10px}
/* touch */
#touchUI{position:fixed;inset:0;pointer-events:none;z-index:5}
#joyBase{position:absolute;left:calc(36px + var(--sl));bottom:calc(36px + var(--sb));width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.45)}
#joyKnob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,255,255,.85)}
#joyBase.run{border-color:#ffcf33}
#tbtns{position:absolute;right:calc(14px + var(--sr));bottom:calc(20px + var(--sb));display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;gap:10px;align-items:center;justify-items:center}
.tb{pointer-events:auto;width:84px;height:84px;border-radius:50%;border:0;font-family:inherit;font-weight:800;font-size:16px;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.25);opacity:.5;transition:opacity .15s,transform .15s;touch-action:none}
.tb.act{opacity:1;transform:scale(1.08)}
#bPick{background:#33d17a;grid-column:2;grid-row:2;width:96px;height:96px;font-size:18px}
#bPlace{background:#3fb6ff;grid-column:1;grid-row:2}
#bDrop{background:#ff8a3d;width:62px;height:62px;font-size:13px;grid-column:2;grid-row:1}
#ttop{position:absolute;right:calc(10px + var(--sr));top:calc(206px + var(--st));display:flex;gap:6px}
.ts{pointer-events:auto;width:46px;height:46px;border-radius:14px;border:0;background:rgba(255,255,255,.9);font-size:22px;box-shadow:0 3px 0 rgba(0,0,0,.2);touch-action:none}
body.touch #keys{display:none}
body.touch #prompt{bottom:auto;top:calc(50% + 34px);font-size:15px;padding:6px 12px}
@media (max-width:820px),(max-height:500px){
 #quests{width:210px;padding:6px 9px}
 .q{font-size:12px}
 #quests h4{font-size:13px}
 #minimap{width:120px;height:98px}
 .pill{font-size:14px;padding:2px 9px}
 #zoneName{top:auto;bottom:calc(6px + var(--sb));font-size:13px}
 #ttop{top:calc(146px + var(--st))}
 #title{font-size:34px}
 .card{padding:14px 14px;border-radius:18px}
 .card h2{font-size:22px}
 .ctrl{font-size:13px}
 .toast{font-size:13px;padding:4px 12px}
 #toasts{top:calc(46px + var(--st))}
 .btn{font-size:16px;padding:8px 14px}
}
@media (max-height:420px){
 .tb{width:70px;height:70px;font-size:14px}
 #bPick{width:82px;height:82px;font-size:15px}
 #bDrop{width:54px;height:54px;font-size:12px}
 #joyBase{width:112px;height:112px}
 #title small{font-size:17px}
 .ctrl{display:none}
}
@media (max-width:520px){
 #topRow #dayPill{display:none}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hidden">
  <div id="quests"><h4><span data-i="quests"></span><i id="qToggle">▾</i></h4><div id="qlist"></div></div>
  <div id="zoneName" class="pill"></div>
  <div id="topRight">
    <div id="topRow"><span class="pill" id="dayPill"></span><span class="pill" id="bagPill"></span><span class="pill" id="coinPill"></span></div>
    <canvas id="minimap" width="360" height="292"></canvas>
  </div>
  <div id="cross"></div>
  <div id="prompt" class="hidden"></div>
  <div id="lockHint" class="hidden" data-i="lockHint"></div>
  <div id="toasts"></div>
  <div id="keys" data-i="keys"></div>
  <div id="flash"></div>
</div>
<div id="touchUI" class="hidden">
  <div id="joyBase"><div id="joyKnob"></div></div>
  <div id="tbtns">
    <button class="tb" id="bDrop" data-i="bDrop"></button>
    <button class="tb" id="bPlace" data-i="bPlace"></button>
    <button class="tb" id="bPick" data-i="bPick"></button>
  </div>
  <div id="ttop"><button class="ts" id="bMap">🗺️</button><button class="ts" id="bUp">⬆️</button><button class="ts" id="bPause">⏸️</button></div>
</div>

<div class="ov" id="startOv"><div class="card" style="text-align:center;max-width:580px">
  <h1 id="title"><span data-i="title"></span><small data-i="sub"></small></h1>
  <div class="langbar" id="langBar"></div>
  <p style="font-size:16px;margin:6px 0" data-i="intro"></p>
  <div id="startBtns"></div>
  <div class="ctrl" id="ctrlHelp"></div>
  <p style="font-size:13px;color:#888;margin:0" data-i="saved"></p>
</div></div>

<div class="ov hidden" id="pauseOv"><div class="card" style="max-width:460px">
  <h2 data-i="pause"></h2>
  <div style="display:flex;flex-direction:column;align-items:stretch">
    <button class="btn green" id="pResume" data-i="resume"></button>
    <div style="display:flex"><button class="btn blue" style="flex:1" id="pUp" data-i="upgradesBtn"></button><button class="btn blue" style="flex:1" id="pMap" data-i="mapBtn"></button></div>
    <div class="row"><span data-i="lang"></span><select id="langSel"></select></div>
    <div class="row"><span data-i="quality"></span><select id="qualSel"></select></div>
    <div class="row"><span data-i="sens"></span><input type="range" id="sensR" min="0.4" max="2.2" step="0.1"></div>
    <div style="display:flex"><button class="btn" style="flex:1" id="pMusic"></button><button class="btn" style="flex:1" id="pSfx"></button></div>
    <button class="btn" id="pFull" data-i="fullscreen"></button>
    <button class="btn red" id="pReset" data-i="reset"></button>
  </div>
</div></div>

<div class="ov hidden" id="upOv"><div class="card">
  <button class="btn close red" data-close>✕</button>
  <h2 data-i="upTitle"></h2>
  <div style="margin-bottom:8px;font-weight:700" id="upCoins"></div>
  <div class="upgrid" id="upGrid"></div>
</div></div>

<div class="ov hidden" id="mapOv"><div class="card">
  <button class="btn close red" data-close>✕</button>
  <h2 data-i="mapTitle"></h2>
  <canvas id="bigmap" width="900" height="720"></canvas>
  <div class="zl" id="zoneList"></div>
</div></div>

<div class="ov hidden" id="dayOv"><div class="card" style="text-align:center;max-width:480px">
  <h2 data-i="dayDone" style="padding:0"></h2>
  <p id="dayText" style="font-size:17px"></p>
  <button class="btn green" id="dNext" data-i="nextDay"></button>
</div></div>

<div class="ov hidden" id="confOv"><div class="card" style="text-align:center;max-width:420px">
  <h2 data-i="confT" style="padding:0"></h2>
  <p data-i="confX"></p>
  <button class="btn red" id="cYes" data-i="confY"></button>
  <button class="btn" id="cNo" data-i="cancel"></button>
</div></div>

<script src="js/three.min.js"></script>
<script>

let isTouch=matchMedia('(pointer: coarse)').matches||location.hash==='#touch';

const ray=new THREE.Raycaster();const center=new THREE.Vector2(0,0);const cand=[];
function computeTarget(){
 const range=upv('range')+(isTouch?.3:0);target=null;cand.length=0;
 for(const ig of FLOOR_IG)if(ig.items.length)cand.push(ig.main);
 for(const sh of shelves){if(!S.unlocked[sh.zone])continue;const dx=sh.group.position.x-player.x,dz=sh.group.position.z-player.z;if(Math.abs(dx)<sh.w/2+4&&Math.abs(dz)<4)cand.push(sh.hitbox);}
 for(const id in fences){const z=ZB[id];if(player.x>z.x0-5&&player.x<z.x1+5&&player.z>z.z0-5&&player.z<z.z1+5)fences[id].pick.forEach(p=>cand.push(p));}
 camera.updateMatrixWorld();ray.setFromCamera(center,camera);ray.far=Math.max(range,4)+1.6;
 const hits=ray.intersectObjects(cand,false);
 for(const h of hits){const u=h.object.userData;const hd=Math.hypot(h.point.x-player.x,h.point.z-player.z);
  if(u.type==='itemIG'){const f=u.ig.items[h.instanceId];if(f&&hd<=range){target={type:'item',ref:f};break;}continue;}
  if(u.type==='shelf'){if(hd<=3.2)target={type:'shelf',ref:u.ref};break;}
  if(u.type==='fence'){if(hd<=3.6)target={type:'fence',zone:u.zone};break;}
 }
 if(!target){
  const fx=-Math.sin(yaw),fz=-Math.cos(yaw);let best=null,bs=-1;const minDot=isTouch?.7:.82;
  for(const f of floorItems){const dx=f.x-player.x,dz=f.z-player.z;const d=Math.hypot(dx,dz);if(d>range||d<.05)continue;const dot=(dx*fx+dz*fz)/d;if(dot<minDot&&d>1)continue;const sc=dot-d*.08;if(sc>bs){bs=sc;best=f;}}
  if(best)target={type:'item',ref:best};
 }
 if(!target&&S.held.length){const sh=nearShelfMatch(2.4);if(sh)target={type:'shelf',ref:sh,soft:true};}
}

 else if(target&&target.type==='shelf'){const sh=target.ref;const ok=S.held.includes(sh.cat);html=t('p_shelf',{c:cn(sh.cat),f:sh.filled,t:sh.slots.length})+'<br>'+(sh.filled>=sh.slots.length?`<span class="good">${t('p_shelfFull')}</span>`:ok?`${K} <span class="good">${t('p_place')}</span> ${isTouch?'':t('p_hold')}`:(S.held.length?`<span class="bad">${t('p_notThis')}</span>`:t('p_bring')));}
 else if(target&&target.type==='fence'){const z=ZB[target.zone];const nz=nextLockedZone();html=t('p_lock',{z:zn(z.id),c:z.cost})+'<br>'+(nz.id!==z.id?`<span class="bad">${t('unlockFirst',{z:zn(nz.id)})}</span>`:S.coins>=z.cost?`${K} <span class="good">${t('p_unlockNow')}</span>`:`<span class="bad">${t('p_missing',{m:z.cost-S.coins})}</span>`);}
 if(html!==lastPrompt){lastPrompt=html;$('prompt').innerHTML=html;$('prompt').classList.toggle('hidden',!html);}
 $('cross').classList.toggle('on',!!target);

 }

// ================= STATE MACHINE / INPUT =================
let state='menu';let locked=false,lockWorked=false,noLock=isTouch;
const keys={};let interactHeld=false,interactTimer=0;
const overlays=['startOv','pauseOv','upOv','mapOv','dayOv','confOv'];
function openOverlay(id){overlays.forEach(o=>$(o).classList.toggle('hidden',o!==id));state=id==='startOv'?'menu':'modal';interactHeld=false;for(const k in keys)keys[k]=false;resetJoy();if(document.pointerLockElement)try{document.exitPointerLock();}catch(e){}

function onLockErr(){if(!lockWorked){if(noLock)return;noLock=true;toast(t('drag'),'good',5000);}}

document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===canvas;if(locked)lockWorked=true;else if(state==='play'&&!noLock)openOverlay('pauseOv');});
let rotateShown=false;

addEventListener('keydown',e=>{
 if(e.repeat&&e.code!=='KeyE')return;

 if(state!=='play')return;
 keys[e.code]=true;

 else if(e.code==='KeyQ')dropItem();

const SENS=.0022;let dragging=false,dragMoved=0;

 if(state!=='play'||isTouch)return;initAudio();
 if(!noLock&&!locked){tryLock();return;}

});

 if(state!=='play'||isTouch)return;
 if(locked||(noLock&&dragging)){const s=SENS*PREFS.sens;yaw-=e.movementX*s;pitch=clamp(pitch-e.movementY*s,-1.35,1.25);if(dragging)dragMoved+=Math.abs(e.movementX)+Math.abs(e.movementY);}
});

const joy={id:null,x:0,y:0,ox:0,oy:0},look={id:null,x:0,y:0,moved:0};
function resetJoy(){joy.id=null;joy.x=joy.y=0;look.id=null;$('joyKnob').style.transform='';const b=$('joyBase');b.style.left='';b.style.top='';b.style.bottom='';b.classList.remove('run');}
function enableTouch(){if(document.body.classList.contains('touch'))return;isTouch=true;noLock=true;document.body.classList.add('touch');if(state==='play')$('touchUI').classList.remove('hidden');lastPrompt='~';applyI18n();}

canvas.addEventListener('touchstart',e=>{e.preventDefault();initAudio();if(state!=='play')return;
 for(const tc of e.changedTouches){if(tc.clientX<innerWidth*.42&&joy.id===null){joy.id=tc.identifier;joy.ox=tc.clientX;joy.oy=tc.clientY;joy.x=joy.y=0;const b=$('joyBase');const r=b.offsetWidth/2;b.style.left=(tc.clientX-r)+'px';b.style.top=(tc.clientY-r)+'px';b.style.bottom='auto';}
  else if(look.id===null){look.id=tc.identifier;look.x=tc.clientX;look.y=tc.clientY;look.moved=0;}}
},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();for(const tc of e.changedTouches){
 if(tc.identifier===joy.id){let dx=tc.clientX-joy.ox,dy=tc.clientY-joy.oy;const d=Math.hypot(dx,dy),mx=$('joyBase').offsetWidth*.42;if(d>mx){dx*=mx/d;dy*=mx/d;}joy.x=dx/mx;joy.y=dy/mx;$('joyKnob').style.transform=`translate(${dx}px,${dy}px)`;$('joyBase').classList.toggle('run',Math.hypot(joy.x,joy.y)>.96);}
 else if(tc.identifier===look.id){const dx=tc.clientX-look.x,dy=tc.clientY-look.y;look.x=tc.clientX;look.y=tc.clientY;look.moved+=Math.abs(dx)+Math.abs(dy);const s=.0055*PREFS.sens;yaw-=dx*s;pitch=clamp(pitch-dy*s,-1.35,1.25);}
}},{passive:false});
function endTouch(e){for(const tc of e.changedTouches){if(tc.identifier===joy.id){joy.id=null;joy.x=joy.y=0;$('joyKnob').style.transform='';const b=$('joyBase');b.style.left='';b.style.top='';b.style.bottom='';b.classList.remove('run');}if(tc.identifier===look.id){if(look.moved<10&&state==='play')doInteract('any');look.id=null;}}}
canvas.addEventListener('touchend',endTouch);canvas.addEventListener('touchcancel',endTouch);
function tbtn(id,fn,hold){const b=$(id);
 b.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();initAudio();if(state!=='play')return;fn();clearInterval(b._h);if(hold)b._h=setInterval(()=>{if(state==='play')fn(true);else clearInterval(b._h);},160);},{passive:false});
 const up=e=>{e.preventDefault();clearInterval(b._h);};b.addEventListener('touchend',up);b.addEventListener('touchcancel',up);
 b.addEventListener('mousedown',e=>{e.preventDefault();initAudio();if(state==='play')fn();});}

tbtn('bPlace',q=>doInteract('place',q),true);

tbtn('bUp',()=>openOverlay('upOv'));

let last=performance.now(),stepT=0,bobT=0,saveT=0,autoT=0,magT=0,frame=0;
let perfAcc=0,perfFrames=0;
function adaptPerf(dt){
 if(PREFS.quality!=='auto')return;perfAcc+=dt;perfFrames++;
 if(perfAcc<2.5)return;const fps=perfFrames/perfAcc;perfAcc=0;perfFrames=0;
 const maxPR=isTouch?Math.min(DPR,1.5):Math.min(DPR,2);
 if(fps<40&&curPR>.7){curPR=Math.max(.7,curPR-.15);renderer.setPixelRatio(curPR);renderer.setSize(innerWidth,innerHeight);if(shadowsOn&&fps<30)setShadows(false);}
 else if(fps>58&&curPR<maxPR-.01){curPR=Math.min(maxPR,curPR+.1);renderer.setPixelRatio(curPR);renderer.setSize(innerWidth,innerHeight);}
}
function update(dt,tm){
 let mx=0,mz=0;
 if(keys.KeyW||keys.ArrowUp)mz+=1;if(keys.KeyS||keys.ArrowDown)mz-=1;if(keys.KeyA||keys.ArrowLeft)mx-=1;if(keys.KeyD||keys.ArrowRight)mx+=1;
 mx+=joy.x;mz-=joy.y;
 const len=Math.hypot(mx,mz);let moving=false;
 if(len>.1){const n=Math.max(1,len);mx/=n;mz/=n;
  const sprint=keys.ShiftLeft||keys.ShiftRight||(joy.id!==null&&Math.hypot(joy.x,joy.y)>.96);const spd=upv('speed')*(sprint?1.5:1)*(S.up.cart?0.95:1);
  const fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
  player.x+=(fx*mz+rx*mx)*spd*dt;player.z+=(fz*mz+rz*mx)*spd*dt;collide(player,.35);moving=true;
  bobT+=dt*spd*2.2;stepT-=dt*(sprint?1.5:1);if(stepT<=0){stepT=.42;sfx('step');}
 }
 const bob=moving?Math.sin(bobT)*.035:0;
 camera.position.set(player.x,1.62+bob,player.z);camera.rotation.set(pitch,yaw,0);
 holdGroup.position.y=-.46+(moving?Math.abs(Math.cos(bobT))*.02:0);
 computeTarget();
 if(interactHeld){interactTimer-=dt;if(interactTimer<=0){interactTimer=.14;doInteract('any',true);}}
 if(S.up.auto&&S.held.length){autoT-=dt;if(autoT<=0){autoT=.18;for(const sh of shelves){if(!S.unlocked[sh.zone]||sh.filled>=sh.slots.length||!S.held.includes(sh.cat))continue;const d=Math.hypot(sh.front.x-player.x,sh.front.z-player.z);if(d<3.2&&Math.abs(player.x-sh.front.x)<sh.w/2+1.2){placeOn(sh,true);break;}}}}
 const mr=upv('magnet');
 if(mr>0){magT-=dt;if(magT<=0){magT=.12;if(S.held.length+pulling.length<capacity()){const want=S.held.length?new Set(S.held):null;let best=null,bd=mr;for(const f of floorItems){if(f.pulled)continue;if(want&&!want.has(f.c))continue;const d=Math.hypot(f.x-player.x,f.z-player.z);if(d<bd){bd=d;best=f;}}if(best){best.pulled=true;pulling.push(best);}}}}
 for(let i=pulling.length-1;i>=0;i--){const f=pulling[i];if(!floorItems.includes(f)){pulling.splice(i,1);continue;}const dx=player.x-f.x,dz=player.z-f.z,d=Math.hypot(dx,dz);const sp=Math.min(d,dt*7);f.x+=dx/d*sp;f.z+=dz/d*sp;f.y+=(.6-f.y)*dt*4;f.ry+=dt*8;updateFloorItem(f);if(d<.7){pulling.splice(i,1);f.pulled=false;if(!pickItem(f,true)){f.y=f.y0;updateFloorItem(f);}}}
 updateTweens(dt);updateGuides(tm);
 if(frame%2===0||!isTouch)updatePrompt();
 updateHUD();
 const z=zoneAt(player.x,player.z);const zt=z.icon+' '+zn(z.id);if($('zoneName')._z!==zt){$('zoneName')._z=zt;$('zoneName').textContent=zt;}
 if(++frame%(isTouch?8:5)===0)drawMap($('minimap'),false);
 setCls('lockHint','hidden',noLock||locked||isTouch);
 saveT+=dt;if(saveT>5){saveT=0;save();}
 if(spillTimer>0){spillTimer-=dt;if(spillTimer<=0){const open=SHELF_ZONES.filter(z=>S.unlocked[z.id]);if(open.every(z=>S.cleared[z.id])&&!floorItems.length&&open.length<SHELF_ZONES.length)spill();}}
 adaptPerf(dt);
}
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;const tm=now/1000;
 holdGroup.visible=state==='play';cartView.visible=state==='play'&&S.up.cart>0;
 if(state==='play')update(dt,tm);else{updateTweens(dt);if(state==='menu'){camera.position.set(0,2.2,16);camera.rotation.set(-.12,Math.sin(tm*.15)*.5,0);}}
 renderer.render(scene,camera);}
addEventListener('beforeunload',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();if(state==='play'&&(isTouch||noLock))openOverlay('pauseOv');}});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(LANGS[h])setLang(h);});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{relabel();});
applyQuality();
buildStart();
requestAnimationFrame(loop);
if(location.hash==='#autotest')setTimeout(autotest,800);
function autotest(){
 const R=[];const ok=(name,c)=>R.push((c?'✅ ':'❌ ')+name);
 try{
  renderer.render(scene,camera);ok('Draw calls (menu): '+renderer.info.render.calls, renderer.info.render.calls<400);
  startGame(true);noLock=true;
  ok('Items on floor: '+floorItems.length, floorItems.length===shelvesByZone.candy.concat(shelvesByZone.drinks).reduce((a,b)=>a+b.slots.length,0));
  ok('3 quests', S.quests.length===3);
  ok('7 fences', Object.keys(fences).length===7);
  const z0=player.z;keys.KeyW=true;for(let i=0;i<30;i++)update(1/60,i/60);keys.KeyW=false;ok('Walk W ('+(z0-player.z).toFixed(2)+' m)', z0-player.z>1.5);
  joy.id=99;joy.x=0;joy.y=-1;const z1=player.z;for(let i=0;i<30;i++)update(1/60,i/60);joy.id=null;joy.x=joy.y=0;ok('Joystick + auto-run ('+(z1-player.z).toFixed(2)+' m)', z1-player.z>2.5);
  const sh0=shelvesByZone.candy[0];player.x=sh0.group.position.x;player.z=sh0.group.position.z;collide(player,.35);ok('Shelf collision', Math.abs(player.z-sh0.group.position.z)>sh0.d/2);
  const aimAt=(x,z,y)=>{const dx=x-player.x,dz=z-player.z;yaw=Math.atan2(-dx,-dz);const d=Math.hypot(dx,dz);pitch=Math.atan2((y||0)-1.62,d);camera.position.set(player.x,1.62,player.z);camera.rotation.set(pitch,yaw,0);camera.updateMatrixWorld();};
  const f=floorItems.find(f=>f.c===sh0.cat);player.x=f.x;player.z=f.z+1.6;collide(player,.35);aimAt(f.x,f.z,f.y);computeTarget();
  ok('Aim at item', target&&target.type==='item');doInteract('any');ok('Pick up', S.held.length===1);
  const shD=shelvesByZone.drinks[0];player.x=shD.front.x;player.z=shD.front.z+.8;aimAt(shD.front.x,shD.group.position.z,1);computeTarget();ok('Aim at shelf', target&&target.type==='shelf');
  const c0=S.coins;doInteract('any');ok('Block wrong shelf', S.held.length===1&&shD.filled===0);
  player.x=sh0.front.x;player.z=sh0.front.z+.8;aimAt(sh0.front.x,sh0.group.position.z,1);computeTarget();doInteract('any');ok('Stock right shelf (+'+(S.coins-c0)+')', sh0.filled===1&&S.coins>c0&&S.held.length===0);
  // touch pick fallback (no aim)
  const wasT=isTouch;isTouch=true;const f2=floorItems[0];player.x=f2.x+.8;player.z=f2.z;collide(player,.35);yaw+=Math.PI;target=null;doInteract('pick');ok('Touch PICK button picks nearby item', S.held.length===1);dropItem();isTouch=wasT;
  const fs=floorItems.filter(f=>f.c===sh0.cat).slice(0,5);fs.forEach(f=>pickItem(f,true));ok('Capacity 3', S.held.length===3);
  let guard=0;while((floorItems.length||S.held.length)&&guard++<500){while(S.held.length<capacity()&&floorItems.length)pickItem(floorItems[0],true);S.held.slice().forEach(c=>{const sh=nearestShelfFor(c);if(sh)placeOn(sh,true);});}
  ok('Cleared Sweets & Drinks', S.cleared.candy&&S.cleared.drinks);
  S.coins+=10000;tryUnlock('produce');ok('No out-of-order unlock', !S.unlocked.produce);
  tryUnlock('canned');ok('Unlock Canned ('+floorItems.length+' items)', S.unlocked.canned&&!fences.canned&&floorItems.length===36);
  UPG.forEach(u=>{while(S.up[u.id]<u.costs.length)buyUpgrade(u.id);});ok('All upgrades, capacity '+capacity(), capacity()===36);
  closeOverlays();state='play';
  const fm=floorItems[0];player.x=fm.x+2;player.z=fm.z;collide(player,.35);const before=S.held.length;for(let i=0;i<120;i++)update(1/60,i/60);ok('Magnet ('+(S.held.length-before)+')', S.held.length>before);
  const c=S.held[0];const sa=nearestShelfFor(c);const f0=sa.filled;player.x=sa.front.x;player.z=sa.front.z+.3;collide(player,.35);for(let i=0;i<60;i++)update(1/60,i/60);ok('Auto-stock', sa.filled>f0);
  const hl=S.held.length,fl=floorItems.length;if(hl){dropItem();ok('Drop', S.held.length===hl-1&&floorItems.length===fl+1);}
  save();const snap=JSON.stringify([S.coins,S.unlocked,shelves.map(s=>s.filled),floorItems.length,S.held]);applyState(loadSave());const snap2=JSON.stringify([S.coins,S.unlocked,shelves.map(s=>s.filled),floorItems.length,S.held]);ok('Save/load roundtrip', snap===snap2);
  // i18n
  const langs=['en','pt','es','id','vi'];let allOk=true;const keysVi=Object.keys(T.vi);
  langs.forEach(l=>{const miss=keysVi.filter(k=>T[l][k]==null);if(miss.length){allOk=false;R.push('❌ '+l+' missing: '+miss.join(','));}});
  ok('All 5 languages have every key ('+keysVi.length+')', allOk);
  const lbl0=dynLabels.length;setLang('pt');ok('Switch to PT: '+$('zoneName').textContent+' / '+document.title, document.title==='Supermercado Bagunçado HiHi'&&t('z_candy')==='Doces'&&$('pResume').textContent.includes('Continuar'));
  ok('3D signs relabelled ('+dynLabels.length+')', dynLabels.length===lbl0&&lbl0>20);
  setLang('es');renderUpgrades();ok('ES upgrades: '+$('upGrid').querySelector('h3').textContent, $('upGrid').querySelector('h3').textContent==='Capacidad');
  setLang('id');ok('ID quest: '+$('qlist').textContent.slice(0,40), true);
  setLang('en');
  S.coins+=20000;['produce','household','fridge','warehouse','discount','premium'].forEach(z=>tryUnlock(z));ok('All 9 areas open, labels '+dynLabels.length, SHELF_ZONES.every(z=>S.unlocked[z.id])&&!Object.keys(fences).length);
  guard=0;while((floorItems.length||S.held.length)&&guard++<500){while(S.held.length<capacity()&&floorItems.length)pickItem(floorItems[0],true);S.held.slice().forEach(c=>{const sh=nearestShelfFor(c);if(sh)placeOn(sh,true);});}
  ok('All shelves full', shelves.every(s=>s.filled===s.slots.length)&&SHELF_ZONES.every(z=>S.cleared[z.id]));
  showDayComplete();ok('Day complete: '+$('dayText').textContent.slice(0,40), !$('dayOv').classList.contains('hidden'));
  startNewDay();ok('New day items '+floorItems.length, S.day===2&&floorItems.length===shelves.reduce((a,b)=>a+b.slots.length,0));
  closeOverlays();state='play';player.x=0;player.z=5;yaw=0;pitch=0;update(1/60,0);renderer.render(scene,camera);ok('Draw calls in play (all shelves full + 282 floor items): '+renderer.info.render.calls, true);
  renderMap();renderUpgrades();drawMap($('minimap'),false);ok('Map & upgrades render', true);
  setLang('vi');
 }catch(e){R.push('💥 '+e.message+' '+(e.stack||'').split('\n')[1]);}
 noSave=true;try{localStorage.removeItem(SAVE_KEY);localStorage.removeItem(PREF_KEY);}catch(e){}
 closeOverlays();state='modal';
 const d=document.createElement('div');d.style.cssText='position:fixed;inset:20px;z-index:100;background:#fff;color:#222;padding:16px;border-radius:12px;font:14px/1.45 Arial;overflow:auto';d.innerHTML='<b>AUTOTEST</b><br>'+R.join('<br>');document.body.appendChild(d);
}
