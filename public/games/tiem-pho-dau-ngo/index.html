  function playSeconds(){return startAt?Math.max(0,Math.floor((Date.now()-startAt)/1000)):0;}
  function start(source){
    if(started) return;
    started=true; startAt=Date.now();
    send('game_start',{start_source:String(source||'interaction'),play_time_seconds:0});
    setTimeout(function(){if(started)send('game_engaged_60s',{play_time_seconds:60});},60000);
  }
  if(cfg.gameSlug==='pho-ha-noi'||cfg.gameSlug==='o-to-bay'||cfg.gameSlug==='mot-ngay-lam-cho-hihi'||cfg.gameSlug==='chao-long-anh-beo'||cfg.gameSlug==='tiem-pho-dau-ngo'){
    window.addEventListener('gamehihi:game-start',function(){start('game_started');},{once:true});
  }else{
  ['pointerdown','touchstart','keydown'].forEach(function(ev){
    window.addEventListener(ev,function(){start(ev);},{passive:true,once:true});
  });
  }

  function submitScore(score,mode,meta,source){
    score=Math.max(0,Math.floor(Number(score)||0));
    var now=Date.now();
    if(lastSubmitScore===score && now-lastSubmitAt<3000)return;
    lastSubmitScore=score;lastSubmitAt=now;
    var data=merge({score:score,mode:String(mode||'').slice(0,50),play_time_seconds:playSeconds(),submit_source:String(source||'game')},cleanMeta(meta));
    send('score_submit',data);
  }

  var originalScore=window.GameHiHiDirectEventScore;
  if(typeof originalScore==='function'){
    window.GameHiHiDirectEventScore=function(payload){
      payload=payload||{}; start('score');
      var score=Math.max(0,Math.floor(Number(payload.score)||0));
      var data=merge({score:score,mode:String(payload.mode||'').slice(0,50),final:payload.final?1:0,play_time_seconds:playSeconds()},cleanMeta(payload.meta));
      send('game_score',data); // giữ event cũ để không gãy report hiện tại
      if(payload.final)submitScore(score,payload.mode,payload.meta,'final_score');
      return originalScore.apply(this,arguments);
    };
  }

  var originalEnd=window.GameHiHiEndGame;
  if(typeof originalEnd==='function'){
    window.GameHiHiEndGame=function(payload){
      payload=payload||{}; start('end_game');
      if(cfg.gameSlug==='pho-ha-noi'||cfg.gameSlug==='oc-dem-hihi'||cfg.gameSlug==='net-co-hihi'||cfg.gameSlug==='1-ngay-lam-cho-hihi'||cfg.gameSlug==='mot-ngay-lam-cho-hihi'||cfg.gameSlug==='hihi-trap-run'||cfg.gameSlug==='la-het-trong-toa-let'||cfg.gameSlug==='mot-ngay-lam-thu-ky'||cfg.gameSlug==='o-to-bay'||cfg.gameSlug==='chao-long-anh-beo'||cfg.gameSlug==='tiem-pho-dau-ngo'){
        return Promise.resolve(originalEnd.apply(this,arguments)).then(function(j){
          if(j&&j.saved){
            var actual=Math.max(0,Math.floor(Number(j.score)||0));
            var data=merge({score:actual,mode:String(payload.mode||'').slice(0,50),result:String(payload.result||'').slice(0,40),play_time_seconds:playSeconds(),submit_source:((cfg.gameSlug==='hihi-trap-run'||cfg.gameSlug==='la-het-trong-toa-let')?'level_saved':(cfg.gameSlug==='o-to-bay'?'round_saved':'day_saved'))},cleanMeta(payload.meta));
            send('game_score',data);
            send('score_submit',data);
            send('game_end',data);
          }
          return j;
        });
      }
      var score=Math.max(0,Math.floor(Number(payload.score)||0));
      submitScore(score,payload.mode,payload.meta,'end_game');
      var data=merge({
        score:score,
        mode:String(payload.mode||'').slice(0,50),
        result:String(payload.result||'').slice(0,40),
        play_time_seconds:playSeconds()
      },cleanMeta(payload.meta));
      send('game_end',data);
      return originalEnd.apply(this,arguments);
    };
  }

  function sendExit(){
    if(exitSent) return; exitSent=true;
    send('game_exit',{started:started?1:0,play_time_seconds:playSeconds(),transport_type:'beacon'});
  }
  window.addEventListener('pagehide',sendExit,{passive:true});
  window.addEventListener('beforeunload',sendExit,{passive:true});

  window.GameHiHiGA4={measurementId:gameMid,masterMeasurementId:masterMid,targets:targets.slice(),userId:uid,sessionId:gameSession,send:send,start:start,submitScore:submitScore};
})();</script>

      <span class="a">Tiệm Phở Đầu Ngõ ăn ngon tuyệt vời ắ ấ ầ ẩ ẫ ậ đ ơ ư ở ữ ự</span>
      <span class="b">Phở</span><span class="c">Phở</span><span class="d">Phở</span><span class="e">Phở</span>
    </div>
  </body>
