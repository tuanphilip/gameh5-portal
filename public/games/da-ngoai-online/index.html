let pchat=null; // {members:[bot]}
function doing(a){if(a.state==='conga')return 'Đang nhảy vòng quanh lửa';if(a.seat){return {ground:'Đang ngồi dưới đất',log:'Đang ngồi bên đống lửa',chair:'Đang ngồi ghế',fish:'Đang câu cá',blanket:'Đang nằm ngắm sao',tent:'Đang nghỉ trong lều'}[a.seat.type]}if(a.propKind)return 'Đang cầm '+((FOODS[a.propKind]||{}).n||'cần câu');return 'Đang dạo quanh trại'}
function openCard(a){
  const inChat=pchat&&pchat.members.includes(a);
  const tag=a.remote?'<span class="online">● Người chơi online</span>':'<span class="online npc">🌙 Bạn trại ảo (NPC)</span>';
  // đang ngồi trong phòng chờ (online với người thật, hoặc phòng có bạn trại ảo) → mời thẳng người này vào phòng
  const R=NET.room,onRoom=a.remote&&MG&&MG.online&&R&&R.state!=='play'&&R.members.length<R.max&&!R.members.some(m=>m.id===a.id),
    npcRoom=!a.remote&&MG&&!MG.online&&MG.room&&!MG.started&&MG.addMember&&!MG.room.members.some(m=>m.name===a.c.name);
  const room=onRoom?{code:R.code,game:R.game}:npcRoom?{code:MG.room.code,game:MG.game}:null;
  openModal(`<h2>${esc(a.c.name)}</h2><p class="note">${tag} ${doing(a)} · ${a.c.gender==='f'?'Nữ':'Nam'}</p>
  ${room?`<button class="cta" id="cRoom">➕ Mời vào phòng #${room.code} · ${mgDef(room.game).i} ${mgDef(room.game).n}</button>`:''}
  <button class="${room?'ghost':'cta'}" id="cGame" ${a.remote&&!NET.online?'disabled':''}>🎮 Mời vào phòng chơi mini-game</button>
  <div class="row"><button class="ghost" id="cWave" style="flex:1">👋 Vẫy tay chào</button><button class="ghost" id="cChat" style="flex:1" ${inChat?'disabled':''}>${inChat?'Đang trò chuyện':a.remote?'💬 Nhắn riêng':pchat?'Mời vào cuộc trò chuyện':'Mời trò chuyện riêng'}</button></div><button class="ghost" id="mClose">Đóng</button>`);
  $('#mClose').onclick=closeModal;
  $('#cGame').onclick=()=>inviteGamePicker(a);
  if($('#cRoom'))$('#cRoom').onclick=()=>{closeModal();mgEl.hidden=false;
    if(a.remote){roomInvite(a);return}
    toast(a.c.name+' nhận lời, đang vào phòng…');setTimeout(()=>{if(MG&&MG.addMember&&!MG.started)MG.addMember(a.c.name)},rndInt(600,1400))};
  $('#cWave').onclick=()=>{closeModal();player.rot=faceTo(player.pos.x,player.pos.z,a.pos.x,a.pos.z);player.setEmote('wave');if(a.remote)return;setTimeout(()=>{a.setEmote('wave');a.say('Chào '+player.c.name+'!')},800)};
  $('#cChat').onclick=()=>{closeModal();if(pchat&&pchat.members.length>=3){toast('Một cuộc trò chuyện tối đa 4 người');return}
    if(a.remote){openPChat(a);setTimeout(()=>$('#pIn').focus(),60);return}
    toast('Đã gửi lời mời tới '+a.c.name+'. Chờ bạn ấy đồng ý…');
    setTimeout(()=>{if(Math.random()<.82){openPChat(a)}else toast(a.c.name+' đang bận, lát nữa thử lại nhé')},rnd(1500,3000))};
}
function openPChat(a){if(!pchat)pchat={members:[]};if(!pchat.members.includes(a))pchat.members.push(a);$('#pchat').hidden=false;$('#pwho').textContent='· '+pchat.members.map(m=>m.c.name).join(', ')+' và bạn';
  if(a.remote){pLine('Hệ thống','Tin nhắn ở đây chỉ gửi riêng tới '+a.c.name);return}
  pLine('Hệ thống',a.c.name+' đã vào cuộc trò chuyện');setTimeout(()=>pLine(a.c.name,pick(['Hi bạn! Tối nay thế nào?','Chào nha, rảnh nói chuyện chút ha','Hello, bạn ở trại lâu chưa?'])),900)}
function pLine(n,t,raw){const d=document.createElement('div');if(raw)d.setAttribute('translate','no');if(n==='Hệ thống'){d.className='sys';d.style.color='var(--ok)';d.textContent=t}else{const b=document.createElement('b');b.textContent=n+': ';d.append(b,document.createTextNode(t))}$('#plog').append(d);$('#plog').scrollTop=1e6}
const P_REPLY=[[/buồn|mệt|chán|stress|áp lực/i,['Ôm bạn nè. Kể mình nghe chuyện gì vậy?','Mệt thì cứ nghỉ chút, không sao đâu.','Mình hiểu cảm giác đó lắm.']],[/vui|thích|hay|tuyệt/i,['Nghe vui lây luôn!','Hihi mình cũng thấy vậy','Tuyệt ghê!']],[/tên|ai/i,['Mình là '+'{n}'+' nè','Gọi mình là {n} được rồi']],[/cá|câu/i,['Mình mới câu được con cá rô bé xíu','Ra cầu gỗ câu cá chill lắm']],[/ăn|đói|nướng|xiên/i,['Quầy ăn vặt có xiên nướng ngon lắm','Đói quá, đi nướng ngô không?']],[/./,['Ừa đúng rồi','Kể tiếp đi','Hihi','Thật hả?','Mình cũng nghĩ vậy','Ở đây yên bình ghê ha']]];
$('#pform').addEventListener('submit',e=>{e.preventDefault();const v=$('#pIn').value.trim();if(!v||!pchat)return;if(BAD_WORDS.test(v)){toast('Nói nhẹ nhàng thôi nhé, trại không dùng từ tục');return}$('#pIn').value='';pLine(player.c.name,v,true);
  pchat.members.filter(m=>m.remote).forEach(m=>netSend({t:'pm',to:m.id,text:v}));
  pchat.members.filter(m=>!m.remote).forEach((m,i)=>{if(i>0&&Math.random()<.5)return;setTimeout(()=>{const r=P_REPLY.find(x=>x[0].test(v));pLine(m.c.name,pick(r[1]).replace('{n}',m.c.name))},rnd(1000,2600)+i*800)})});
$('#pleave').onclick=()=>{pchat=null;$('#pchat').hidden=true;$('#plog').innerHTML='';toast('Bạn đã rời cuộc trò chuyện')};
function botInvite(){if(pchat||MG||mode!=='play'||!$('#modal').hidden||activity==='cook'||activity==='chop')return;const b=pick(bots);if(!b)return;
  openModal(`<h2>Lời mời trò chuyện</h2><p style="margin:0">${esc(b.c.name)} muốn trò chuyện riêng với bạn. Tin nhắn riêng không được lưu lại.</p><div class="row"><button class="ghost" id="no" style="flex:1">Từ chối</button><button class="cta" id="yes" style="flex:1">Đồng ý</button></div>`);
  $('#no').onclick=()=>{closeModal()};$('#yes').onclick=()=>{closeModal();openPChat(b)}}

/* ======================= TRẠI, MỜI BẠN, CÀI ĐẶT ======================= */
const CAMPS=[...Array(20)].map((_,i)=>({n:'Trại '+(i+1),c:null}));
const NPC_N=4; // số bạn trại ảo bầu bạn trong mỗi trại (chạy trên máy từng người)
let campIdx=0;
function updateCampBtn(){$('#campTxt').textContent=CAMPS[campIdx].n+' · '+(NET.online?(remotes.size+1)+' online':NET.ws?'đang kết nối…':'ngoại tuyến')+' ▾';$('#net').className=NET.online?'on':NET.ws?'wait':''}
function campGrid(){return CAMPS.map((c,i)=>{const n=i===campIdx&&NET.online?remotes.size+1:c.c;const s=n===null?'…':n;return `<button class="camp ${i===campIdx?'here':''}" data-c="${i}">${i===campIdx?'<em>Bạn ở đây</em>':''}${c.n}<span>${s} / 30 online</span><div class="bar"><i style="width:${(n||0)/30*100}%"></i></div></button>`}).join('')}
function openCamps(){
  openModal(`<h2>Đến một khu cắm trại khác</h2><div class="invitebox"><p class="note">Mời bạn bè cùng vào trại. Người nhận đường dẫn sẽ vào đúng trại của bạn.</p><button class="cta" id="campInvite">➕ Mời bạn bè</button></div>
  <p class="note">Khu trại nào cũng giống nhau. Con số là số người chơi thật đang online. Trại nào cũng có vài bạn trại ảo (NPC) ngồi cùng cho đỡ vắng.</p>
  <div class="campgrid" id="campGrid">${campGrid()}</div>
  <button class="ghost" id="mClose">Đóng</button>`);
  $('#mClose').onclick=closeModal;$('#campInvite').onclick=()=>{closeModal();$('#inviteBtn').click()};
  $('#campGrid').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b)return;const i=+b.dataset.c;closeModal();if(i===campIdx)return;
    if(CAMPS[i].c>=30){toast(CAMPS[i].n+' đã đủ 30 người, chọn trại khác nhé');return}
    switchCamp(i)});
  if(NET.base!==null)fetch(NET.base+'/api/camps',{cache:'no-store'}).then(r=>r.json()).then(j=>{j.counts.forEach((n,i)=>CAMPS[i].c=n);const g=$('#campGrid');if(g)g.innerHTML=campGrid()}).catch(()=>{})}
function switchCamp(i){endActivity();player.leave();campIdx=i;try{history.replaceState(null,'','#trai-'+(i+1))}catch(e){}
  const names=BOT_NAMES.slice().sort(()=>Math.random()-.5);spawnBots(NPC_N,names);player.pos.set(0,0,6.5);toast('Đã chuyển sang '+CAMPS[i].n);sysLog('Bạn vừa đến '+CAMPS[i].n+'.');netConnect();updateCampBtn()}
$('#campBtn').onclick=openCamps;
function shareLink(){const base=(window.GAME_URL||location.href).split('#')[0];return base+'#trai-'+(campIdx+1)}
$('#inviteBtn').onclick=()=>{const link=shareLink(),msg=`Vào Trại An Yên HiHi ngồi bên đống lửa với mình nha! 🔥 Mình đang ở ${CAMPS[campIdx].n}.`;
  const E=encodeURIComponent,mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  openModal(`<h2>Mời bạn bè vào trại</h2><p class="note">Bạn bè mở đường dẫn sẽ vào thẳng ${CAMPS[campIdx].n} cùng bạn.</p>
  <div class="share">
   <a href="https://www.facebook.com/sharer/sharer.php?u=${E(link)}&quote=${E(msg)}" target="_blank" rel="noopener" style="background:#1877f2">Facebook</a>
   ${mobile?`<a href="fb-messenger://share/?link=${E(link)}" style="background:linear-gradient(135deg,#0099ff,#a033ff,#ff5280)">Messenger</a>`:`<button id="msgr" style="background:linear-gradient(135deg,#0099ff,#a033ff,#ff5280)">Messenger</button>`}
   ${window.__lang.L==='vi'?'<button id="zalo" style="background:#0068ff">Zalo</button>':`<a href="https://wa.me/?text=${E(msg+' '+link)}" target="_blank" rel="noopener" style="background:#25d366">WhatsApp</a>`}
   <button id="nshare" style="background:#3a4157">Chia sẻ khác…</button>
  </div>
  <div class="lbl" style="margin:0">Đường dẫn mời</div><input id="lnk" class="inp" readonly value="${esc(link)}"><button class="cta" id="cp">Sao chép đường dẫn</button><button class="ghost" id="mClose">Đóng</button>`);
  $('#mClose').onclick=closeModal;
  const copy=(after)=>{const done=()=>{toast(after||'Đã sao chép đường dẫn. Gửi cho bạn bè nhé');};try{navigator.clipboard.writeText(msg+' '+link).then(done,()=>{$('#lnk').select();toast('Hãy nhấn giữ đường dẫn để sao chép')})}catch(e){$('#lnk').select();toast('Hãy nhấn giữ đường dẫn để sao chép')}};
  $('#cp').onclick=()=>copy();
  if($('#msgr'))$('#msgr').onclick=()=>{copy('Đã sao chép lời mời. Mở Messenger, chọn bạn bè rồi dán vào khung chat');const a=document.createElement('a');a.href='https://www.messenger.com/';a.target='_blank';a.rel='noopener';document.body.append(a);a.click();a.remove()};
  if($('#zalo'))$('#zalo').onclick=()=>{copy('Đã sao chép lời mời. Mở Zalo, chọn bạn bè rồi dán vào khung chat');if(navigator.share&&mobile){navigator.share({title:'Trại An Yên HiHi',text:msg,url:link}).catch(()=>{})}else{const a=document.createElement('a');a.href='https://chat.zalo.me/';a.target='_blank';a.rel='noopener';document.body.append(a);a.click();a.remove()}};
  $('#nshare').onclick=()=>{if(navigator.share){navigator.share({title:'Trại An Yên HiHi',text:msg,url:link}).catch(()=>{})}else copy('Máy này chưa hỗ trợ chia sẻ nhanh. Đã sao chép lời mời để bạn dán vào Zalo, Messenger…')};
};
$('#setBtn').onclick=()=>{openModal(`<h2>Cài đặt</h2>
  <div><div class="lbl">Âm lượng chung</div><input type="range" id="vol" min="0" max="1" step=".05" value="${vol}" style="width:100%"></div>
  <div><div class="lbl">Nhạc nền</div><input type="range" id="musv" min="0" max="1" step=".05" value="${musVol}" style="width:100%"></div>
  <div><div class="lbl">Tiếng rừng, lửa, hồ</div><input type="range" id="ambv" min="0" max="1" step=".05" value="${ambVol}" style="width:100%"></div>
  <div><div class="lbl">Đồ hoạ</div><div class="chips"><button class="chip ${quality==='high'?'on':''}" data-q="high">Đẹp (có bóng đổ)</button><button class="chip ${quality==='low'?'on':''}" data-q="low">Nhẹ (máy yếu)</button></div></div>
  <div><div class="lbl">Tên trên đầu</div><div class="chips"><button class="chip ${showNames?'on':''}" data-n="1">Hiện</button><button class="chip ${!showNames?'on':''}" data-n="0">Ẩn</button></div></div>
  <div><div class="lbl">Ngôn ngữ / Language</div>${window.__lang.picker()}</div>
  <button class="ghost" id="howto">Cách chơi</button><button class="ghost" id="mClose">Đóng</button>`);
  $('#mClose').onclick=closeModal;
  $('#vol').oninput=e=>{vol=+e.target.value;store('tay_vol',vol);if(AC&&soundOn)master.gain.setTargetAtTime(vol,AC.currentTime,.05)};
  $('#musv').oninput=e=>{musVol=+e.target.value;store('tay_mus',musVol);if(AC)AU.mus.gain.setTargetAtTime(musVol,AC.currentTime,.05)};
  $('#ambv').oninput=e=>{ambVol=+e.target.value;store('tay_amb',ambVol);if(AC)AU.amb.gain.setTargetAtTime(ambVol,AC.currentTime,.05)};
  $('#mbox').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{quality=b.dataset.q;store('tay_quality',quality);renderer.setPixelRatio(Math.min(devicePixelRatio,quality==='high'?2:1));renderer.shadowMap.enabled=quality==='high';scene.traverse(o=>{if(o.material)o.material.needsUpdate=true});resize();$('#setBtn').click()});
  $('#mbox').querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{showNames=b.dataset.n==='1';store('tay_names',showNames);actors.forEach(a=>a.label.visible=showNames);$('#setBtn').click()});
  $('#howto').onclick=howTo};
function howTo(){openModal(`<h2>Cách chơi</h2><div class="note" style="font-size:13px;line-height:1.7">
  • <b>Trại online:</b> người có tên nền xanh ● là người chơi thật đang online cùng trại; tên nền tối là bạn trại ảo (NPC). Lửa trại, tiệc và đèn ước được chia sẻ với mọi người trong trại.<br>
  • <b>Máy tính:</b> WASD / mũi tên để đi, E để ngồi / chơi, Enter để chat, kéo chuột để xoay nhìn, lăn chuột để phóng to.<br>
  • <b>Điện thoại:</b> kéo cần điều khiển ở góc trái để đi, hoặc chạm vào mặt đất để tự đi tới đó; kéo màn hình để xoay nhìn. Xoay ngang máy để chơi thoải mái nhất (nút ⛶ để toàn màn hình).<br>
  • <b>Bấm vào đồ vật:</b> khúc gỗ, ghế, thảm, lều, quầy ăn, bếp nướng, gốc chẻ củi, hòm thư, hoa đăng trên hồ.<br>
  • <b>Bấm vào người khác:</b> xem thẻ, vẫy tay hoặc nhắn riêng.<br>
  • <b>Thanh hoạt động:</b> Ngồi, Ngắm sao, Quầy ăn (rồi nướng), Thêm củi, Câu cá, Tiệc, Nhảy vòng, Hoa đăng, Ngủ lều, Chẻ củi, Vẫy tay.<br>
  • <b>Mini-game:</b> bấm 🎮 hoặc đi tới sàn Kéo Búa Bao, bàn cờ, sân nhảy, bến thuyền rồi bấm E / nút Chơi. Nhận xu, XP, làm nhiệm vụ ngày và leo BXH tuần.<br>
  • <b>Chat:</b> nhấn Enter (hoặc nút 💬 trên điện thoại) để gõ; mọi người trong trại đều thấy, lời nói hiện thành bong bóng trên đầu.</div><button class="cta" id="mClose">Đã hiểu</button>`);$('#mClose').onclick=closeModal}

$('#chatform').addEventListener('submit',e=>{e.preventDefault();const v=$('#chatIn').value.trim();if(!v)return;if(BAD_WORDS.test(v)){toast('Nói nhẹ nhàng thôi nhé, trại không dùng từ tục');return}player.say(v,false,true);netSend({t:'chat',text:v});$('#chatIn').value='';$('#chatIn').blur();sfx('pop');npcRespond(v)});

/* ======================= CREATOR ======================= */
let tab='body';
const pane=$('#pane');
const ICON=2;
function optGrid(list,key,label,withIcon){const cur=list.find(o=>o[0]===cfg[key]);return `<div class="sec"><div class="lbl"><span>${label}</span>${cur&&cur[0]!=='none'?`<em>${cur[1]}</em>`:''}</div><div class="grid">${list.map(o=>`<button class="opt ${cfg[key]===o[0]?'on':''}" data-k="${key}" data-v="${o[0]}">${withIcon?`<i>${o[ICON]}</i>`:''}<span>${o[1]}${lockPrice(key,o[0])?`<br><small class="lock">🔒 ${lockPrice(key,o[0])} xu</small>`:''}</span></button>`).join('')}</div></div>`}
function swatches(list,key,label){const v=cfg[key]||'#ffffff',custom=!list.includes(v);return `<div class="sec"><div class="lbl"><span>${label}</span></div><div class="sw">${list.map(c=>`<button class="dot ${v===c?'on':''}" style="background:${c}" data-k="${key}" data-v="${c}" aria-label="Màu ${c}"></button>`).join('')}<label class="dot pick ${custom?'on':''}" title="Tự chọn màu" style="background:${custom?v:'conic-gradient(#ff4d4d,#ffd23f,#5fe07a,#4fc3d9,#6c8cff,#e05cff,#ff4d4d)'}"><input type="color" data-k="${key}" value="${/^#[0-9a-f]{6}$/i.test(v)?v:'#ffffff'}" aria-label="${label}: tự chọn màu"></label></div></div>`}
function renderPane(){let h='';const st=pane.scrollTop;
  if(tab==='body')h+=`<div class="sec"><div class="lbl">Giới tính</div><div class="gender"><button class="opt ${cfg.gender==='m'?'on':''}" data-k="gender" data-v="m">👦 Nam</button><button class="opt ${cfg.gender==='f'?'on':''}" data-k="gender" data-v="f">👧 Nữ</button></div></div>`+swatches(SKINS,'skin','Màu da')+`<p class="note">Có ${HAIRS.length} kiểu tóc, ${OUTFITS.length} bộ đồ × ${PATTERNS.length} họa tiết và ${HATS.length+FACES.length+NECKS.length+BACKS.length-4} phụ kiện. Ô 🌈 cuối mỗi hàng màu để tự chọn bất kỳ màu nào.</p>`;
  if(tab==='hair'){const g=cfg.gender,mine=HAIRS.filter(x=>x[2]==='u'||x[2]===g),other=HAIRS.filter(x=>x[2]!=='u'&&x[2]!==g);
    h+=optGrid(mine,'hair','Kiểu tóc '+(g==='m'?'nam':'nữ'))+swatches(HAIR_COLORS,'hairColor','Màu tóc')+optGrid(other,'hair','Kiểu tóc khác (ai cũng chọn được)')}
  if(tab==='clothes'){h+=optGrid(cfg.gender==='m'?OUTFITS.filter(o=>!o[3]):OUTFITS,'outfit','Bộ đồ',1);
    const fixed=cfg.outfit==='stripe'||cfg.outfit==='school';
    h+=swatches(OUT_COLORS,'color',fixed?'Màu áo (bộ này có màu cố định)':'Màu áo');
    if(!fixed){h+=optGrid(PATTERNS,'pattern','Họa tiết vải',1);if(cfg.pattern!=='plain')h+=swatches(PAT_COLORS,'pcolor','Màu họa tiết')}
    h+=swatches(COLOR2,'color2','Màu quần / chi tiết')+swatches(SHOE_COLORS,'shoe','Màu giày')}

  pane.innerHTML=h;pane.scrollTop=st}

/* ======================= 1. KÉO BÚA BAO ======================= */
const RPS=[['bua','✊','Búa'],['bao','✋','Bao'],['keo','✌️','Kéo']];
const rpsBeats=(a,b)=>(a==='bua'&&b==='keo')||(a==='keo'&&b==='bao')||(a==='bao'&&b==='bua');
async function rpsGame(names,tok){
  const alive=()=>MG&&MG.tok===tok;const pl=names.slice().sort(()=>Math.random()-.5);let size=2;while(size<pl.length)size*=2;
  // xếp miễn đấu: người miễn được rải đều để không ai miễn 2 lần liền
  let round=[];const byes=size-pl.length;for(let i=0,k=0;i<size/2;i++){round.push([pl[k++],i<byes?null:pl[k++]])}
  const rounds=[];const elim={};let wins={};names.forEach(n=>wins[n]=0);let roundNo=0;
  while(true){roundNo++;rounds.push(round.map(m=>({a:m[0],b:m[1],w:null})));const cur=rounds[rounds.length-1];
    for(const m of cur){if(!alive())return;
      if(!m.b){m.w=m.a;continue}
      if(m.a!==player.c.name&&m.b!==player.c.name){await wait(350);m.w=Math.random()<.5?m.a:m.b;wins[m.w]++;continue}
      const w=await rpsDuel(m.a===player.c.name?m.b:m.a,roundNo,rounds,tok);if(w===undefined)return;m.w=w;wins[w]++}
    cur.forEach(m=>{const l=m.w===m.a?m.b:m.a;if(l)elim[l]=roundNo});
    const winners=cur.map(m=>m.w);if(winners.length===1){const champ=winners[0];elim[champ]=99;break}
    round=[];for(let i=0;i<winners.length;i+=2)round.push([winners[i],winners[i+1]||null])}
  if(!alive())return;MG.over=true;
  const rows=names.map(n=>({name:n,me:n===player.c.name,score:wins[n],r:elim[n]||0})).sort((a,b)=>b.r-a.r||b.score-a.score).map((x,i)=>({...x,label:x.r===99?'🏆 Quán quân':x.r===roundNo?'Á quân':'Vòng '+x.r+' · '+x.score+' thắng'}));
  mgResults('rps',rows,{title:rows[0].me?'Bạn là quán quân Kéo Búa Bao! 🏆':rows[0].name+' vô địch',best:wins[player.c.name],badge:rows[0].me?'Vua Oẳn Tù Tì':null})}
function bracketHTML(rounds){return `<div class="bracket">${rounds.map((r,i)=>`<div><div class="lbl">Vòng ${i+1}</div>${r.map(m=>`<div class="bm">${[m.a,m.b].map(x=>`<span class="${m.w&&m.w===x?'w':m.w?'l':''}${x===player.c.name?' me':''}">${x?esc(x):'— miễn đấu —'}</span>`).join('')}</div>`).join('')}</div>`).join('')}</div>`}
function rpsDuel(opp,roundNo,rounds,tok){return new Promise(res=>{let my=null,their=null,left=10,tries=0,done=false;const alive=()=>MG&&MG.tok===tok;
  function start(){my=null;their=null;left=10;tries++;
    const afk=Math.random()<.04;if(!afk)setTimeout(()=>{if(alive()&&!done)their=pick(RPS)[0],paint()},rndInt(1200,7000));
    paint();clearInterval(T);T=setInterval(()=>{if(!alive()){clearInterval(T);return res(undefined)}left--;paint();if(left<=0||(my&&their)){clearInterval(T);reveal()}},1000)}
  function paint(msg){if(!alive())return;mgShow(mgHead(`✊ Kéo Búa Bao · Vòng ${roundNo}`)+`<div class="mgbody"><div class="duel"><div><b>${esc(player.c.name)}</b><i id="hMe">${my?'✅':'❔'}</i></div><span class="score">${left}</span><div><b>${esc(opp)}</b><i>${their?'✅':'❔'}</i></div></div>
    <p class="note" style="text-align:center">${msg||(tries>1?'Hoà! Đấu lại. ':'')+(my?'Đã chọn bí mật, chờ đối thủ…':'Chọn bí mật trong 10 giây. Không chọn sẽ bị xử thua.')}</p>
    <div class="rpsb">${RPS.map(r=>`<button class="opt ${my===r[0]?'on':''}" data-r="${r[0]}" ${my?'disabled':''}><i>${r[1]}</i><span>${r[2]}</span></button>`).join('')}</div>${bracketHTML(rounds)}</div>`);
    bindQuit(leaveMid);mgEl.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{if(my)return;my=b.dataset.r;sfx('pop');paint()})}
  let T=null;
  async function reveal(){if(!alive())return;mgEl.querySelectorAll('[data-r]').forEach(b=>b.disabled=true);
    for(const w of ['Oẳn','tù','tì!']){paint(`<b style="font-size:24px">${w}</b>`);sfx('pop');await wait(380)}
    const sym=k=>k?RPS.find(r=>r[0]===k)[1]:'💤';let w;
    if(!my&&!their)w='again';else if(!my)w=opp;else if(!their)w=player.c.name;else if(my===their)w='again';else w=rpsBeats(my,their)?player.c.name:opp;
    mgShow(mgHead(`✊ Kéo Búa Bao · Vòng ${roundNo}`)+`<div class="mgbody"><div class="duel big2"><div><b>${esc(player.c.name)}</b><i class="pop">${sym(my)}</i></div><span>VS</span><div><b>${esc(opp)}</b><i class="pop">${sym(their)}</i></div></div>
      <h3 class="mgt">${w==='again'?'Hoà! Đấu lại…':w===player.c.name?(their?'Bạn thắng!':'Đối thủ không chọn, bạn thắng'):(my?esc(opp)+' thắng':'Bạn không chọn kịp, xử thua')}</h3>${bracketHTML(rounds)}</div>`);bindQuit(leaveMid);
    sfx(w===player.c.name?'win':w==='again'?'pop':'bad');await wait(1700);if(!alive())return res(undefined);
    if(w==='again'&&tries<6)return start();if(w==='again')w=Math.random()<.5?opp:player.c.name;done=true;res(w)}
  start()})}

/* ======================= 2. CỜ CARO ======================= */
const CN=15;
function caroWin(b,i,v){const x=i%CN,y=(i/CN)|0;for(const[dx,dy]of[[1,0],[0,1],[1,1],[1,-1]]){let c=1;for(const s of[1,-1]){let k=1;while(true){const nx=x+dx*k*s,ny=y+dy*k*s;if(nx<0||ny<0||nx>=CN||ny>=CN||b[ny*CN+nx]!==v)break;c++;k++}}if(c>=5)return true}return false}
function caroLine(b,i,v){const x=i%CN,y=(i/CN)|0;const out=[];for(const[dx,dy]of[[1,0],[0,1],[1,1],[1,-1]]){let line=[i];for(const s of[1,-1]){let k=1;while(true){const nx=x+dx*k*s,ny=y+dy*k*s;if(nx<0||ny<0||nx>=CN||ny>=CN||b[ny*CN+nx]!==v)break;line.push(ny*CN+nx);k++}}if(line.length>=5)return line}return out}
function caroEval(b,i,v){const x=i%CN,y=(i/CN)|0;let sc=0;
  for(const[dx,dy]of[[1,0],[0,1],[1,1],[1,-1]]){let c=1,open=0;for(const s of[1,-1]){let k=1;while(true){const nx=x+dx*k*s,ny=y+dy*k*s;if(nx<0||ny<0||nx>=CN||ny>=CN)break;const t=b[ny*CN+nx];if(t===v){c++;k++;continue}if(t===0)open++;break}}
    sc+=c>=5?1e6:c===4?(open===2?5e4:open===1?6e3:0):c===3?(open===2?4e3:open===1?400:0):c===2?(open===2?300:open===1?40:0):(open===2?10:1)}return sc}
function caroAI(b,me,skill=1){const op=me===1?2:1;let best=-1,bs=-1;const cand=[];
  for(let i=0;i<CN*CN;i++){if(b[i])continue;const x=i%CN,y=(i/CN)|0;let near=false;for(let dy=-2;dy<=2&&!near;dy++)for(let dx=-2;dx<=2;dx++){const nx=x+dx,ny=y+dy;if(nx>=0&&ny>=0&&nx<CN&&ny<CN&&b[ny*CN+nx]){near=true;break}}if(near)cand.push(i)}
  if(!cand.length)return 112;for(const i of cand){const s=caroEval(b,i,me)*1.05+caroEval(b,i,op)*(.75+.2*skill)+Math.random()*(60/skill);if(s>bs){bs=s;best=i}}return best}
function caroLobby(){const tok=++mgTok;MG={game:'caro',tok};const w=wallet();const cands=botPool(6).map(n=>({n,r:Math.round(w.rating+rndInt(-180,180))}));

   <div class="row wrap"><button class="cta sm" id="caroOn" ${NET.online?'':'disabled'}>🌐 Tạo phòng online đấu người thật</button>${NET.rooms.some(r=>r.game==='caro'&&r.state==='wait'&&r.n<r.max)?'<button class="ghost sm" id="caroRooms">Xem phòng đang chờ</button>':''}</div>
   <div class="lbl">Thách đấu</div><div class="mglist">${cands.map(c=>`<div><span>${esc(c.n)} · ⚔️ ${c.r}</span><button class="cta sm" data-ch="${esc(c.n)}" data-r="${c.r}">Thách đấu</button></div>`).join('')}</div>
   <div class="lbl">Các bàn trong trại</div><div class="mglist">${tables.map(t=>`<div><span>Bàn ${t.t}: ${t.busy?esc(t.a)+' vs '+esc(t.b):'Đang trống'}</span>${t.busy?`<button class="ghost sm" data-watch="${t.t}" data-a="${esc(t.a)}" data-b="${esc(t.b)}">👀 Xem</button>`:''}</div>`).join('')}</div></div>`);
  bindQuit();

function caroGame(opp,oppR,tok,watchB){MG.started=!watchB;MG.matchId='caro-'+Date.now();MG.over=false;const alive=()=>MG&&MG.tok===tok;
  const b=new Array(CN*CN).fill(0);const meFirst=Math.random()<.5;const P1=watchB?opp:(meFirst?player.c.name:opp),P2=watchB?watchB:(meFirst?opp:player.c.name);

  function play(i,v){if(MG.over||!alive())return;if(v!==turn||!v){if(v)toast('Chưa tới lượt bạn');return}if(!(i>=0&&i<CN*CN)||b[i]){toast('Ô này đã có quân');return}

    turn=turn===1?2:1;left=20;paint();schedule()}
  function schedule(){if(MG.over)return;const aiTurn=watchB||turn!==myV;if(aiTurn)setTimeout(()=>{if(alive()&&!MG.over)play(caroAI(b,turn,watchB?1.2:Math.min(1.6,Math.max(.6,oppR/1000))),turn)},rndInt(500,watchB?900:1600))}
  function end(winV,why){MG.over=true;clearInterval(T);paint('<b>'+why+'</b>');if(!alive())return;setTimeout(()=>{if(!alive())return;
    if(watchB){toast('Ván đấu kết thúc: '+(winV?nameOf(winV)+' thắng':'hoà'));return caroLobby()}
    const won=winV===myV,draw=winV===0;const exp=1/(1+Math.pow(10,(oppR-wallet().rating)/400));const dr=Math.round(32*((won?1:draw?.5:0)-exp));
    const rows=[{name:player.c.name,me:true,score:won?1:0,label:won?'Thắng':draw?'Hoà':'Thua'},{name:opp,score:won?0:1,label:won?'Thua':draw?'Hoà':'Thắng'}];if(!won&&!draw)rows.reverse();
    mgResults('caro',rows,{title:why,win:won,xu:won?40:draw?15:8,xp:won?60:draw?30:20,best:moves,rating:dr,again:()=>{mgOpenGame('caro')}})},1600)}
  T=setInterval(()=>{if(!alive()){clearInterval(T);return}if(MG.over)return;left--;const el=$('#cT');if(el)el.textContent=left+'s';if(left<=0){const loser=turn;end(loser===1?2:1,nameOf(loser)+' hết 20 giây, xử thua')}},1000);
  paint(watchB?'':meFirst?'Bạn đi trước (❌)':esc(opp)+' đi trước');schedule()}

function pickWord(){const WB=(window.__lang&&window.__lang.words)||WORDBANK;const t=pick(Object.keys(WB)),e=pick(WB[t]).split('|');return{topic:t,word:e[0],clues:e.slice(1)}}
function editDist(a,b){const d=[...Array(b.length+1)].map((_,i)=>i);for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[b.length]}
async function wordGame(names,tok){const alive=()=>MG&&MG.tok===tok;const score={};names.forEach(n=>score[n]=0);const R=Math.max(3,Math.min(5,names.length));
  const givers=[];const order=names.slice().sort(()=>Math.random()-.5);for(let i=0;i<R;i++)givers.push(order[i%order.length]);if(!givers.includes(player.c.name))givers[rndInt(0,R-1)]=player.c.name;
  const skill={};names.forEach(n=>skill[n]=.6+Math.random()*.8);const used=new Set();
  for(let r=0;r<R;r++){if(!alive())return;let W;do{W=pickWord()}while(used.has(W.word));used.add(W.word);
    const giver=givers[r],meGive=giver===player.c.name;const got={};const clues=[];let t0=performance.now(),lastGuess=0,feed=[],myMsg='';const guessers=names.filter(n=>n!==giver);
    await new Promise(done=>{let T=null,ended=false;
      const finish=()=>{if(ended)return;ended=true;clearInterval(T);done()};
      const correct=(n)=>{if(got[n]!=null)return;const el=(performance.now()-t0)/1000;const pts=Math.max(20,Math.round(100-el*1.3));got[n]=pts;score[n]+=pts;score[giver]+=15;feed.push(`✅ ${n} đã đoán đúng (+${pts})`);sfx(n===player.c.name?'win':'pop');if(guessers.every(g=>got[g]!=null))setTimeout(finish,900)};
      const giveClue=c=>{clues.push(c);feed.push('💬 Gợi ý: '+c)};
      if(!meGive){setTimeout(()=>alive()&&giveClue(W.clues[0]),1500);setTimeout(()=>alive()&&!ended&&giveClue(W.clues[1]),16000);setTimeout(()=>alive()&&!ended&&giveClue(W.clues[2]),32000)}
      function paint(){if(!alive())return finish();const left=Math.max(0,60-Math.floor((performance.now()-t0)/1000));
        mgShow(mgHead(`💡 Đoán Từ · Vòng ${r+1}/${R}`)+`<div class="mgbody"><div class="row" style="justify-content:space-between"><span>Chủ đề: <b>${W.topic}</b> · ${W.word.split(' ').map(x=>'_ '.repeat(x.length)).join('  ')}</span><b class="score" style="font-size:28px">${left}</b></div>
         <p class="note">Người gợi ý: <b>${esc(giver)}</b>${meGive?' (bạn)':''}</p>
         ${meGive?`<div class="letter"><span class="note">Từ bí mật (chỉ bạn thấy):</span><b style="font-size:24px;color:var(--ember)">${esc(W.word)}</b></div>`:''}
         <div class="mgfeed" id="wFeed">${feed.map(f=>`<div>${esc(f)}</div>`).join('')||'<div class="note">Chờ gợi ý…</div>'}</div>
         ${myMsg?`<p class="note" style="color:var(--ember)">${esc(myMsg)}</p>`:''}
         ${meGive?`<form id="wForm" class="row"><input id="wIn" class="inp" maxlength="60" placeholder="Viết gợi ý (không nhắc đến từ khoá)" autocomplete="off"><button class="cta sm">Gợi ý</button></form>`:
           got[player.c.name]!=null?`<p class="note">Bạn đã đoán đúng! Chờ mọi người…</p>`:`<form id="wForm" class="row"><input id="wIn" class="inp" maxlength="30" placeholder="Nhập đáp án (chỉ bạn thấy)" autocomplete="off"><button class="cta sm">Đoán</button></form>`}
         <div class="mglist small">${names.map(n=>`<div class="${n===player.c.name?'me':''}"><span>${got[n]!=null?'✅ ':n===giver?'💬 ':''}${esc(n)}</span><span>${score[n]}</span></div>`).join('')}</div></div>`);
        bindQuit(leaveMid);const f=$('#wFeed');if(f)f.scrollTop=1e6;const form=$('#wForm');if(form){const inp=$('#wIn');inp.focus({preventScroll:true});form.onsubmit=e=>{e.preventDefault();const v=inp.value.trim();if(!v)return;
          if(performance.now()-lastGuess<1200){myMsg='Chậm lại chút nhé (chống spam)';return paint()}lastGuess=performance.now();
          if(BAD_WORDS.test(v)){myMsg='Không dùng từ nhạy cảm';return paint()}
          if(meGive){const nv=norm(v),nw=norm(W.word);if(nv.includes(nw)||nw.split(' ').some(p=>p.length>=2&&nv.split(' ').includes(p))){myMsg='Gợi ý không được chứa từ khoá!';return paint()}if(clues.length>=8){myMsg='Tối đa 8 gợi ý';return paint()}myMsg='';giveClue(v);paint()}
          else{const nv=norm(v),nw=norm(W.word);if(nv===nw||nv.replace(/ /g,'')===nw.replace(/ /g,'')){myMsg='';correct(player.c.name);paint()}else{myMsg=editDist(nv,nw)<=1?`"${v}" gần đúng rồi!`:`"${v}" chưa đúng (chỉ bạn thấy)`;paint()}}}}}
      T=setInterval(()=>{if(!alive())return finish();const el=(performance.now()-t0)/1000;
        guessers.forEach(n=>{if(n===player.c.name||got[n]!=null)return;const p=(clues.length?.012+.018*clues.length:0)*skill[n];if(Math.random()<p)correct(n)});
        if(el>=60){feed.push('⏰ Hết giờ! Đáp án: '+W.word);finish()}if(alive()&&!document.activeElement.matches('#wIn'))paint();else{const s=mgEl.querySelector('.score');if(s)s.textContent=Math.max(0,60-Math.floor(el))}},1000);
      paint()});
    if(!alive())return;mgShow(mgHead(`💡 Đoán Từ · Vòng ${r+1}/${R}`)+`<div class="mgbody"><h3 class="mgt">Đáp án: ${esc(W.word)}</h3><p class="note" style="text-align:center">${Object.keys(got).length}/${guessers.length} người đoán đúng</p></div>`);bindQuit(leaveMid);await wait(2600)}
  if(!alive())return;MG.over=true;const rows=names.map(n=>({name:n,me:n===player.c.name,score:score[n],label:score[n]+' điểm'})).sort((a,b)=>b.score-a.score);
  mgResults('word',rows,{best:score[player.c.name],badge:rows[0].me?'Thánh Đoán Chữ':null})}

// một bộ bắt sự kiện duy nhất cho mọi nút "Vào" phòng trong hộp thoại
$('#mbox').addEventListener('click',e=>{const b=e.target.closest('[data-join]');if(b){closeModal();roomJoinAny(b.dataset.join,b.dataset.g,+b.dataset.camp)}});
mgEl.addEventListener('click',e=>{const b=e.target.closest('[data-join]');if(b)roomJoinAny(b.dataset.join,b.dataset.g,+b.dataset.camp)}); // "Vào" trong màn phòng chờ: rời phòng hiện tại, sang phòng kia
function roomStart(game,code){if(MG){if(MG.started&&!MG.over&&!leaveMid())return false;mgClose()}endActivity();closeModal();
  MG={game,tok:++mgTok,online:true,code:code||null,phase:'room'};NET.room=null;
  mgShow(mgHead(`${mgDef(game).i} ${mgDef(game).n} · Online`)+`<div class="mgbody"><p class="note" style="text-align:center">${code?'Đang vào phòng #'+code+'…':'Đang tạo phòng…'}</p></div>`);bindQuit();return true}
function roomCreate(game,inviteId){if(!NET.online){toast('Đang ngoại tuyến, chưa tạo phòng online được');return}
  if(roomStart(game))netSend({t:'rcreate',game,pub:true,rating:wallet().rating,invite:inviteId||undefined})}
function roomJoin(code,game){if(!NET.online){toast('Đang ngoại tuyến');return}if(roomStart(game,code))netSend({t:'rjoin',code,rating:wallet().rating})}
function roomLeave(){netSend({t:'rleave'});NET.room=null}
function roomInvite(a){if(!a||!a.remote)return;netSend({t:'rinvite',to:a.id});toast('Đã gửi lời mời tới '+a.c.name)}
// vẽ phòng chờ; trả về false nếu không còn ở trong phòng
function roomRender(){const R=NET.room;if(!MG||!MG.online||MG.phase!=='room'||!R||R.code!==MG.code)return false;
  const g=mgDef(R.game),meId=NET.id,me=R.members.find(x=>x.id===meId);if(!me)return false;const host=R.host===meId;
  mgShow(mgHead(`${g.i} ${g.n} · Online`)+`<div class="mgbody"><p class="note">Phòng #${R.code} · ${R.pub?'Công khai, ai trong '+CAMPS[campIdx].n+' cũng thấy':'Riêng tư, chỉ người được mời vào được'} · ${R.members.length}/${R.max} người (cần ít nhất ${R.min})</p>
    <div class="mglist">${R.members.map(x=>`<div class="${x.id===meId?'me':''}"><span>${x.id===R.host?'👑 ':''}${esc(x.name)}${x.id===meId?' (bạn)':''}</span><span>${x.ready?'✅ Sẵn sàng':'⏳ Chưa sẵn sàng'}</span>${host&&x.id!==meId&&R.state==='wait'?`<button class="linkbtn" data-kick="${x.id}">Mời ra</button>`:''}</div>`).join('')}</div>
    ${R.state==='cd'?`<div class="score">Bắt đầu sau ${R.cd}</div>`:R.state==='play'?'<p class="note">Phòng đang chơi…</p>':''}
    <div class="row wrap"><button class="cta" id="mgReady" style="flex:1">${me.ready?'Huỷ sẵn sàng':'Sẵn sàng'}</button><button class="ghost" id="mgInvP">👥 Mời người chơi</button>${host?`<button class="ghost" id="mgPub">${R.pub?'🔓 Công khai':'🔒 Riêng tư'}</button>`:''}</div>
    <div class="mglist small" id="mgInvList" hidden></div>
    <p class="note">${g.d}. ${R.members.length<R.min?'Đang chờ thêm người: mời bạn trong trại, hoặc bấm vào người chơi khác rồi chọn 🎮 Mời chơi. ':''}Khi đủ người và tất cả bấm Sẵn sàng, trận tự bắt đầu.</p>
    <div class="mgsec"><div class="lbl">🌐 Các phòng khác đang mở · bấm Vào để chuyển sang</div><div class="mglist small" id="mgOther">${otherRoomsHtml()}</div></div></div>`);
  bindQuit();
  if(!NET.roomT){fetchAllRooms();NET.roomT=setInterval(()=>{if(!MG||!MG.online||MG.phase!=='room'){clearInterval(NET.roomT);NET.roomT=0;return}fetchAllRooms()},4000)} // làm mới danh sách phòng khác mỗi 4 giây khi đang chờ
  $('#mgReady').onclick=()=>{netSend({t:'rready',on:!me.ready});sfx('pop')};
  if($('#mgPub'))$('#mgPub').onclick=()=>netSend({t:'rpub',on:!R.pub});
  mgEl.querySelectorAll('[data-kick]').forEach(b=>b.onclick=()=>netSend({t:'rkick',id:b.dataset.kick}));
  $('#mgInvP').onclick=()=>{const el=$('#mgInvList'),inRoom=new Set(R.members.map(x=>x.id)),L=[...remotes.values()].filter(a=>!inRoom.has(a.id));el.hidden=false;
    el.innerHTML=L.length?L.map(a=>`<div><span>● ${esc(a.c.name)}</span><button class="cta sm" data-inv="${a.id}">Mời</button></div>`).join(''):`<div><span>Chưa có người chơi nào khác trong ${CAMPS[campIdx].n}. Bấm ➕ Mời bạn để gửi đường dẫn cho bạn bè.</span></div>`;
    el.querySelectorAll('[data-inv]').forEach(b=>b.onclick=()=>{roomInvite(remotes.get(b.dataset.inv));b.disabled=true;b.textContent='Đã mời'})};
  return true}
// thẻ lời mời nhỏ ở trên cùng: không đè lên hộp thoại đang mở
function showRoomInvite(m){if(MG&&MG.online&&MG.code===m.code)return;const g=mgDef(m.game);if(!g)return;const old=$('#rInv');if(old)old.remove();
  const d=document.createElement('div');d.id='rInv';d.className='glass';
  d.innerHTML=`<span>${g.i} <b>${esc(m.name)}</b> mời bạn chơi <b>${g.n}</b> (phòng #${esc(m.code)})</span><div class="row"><button class="ghost sm" style="flex:1">Để sau</button><button class="cta sm" style="flex:1">Vào chơi</button></div>`;
  const [no,yes]=d.querySelectorAll('button');no.onclick=()=>d.remove();yes.onclick=()=>{d.remove();if(mode!=='play'){toast('Vào trại trước rồi nhận lời nhé');return}roomJoin(m.code,m.game)};
  stageEl.append(d);sfx('pm');setTimeout(()=>d.remove(),25000)}
function inviteGamePicker(a){openModal(`<h2>🎮 Mời ${esc(a.c.name)} chơi</h2><p class="note">${a.remote?`Chọn trò chơi. Bạn sẽ tạo phòng online và ${esc(a.c.name)} nhận được lời mời ngay.`:`Chọn trò chơi. ${esc(a.c.name)} là bạn trại ảo nên sẽ vào phòng chơi cùng bạn ngay.`}</p>
  <div class="items" style="grid-template-columns:1fr">${MGS.map(x=>x.id).map(id=>{const g=mgDef(id);return `<button class="item" data-g="${id}"><i>${g.i}</i><b>${g.n}</b><span>${g.d}</span></button>`}).join('')}</div><button class="ghost" id="mClose">Đóng</button>`);
  $('#mClose').onclick=closeModal;
  $('#mbox').querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{const id=b.dataset.g;closeModal();if(!a.remote)return npcGame(id,a);
    if(MG&&MG.online&&NET.room&&NET.room.game===id&&NET.room.state==='wait'){roomInvite(a);return}roomCreate(id,a.id);toast('Đã tạo phòng và gửi lời mời tới '+a.c.name)})}
function mgNetOn(m){
  switch(m.t){
    case 'rooms':NET.rooms=m.list||[];refreshRoomLists();break;
    case 'room':{const R=m.room;if(!MG||!MG.online||!(MG.code===R.code||(MG.code===null&&MG.game===R.game&&R.host===NET.id)))break;
      MG.code=R.code;NET.room=R;if(MG.phase==='room')roomRender();break}
    case 'rg':if(MG&&MG.online&&MG.code===m.code){if(m.ev==='start')return mgOnlineStart(m);if(MG.onGame)MG.onGame(m)}break;
    case 'rinv':showRoomInvite(m);break;
    case 'rkicked':if(MG&&MG.online){NET.room=null;mgClose();mgOpenHub();toast('Chủ phòng đã mời bạn ra khỏi phòng')}break;
    case 'rerr':toast(m.msg);if(MG&&MG.online&&MG.phase==='room'&&(!NET.room||NET.room.code!==MG.code)){NET.room=null;mgClose();mgOpenHub()}break;
  }
}
function mgOnlineStart(e){MG.phase='play';MG.started=true;MG.over=false;MG.matchId=e.match;MG.onGame=null;closeModal();
  sysLog('Trận '+mgDef(MG.game).n+' online bắt đầu ('+Object.keys(e.names).length+' người)');
  const G=MG.game;if(G==='caro')caroOnline(e);else if(G==='rps')rpsOnline(e);else if(G==='word')wordOnline(e);else if(G==='spy')spyOnline(e);
  else{MG.netNames=e.names;(G==='boat'?boatGame:danceGame)(Object.values(e.names),MG.tok)}}

/* ---- Cờ Caro online: máy chủ giữ bàn cờ, lượt và đồng hồ 20 giây ---- */
function caroOnline(e){const tok=MG.tok,alive=()=>MG&&MG.tok===tok,myV=e.p.indexOf(NET.id)+1,oppId=e.p[myV===1?1:0],opp=e.names[oppId]||'Đối thủ',oppR=e.ratings[oppId]||1000;
  const P1=e.names[e.p[0]],P2=e.names[e.p[1]],S={b:new Array(CN*CN).fill(0),turn:e.turn,left:e.left,last:-1,line:[],ask:null,moves:0};
  function paint(msg){if(!alive())return;mgShow(mgHead('⭕ Cờ Caro · Online')+`<div class="mgbody"><div class="row" style="justify-content:space-between;font-size:14px"><span class="${S.turn===1?'turn':''}">❌ ${esc(P1)}${myV===1?' (bạn)':''}</span><b id="cT">${S.turn?S.left+'s':''}</b><span class="${S.turn===2?'turn':''}">⭕ ${esc(P2)}${myV===2?' (bạn)':''}</span></div>
    <div class="caro">${S.b.map((v,i)=>`<button data-i="${i}" class="${i===S.last?'last':''} ${S.line.includes(i)?'win':''}" aria-label="Ô ${i%CN+1}-${(i/CN|0)+1}">${v===1?'<i class="x">✕</i>':v===2?'<i class="o">◯</i>':''}</button>`).join('')}</div>
    <p class="note" style="text-align:center">${msg||(S.turn===myV?'Lượt của bạn · '+CARO_SEC+' giây':esc(opp)+' đang nghĩ…')}</p>
    ${MG.over?'':S.ask&&S.ask!==NET.id?`<div class="row"><button class="ghost" id="cNo" style="flex:1">Không hoà</button><button class="cta" id="cOk" style="flex:1">Đồng ý hoà</button></div>`:`<div class="row"><button class="ghost" id="cDraw" style="flex:1" ${S.ask?'disabled':''}>${S.ask?'Đã xin hoà…':'Xin hoà'}</button><button class="ghost" id="cGive" style="flex:1">Đầu hàng</button></div>`}</div>`);
    bindQuit(leaveMid);
    mgEl.querySelector('.caro').onclick=ev=>{const x=ev.target.closest('button');if(!x||MG.over)return;const i=+x.dataset.i;if(S.turn!==myV){toast('Chưa tới lượt bạn');return}if(S.b[i]){toast('Ô này đã có quân');return}netSend({t:'rmove',i})};
    if($('#cGive'))$('#cGive').onclick=()=>{if(confirm('Đầu hàng ván này?'))netSend({t:'rmove',resign:1})};
    if($('#cDraw'))$('#cDraw').onclick=()=>netSend({t:'rmove',draw:1});
    if($('#cOk'))$('#cOk').onclick=()=>netSend({t:'rmove',drawok:1});if($('#cNo'))$('#cNo').onclick=()=>netSend({t:'rmove',drawno:1})}
  const T=setInterval(()=>{if(!alive())return clearInterval(T);if(MG.over||!S.turn)return;S.left=Math.max(0,S.left-1);const el=$('#cT');if(el)el.textContent=S.left+'s'},1000);MG.cleanup=()=>clearInterval(T);
  MG.onGame=m=>{
    if(m.ev==='move'){S.b[m.i]=m.v;S.last=m.i;S.moves++;S.ask=null;sfx('pop');S.turn=m.turn;if(m.turn)S.left=m.left;if(m.turn===myV)buzz(30);paint()}
    else if(m.ev==='drawask'){S.ask=m.from;paint(m.from===NET.id?'Đã gửi lời xin hoà, chờ '+esc(opp)+' trả lời…':esc(opp)+' xin hoà')}
    else if(m.ev==='drawno'){S.ask=null;paint();if(m.from!==NET.id)toast(opp+' không đồng ý hoà')}
    else if(m.ev==='end'){MG.over=true;clearInterval(T);S.line=m.line||[];S.turn=0;paint('<b>'+esc(m.why)+'</b>');
      setTimeout(()=>{if(!alive())return;MG.phase='result';const won=m.win===myV,draw=m.win===0;const exp=1/(1+Math.pow(10,(oppR-wallet().rating)/400));const dr=Math.round(32*((won?1:draw?.5:0)-exp));
        const rows=[{name:player.c.name,me:true,score:won?1:0,label:won?'Thắng':draw?'Hoà':'Thua'},{name:opp,score:won?0:1,label:won?'Thua':draw?'Hoà':'Thắng'}];if(!won&&!draw)rows.reverse();
        mgResults('caro',rows,{title:m.why,win:won,xu:won?40:draw?15:8,xp:won?60:draw?30:20,best:m.moves,rating:dr})},1600)}};
  paint(myV===1?'Bạn đi trước (❌)':esc(opp)+' đi trước')}
const CARO_SEC=20;
// vẽ lại màn mini-game mà không làm mất chữ đang gõ dở trong ô nhập
function mgShowKeep(html,inputSel){const cur=$(inputSel),val=cur?cur.value:'',foc=cur&&document.activeElement===cur;mgShow(html);const nx=$(inputSel);if(nx&&val){nx.value=val}if(nx&&foc)nx.focus({preventScroll:true})}

/* ---- Đoán Từ online: máy chủ giữ từ bí mật, người gợi ý gõ gợi ý thật, mọi người đoán ---- */
function wordOnline(e){const tok=MG.tok,alive=()=>MG&&MG.tok===tok,me=NET.id,names=e.names,nm=id=>names[id]||'?';
  let S={round:0,R:0,giver:null,topic:'',mask:[],left:0,scores:{},secret:null,feed:[],got:{},msg:'',phase:'wait'},T=null;
  function paint(){if(!alive())return;const meGive=S.giver===me;
    if(S.phase==='wait')return mgShow(mgHead('💡 Đoán Từ · Online')+'<div class="mgbody"><p class="note" style="text-align:center">Đang chọn từ…</p></div>');
    mgShowKeep(mgHead(`💡 Đoán Từ · Vòng ${S.round}/${S.R}`)+`<div class="mgbody"><div class="row" style="justify-content:space-between"><span>Chủ đề: <b>${esc(S.topic)}</b> · ${S.mask.map(n=>'_ '.repeat(n)).join('  ')}</span><b class="score" style="font-size:28px">${S.left}</b></div>
      <p class="note">Người gợi ý: <b>${esc(nm(S.giver))}</b>${meGive?' (bạn)':''}</p>
      ${meGive&&S.secret?`<div class="letter"><span class="note">Từ bí mật (chỉ bạn thấy). Gõ gợi ý nhưng không được nhắc tới từ này:</span><b style="font-size:24px;color:var(--ember)">${esc(S.secret)}</b></div>`:''}
      <div class="mgfeed" id="wFeed">${S.feed.map(f=>`<div>${esc(f)}</div>`).join('')||'<div class="note">'+(meGive?'Gõ gợi ý đầu tiên đi!':'Chờ gợi ý…')+'</div>'}</div>
      ${S.msg?`<p class="note" style="color:var(--ember)">${esc(S.msg)}</p>`:''}
      ${meGive?`<form id="wForm" class="row"><input id="wIn" class="inp" maxlength="60" placeholder="Viết gợi ý (không nhắc đến từ khoá)" autocomplete="off"><button class="cta sm">Gợi ý</button></form>`:
        S.got[me]!=null?`<p class="note">Bạn đã đoán đúng! Chờ mọi người…</p>`:`<form id="wForm" class="row"><input id="wIn" class="inp" maxlength="30" placeholder="Nhập đáp án (chỉ bạn thấy)" autocomplete="off"><button class="cta sm">Đoán</button></form>`}
      <div class="mglist small">${Object.keys(names).sort((a,b)=>(S.scores[b]||0)-(S.scores[a]||0)).map(id=>`<div class="${id===me?'me':''}"><span>${S.got[id]!=null?'✅ ':id===S.giver?'💬 ':''}${esc(nm(id))}${id===me?' (bạn)':''}</span><span>${S.scores[id]||0}</span></div>`).join('')}</div></div>`,'#wIn');
    bindQuit(leaveMid);const f=$('#wFeed');if(f)f.scrollTop=1e6;
    const form=$('#wForm');if(form)form.onsubmit=ev=>{ev.preventDefault();const inp=$('#wIn'),v=inp.value.trim();if(!v)return;if(BAD_WORDS.test(v)){S.msg='Không dùng từ nhạy cảm';return paint()}
      inp.value='';S.msg='';netSend(meGive?{t:'rmove',clue:v}:{t:'rmove',guess:v});inp.focus({preventScroll:true})}}
  T=setInterval(()=>{if(!alive())return clearInterval(T);if(S.phase==='play'&&S.left>0){S.left--;const s=mgEl.querySelector('.score');if(s)s.textContent=S.left}},1000);MG.cleanup=()=>clearInterval(T);
  MG.onGame=m=>{
    if(m.ev==='round'){S={...S,round:m.round,R:m.R,giver:m.giver,topic:m.topic,mask:m.mask,left:m.left,scores:m.scores,secret:null,feed:[],got:{},msg:'',phase:'play'};if(m.giver===me)buzz(40);paint()}
    else if(m.ev==='secret'){S.secret=m.word;paint()}
    else if(m.ev==='clue'){S.feed.push((m.auto?'💡 Gợi ý tự động: ':'💬 Gợi ý: ')+m.text);sfx('pop');paint()}
    else if(m.ev==='got'){S.got[m.id]=m.pts;S.scores=m.scores;S.feed.push(`✅ ${nm(m.id)} đã đoán đúng (+${m.pts})`);sfx(m.id===me?'win':'pop');paint()}
    else if(m.ev==='msg'){S.msg=m.text;paint()}
    else if(m.ev==='answer'){S.phase='answer';S.scores=m.scores;mgShow(mgHead(`💡 Đoán Từ · Vòng ${S.round}/${S.R}`)+`<div class="mgbody"><h3 class="mgt">Đáp án: ${esc(m.word)}</h3><p class="note" style="text-align:center">${m.n}/${m.total} người đoán đúng</p></div>`);bindQuit(leaveMid)}
    else if(m.ev==='end'){clearInterval(T);MG.over=true;MG.phase='result';const rows=m.rows.map(x=>({name:x.name,me:x.id===me,score:x.score,label:x.score+' điểm'}));
      mgResults('word',rows,{best:(m.rows.find(x=>x.id===me)||{}).score||0,badge:rows[0]&&rows[0].me?'Thánh Đoán Chữ':null})}};
  paint()}

/* ---- Kẻ Giả Mạo online: máy chủ chia từ bí mật, lần lượt gợi ý, bỏ phiếu kín ---- */
function spyOnline(e){const tok=MG.tok,alive=()=>MG&&MG.tok===tok,me=NET.id,names=e.names,nm=id=>names[id]||'?';
  const S={order:e.order,word:null,said:{},cur:null,phase:'clue',left:0,cands:null,voted:null,n:0,total:0,msg:''};let T=null;
  function paint(){if(!alive())return;const myTurn=S.phase==='clue'&&S.cur===me;
    mgShowKeep(mgHead('🕵️ Ai Là Kẻ Giả Mạo? · Online')+`<div class="mgbody"><div class="letter"><span class="note">Từ của bạn (chỉ bạn thấy):</span><b style="font-size:24px;color:var(--ember)">${S.word?esc(S.word):'…'}</b><span class="note">Có 1 kẻ giả mạo cầm từ khác. Chính bạn cũng không biết mình có phải không!</span></div>
      <div class="row" style="justify-content:space-between"><b>${S.phase==='clue'?'Lượt gợi ý: '+esc(nm(S.cur))+(myTurn?' (bạn)':''):S.cands?'Phiếu hoà, bỏ phiếu lại':'Bỏ phiếu bí mật'}</b><b class="score" style="font-size:26px">${S.left}</b></div>
      <div class="mglist">${S.order.map(id=>{const canVote=S.phase==='vote'&&id!==me&&!S.voted&&(!S.cands||S.cands.includes(id));return `<div class="${id===me?'me':''}${S.phase==='clue'&&id===S.cur?' turn':''}"><span>${esc(nm(id))}${id===me?' (bạn)':''}${S.voted===id?' · bạn bầu':''}</span><span>${S.said[id]!=null?'“'+esc(S.said[id])+'”':S.phase==='clue'?'…':''}</span>${canVote?`<button class="cta sm" data-v="${id}">Bỏ phiếu</button>`:''}</div>`}).join('')}</div>
      ${S.msg?`<p class="note" style="color:var(--ember)">${esc(S.msg)}</p>`:''}
      ${myTurn?`<form id="sForm" class="row"><input id="sIn" class="inp" maxlength="40" placeholder="Một câu gợi ý ngắn, không nói thẳng từ" autocomplete="off"><button class="cta sm">Gửi</button></form>`:''}
      ${S.phase==='vote'?`<p class="note">${S.voted?'Bạn đã bỏ phiếu. Phiếu được giữ kín đến khi công bố.':'Chọn người bạn nghĩ là kẻ giả mạo.'} Đã bỏ: ${S.n}/${S.total}</p>`:''}</div>`,'#sIn');
    bindQuit(leaveMid);
    const f=$('#sForm');if(f){if(!document.activeElement||document.activeElement.id!=='sIn')$('#sIn').focus({preventScroll:true});f.onsubmit=ev=>{ev.preventDefault();const v=$('#sIn').value.trim();if(v.length<2)return;if(BAD_WORDS.test(v)){S.msg='Không dùng từ nhạy cảm';return paint()}if(S.word&&norm(v).includes(norm(S.word))){S.msg='Không được nói thẳng từ khoá!';return paint()}S.msg='';netSend({t:'rmove',clue:v})}}
    mgEl.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{S.voted=b.dataset.v;sfx('pop');netSend({t:'rmove',vote:S.voted});paint()})}

// tin hệ thống của phần online: giữ nguyên tiếng Việt, không cho bộ dịch thay từng chữ

const CFG_KEYS=['gender','skin','hair','hairColor','outfit','color','color2','pattern','pcolor','shoe','hat','face','neck','back','acc'];

  if(s.s==='s'&&p.seat){const i=seats.indexOf(p.seat);s.k=i>=0?i:-2}return s}

function netDropRoom(){NET.rooms=[];if(MG&&MG.online){NET.room=null;MG.online=false;mgClose();toast('Mất kết nối nên đã rời phòng mini-game online')}NET.room=null}
function netClose(){clearTimeout(NET.timer);netDropRoom();const w=NET.ws;NET.ws=null;NET.online=false;if(w){w.onclose=w.onmessage=w.onerror=null;try{w.close(1000)}catch(e){}}clearRemotes()}
function netConnect(){
  netClose();if(NET.base===null){updateCampBtn();return}
  const gen=++NET.gen;let ws;
  try{ws=new WebSocket(NET.base.replace(/^http/,'ws')+'/ws?camp='+(campIdx+1))}catch(e){netRetry(gen);return}

  ws.onclose=ev=>{if(gen!==NET.gen)return;const was=NET.online;NET.online=false;NET.ws=null;clearRemotes();updateCampBtn();netDropRoom();
    if(ev.code===4001){toast(CAMPS[campIdx].n+' đã đủ 30 người. Bấm tên trại để chọn trại khác nhé',5000);nlog(CAMPS[campIdx].n+' đã đủ người, bạn đang ở chế độ ngoại tuyến.');return}
    if(ev.code===4000)return;
    if(was)nlog('Mất kết nối với trại online, đang thử kết nối lại…');netRetry(gen)};

function netRetry(gen){clearTimeout(NET.timer);const d=Math.min(15000,1000*Math.pow(1.7,NET.retry++))+Math.random()*500;NET.timer=setTimeout(()=>{if(gen===NET.gen)netConnect()},d)}

function addRemote(p){if(!p||p.id===NET.id||remotes.has(p.id))return;let a;
  try{a=new Actor(Object.assign(netSafeCfg(p.cfg),{name:p.name}),false,true)}catch(e){console.warn(e);a=new Actor(Object.assign({},DEFAULT,{name:p.name}),false,true)}
  a.id=p.id;const s=p.st||{};a.pos.set(s.x||0,0,s.z===undefined?6.5:s.z);a.rot=s.r||0;remotes.set(p.id,a);applyRemote(a,s)}
function removeRemote(id){const a=remotes.get(id);if(!a)return;remotes.delete(id);a.leave();a.drop();scene.remove(a.g);const i=actors.indexOf(a);if(i>=0)actors.splice(i,1);
  if(pchat&&pchat.members.includes(a)){pchat.members=pchat.members.filter(x=>x!==a);pLine('Hệ thống',a.c.name+' đã rời trại')}}
function clearRemotes(){[...remotes.keys()].forEach(removeRemote)}
// áp trạng thái nhận được: ngồi đúng ghế / thảm / lều, nhảy vòng, cầm đồ
function applyRemote(a,s){a.net=s;
  if(s.s==='s'){let seat=s.k>=0?seats[s.k]:null;
    if(seat){if(a.seat!==seat&&!(a.seat&&a.seat.ghostOf===seat)){
        if(seat.taken&&seat.taken!==a){const o=seat.taken;if(o.isPlayer||o.remote)seat={x:seat.x,z:seat.z,rot:seat.rot,h:seat.h,type:seat.type,reach:seat.reach,ghostOf:seat};else{o.leave();o.think=0}}
        a.sit(seat)}}
    else if(!a.seat||a.seat.type!=='ground'||Math.hypot(a.seat.x-s.x,a.seat.z-s.z)>.3)a.sit({x:s.x,z:s.z,rot:s.r,h:0,type:'ground',reach:1});
  } else if(s.s==='c'){if(a.state!=='conga')a.joinConga()}
  else if(a.state==='sit'||a.state==='conga')a.leave();
  if((s.p||'')!==(a.propKind||'')){if(s.p)a.hold(s.p);else a.drop()}
  if(s.s!=='s')a.g.visible=true}
// di chuyển mượt tới vị trí mới nhất nhận được; trả về true nếu đang đi (để chạy hoạt ảnh bước chân)
function netMove(a,dt){const s=a.net;if(!s)return false;const dx=s.x-a.pos.x,dz=s.z-a.pos.z,d=Math.hypot(dx,dz);
  if(d>8){a.pos.x=s.x;a.pos.z=s.z}else if(d>.001){const k=Math.min(1,dt*9);a.pos.x+=dx*k;a.pos.z+=dz*k}
  let dr=s.r-a.rot;dr=Math.atan2(Math.sin(dr),Math.cos(dr));a.rot+=dr*Math.min(1,dt*10);
  const mv=d>.05||(s.m&&d>.01);if(mv){a.walkT+=dt*11;if(a.emote&&a.emote!=='wave')a.emote=null}return mv}
function lanternKey(d){return d.name+'|'+d.wish+'|'+d.text}
function netOn(m){
  switch(m.t){
    case 'welcome':{NET.online=true;NET.id=m.id;NET.retry=0;NET.last='';NET.rooms=m.rooms||[];clearRemotes();m.players.forEach(addRemote);const r=m.room||{};
      if(r.fire){setFireLevel(r.fire.lv);fireDecay=clamp(90-(m.now-r.fire.ts)/1000,5,90)}
      if(!!r.party!==partyOn)togglePartyMode('Cả trại');
      (r.lanterns||[]).forEach(d=>{const k=lanternKey(d);if(lanternSeen.has(k))return;lanternSeen.add(k);addLantern(d,null,true)});
      if(NET.hist!==campIdx){NET.hist=campIdx;const recent=(r.chat||[]).filter(c=>m.now-c.ts<3600e3).slice(-8);if(recent.length){nlog('Tin nhắn gần đây trong trại:');recent.forEach(c=>addLog(c.name,c.text))}}
      nlog(remotes.size?'Có '+remotes.size+' người chơi khác đang online ở '+CAMPS[campIdx].n+'. Chào mọi người đi!':'Bạn là người chơi online đầu tiên ở '+CAMPS[campIdx].n+'. Mời bạn bè vào cùng nhé ➕');
      updateCampBtn();if(NET.pendingJoin){const p=NET.pendingJoin;NET.pendingJoin=null;setTimeout(()=>roomJoin(p.code,p.game),300)}break}
    case 'join':addRemote(m.p);nlog(m.p.name+' vừa vào trại 👋');sfx('join');updateCampBtn();break;
    case 'leave':{const a=remotes.get(m.id);if(a){nlog(a.c.name+' đã rời trại');removeRemote(m.id);sfx('leave');updateCampBtn()}break}
    case 'st':{const a=remotes.get(m.id);if(a)applyRemote(a,m.s);break}
    case 'chat':{const a=remotes.get(m.id);if(a)a.say(m.text,false,true);else{addLog(m.name,m.text);log.lastChild.setAttribute('translate','no')}sfx('msg');break}
    case 'emo':{const a=remotes.get(m.id);if(a&&a.g.visible)a.setEmote(m.e,m.d);break}
    case 'cfg':{const a=remotes.get(m.id);if(a){a.c=Object.assign(netSafeCfg(m.cfg),{name:m.name});try{a.rebuild()}catch(e){a.c=Object.assign({},DEFAULT,{name:m.name});a.rebuild()}}break}
    case 'fire':setFireLevel(m.lv);burst=1;fireDecay=90;nlog(m.name+' vừa thêm củi vào lửa 🔥');sfx('fire');break;
    case 'party':if(!!m.on!==partyOn)togglePartyMode(m.name);break;
    case 'lantern':{const d=m.d,a=remotes.get(m.id),k=lanternKey(d);if(lanternSeen.has(k))break;lanternSeen.add(k);
      addLantern(d,d.kind==='sky'?{x:a?a.pos.x:0,y:2,z:a?a.pos.z:0}:true,true);nlog(d.name+' vừa thả một chiếc '+(d.kind==='sky'?'đèn trời':'hoa đăng')+': '+wishName(d.wish));break}
    case 'pm':{const a=remotes.get(m.from);if(!a)break;
      if(!pchat||!pchat.members.includes(a)){if(pchat&&pchat.members.length>=3)break;openPChat(a)}
      $('#pchat').hidden=false;pLine(a.c.name,m.text,true);sfx('pm');break}
    case 'pmfail':pLine('Hệ thống','Người này vừa rời trại, tin nhắn chưa gửi được');break;
    case 'warn':toast(m.msg);break;
    default:if(m.t[0]==='r')mgNetOn(m);
  }
}
function netTick(dt){if(!NET.online)return;NET.sendT-=dt;NET.beatT-=dt;if(NET.sendT>0)return;NET.sendT=.12;
  const s=myState(),j=JSON.stringify(s);if(j!==NET.last||NET.beatT<=0){NET.last=j;NET.beatT=2.5;netSend({t:'st',s})}}

player=new Actor(Object.assign({},cfg,{name:cfg.name||'Bạn'}),true);

const clock=new THREE.Clock(),tmp=new THREE.Vector3(),tmp2=new THREE.Vector3();

function loop(){requestAnimationFrame(loop);try{
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  if(mode==='play'&&!typing()&&!['cook','chop'].includes(activity)&&!MG){
    let ix=0,iz=0;
    if(keys['w']||keys['arrowup'])iz-=1;if(keys['s']||keys['arrowdown'])iz+=1;if(keys['a']||keys['arrowleft'])ix-=1;if(keys['d']||keys['arrowright'])ix+=1;

    if(l>.15){if(activity&&activity!=='hold')endActivity(true);if(player.state==='sit'||player.state==='conga')player.leave();
      const s=Math.sin(cam.yaw),c=Math.cos(cam.yaw),nx=ix/Math.max(1,l),nz=iz/Math.max(1,l);player.input={x:nx*c+nz*s,z:-nx*s+nz*c}}
