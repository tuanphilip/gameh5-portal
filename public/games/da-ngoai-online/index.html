<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Trại An Yên HiHi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@400;600;700&display=swap">
<style>
/* Layout: canvas toàn màn hình; bảng kính tối ấm nổi trên trời đêm; thanh hoạt động cuộn ngang ở đáy. Giao diện tối cố định (trại đêm). */
:root{
  --night:#0f1424; --panel:rgba(20,24,42,.86); --panel2:rgba(34,30,48,.95);
  --ember:#ffb347; --ember2:#ff7a3d; --cream:#fff3dd; --muted:#b9b2c9; --line:rgba(255,220,170,.18);
  --ok:#7fd99a; --bad:#ff7a7a; --lake:#7fc8ff;
  --display:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#05060c;color:var(--cream);font-family:var(--body);overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
/* Sân khấu game: kích thước do ResizeObserver đặt (16:9 khi nhúng iframe < 1400px, đầy khung khi ≥ 1400px).
   container-type biến #stage thành khung chứa cho mọi phần tử position:fixed bên trong. */
#stage{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;background:var(--night);container-type:size;container-name:stage}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:var(--body);cursor:pointer;color:inherit}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 40px rgba(0,0,0,.45)}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin:0}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:6px}
.cta{padding:13px;border:none;border-radius:14px;background:linear-gradient(180deg,var(--ember),var(--ember2));color:#2a1606;font-family:var(--display);font-weight:800;font-size:18px}
.ghost{padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--cream);font-weight:600}
.row{display:flex;gap:8px;align-items:center}
.inp{width:100%;box-sizing:border-box;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--cream);font-size:15px;font-family:var(--body)}

/* ---------- Creator ---------- */
#creator{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);right:max(16px,env(safe-area-inset-right,0px));width:min(400px,calc(100% - 32px));display:flex;flex-direction:column;padding:18px 18px 16px;gap:12px;z-index:20;box-sizing:border-box}
#creator h1{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;margin:0;color:var(--ember);text-wrap:balance}
#creator h1 small{display:block;font-size:13px;font-family:var(--body);font-weight:400;color:var(--muted);margin-top:6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{flex:1;min-width:64px;padding:8px 6px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--muted);font-weight:600;font-size:13px}
.tab.on{background:var(--ember);color:#2a1606;border-color:var(--ember)}
.pane{flex:1;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:14px;padding-right:4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{padding:10px 6px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--cream);font-size:13px;font-weight:600;line-height:1.25}
.opt.on{border-color:var(--ember);background:rgba(255,179,71,.18);color:#fff}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.15);padding:0}
.dot.on{border-color:#fff;box-shadow:0 0 0 3px var(--ember)}
.gender{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gender .opt{font-size:15px;padding:12px}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:50px;text-align:center}
.opt i{font-style:normal;font-size:20px;line-height:1}
.sec{display:flex;flex-direction:column}
.sec .lbl{display:flex;justify-content:space-between;align-items:center}
.sec .lbl em{font-style:normal;text-transform:none;letter-spacing:0;color:var(--ember)}
.dot.pick{position:relative;overflow:hidden;display:inline-block;cursor:pointer;box-sizing:border-box}
.dot.pick input{position:absolute;inset:-4px;width:calc(100% + 8px);height:calc(100% + 8px);opacity:0;cursor:pointer;border:0;padding:0}
.foot{display:flex;flex-direction:column;gap:8px}
.foot .row{flex-wrap:wrap}
.foot .row .inp{flex:1}
.foot #go{flex:1 0 100%}
.ml{display:none}
.tab{white-space:nowrap}
.grab{display:none}
.langs{display:flex;gap:6px;flex-wrap:wrap}.langs .chip{padding:5px 9px;font-size:12px}
.hint{font-size:12px;color:var(--muted);text-align:center;margin:0}
.mob{display:none}

/* ---------- HUD ---------- */
#topbar{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:center;padding:7px 12px 7px 7px;z-index:10}
#topbar img{width:38px;height:38px;border-radius:12px;background:#cfd6e0}
#topbar b{font-family:var(--display);font-size:17px;color:var(--ember);display:block;line-height:1.05}
#campBtn{background:none;border:none;padding:0;font-size:12px;color:var(--muted);text-align:left}
#campBtn:hover{color:var(--cream)}
#tools{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:7px;z-index:10}
.ib{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--panel);font-size:18px;position:relative}
.ib.on{background:var(--ember)}
.share{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.share a,.share button{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:14px;font-weight:700;font-size:14px;text-decoration:none;border:none;color:#fff}
.ib .badge{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:8px;background:var(--bad);font-size:10px;font-weight:700;line-height:16px;color:#fff}
#chatbox{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 92px);width:min(340px,calc(100% - 32px));padding:9px;display:flex;flex-direction:column;gap:7px;z-index:10;box-sizing:border-box}
#log{max-height:130px;overflow:auto;font-size:13px;line-height:1.45;display:flex;flex-direction:column;gap:3px}
#log b{color:var(--ember)}
#log .sys{color:var(--ok);font-style:italic}
#chatform{display:flex;gap:6px}
#chatIn{flex:1;min-width:0}
#chatform button{padding:0 14px;border-radius:12px;border:none;background:var(--ember);color:#2a1606;font-weight:700}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-width:calc(100% - 32px);display:flex;gap:4px;padding:6px;z-index:12;overflow-x:auto;box-sizing:border-box;scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
#bar button{flex:0 0 auto;width:64px;padding:6px 2px 5px;border:none;border-radius:12px;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted)}
#bar button i{font-style:normal;font-size:21px;line-height:1.1}
#bar button:hover,#bar button.on{background:rgba(255,179,71,.16);color:var(--cream)}
#bar button.on{box-shadow:inset 0 0 0 1px var(--ember)}
#status{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 70px);padding:8px 14px;font-size:13px;font-weight:600;z-index:11;display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px);box-sizing:border-box}
#status button{padding:5px 10px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:12px;font-weight:600;white-space:nowrap}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 118px);transform:translateX(-50%);padding:10px 18px;font-size:14px;z-index:45;max-width:calc(100% - 32px);text-align:center;box-sizing:border-box}
#joy{position:fixed;left:max(24px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 150px);width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid var(--line);z-index:10;touch-action:none;display:none}
#joy i{position:absolute;left:50%;top:50%;margin:-20px 0 0 -20px;width:40px;height:40px;border-radius:50%;background:var(--ember);opacity:.85}
@media (pointer:coarse){#joy{display:block}}
body.touch #joy{display:block}
body.busy #joy{display:none!important}
#tapMark{position:fixed;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:2px solid var(--ember);pointer-events:none;z-index:9;animation:tapm .5s ease-out forwards}
@keyframes tapm{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.4);opacity:0}}
#net{display:inline-block;width:7px;height:7px;border-radius:50%;background:#777;margin-right:5px;vertical-align:1px}
#net.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}#net.wait{background:var(--ember)}
#log .on{color:var(--lake)}
.online{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;background:rgba(127,200,255,.18);color:var(--lake)}
.online.npc{background:rgba(255,255,255,.08);color:var(--muted)}
#rotHint{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(8,10,20,.92);text-align:center;padding:24px;font-size:15px;line-height:1.5}
#rotHint i{font-style:normal;font-size:54px;animation:rot 1.8s ease-in-out infinite}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}

/* ---------- Mini-game overlay ---------- */
#mini{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 96px);width:min(380px,calc(100% - 32px));padding:14px 16px;z-index:30;display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
#mini h3{margin:0;font-family:var(--display);font-size:20px;color:var(--ember)}
.gauge{position:relative;height:18px;border-radius:9px;background:linear-gradient(90deg,#4d5a73 0%,#4d5a73 58%,#ffcf5a 58%,#ffcf5a 86%,#b8492e 86%);overflow:hidden}
.gauge i{position:absolute;top:-3px;width:4px;height:24px;background:#fff;border-radius:2px;box-shadow:0 0 6px #000}
.gauge.two{margin-top:2px}
.big{font-size:22px;padding:16px}
.score{font-family:var(--display);font-size:38px;color:var(--ember);line-height:1;text-align:center}

/* ---------- Modal ---------- */
#modal{position:fixed;inset:0;background:rgba(5,6,14,.6);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px;box-sizing:border-box}
#mbox{width:min(460px,100%);max-height:calc(100% - 8px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
#mbox h2{margin:0;font-family:var(--display);color:var(--ember);font-size:24px;line-height:1.1}
#mbox textarea{min-height:110px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:13px;font-weight:600}
.chip.on{background:var(--ember);color:#2a1606;border-color:var(--ember)}
.items{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{padding:12px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);text-align:left;display:flex;flex-direction:column;gap:3px}
.item b{font-size:15px}.item span{font-size:12px;color:var(--muted)}
.item i{font-style:normal;font-size:26px}
.letter{padding:12px 14px;border-radius:14px;background:rgba(255,243,221,.07);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.letter p{margin:0;font-size:14px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.letter .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.letter .tag{padding:2px 8px;border-radius:999px;background:rgba(255,179,71,.18);color:var(--ember);font-weight:600}
.cmt{font-size:13px;padding:6px 10px;border-left:2px solid var(--ember);background:rgba(0,0,0,.2);border-radius:0 8px 8px 0}
.cmt b{color:var(--ember)}
.linkbtn{background:none;border:none;padding:0;font-size:12px;color:var(--muted);text-decoration:underline}
.rank{display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
.rank div{display:flex;justify-content:space-between;padding:7px 10px;border-radius:10px;background:rgba(255,255,255,.04);font-size:14px}
.rank div.me{background:rgba(255,179,71,.2);color:#fff;font-weight:700}
.campgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.camp{position:relative;padding:10px 10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);text-align:left;display:flex;flex-direction:column;gap:3px;font-size:14px;font-weight:600}
.camp span{font-size:12px;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.camp em{position:absolute;top:6px;right:8px;font-style:normal;font-size:10px;color:var(--ember)}
.camp.here{border-color:var(--ember)}
.camp .bar{height:3px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}.camp .bar i{display:block;height:100%;background:var(--ember)}
.invitebox{padding:12px;border-radius:14px;border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
@container stage (max-width:520px){.campgrid{grid-template-columns:repeat(3,1fr)}}
.fishgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px;text-align:center}
.fishgrid div{padding:8px 4px;border-radius:10px;background:rgba(255,255,255,.04)}
.fishgrid div.no{opacity:.35}

/* ---------- Private chat ---------- */
#pchat{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 66px);width:min(300px,calc(100% - 32px));padding:10px;z-index:15;display:flex;flex-direction:column;gap:8px;box-sizing:border-box}
#pchat header{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px}
#pchat header span{color:var(--muted);font-weight:400;font-size:12px}
#plog{max-height:180px;overflow:auto;font-size:13px;line-height:1.45;display:flex;flex-direction:column;gap:3px}
#plog b{color:var(--lake)}

#boot{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:18px 22px;z-index:50;max-width:calc(100% - 32px);text-align:center;font-size:15px;line-height:1.5;box-sizing:border-box}
@container stage (max-width:720px){
  /* Bảng tạo nhân vật thành bottom sheet: nửa trên màn hình để ngắm nhân vật */
  #creator{top:auto;bottom:0;left:0;right:0;width:auto;height:58%;border-radius:22px 22px 0 0;border-bottom:none;padding:4px 14px calc(env(safe-area-inset-bottom,0px) + 12px);gap:9px}
  #creator.collapsed{height:auto}
  #creator.collapsed .pane,#creator.collapsed .tabs,#creator.collapsed .foot .lbl{display:none}
  .grab{display:flex;justify-content:center;align-items:center;width:100%;height:24px;background:none;border:none;padding:0;flex:0 0 auto}
  .grab span{width:46px;height:5px;border-radius:3px;background:rgba(255,243,221,.4)}
  #creator{height:62%}
  #creator h1{font-size:19px}
  #creator h1 small{display:none;font-size:12px;margin-top:3px}
  #creator.collapsed h1 small{display:block}
  .foot .lbl{display:none}
  .foot .row{flex-wrap:nowrap}
  .foot #go{flex:0 0 auto;padding:11px 16px;font-size:16px}
  .dl{display:none}.ml{display:inline}
  .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;min-width:auto;padding:9px 14px;font-size:14px}
  .grid{grid-template-columns:repeat(4,1fr);gap:6px}
  .opt{font-size:11px;padding:7px 3px;min-height:54px;border-radius:12px}
  .dot{width:34px;height:34px}
  .foot{gap:6px}
  /* HUD */
  #topbar{padding:5px 10px 5px 5px;gap:8px;left:12px;max-width:calc(100% - 84px);box-sizing:border-box}
  #topbar img{width:32px;height:32px;border-radius:10px}
  #topbar b{font-size:15px}
  #tools{flex-direction:column;right:max(12px,env(safe-area-inset-right,0px));gap:6px}
  #tools .x{display:none}
  #tools.open .x{display:block}
  .mob{display:block}
  #chatbox{top:calc(env(safe-area-inset-top,0px) + 60px);bottom:auto;left:12px;right:68px;width:auto;max-width:380px;padding:7px;gap:6px}
  #chatbox:not(.open){background:rgba(20,24,42,.5);backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none}
  #chatbox:not(.open) #chatform{display:none}
  #chatbox:not(.open) #log{max-height:36px;overflow:hidden;font-size:12px;justify-content:flex-end}
  #chatbox.open #log{max-height:120px}
  #status{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);left:12px;right:12px;transform:none;max-width:none;flex-wrap:wrap;justify-content:center;text-align:center;font-size:12px;gap:6px 8px}
  #toast{top:calc(env(safe-area-inset-top,0px) + 108px);font-size:13px;padding:9px 14px}
  #bar{left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);transform:none;max-width:none;-webkit-mask-image:linear-gradient(90deg,#000 85%,rgba(0,0,0,.25));mask-image:linear-gradient(90deg,#000 85%,rgba(0,0,0,.25))}
  #bar button{width:56px}
  #mini{bottom:calc(env(safe-area-inset-bottom,0px) + 80px);width:calc(100% - 24px)}
  #modal{align-items:flex-end;padding:0}
  #mbox{width:100%;max-height:88%;border-radius:22px 22px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px)}
  #pchat{top:calc(env(safe-area-inset-top,0px) + 108px);left:12px;right:68px;width:auto}
}
/* ---------- Mini-game ---------- */
#mg{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);width:min(720px,calc(100% - 32px));z-index:35;display:flex;flex-direction:column;box-sizing:border-box;padding:0;overflow:hidden}
.mgh{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}.mgh b{font-family:var(--display);font-size:20px;color:var(--ember);flex:1}
.mgx{padding:7px 12px}.mgbody{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px;min-height:0}
.mgt{margin:0;text-align:center;font-family:var(--display);font-size:22px;color:var(--cream)}
.mglist{display:flex;flex-direction:column;gap:5px}.mglist>div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 11px;border-radius:10px;background:rgba(255,255,255,.05);font-size:14px}
.mglist>div.me{background:rgba(255,179,71,.2)}.mglist>div.turn{box-shadow:inset 0 0 0 1px var(--ember)}.mglist.small>div{padding:5px 9px;font-size:12px}
.mggrid{display:grid;grid-template-columns:1fr;gap:8px}.mgcard{padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);display:flex;flex-direction:column;gap:8px}
.mgcard i{font-style:normal;font-size:30px}.mgcard b{display:block;font-size:15px}.mgcard span{display:block;font-size:12px;color:var(--muted)}
.sm{padding:8px 12px!important;font-size:14px!important;border-radius:11px}.row.wrap{flex-wrap:wrap}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.podium div{padding:10px 6px;border-radius:12px;background:rgba(255,255,255,.05);display:flex;flex-direction:column;gap:2px}.podium i{font-style:normal;font-size:28px}.podium span{font-size:12px;color:var(--muted)}

<script>
/* ======================= KHUNG HIỂN THỊ (iframe / toàn màn hình) =======================
   Đo kích thước thật của vùng chứa bằng ResizeObserver (không dùng kích thước màn hình).
   Khi được nhúng iframe: vùng chứa < 1400px → giữ khung 16:9 ở giữa; ≥ 1400px → đầy toàn bộ vùng chứa.
   Mở trực tiếp hoặc đang toàn màn hình → luôn đầy khung. */
(function(){
  var st=document.getElementById('stage'),last=null;
  var embedded=(function(){try{return window.self!==window.top}catch(e){return true}})();
  var isFs=function(){return !!(document.fullscreenElement||document.webkitFullscreenElement)};
  function fit(w,h){last=[w,h];var sw=w,sh=h;
    if(embedded&&!isFs()&&w<1400){sw=w;sh=w*9/16;if(sh>h){sh=h;sw=h*16/9}}
    sw=Math.round(sw);sh=Math.round(sh);
    st.style.width=sw+'px';st.style.height=sh+'px';st.style.left=Math.round((w-sw)/2)+'px';st.style.top=Math.round((h-sh)/2)+'px';
    document.documentElement.classList.toggle('embedded',embedded)}
  var de=document.documentElement;
  if(window.ResizeObserver)new ResizeObserver(function(es){var r=es[es.length-1].contentRect;fit(r.width,r.height)}).observe(de);
  else{var f=function(){fit(de.clientWidth,de.clientHeight)};addEventListener('resize',f)}
  fit(de.clientWidth,de.clientHeight);
  ['fullscreenchange','webkitfullscreenchange'].forEach(function(ev){document.addEventListener(ev,function(){if(last)fit(last[0],last[1])})});
  window.__embedded=embedded;
})();
</script>

function tent(x,z,c){
  const rot=faceTo(x,z,0,0);
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;world.add(g);
  const shape=new THREE.Shape();shape.moveTo(-1.2,0);shape.lineTo(0,1.6);shape.lineTo(1.2,0);shape.lineTo(-1.2,0);
  const geo=new THREE.ExtrudeGeometry(shape,{depth:2.2,bevelEnabled:false});geo.translate(0,0,-1.1);
  const body=mesh(geo,M(c));g.add(body);
  const door=mesh(new THREE.CircleGeometry(.5,3),M('#1b1410'),0,.42,1.11,false);door.rotation.z=Math.PI*1.5;g.add(door);
  const lightIn=glow('#ffcf80',0);lightIn.position.set(0,.7,.6);g.add(lightIn);
  obstacles.push({x,z,r:1.45});
  const s=addSeat({x,z,rot,h:0,type:'tent',reach:2.1,meshes:[body,door]});s.glow=lightIn;return s;
}

function stripeTex(c1,c2){const cv=document.createElement('canvas');cv.width=cv.height=64;const x=cv.getContext('2d');x.fillStyle=c1;x.fillRect(0,0,64,64);x.fillStyle=c2;for(let i=0;i<4;i++)x.fillRect(0,i*16,64,8);const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(1,2);t.encoding=THREE.sRGBEncoding;return t}
function shade(hex,f){const c=new THREE.Color(hex);c.multiplyScalar(f);return '#'+c.getHexString()}

/* họa tiết vải vẽ bằng canvas (cache theo màu) */
const patCache={};
function patTex(kind,base,acc){const key=kind+base+acc;if(patCache[key])return patCache[key];
  const cv=document.createElement('canvas');cv.width=cv.height=64;const x=cv.getContext('2d');x.fillStyle=base;x.fillRect(0,0,64,64);x.fillStyle=acc;
  const star=(cx,cy,r)=>{x.beginPath();for(let i=0;i<10;i++){const a=i/10*Math.PI*2-Math.PI/2,rr=i%2?r*.45:r;x.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr)}x.closePath();x.fill()};
  const heart=(cx,cy,s)=>{x.beginPath();x.moveTo(cx,cy+s*.9);x.bezierCurveTo(cx-s*1.4,cy-s*.1,cx-s*.6,cy-s*1.1,cx,cy-s*.35);x.bezierCurveTo(cx+s*.6,cy-s*1.1,cx+s*1.4,cy-s*.1,cx,cy+s*.9);x.fill()};
  switch(kind){
    case 'hstripe':for(let i=0;i<4;i++)x.fillRect(0,i*16+4,64,7);break;
    case 'vstripe':for(let i=0;i<4;i++)x.fillRect(i*16+4,0,7,64);break;
    case 'dots':for(let i=0;i<4;i++)for(let j=0;j<4;j++){x.beginPath();x.arc(4+i*16+(j%2)*8,8+j*16,3.6,0,7);x.fill()}break;
    case 'plaid':x.globalAlpha=.45;for(let i=0;i<4;i++){x.fillRect(i*16,0,7,64);x.fillRect(0,i*16,64,7)}x.globalAlpha=1;for(let i=0;i<4;i++){x.fillRect(i*16+11,0,1.5,64);x.fillRect(0,i*16+11,64,1.5)}break;
    case 'stars':for(let i=0;i<3;i++)for(let j=0;j<3;j++)star(11+i*21+(j%2)*10,11+j*21,6.5);break;
    case 'hearts':for(let i=0;i<3;i++)for(let j=0;j<3;j++)heart(11+i*21+(j%2)*10,11+j*21,5.5);break;
    case 'flowers':for(let i=0;i<3;i++)for(let j=0;j<3;j++){const cx=11+i*21+(j%2)*10,cy=11+j*21;x.fillStyle=acc;for(let k=0;k<5;k++){const a=k/5*Math.PI*2;x.beginPath();x.arc(cx+Math.cos(a)*3.6,cy+Math.sin(a)*3.6,2.8,0,7);x.fill()}x.fillStyle='#ffcf3a';x.beginPath();x.arc(cx,cy,2,0,7);x.fill()}break;
  }
  const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;return patCache[key]=t}
function starGeo(r){const s=new THREE.Shape();for(let i=0;i<10;i++){const a=i/10*Math.PI*2+Math.PI/2,rr=i%2?r*.45:r;const x=Math.cos(a)*rr,y=Math.sin(a)*rr;if(i)s.lineTo(x,y);else s.moveTo(x,y)}return new THREE.ShapeGeometry(s)}
// đặt miếng dán phẳng lên bề mặt đầu (bán kính ~.36)
function decal(geo,mat,x,y,r=.364){const m=new THREE.Mesh(geo,mat);const z=Math.sqrt(Math.max(.001,r*r-x*x-y*y));m.position.set(x,y,z);m.rotation.set(-Math.asin(y/r),Math.atan2(x,z),0,'YXZ');return m}

// legs: chất liệu ống chân · sl: kiểu tay áo · d: chi tiết trang trí · skirt: kiểu váy
const OUT_DEF={jump:{legs:'main',sl:'long',d:'zip'},tee:{legs:'skin',shorts:1,sl:'short'},tank:{legs:'skin',shorts:1,sl:'none'},shirt:{legs:'second',sl:'long',d:'collar'},hoodie:{legs:'second',sl:'long',d:'hood'},sweater:{legs:'second',sl:'long',d:'turtle'},bomber:{legs:'denim',sl:'long',d:'bomber'},puffer:{legs:'second',sl:'puffy',d:'puffer'},sport:{legs:'main',sl:'long',d:'sport'},suit:{legs:'second',sl:'long',d:'suit'},overall:{legs:'denim',sl:'short',d:'overall'},stripe:{legs:'main',sl:'long'},aodai:{legs:'white',sl:'long',d:'aodai'},baba:{legs:'second',sl:'long',d:'baba'},school:{legs:'second',sl:'short',d:'school',white:1},dress:{legs:'skin',sl:'short',skirt:'flare'},skirt:{legs:'skin',sl:'short',skirt:'pencil'},longdress:{legs:'skin',sl:'none',skirt:'long'}};

function buildChar(c){
  const def=OUT_DEF[c.outfit]||OUT_DEF.jump;
  const root=new THREE.Group();
  const body=new THREE.Group();root.add(body);
  const skin=M(c.skin);
  let main;
  if(def.white)main=M('#f7f7f2');
  else if(c.outfit==='stripe')main=M('#ffffff',{map:stripeTex(c.color,'#2b2f3d')});
  else if(c.pattern&&c.pattern!=='plain')main=M('#ffffff',{map:patTex(c.pattern,c.color,c.pcolor||'#ffffff')});
  else main=M(c.color);
  const second=M(c.color2||'#3a4a6b'),shoe=M(c.shoe||'#7a4a2e'),den=M('#4a6fa8'),white=M('#f7f7f2');
  const trim=M(shade(def.white?'#f7f7f2':c.color,.72));
  const parts={};
  const female=c.gender==='f';
  const B=(geo,mat,x,y,z,rx=0,ry=0,rz=0,cast=true)=>{const m=mesh(geo,mat,x,y,z,cast);m.rotation.set(rx,ry,rz);body.add(m);return m};
  // legs
  const legMat={main,skin,second,denim:den,white}[def.legs]||main;
  ['L','R'].forEach((s,i)=>{
    const hip=new THREE.Group();hip.position.set(i?.1:-.1,.42,0);body.add(hip);
    hip.add(mesh(new THREE.BoxGeometry(.16,.34,.18),legMat,0,-.19,0));
    if(def.shorts)hip.add(mesh(new THREE.BoxGeometry(.18,.16,.2),second,0,-.07,0));
    if(def.d==='sport')hip.add(mesh(new THREE.BoxGeometry(.02,.33,.1),white,(i?1:-1)*.081,-.19,0,false));
    hip.add(mesh(new THREE.BoxGeometry(.18,.08,.25),shoe,0,-.38,.03));
    if(c.shoe==='#f2f2ee'||c.shoe==='#ffffff')hip.add(mesh(new THREE.BoxGeometry(.185,.02,.255),M('#9aa0ad'),0,-.415,.03,false));
    parts['leg'+s]=hip;
  });
  // torso
  const torsoW=female?.46:.5;parts.tw=torsoW;
  B(new THREE.BoxGeometry(torsoW,.46,.32),main,0,.64,0);
  switch(def.d){
    case 'zip':B(new THREE.BoxGeometry(.03,.3,.01),trim,0,.66,.165,0,0,0,false);break;
    case 'hood':{const hood=mesh(new THREE.TorusGeometry(.2,.07,8,16,Math.PI),main,0,.88,-.08);hood.rotation.x=-.4;body.add(hood);B(new THREE.BoxGeometry(.26,.12,.02),trim,0,.52,.165,0,0,0,false);break}
    case 'collar':[-1,1].forEach(s=>B(new THREE.BoxGeometry(.11,.06,.02),trim,s*.06,.85,.168,0,0,-s*.5,false));[.78,.68,.58,.48].forEach(y=>B(new THREE.SphereGeometry(.014,6,5),white,0,y,.165,0,0,0,false));break;
    case 'turtle':B(new THREE.TorusGeometry(.13,.055,8,16),main,0,.9,0,Math.PI/2);B(new THREE.BoxGeometry(torsoW+.012,.05,.33),trim,0,.43,0);break;
    case 'bomber':B(new THREE.TorusGeometry(.15,.05,8,16),second,0,.88,0,Math.PI/2);B(new THREE.BoxGeometry(torsoW+.02,.07,.34),second,0,.44,0);B(new THREE.BoxGeometry(.025,.36,.01),M('#c9cbd6'),0,.64,.166,0,0,0,false);break;
    case 'puffer':[.5,.64,.78].forEach(y=>B(new THREE.BoxGeometry(torsoW+.08,.15,.38),main,0,y,0));B(new THREE.TorusGeometry(.15,.06,8,16),main,0,.9,0,Math.PI/2);break;
    case 'sport':B(new THREE.BoxGeometry(.025,.42,.01),white,0,.64,.166,0,0,0,false);B(new THREE.TorusGeometry(.14,.03,6,16),white,0,.88,0,Math.PI/2);break;
    case 'suit':B(new THREE.BoxGeometry(.15,.32,.01),white,0,.71,.163,0,0,0,false);B(new THREE.BoxGeometry(.05,.26,.012),M('#c73a3a'),0,.7,.171,0,0,0,false);[-1,1].forEach(s=>B(new THREE.BoxGeometry(.05,.3,.015),trim,s*.09,.72,.168,0,0,s*.25,false));[.55,.47].forEach(y=>B(new THREE.SphereGeometry(.015,6,5),trim,0,y,.168,0,0,0,false));break;
    case 'overall':B(new THREE.BoxGeometry(torsoW+.01,.22,.33),den,0,.52,0);B(new THREE.BoxGeometry(.24,.2,.02),den,0,.68,.165);[-.1,.1].forEach(x=>B(new THREE.BoxGeometry(.05,.24,.02),den,x,.78,.165));break;
    case 'aodai':B(new THREE.CylinderGeometry(.13,.14,.08,14,1,true),main,0,.9,0);B(new THREE.BoxGeometry(torsoW-.06,.36,.025),main,0,.24,.15);B(new THREE.BoxGeometry(torsoW-.06,.36,.025),main,0,.24,-.15);[.82,.76,.7].forEach((y,i)=>B(new THREE.SphereGeometry(.013,6,5),M('#f2d14a'),.06+i*.03,y,.164,0,0,0,false));break;
    case 'baba':B(new THREE.BoxGeometry(torsoW+.01,.12,.33),main,0,.37,0);[.8,.68,.56,.44].forEach(y=>B(new THREE.SphereGeometry(.015,6,5),M('#f2f2ee'),0,y,.168,0,0,0,false));break;
    case 'school':[-1,1].forEach(s=>B(new THREE.BoxGeometry(.11,.06,.02),M('#e8e8e2'),s*.06,.85,.168,0,0,-s*.5,false));B(new THREE.BoxGeometry(.03,.38,.01),M('#e8e8e2'),0,.64,.164,0,0,0,false);
      if(!c.neck||c.neck==='none'){const r=M('#e02b2b');B(new THREE.TorusGeometry(.19,.035,6,18),r,0,.9,0,Math.PI/2);B(new THREE.ConeGeometry(.07,.2,3),r,0,.78,.17,0,0,Math.PI)}break;
  }
  if(def.skirt==='flare'){B(new THREE.CylinderGeometry(.24,.42,.36,16),main,0,.36,0);B(new THREE.TorusGeometry(.245,.025,6,16),white,0,.53,0,Math.PI/2)}
  if(def.skirt==='pencil'){B(new THREE.CylinderGeometry(.25,.29,.28,16),second,0,.3,0)}
  if(def.skirt==='long'){B(new THREE.CylinderGeometry(.25,.42,.5,18),main,0,.21,0);B(new THREE.TorusGeometry(.42,.02,6,20),trim,0,-.03,0,Math.PI/2)}
  // arms
  ['L','R'].forEach((s,i)=>{
    const sg=i?1:-1;
    const sh=new THREE.Group();sh.position.set(sg*(torsoW/2+.07+(def.sl==='puffy'?.03:0)),.84,0);body.add(sh);
    if(def.sl==='long'){sh.add(mesh(new THREE.BoxGeometry(.13,.34,.15),main,0,-.17,0));if(def.d==='sport')sh.add(mesh(new THREE.BoxGeometry(.02,.32,.155),white,sg*.066,-.17,0,false));if(def.d==='bomber')sh.add(mesh(new THREE.BoxGeometry(.14,.05,.16),second,0,-.33,0))}
    else if(def.sl==='puffy'){sh.add(mesh(new THREE.BoxGeometry(.17,.36,.19),main,0,-.17,0));sh.add(mesh(new THREE.BoxGeometry(.18,.05,.2),trim,0,-.17,0))}
    else if(def.sl==='short'){sh.add(mesh(new THREE.BoxGeometry(.14,.14,.16),main,0,-.07,0));sh.add(mesh(new THREE.BoxGeometry(.11,.22,.12),skin,0,-.24,0))}
    else sh.add(mesh(new THREE.BoxGeometry(.11,.34,.12),skin,0,-.17,0));
    const hand=mesh(new THREE.SphereGeometry(.075,10,8),skin,0,-.4,0);sh.add(hand);
    sh.rotation.z=sg*.12;
    parts['arm'+s]=sh;parts['hand'+s]=hand;
  });
  // head
  const head=new THREE.Group();head.position.set(0,1.2,0);body.add(head);parts.head=head;
  head.add(mesh(new THREE.SphereGeometry(.36,28,20),skin));
  const black=new THREE.MeshBasicMaterial({color:'#1d1a1a'});
  [-.12,.12].forEach(x=>{const e=new THREE.Mesh(new THREE.SphereGeometry(.04,10,8),black);e.position.set(x,.0,.335);e.scale.z=.5;head.add(e);(parts.eyes=parts.eyes||[]).push(e);
    if(female){const l=new THREE.Mesh(new THREE.BoxGeometry(.05,.012,.01),black);l.position.set(x+(x>0?.03:-.03),.045,.34);l.rotation.z=x>0?-.5:.5;head.add(l)}});
  const cheekM=new THREE.MeshBasicMaterial({color:'#ff9aa2',transparent:true,opacity:.8});
  [-.2,.2].forEach(x=>{const ch=new THREE.Mesh(new THREE.CircleGeometry(.055,14),cheekM);ch.position.set(x,-.07,.3);ch.lookAt(x*3,-.2,2);head.add(ch)});
  const mouth=new THREE.Mesh(new THREE.TorusGeometry(.045,.012,6,12,Math.PI),new THREE.MeshBasicMaterial({color:'#7a2a2a'}));mouth.position.set(0,-.08,.34);mouth.rotation.z=Math.PI;head.add(mouth);parts.mouth=mouth;
  buildHair(head,c);
  buildAcc(head,body,c,parts);
  root.userData.parts=parts;root.userData.body=body;
  return root;
}
function buildHair(head,c){
  const hm=M(c.hairColor);const tie=M('#ff6fa0');
  const S=(r,w=12,h=10)=>new THREE.SphereGeometry(r,w,h);
  const add=(geo,x,y,z,sx,sy,sz,rx,ry,rz,mat)=>{const m=mesh(geo,mat||hm,x,y,z);if(sx)m.scale.set(sx,sy,sz);m.rotation.set(rx||0,ry||0,rz||0);head.add(m);return m};
  const cap=(t=.42,tilt=-.3,r=.375)=>{const m=mesh(new THREE.SphereGeometry(r,28,16,0,Math.PI*2,0,Math.PI*t),hm);m.rotation.x=tilt;head.add(m);return m};
  const back=(t=.75,r=.385)=>{const m=mesh(new THREE.SphereGeometry(r,24,16,Math.PI,Math.PI,0,Math.PI*t),hm);head.add(m);return m};
  switch(c.hair){
    case 'cap':cap();break;
    case 'spiky':cap(.38,-.2);for(let i=0;i<9;i++){const a=i/9*Math.PI*2;const s=mesh(new THREE.ConeGeometry(.08,.2,5),hm,Math.cos(a)*.18,.36,Math.sin(a)*.18);s.rotation.set(Math.sin(a)*.5,0,-Math.cos(a)*.5);head.add(s)}head.add(mesh(new THREE.ConeGeometry(.09,.24,5),hm,0,.44,0));break;
    case 'side':cap(.4,-.25);{const f=mesh(S(.2,14,10),hm,-.12,.2,.25);f.scale.set(1.4,.6,.7);f.rotation.z=.4;head.add(f)}break;
    case 'parted':cap(.42,-.28,.38);add(S(.2,14,10),.1,.24,.24,1.5,.55,.7,0,0,-.35);add(S(.12,10,8),-.2,.21,.2,1,.5,.6,0,0,.5);break;

function textSprite(text,opts={}){
  if(!opts.raw)text=window.__lang?window.__lang.tr(text):text;
  const cv=document.createElement('canvas'),x=cv.getContext('2d');
  const fs=opts.size||40;x.font=`600 ${fs}px "Be Vietnam Pro",system-ui,sans-serif`;
  const maxW=520;const words=String(text).split(' ');const lines=[];let cur='';
  words.forEach(w=>{const t=cur?cur+' '+w:w;if(x.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t});lines.push(cur);
  const w=Math.min(maxW,Math.max(...lines.map(l=>x.measureText(l).width)))+40,h=lines.length*fs*1.25+26+(opts.bubble?18:0);
  cv.width=Math.ceil(w);cv.height=Math.ceil(h);
  x.font=`600 ${fs}px "Be Vietnam Pro",system-ui,sans-serif`;
  const bh=h-(opts.bubble?18:0);
  x.fillStyle=opts.bg||'rgba(15,18,34,.75)';
  const r=22;x.beginPath();x.moveTo(r,0);x.arcTo(w,0,w,bh,r);x.arcTo(w,bh,0,bh,r);x.arcTo(0,bh,0,0,r);x.arcTo(0,0,w,0,r);x.closePath();x.fill();
  if(opts.bubble){x.beginPath();x.moveTo(w/2-14,bh-1);x.lineTo(w/2,h);x.lineTo(w/2+14,bh-1);x.fill()}
  x.fillStyle=opts.color||'#fff3dd';x.textAlign='center';x.textBaseline='middle';
  lines.forEach((l,i)=>x.fillText(l,w/2,13+fs*.62+i*fs*1.25));
  const tex=new THREE.CanvasTexture(cv);tex.encoding=THREE.sRGBEncoding;tex.minFilter=THREE.LinearFilter;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));
  const k=(opts.scale||.0042);sp.scale.set(cv.width*k,cv.height*k,1);sp.renderOrder=10;
  return sp;
}

    if(this.label)this.g.remove(this.label);this.label=textSprite((this.remote?'● ':'')+(this.c.name||'Khách'),{raw:this.remote,size:34,bg:this.isPlayer?'rgba(255,150,50,.85)':this.remote?'rgba(30,80,140,.85)':'rgba(15,18,34,.72)',color:this.isPlayer?'#2a1606':this.remote?'#dff1ff':'#fff3dd',scale:.0036});this.label.position.y=1.92;this.label.visible=showNames;this.label.userData.actor=this;this.g.add(this.label);
    const k=this.propKind;this.prop=null;this.propKind=null;if(k)this.hold(k)}
  say(t,silent,raw){if(this.bubble)this.g.remove(this.bubble);this.bubble=textSprite(t,{raw,bubble:true,bg:'rgba(255,248,236,.95)',color:'#2b2230',size:36});this.bubble.position.y=2.35+this.bubble.scale.y/2-.2;this.g.add(this.bubble);this.bubbleT=6;
    if(!silent){addLog(this.c.name||'Khách',t);if(raw)log.lastChild.setAttribute('translate','no')}}
  hold(kind){this.drop();if(!kind)return;const p=makeProp(kind);this.parts.handR.add(p);this.prop=p;this.propKind=kind}
  drop(){if(this.prop){this.prop.parent&&this.prop.parent.remove(this.prop);this.prop=null;this.propKind=null}}
  goTo(x,z,cb,seat,reach){this.leave();this.target={x,z,seat,reach};this.onArrive=cb||null;this.stuckT=0;
    const nearDock=(px,pz)=>onDock(px,pz)||(pz<-10.3&&Math.abs(px-3)<1.6);const f=nearDock(this.pos.x,this.pos.z),t=nearDock(x,z);
    this.path=(f!==t)?[{x:3,z:-9.7}]:[];
    const dist=Math.hypot(x-this.pos.x,z-this.pos.z);this.giveUp=dist/(this.isPlayer?3.2:1.7)*2.2+3}
  sit(seat){if(seat.taken&&seat.taken!==this)return false;this.leave();seat.taken=this;this.seat=seat;this.state='sit';this.pos.set(seat.x,0,seat.z);this.rot=seat.rot;this.target=null;
    if(seat.type==='tent'){this.g.visible=false;if(seat.glow)seat.glow.scale.set(1.6,1.6,1)}return true}
  leave(){ // rời ghế / hàng nhảy
    if(this.state==='conga'){const i=conga.indexOf(this);if(i>=0)conga.splice(i,1);this.state='idle'}
    if(this.seat){const s=this.seat;s.taken=null;this.seat=null;this.g.visible=true;if(s.glow)s.glow.scale.set(0,0,1);
      if(s.type==='tent'){this.pos.x=s.x+Math.sin(s.rot)*1.8;this.pos.z=s.z+Math.cos(s.rot)*1.8}
      else if(s.type==='blanket'){this.pos.x=s.x+1.0;}
      else if(s.type==='fish'&&s.h>.5){this.pos.x=s.x;this.pos.z=s.z+.8}
      else if(s.type==='ground'){}
      else{this.pos.x+=Math.sin(s.rot)*.75;this.pos.z+=Math.cos(s.rot)*.75}}
    if(this.state==='sit')this.state='idle';
  }
  joinConga(){this.leave();this.target=null;conga.push(this);this.state='conga';this.emote=null}
  setFace(f,dur){this.face=f;this.faceT=dur||3}
  setEmote(e,dur){this.emote=e;this.emoteT=dur||(e==='sleep'?8:3.2);if(this.isPlayer)netSend({t:'emo',e,d:this.emoteT})}
  update(dt,t){
    const P=this.parts;let moving=false;
    if(this.state==='conga'){
      const i=conga.indexOf(this);const a=congaAngle-i*.42;
      const tx=Math.cos(a)*CONGA_R,tz=Math.sin(a)*CONGA_R;
      this.pos.x+= (tx-this.pos.x)*Math.min(1,dt*4);this.pos.z+=(tz-this.pos.z)*Math.min(1,dt*4);
      this.rot=Math.atan2(-Math.sin(a),Math.cos(a));moving=true;this.walkT+=dt*9;
    } else if(this.remote&&this.state!=='sit'){moving=netMove(this,dt);
    } else if(this.state!=='sit'){
      let dx=0,dz=0;
      if(this.input&&(this.input.x||this.input.z)){dx=this.input.x;dz=this.input.z;moving=true;this.target=null;this.onArrive=null}
      else if(this.target){
        if(this.path&&this.path.length){const w=this.path[0];if(Math.hypot(w.x-this.pos.x,w.z-this.pos.z)<.35)this.path.shift()}
        this.giveUp-=dt;if(this.giveUp<=0){this.pos.x=this.target.x;this.pos.z=this.target.z;this.path=[]}
        const goal=(this.path&&this.path.length)?this.path[0]:this.target;
        dx=goal.x-this.pos.x;dz=goal.z-this.pos.z;let d=Math.hypot(dx,dz);if(goal!==this.target)d+=10;
        const reach=this.target.seat?this.target.seat.reach:(this.target.reach||.2);
        if(d<reach){const s=this.target.seat;this.target=null;dx=dz=0;if(s&&!this.sit(s)&&this.isPlayer)toast('Chỗ này vừa có người rồi');const f=this.onArrive;this.onArrive=null;if(f)f()}
        else{moving=true;const dd=Math.hypot(dx,dz)||1;dx/=dd;dz/=dd;
          this.stuckT+=dt;if(this.stuckT>1.2){if(this.lastD-d<.3){ // kẹt → dịch chuyển nhẹ tới đích
              const jump=Math.min(1.5,Math.hypot(goal.x-this.pos.x,goal.z-this.pos.z));this.pos.x+=dx*jump;this.pos.z+=dz*jump}this.lastD=d;this.stuckT=0}}}
      if(moving){
        if(this.emote&&this.emote!=='wave')this.emote=null;
        const sp=(this.isPlayer?3.2:1.7)*dt;
        let nx=this.pos.x+dx*sp,nz=this.pos.z+dz*sp;
        for(const o of obstacles){const ox=nx-o.x,oz=nz-o.z,d=Math.hypot(ox,oz),m=o.r+.3;if(d<m&&d>1e-4){nx=o.x+ox/d*m;nz=o.z+oz/d*m}}
        if(!onDock(nx,nz)){const v=lakeVal(nx,nz,-.25);if(v<1){const k=1/Math.sqrt(v);nx=LAKE.x+(nx-LAKE.x)*k;nz=LAKE.z+(nz-LAKE.z)*k}}
        for(const a of actors){if(a===this||this.isPlayer||a.isPlayer||a.state==='sit'||!a.g.visible)continue;const ox=nx-a.pos.x,oz=nz-a.pos.z,d=Math.hypot(ox,oz);if(d<.55&&d>1e-4){nx=a.pos.x+ox/d*.55;nz=a.pos.z+oz/d*.55}}
        const R=Math.hypot(nx,nz+4);if(R>24){nx*=24/R;nz=(nz+4)*24/R-4}
        this.pos.x=nx;this.pos.z=nz;
        const want=Math.atan2(dx,dz);let d=want-this.rot;d=Math.atan2(Math.sin(d),Math.cos(d));this.rot+=d*Math.min(1,dt*12);
        this.walkT+=dt*(this.isPlayer?11:8);
      }
    }
    this.g.position.set(this.pos.x,groundY(this.pos.x,this.pos.z),this.pos.z);this.g.rotation.y=this.rot;
    // pose
    const sw=moving?Math.sin(this.walkT):0;const body=this.model.userData.body;
    body.position.set(0,moving?Math.abs(Math.cos(this.walkT))*.05:Math.sin(t*2+this.pos.x)*.008,0);
    body.rotation.set(0,0,0);P.head.rotation.set(0,0,0);
    P.legL.rotation.x=sw*.7;P.legR.rotation.x=-sw*.7;
    P.armL.rotation.set(-sw*.6,0,-.12);P.armR.rotation.set(sw*.6,0,.12);
    if(this.state==='conga'){P.armL.rotation.set(-1.3,0,.2);P.armR.rotation.set(-1.3,0,-.2);body.rotation.z=Math.sin(t*6)*.12}
    if(this.state==='sit'){
      const s=this.seat;this.g.position.y=s.h-.42+.02;
      if(s.type==='blanket'){this.g.position.y=s.h+.18;body.rotation.x=-Math.PI/2;body.position.set(0,0,-.1);P.legL.rotation.x=P.legR.rotation.x=0;P.armL.rotation.set(0,0,-.5);P.armR.rotation.set(0,0,.5)}
      else{P.legL.rotation.x=P.legR.rotation.x=-1.45;P.armL.rotation.set(-.5,0,-.15);P.armR.rotation.set(-.5,0,.15);body.position.z=-.05}
    }
    if(this.prop){
      if(this.propKind==='rod'){P.armR.rotation.set(this.rodArm!==undefined?this.rodArm:-1.0,0,.1);P.armL.rotation.set(-1.0,0,-.3)}
      else if(this.propKind==='cup'){P.armR.rotation.set(-1.5+Math.max(0,Math.sin(t*.8))*.4,0,-.3)}
      else{P.armR.rotation.set(-1.1,0,.1);const f=this.prop.userData.food;if(f&&this.cookK!==undefined){f.traverse(o=>{if(o.isMesh&&o.userData.base)o.material.color.copy(cookColor(o.userData.base,this.cookK))})}}
    }
    if(this.emote){
      this.emoteT-=dt;const e=this.emote;if(this.emoteT<=0)this.emote=null;
      switch(e){
        case 'wave':P.armR.rotation.set(0,0,2.6+Math.sin(t*14)*.4);break;
        case 'dance':body.rotation.y=Math.sin(t*6)*.5;body.position.y+=Math.abs(Math.sin(t*8))*.12;P.armL.rotation.set(0,0,-2.2+Math.sin(t*8)*.6);P.armR.rotation.set(0,0,2.2-Math.sin(t*8)*.6);if(this.state!=='sit'){P.legL.rotation.x=Math.sin(t*8)*.4;P.legR.rotation.x=-Math.sin(t*8)*.4}break;
        case 'clap':{const k=Math.sin(t*18)*.25;P.armL.rotation.set(-1.3,0,.5+k);P.armR.rotation.set(-1.3,0,-.5-k);break}
        case 'sleep':P.head.rotation.z=.35+Math.sin(t*1.5)*.05;P.head.rotation.x=.25;break;
        case 'eat':P.armR.rotation.set(-2.2+Math.sin(t*10)*.2,0,-.4);P.head.rotation.x=Math.sin(t*10)*.05;break;
        case 'chop':{const k=(Math.sin(t*16)+1)/2;P.armR.rotation.set(-2.6+k*2,0,-.2);P.armL.rotation.set(-2.6+k*2,0,.2);body.rotation.x=k*.25;break}
        case 'show':P.armR.rotation.set(-1.45,0,-.45);P.armL.rotation.set(-1.45,0,.45);body.position.y+=Math.abs(Math.sin(t*5))*.03;break;
        case 'laugh':body.rotation.x=Math.sin(t*16)*.06;P.head.rotation.x=-.15;P.armL.rotation.set(-.4,0,-.4);P.armR.rotation.set(-.4,0,.4);break;
        case 'nod':P.head.rotation.x=Math.sin(t*9)*.18;break;
        case 'shrug':P.armL.rotation.set(0,0,-.9);P.armR.rotation.set(0,0,.9);P.head.rotation.z=.12;break;
        case 'pull':P.armR.rotation.set(-2.0,0,.1);P.armL.rotation.set(-2.0,0,-.3);body.rotation.x=-.2;break;
      }
    }
    {const m=P.mouth;m.rotation.set(0,0,Math.PI);m.scale.set(1,1,1);m.position.y=-.08;const E=P.eyes||[];E.forEach(e=>e.scale.set(1,1,.5));
     if(this.face){this.faceT-=dt;if(this.faceT<=0)this.face=null;else switch(this.face){
      case 'happy':m.scale.set(1.3,1.3,1);break;
      case 'laugh':m.scale.set(1.6,1.8,1);E.forEach(e=>e.scale.set(1.3,.25,.5));break;
      case 'sad':m.rotation.z=0;m.position.y=-.13;E.forEach(e=>e.scale.set(1,.65,.5));P.head.rotation.x=.18;break;
      case 'surprise':m.rotation.z=0;m.scale.set(.8,2.2,1);m.position.y=-.11;E.forEach(e=>e.scale.set(1.45,1.45,.5));break;
      case 'shy':m.scale.set(.7,.7,1);P.head.rotation.z=.18;P.head.rotation.x=.1;break;}}}
    if(P.flap){const k=Math.sin(t*(this.state==='sit'?2:4.5)+this.pos.z)*.25;P.flap[0].rotation.y=-(.35+k);P.flap[1].rotation.y=.35+k}
    if(P.tail)P.tail.rotation.y=Math.sin(t*4+this.pos.x)*.45;
    if(P.cape)P.cape.rotation.x=.1+(moving?.35+Math.sin(t*9)*.08:Math.sin(t*1.5)*.04);
    if(this.bubble){this.bubbleT-=dt;if(this.bubbleT<=0){this.g.remove(this.bubble);this.bubble=null}else this.bubble.material.opacity=Math.min(1,this.bubbleT*2)}
  }
}

/* ======================= BOTS ======================= */
const BOT_NAMES=['Mây','Gió','Sóc Nâu','Bông','Cún Mập','Trăng Non','Hạt Đậu','Su Kem','Mèo Mướp','Lá Chè','Bé Na','Ốc Nhỏ','Đom Đóm','Cà Phê','Mưa Bay'];
const BOT_LINES=['Lửa ấm quá nhỉ 🔥','Hôm nay bạn ổn không?','Ngồi đây nghe tiếng củi nổ thích ghê','Ai muốn nướng xiên không?','Thở chậm thôi, mọi chuyện rồi sẽ ổn 🌙','Trời nhiều sao ghê','Mình vừa thả một bông hoa đăng','Chúc mọi người ngủ ngon nha','Cảm ơn vì đã ở đây 💛','Có ai nghe tiếng dế không?','Hồ đêm nay yên ghê','Mai lại đi làm rồi, tối nay xả hơi đã','Ai chẻ củi giỏi nhất trại vậy?'];
function randCfg(name){const g=Math.random()<.5?'m':'f';const hl=g==='m'?HAIR_M:HAIR_F;const ol=OUTFITS.filter(o=>g==='f'||!o[3]);const r=(p,l)=>Math.random()<p?pick(l.slice(1))[0]:'none';
  return{gender:g,skin:pick(SKINS),hair:pick(hl)[0],hairColor:pick(HAIR_COLORS),outfit:pick(ol)[0],color:pick(OUT_COLORS),color2:pick(COLOR2),pattern:Math.random()<.35?pick(PATTERNS.slice(1))[0]:'plain',pcolor:pick(PAT_COLORS),shoe:pick(SHOE_COLORS),hat:r(.4,HATS),face:r(.25,FACES),neck:r(.25,NECKS),back:r(.2,BACKS),acc:pick(ACC_COLORS),name}}
let bots=[];
function clearBots(){bots.forEach(b=>{b.leave();b.drop();scene.remove(b.g);actors.splice(actors.indexOf(b),1)});bots=[]}
function spawnBots(n,names){clearBots();names.slice(0,n).forEach((nm,i)=>{const b=new Actor(randCfg(nm),false);const a=rnd(0,6.28),r=rnd(5,9);b.pos.set(Math.cos(a)*r,0,Math.sin(a)*r);b.think=rnd(1,6);bots.push(b);
  if(i<3){const free=seats.filter(s=>!s.taken&&s.type==='log');if(free.length)b.sit(pick(free))}
  else if(i===3){const f=seats.find(s=>s.type==='fish'&&!s.taken);if(f){b.sit(f);b.hold('rod')}}})}
function freeSeat(type){const f=seats.filter(s=>!s.taken&&s.type===type);return f.length?pick(f):null}
function botAI(b,dt){
  b.think-=dt;if(b.think>0)return;b.think=rnd(5,12);
  if(b.state==='conga'){if(!partyOn&&Math.random()<.5){b.leave()}return}
  const r=Math.random();
  if(partyOn&&r<.35){b.joinConga();return}
  if(r<.06){b.say(pick(BOT_LINES))}else if(r<.2){}
  else if(r<.36){const s=freeSeat(pick(['log','log','chair','fish','blanket']));if(s){b.drop();b.goTo(s.x,s.z,()=>{if(s.type==='fish')b.hold('rod')},s)}}
  else if(r<.48){if(b.state==='sit'&&Math.random()<.6)return;b.drop();const a=rnd(0,6.28),R=rnd(4.5,10);b.goTo(Math.cos(a)*R,Math.sin(a)*R)}
  else if(r<.56){b.drop();const sa=pick([-1,1]);b.goTo(SPOT.shop.x+sa*rnd(1.3,2),SPOT.shop.z+rnd(-.4,.6),()=>{b.rot=SPOT.shop.rot;b.hold(pick(['skewer','corn','cup','mallow']));setTimeout(()=>{if(b.propKind){b.setEmote('eat',2.5)}},rnd(3000,6000));setTimeout(()=>{if(b.propKind!=='rod')b.drop()},9000)})}
  else if(r<.62){b.drop();b.goTo(SPOT.chop.x,SPOT.chop.z,()=>{b.rot=SPOT.chop.rot;b.setEmote('chop',4)})}
  else if(r<.68&&fireLevel<4&&!remotes.size){b.drop();const ws=woodSpot(b.pos.x,b.pos.z);b.goTo(ws.x,ws.z,()=>{b.rot=faceTo(b.pos.x,b.pos.z,0,0);b.setEmote('chop',1);setFireLevel(fireLevel+1);sysLog(b.c.name+' vừa thêm củi, lửa to hơn rồi')})}
  else if(r<.72){const s=freeSeat('tent');if(s){b.drop();b.goTo(s.x,s.z,null,s)}}
  else if(r<.86){b.setEmote(pick(['wave','clap','dance','sleep']))}
}

/* ======================= AUDIO (tự tạo bằng WebAudio) =======================
   3 kênh trộn qua bộ nén: môi trường (gió, dế, cú đêm, lửa lách tách và sóng hồ to nhỏ theo vị trí nhân vật),
   nhạc (guitar êm khi yên tĩnh, nhịp tiệc khi bật tiệc) và hiệu ứng. Nhạc được lên lịch trước theo đồng hồ âm thanh
   nên nhịp đều kể cả khi khung hình giật; tự tạm dừng khi ẩn tab. */
let AC=null,soundOn=false,master=null,vol=store('tay_vol');if(vol===null)vol=.6;
let musVol=store('tay_mus');if(musVol===null)musVol=.45;
let ambVol=store('tay_amb');if(ambVol===null)ambVol=.8;
const AU={};
function initAudio(){if(AC)return;try{
  AC=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});
  const G=v=>{const g=AC.createGain();g.gain.value=v;return g};
  master=G(0);const comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=12;comp.ratio.value=3;comp.attack.value=.01;comp.release.value=.25;master.connect(comp).connect(AC.destination);
  AU.amb=G(ambVol);AU.amb.connect(master);AU.mus=G(musVol);AU.mus.connect(master);AU.fx=G(.8);AU.fx.connect(master);
  // vang nhẹ kiểu ngoài trời cho nhạc và hiệu ứng
  const ir=AC.createBuffer(2,AC.sampleRate*2.4|0,AC.sampleRate);for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2.8)}
  const rev=AC.createConvolver();rev.buffer=ir;const rg=G(.2);rev.connect(rg).connect(master);
  const ms=G(.55),fs=G(.25);AU.mus.connect(ms).connect(rev);AU.fx.connect(fs).connect(rev);
  // nhiễu trắng (hiệu ứng) và nhiễu nâu nối vòng liền mạch (gió, sóng, lửa ù)
  const n=AC.sampleRate*4;AU.noise=AC.createBuffer(1,n,AC.sampleRate);const w=AU.noise.getChannelData(0);for(let i=0;i<n;i++)w[i]=Math.random()*2-1;
  AU.brown=AC.createBuffer(1,n,AC.sampleRate);const b=AU.brown.getChannelData(0);let last=0;for(let i=0;i<n;i++){last=(last+.02*(Math.random()*2-1))/1.02;b[i]=last*3.5}
  const drift=b[n-1]-b[0];for(let i=0;i<n;i++)b[i]-=drift*i/(n-1);
  const bed=(buf,...nodes)=>{const s=AC.createBufferSource();s.buffer=buf;s.loop=true;let x=s;nodes.forEach(nd=>{x.connect(nd);x=nd});s.start(0,Math.random()*3);return x};
  const F=(type,f,q)=>{const x=AC.createBiquadFilter();x.type=type;x.frequency.value=f;if(q)x.Q.value=q;return x};
  // gió rừng thổi từng đợt
  AU.wind=G(.3);bed(AU.brown,F('lowpass',480),AU.wind).connect(AU.amb);

function tone(t,fr,v,dur,type,dest,fr2){const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(fr,t);if(fr2)o.frequency.exponentialRampToValueAtTime(fr2,t+dur*.8);

const CALM=[[98,196,246.9,293.7,392],[82.4,164.8,196,246.9,329.6],[65.4,196,261.6,329.6,392],[73.4,220,293.7,370,440]];   // G – Em – C – D

function audioSchedule(){if(!AC||!soundOn||AC.state!=='running')return;const now=AC.currentTime,ahead=now+.3,N=AU.next;

// âm lượng theo vị trí: gần lửa nghe lửa to hơn, gần hồ nghe sóng rõ hơn, trong lều thì nghe nhỏ lại
let auFrameT=0;
function audioFrame(dt){if(!AC||!soundOn)return;auFrameT-=dt;if(auFrameT>0)return;auFrameT=.2;const t=AC.currentTime,p=player?player.pos:{x:0,z:6.5};

  splash:()=>{noiseHit(t,.35,.45,'bandpass',1600,350,.9);noiseHit(t+.08,.18,.3,'highpass',3000,0,.7)},

function endActivity(silent){
  const a=activity;activity=null;clearStatus();$('#mini').hidden=true;
  if(a==='fish'){fishState='idle';bobber.visible=false;fishLine.visible=false;player.rodArm=undefined;btnHeld=false;player.drop()}
  if(a==='chop'){clearInterval(chopTimer)}
  if(a==='cook'){clearInterval(cookTimer);player.cookK=undefined}
  if(a==='conga'||a==='stars'||a==='tent'||a==='fish')player.leave();
  if(a==='hold'&&!silent){player.drop()}
  if(a==='hold'&&silent){activity='hold';showHoldStatus()}
  markBar(null);
}
function sitAt(seat){
  if(seat.taken&&seat.taken!==player){toast('Chỗ này có người rồi');return}
  endActivity(true);
  const after={blanket:startStars,tent:startTent,fish:startFish}[seat.type];
  player.goTo(seat.x,seat.z,()=>{sfx('sit');if(after&&player.seat===seat)after()},seat);
}

  if(mode!=='play')return;

  switch(a){
    case 'sit':{if(player.state==='sit'&&['log','chair','ground'].includes(player.seat.type)){player.leave();return}
      const s=nearestFree(['log','chair']);if(s&&Math.hypot(s.x-player.pos.x,s.z-player.pos.z)<4){sitAt(s);break}
      endActivity(true);player.target=null;player.sit({x:player.pos.x,z:player.pos.z,rot:player.rot,h:0,type:'ground',reach:1});sfx('sit');toast('Không có ghế gần đây, bạn ngồi xuống đất 🌿');break}

    case 'tent':{const s=nearestFree(['tent']);if(!s){toast('Lều nào cũng có người nghỉ rồi, lát quay lại nhé');return}toast('Đang đến lều');sitAt(s);break}
    case 'fish':{const s=nearestFree(['fish']);if(!s){toast('Ghế câu cá đều có người rồi');return}toast('Đang ra hồ câu cá');sitAt(s);break}

    case 'wood':endActivity();addWood();break;
    case 'party':togglePartyMode();break;

/* ---- Quầy ăn vặt + nấu nướng ---- */
const FOODS={skewer:{n:'Xiên nướng',i:'🍢',d:'Nướng trên bếp than, nhớ lật mặt',where:'grill',sides:2},corn:{n:'Ngô nướng',i:'🌽',d:'Lật đều cho vàng hai mặt',where:'grill',sides:2},potato:{n:'Khoai lang nướng',i:'🍠',d:'Nướng lâu một chút cho bùi',where:'grill',sides:2,speed:.8},mallow:{n:'Kẹo dẻo',i:'🍡',d:'Hơ chậm bên đống lửa',where:'fire',sides:1},cup:{n:'Trà gừng nóng',i:'🍵',d:'Uống luôn cho ấm bụng',where:'none'}};
function openShop(){
  openModal(`<h2>Quầy ăn vặt</h2><p class="note">Tất cả đều miễn phí. Chọn một món, bạn sẽ đặt món đang cầm xuống để lấy món mới.</p><div class="items">${Object.entries(FOODS).map(([k,f])=>`<button class="item" data-f="${k}"><i>${f.i}</i><b>${f.n}</b><span>${f.d}</span></button>`).join('')}</div><button class="ghost" id="mClose">Để sau</button>`);
  $('#mClose').onclick=closeModal;
  $('#mbox').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{const k=b.dataset.f;closeModal();player.hold(k);player.cookK=0;sfx('pop');
    if(k==='cup'){player.say('Trà gừng ấm bụng quá');setTimeout(()=>{if(player.propKind==='cup')player.drop()},6000);return}
    activity='hold';showHoldStatus()});
}
function showHoldStatus(){const f=FOODS[player.propKind];if(!f)return;setStatus(`Đang cầm ${f.n}`,[{label:f.where==='grill'?'Ra bếp nướng':'Ra đống lửa',fn:goCook}],'Bỏ xuống')}
function goCook(){
  const k=player.propKind;const f=FOODS[k];
  if(!f||f.where==='none'){toast('Lấy đồ ở quầy ăn vặt trước nhé');doAction('shop');return}
  if(f.where==='grill'){player.goTo(SPOT.grill.x,SPOT.grill.z,()=>{player.rot=SPOT.grill.rot;startCook()})}
  else{const a=Math.atan2(player.pos.z,player.pos.x)+.3;const x=Math.cos(a)*2.3,z=Math.sin(a)*2.3;player.goTo(x,z,()=>{player.rot=faceTo(x,z,0,0);startCook()})}
}
let cookTimer=null;
function startCook(){
  const k=player.propKind,f=FOODS[k];if(!f)return;activity='cook';clearStatus();
  const sides=[0,0];let cur=0;const speed=(f.speed||1)*(f.where==='fire'?.1:.13);
  const mini=$('#mini');mini.hidden=false;
  mini.innerHTML=`<h3>${f.i} ${f.where==='grill'?'Nướng':'Hơ'} ${f.n}</h3><p class="note" id="cookTip">${f.sides>1?'Lật mặt khi mặt dưới đã vàng. Lấy ra khi cả hai mặt nằm trong vùng vàng.':'Lấy ra khi kim chỉ nằm trong vùng vàng.'}</p>
  <div class="gauge"><i id="g0"></i></div>${f.sides>1?'<div class="gauge two"><i id="g1"></i></div>':''}
  <div class="row">${f.sides>1?'<button class="ghost" id="flip" style="flex:1">Lật mặt</button>':''}<button class="cta" id="takeOut" style="flex:1">Lấy ra</button></div>`;
  const show=()=>{$('#g0').style.left=`calc(${clamp(sides[0],0,1)*100}% - 2px)`;if(f.sides>1)$('#g1').style.left=`calc(${clamp(sides[1],0,1)*100}% - 2px)`;
    player.cookK=f.sides>1?(sides[0]+sides[1])/2:sides[0];const mx=Math.max(...sides.slice(0,f.sides));$('#cookTip').textContent=mx>.86?'Ôi, sắp cháy rồi!':mx>.58?'Thơm phức rồi đó…':(f.sides>1?`Đang nướng mặt ${cur+1}`:'Đang hơ trên lửa…')};
  show();
  if(f.sides>1)$('#flip').onclick=()=>{cur=1-cur;sfx('pop');player.setEmote('pull',.3)};
  $('#takeOut').onclick=()=>finishCook(f,sides.slice(0,f.sides));
  cookTimer=setInterval(()=>{sides[cur]+=speed*.1*(f.where==='fire'?(.7+fireLevel*.15):1);show();if(Math.max(...sides)>1.05)finishCook(f,sides.slice(0,f.sides))},100);
}
function finishCook(f,sides){
  clearInterval(cookTimer);$('#mini').hidden=true;activity=null;
  const burnt=sides.some(s=>s>.86),raw=sides.some(s=>s<.58);
  let msg,good=false;
  if(burnt){msg='Cháy mất rồi, huhu';sfx('bad')}else if(raw){msg='Chưa chín lắm…';sfx('bad')}else{msg='Ngon tuyệt! Vàng đều thơm phức';good=true;sfx('win')}
  const st=store('tay_cook')||{good:0,total:0};st.total++;if(good)st.good++;store('tay_cook',st);
  player.setEmote('eat',2.6);player.say(good?`${f.n} ngon quá! 😋`:msg);toast(msg+` · Bạn đã nấu ngon ${st.good}/${st.total} lần`);
  setTimeout(()=>{player.drop();player.cookK=undefined},2700);
  if(good){const b=bots.find(b=>b.pos.distanceTo(player.pos)<8);if(b)setTimeout(()=>b.say('Thơm ghê, cho mình xin miếng!'),1500)}
}

const fishCm=kg=>Math.round(28*Math.cbrt(kg));
const AMBIENT=['Một chú cá bơi ngang qua','Gợn sóng lan ra xa','Phao khẽ rung rồi im','Cá đang rỉa mồi…','Có bóng cá lớn dưới nước!'];
const bobber=new THREE.Group();bobber.add(mesh(new THREE.SphereGeometry(.07,10,8),M('#ff4a4a'),0,0,0,false));bobber.add(mesh(new THREE.SphereGeometry(.06,10,8),M('#ffffff'),0,.06,0,false));bobber.visible=false;scene.add(bobber);

let vibT=0,fishState='idle',fishT=0,biteT=0,power=0,charging=false,btnHeld=false,castT=0,castFrom=new THREE.Vector3(),castTo=new THREE.Vector3(),hooked=null,tension=.3,reel=0,slackT=0,surgeT=1,nibbles=0;
const tipV=new THREE.Vector3();
function makeFishMesh(f,kg){const g=new THREE.Group();const L=clamp(fishCm(kg)/100,.12,1.6);const col=f[5];
  if(f[0]==='Chiếc dép cũ'){g.add(mesh(new THREE.BoxGeometry(.12,.03,.28),M(col),0,0,0,false));return g}
  const body=mesh(new THREE.SphereGeometry(.5,14,10),M(col),0,0,0,false);body.scale.set(L*.32,L*.4,L);g.add(body);
  const belly=mesh(new THREE.SphereGeometry(.5,12,8),M('#efe6cf'),0,-L*.06,L*.02,false);belly.scale.set(L*.26,L*.25,L*.8);g.add(belly);
  const tail=mesh(new THREE.ConeGeometry(L*.22,L*.32,4),M(col),0,0,-L*.6,false);tail.rotation.x=-Math.PI/2;tail.scale.x=.3;g.add(tail);
  const fin=mesh(new THREE.ConeGeometry(L*.1,L*.22,4),M(col),0,L*.22,-L*.05,false);fin.scale.z=2;g.add(fin);
  [-1,1].forEach(s=>{const e=new THREE.Mesh(new THREE.SphereGeometry(L*.04+.01,8,6),new THREE.MeshBasicMaterial({color:'#111'}));e.position.set(s*L*.14,L*.06,L*.38);g.add(e)});
  return g}
function pickFish(){const tot=FISH.reduce((a,f)=>a+f[1],0);let r=Math.random()*tot;for(const f of FISH){r-=f[1];if(r<=0)return f}return FISH[0]}
function startFish(){fishStart=Date.now();activity='fish';player.hold('rod');markBar('fish');clearStatus();
  const mini=$('#mini');mini.hidden=false;
  mini.innerHTML=`<h3>🎣 Câu cá bên hồ</h3><p class="note" id="fishTip"></p>
  <div id="gPow" class="gauge" style="background:linear-gradient(90deg,#4d5a73,#7fd99a 55%,#ffcf5a 80%,#ff7a3d)"><i id="pPow"></i></div>
  <div id="gTen" hidden><div class="lbl" style="margin:0 0 4px">Độ căng dây · giữ trong vùng xanh</div><div class="gauge" style="background:linear-gradient(90deg,#5a6b8a 0%,#5a6b8a 22%,#7fd99a 22%,#7fd99a 78%,#d9493a 78%)"><i id="pTen"></i></div>
    <div class="lbl" style="margin:8px 0 4px">Kéo cá vào bờ</div><div class="gauge" style="background:#2c3550"><b id="pReel" style="display:block;height:100%;width:0;background:var(--ember)"></b></div></div>
  <button class="cta big" id="fishBtn" style="touch-action:none;user-select:none">Giữ để lấy đà</button>

  const b=$('#fishBtn');
  b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){}fishDown()});

  $('#fishBook').onclick=openFishBook;$('#fishRank').onclick=()=>openFishRank();$('#fishQuit').onclick=()=>endActivity();fishIdle()}
function fishUI(tip,btn,hot){const t=$('#fishTip'),b=$('#fishBtn');if(!t)return;t.textContent=tip;if(btn)b.textContent=btn;b.style.filter=hot?'brightness(1.3)':'';b.style.transform=hot?'scale(1.04)':''}
function showG(pow,ten){const a=$('#gPow'),b=$('#gTen');if(a)a.hidden=!pow;if(b)b.hidden=!ten}
function fishIdle(){fishState='idle';bobber.visible=false;fishLine.visible=false;player.rodArm=undefined;power=0;hooked=null;showG(true,false);if($('#pPow'))$('#pPow').style.left='0';fishUI('Giữ nút (hoặc phím Cách) để lấy đà, thả ra để vung cần. Đà càng mạnh, phao bay càng xa.','Giữ để lấy đà')}
function fishDown(){btnHeld=true;
  if(fishState==='idle'){charging=true;power=0;fishState='charge';fishUI('Đang lấy đà… thả ra để quăng!','Thả để quăng')}
  else if(fishState==='wait'||fishState==='nibble'){spook()}
  else if(fishState==='bite'){hook()}}
function fishUp(){btnHeld=false;if(fishState==='charge'){charging=false;doCast()}}
function spook(){sfx('bad');buzz(70);shake(.04,.2);toast(fishState==='nibble'?'Giật sớm quá! Cá mới rỉa mồi thôi, nó sợ bỏ đi rồi':'Chưa có cá cắn câu đâu');fishIdle()}
function rodTip(){const p=player.prop;if(!p)return tipV.set(player.pos.x,1.5,player.pos.z);p.updateMatrixWorld(true);return p.localToWorld(tipV.set(0,1.6,0))}
function doCast(){if(!player.seat){fishIdle();return}const s=player.seat;const d=1.8+power*3.6;
  castTo.set(s.x+Math.sin(s.rot)*d,.06,s.z+Math.cos(s.rot)*d);
  if(!onDock(castTo.x,castTo.z)&&lakeVal(castTo.x,castTo.z)>1){castTo.set(s.x+Math.sin(s.rot)*1.8,.06,s.z+Math.cos(s.rot)*1.8)}
  fishState='windup';castT=0;showG(false,false);fishUI('Vung cần…','…');player.rodArm=-1.0}
function fishTick(dt,t){
  if(activity!=='fish')return;
  if(fishState==='charge'){power=(Math.sin(t*3.2)+1)/2;const p=$('#pPow');if(p)p.style.left=`calc(${power*100}% - 2px)`;player.rodArm=-1.0+power*.9}
  else if(fishState==='windup'){castT+=dt;player.rodArm=-1.0+Math.min(1,castT/.35)*1.3;if(castT>.35){fishState='throw';castT=0;castFrom.copy(rodTip());bobber.visible=true;fishLine.visible=true;sfx('pop');buzz(20)}}
  else if(fishState==='throw'){castT+=dt;const k=Math.min(1,castT/.7);player.rodArm=.3-Math.min(1,castT/.15)*1.6;
    bobber.position.lerpVectors?bobber.position.lerpVectors(castFrom,castTo,k):bobber.position.copy(castTo);bobber.position.y=castFrom.y*(1-k)+.06*k+Math.sin(k*Math.PI)*1.8;
    if(k>=1){fishState='wait';fishT=rnd(2,5);nibbles=Math.floor(rnd(0,3));player.rodArm=-1.25;sfx('splash');fishUI('Quan sát phao: phao nhấp nhẹ là cá đang rỉa mồi, đừng giật. Khi phao CHÌM HẲN thì bấm Giật cần!','Giật cần!')}}
  else if(fishState==='wait'){bobber.position.y=.06+Math.sin(t*2.2)*.015;fishT-=dt;if(fishT<=0){if(nibbles>0){nibbles--;fishState='nibble';fishT=.9;buzz(18);fishUI('Phao nhấp nhấp… cá đang rỉa mồi. Bình tĩnh, chưa giật!','Giật cần!')}else if(Math.random()<.8){fishState='bite';biteT=1.3;hooked=pickFish();sfx('splash');fishUI('PHAO CHÌM HẲN! Giật cần ngay!','🎣 GIẬT CẦN!',true);buzz([90,40,90]);shake(.05,.35)}else{fishUI(pick(AMBIENT)+'…','Giật cần!');fishT=rnd(2,4);nibbles=Math.floor(rnd(0,2))}}}
  else if(fishState==='nibble'){bobber.position.y=.06-Math.abs(Math.sin(t*14))*.05;fishT-=dt;if(fishT<=0){fishState='wait';fishT=rnd(.8,2.2)}}
  else if(fishState==='bite'){bobber.position.y=-.12+Math.sin(t*20)*.03;biteT-=dt;if(biteT<=0){toast('Chậm tay rồi, cá ăn mồi xong bơi mất…');fishIdle()}}
  else if(fishState==='fight'){const f=hooked.f,str=f[4];
    const held=btnHeld||keys[' '];
    tension+=(held?(.35+str*.35):-.45)*dt;
    surgeT-=dt;if(surgeT<=0){surgeT=rnd(.6,1.6)*(1.2-str*.5);tension+=rnd(.05,.18)*(.4+str);sfx('splash');buzz(Math.round(40+str*90));shake(.03+str*.07,.3)}
    if(tension>.8){vibT-=dt;if(vibT<=0){vibT=.3;buzz(25);shake(.025,.2)}}
    tension=clamp(tension,0,1.05);
    const inZone=tension>.22&&tension<.78;
    if(inZone&&held)reel+=dt*.32/(1+hooked.kg/12);else if(!held)reel-=dt*.04*str;
    reel=clamp(reel,0,1);
    if(tension<.12)slackT+=dt;else slackT=0;
    $('#pTen')&&($('#pTen').style.left=`calc(${Math.min(tension,1)*100}% - 2px)`);$('#pReel')&&($('#pReel').style.width=(reel*100)+'%');
    bobber.position.lerpVectors?bobber.position.lerpVectors(castTo,tipV.set(player.seat.x+Math.sin(player.seat.rot)*.6,-.05,player.seat.z+Math.cos(player.seat.rot)*.6),reel):0;
    bobber.position.x+=Math.sin(t*7)*.08*str;bobber.position.y=-.05;
    player.rodArm=-1.6-tension*.6+Math.sin(t*18)*.04*tension;
    fishUI(tension>.78?'Dây căng quá! Thả tay ra kẻo đứt!':tension<.22?'Dây chùng rồi, giữ nút để kéo!':held?'Đang kéo… giữ dây trong vùng xanh':'Đang nhả dây…',held?'Đang kéo…':'Giữ để kéo dây',tension>.78);
    if(tension>=1){sfx('bad');buzz([260,70,260]);shake(.16,.5);toast('PHỰT! Dây đứt rồi… '+(hooked.kg>10?'Con này to thật đó!':'Thử lại nhé'),3500);fishIdle()}
    else if(slackT>1.4){toast('Dây chùng quá lâu, cá giãy thoát mất rồi');fishIdle()}
    else if(reel>=1)landFish()}
  if(fishLine.visible&&player.prop){const a=rodTip(),b=bobber.position;const sag=fishState==='fight'?.05:.5;
    for(let i=0;i<16;i++){const k=i/15;linePts[i*3]=a.x+(b.x-a.x)*k;linePts[i*3+1]=a.y+(b.y-a.y)*k-Math.sin(k*Math.PI)*sag;linePts[i*3+2]=a.z+(b.z-a.z)*k}lineGeo.attributes.position.needsUpdate=true}
}
function hook(){const f=hooked;const kg=Math.round(rnd(f[2],f[3])*100)/100;hooked={f,kg};fishState='fight';tension=.4;reel=0;slackT=0;surgeT=1;vibT=0;buzz([160,50,100]);shake(.13,.45);showG(false,true);player.setEmote('pull',.4);sfx('chop');

let photoMode=0,photoHidden=[];
// ẩn bảng tên, bong bóng chat, biển chữ và người đứng chắn giữa máy ảnh với nhân vật (gọi mỗi khung hình khi chụp)
function photoHide(d){scene.traverse(o=>{if(o.isSprite&&o.visible&&o.material.map&&o.material.map!==glowTex){o.visible=false;photoHidden.push(o)}});
  for(const a of actors){if(a===player||!a.g.visible)continue;const dc=Math.hypot(a.pos.x-camera.position.x,a.pos.z-camera.position.z),dp=Math.hypot(a.pos.x-player.pos.x,a.pos.z-player.pos.z);if(dc<d-.2||dp<.9){a.g.visible=false;photoHidden.push(a.g)}}}
// dựng cảnh chụp: bật bộ đèn chụp, ống kính chân dung; tắt thì trả lại mọi thứ đã ẩn
function photoStage(on){
  if(on){photoHidden=[];photoHide(0)}
  else{photoHidden.forEach(o=>o.visible=true);photoHidden=[]}

// lưu ảnh về máy: điện thoại mở bảng chia sẻ (Lưu ảnh / Zalo / Messenger…), máy tính tải file JPG
async function savePhoto(url,fish){const fname=`trai-an-yen-${norm(fish).replace(/ /g,'-')||'ca'}-${Date.now()}.jpg`;
  try{const blob=await (await fetch(url)).blob(),file=new File([blob],fname,{type:'image/jpeg'});
    if(matchMedia('(pointer:coarse)').matches&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Trại An Yên HiHi',text:'Mình vừa câu được '+fish+' ở Trại An Yên 🎣'});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=url;a.download=fname;document.body.append(a);a.click();a.remove();toast('Đã lưu ảnh '+fname)}

let convo=null,convoCD=6,pendingQ=null,askCD=50,arriveCD=rnd(60,110),leaveCD=rnd(140,220);
function fill(t,cast,b){return t.replace(/\{P\}/g,player.c.name).replace(/\{A\}/g,cast&&cast[0]?cast[0].c.name:'').replace(/\{B\}/g,cast&&cast[1]?cast[1].c.name:'').replace(/\{C\}/g,cast&&cast[2]?cast[2].c.name:'').replace(/\{N\}/g,b?b.c.name:'').replace(/\{CITY\}/g,pick(CITIES))}
function act(b,line,cast){if(!b)return;b.say(fill(line[0],cast,b));if(line[1])b.setFace(line[1],3.5);if(line[2])b.setEmote(line[2],line[2]==='dance'?3:2)}
function faceEach(b,o){if(!b||!o||b.state==='sit'||b.state==='conga')return;b.rot=faceTo(b.pos.x,b.pos.z,o.pos.x,o.pos.z)}
function talkable(){return bots.filter(b=>b.g.visible&&!(b.seat&&b.seat.type==='tent'))}
function nearestBot(to,ex){let best=null,bd=1e9;for(const b of talkable()){if(b===ex)continue;const d=b.pos.distanceTo(to.pos);if(d<bd){bd=d;best=b}}return best}
function startConvo(){const pool=talkable();if(pool.length<2)return;const s=pick(SCRIPTS);const need=Math.max(...s.map(l=>l[0]))+1;if(pool.length<need)return;
  const a=pick(pool);const others=pool.filter(b=>b!==a).sort((x,y)=>x.pos.distanceTo(a.pos)-y.pos.distanceTo(a.pos));const cast=[a].concat(others.slice(0,need-1));
  convo={s,cast,i:0,t:.3}}
function npcTick(dt,t){
  if(convo){convo.t-=dt;if(convo.t<=0){const l=convo.s[convo.i];if(!l){convo=null;convoCD=rnd(8,20)}else{const sp=convo.cast[l[0]];if(!sp||!bots.includes(sp)){convo=null;return}
      act(sp,[l[1],l[2],l[3]],convo.cast);convo.cast.forEach(o=>{if(o!==sp)faceEach(o,sp)});faceEach(sp,convo.cast[l[0]===0?1:0]);
      convo.i++;convo.t=2+l[1].length*.055+rnd(0,1)}}}
  else{convoCD-=dt;if(convoCD<=0){convoCD=rnd(6,14);startConvo()}}
  // hỏi han người chơi
  askCD-=dt;if(askCD<=0&&!pendingQ&&!convo&&!activity){askCD=rnd(70,130);const b=nearestBot(player);if(b&&b.pos.distanceTo(player.pos)<16){const q=pick(PLAYER_QS);faceEach(b,player);act(b,[q[1],'happy','wave']);pendingQ={b,type:q[0],until:t+40}}}
  if(pendingQ&&t>pendingQ.until)pendingQ=null;
  // người mới vào / rời trại
  arriveCD-=dt;if(arriveCD<=0){arriveCD=rnd(80,150);if(bots.length<12)npcArrive()}
  leaveCD-=dt;if(leaveCD<=0){leaveCD=rnd(150,260);if(bots.length>4)npcLeave()}
}
function npcWelcome(who){const greeters=talkable().sort((a,b)=>a.pos.distanceTo(who.pos)-b.pos.distanceTo(who.pos)).slice(0,3);
  greeters.forEach((b,i)=>setTimeout(()=>{if(!bots.includes(b))return;faceEach(b,who);const w=pick(WELCOME);act(b,[w[0].replace(/\{P\}/g,who.c.name),w[1],w[2]])},i*1800+rnd(0,600)));
  if(who===player)setTimeout(()=>{const b=greeters[0];if(b&&bots.includes(b)){const q=pick(PLAYER_QS);act(b,[q[1],'happy']);pendingQ={b,type:q[0],until:clock.elapsedTime+45}}},greeters.length*1800+1500)}
function npcArrive(){const used=new Set(bots.map(b=>b.c.name));const n=BOT_NAMES.concat(['Gấu Con','Sương','Bi','Nắng','Su Hào']).find(x=>!used.has(x));if(!n)return;
  const b=new Actor(randCfg(n),false);b.pos.set(rnd(-.6,.6),0,19);b.rot=Math.PI;b.think=8;bots.push(b);updateCampBtn();
  sysLog(n+' vừa vào trại');b.goTo(rnd(-3,3),5.5,()=>{b.setEmote('wave');b.say(pick(['Chào cả nhà! 👋','Hello mọi người, cho mình ngồi ké với','Hi hi, mình mới tới nè']));b.setFace('happy',3);
    setTimeout(()=>{const others=talkable().filter(x=>x!==b).sort((x,y)=>x.pos.distanceTo(b.pos)-y.pos.distanceTo(b.pos)).slice(0,2);others.forEach((o,i)=>setTimeout(()=>{if(!bots.includes(o))return;faceEach(o,b);const w=pick(WELCOME);act(o,[w[0].replace(/\{P\}/g,n),w[1],w[2]])},i*1700))},1500)})}
function npcLeave(){const b=pick(talkable().filter(x=>!(convo&&convo.cast.includes(x))&&!(pchat&&pchat.members.includes(x))));if(!b)return;
  act(b,[pick(['Thôi mình đi ngủ đây, chúc cả nhà ngủ ngon nha 🌙','Mình về trước nha, mai gặp lại!','Buồn ngủ quá, bye mọi người 👋']),'happy','wave']);

  setTimeout(()=>{if(!bots.includes(b))return;b.drop();b.think=999;b.goTo(rnd(-.5,.5),20,()=>{b.leave();scene.remove(b.g);actors.splice(actors.indexOf(b),1);bots.splice(bots.indexOf(b),1);sysLog(b.c.name+' đã rời trại');updateCampBtn()})},3500)}
function sentiment(v){if(/(buồn|mệt|chán|khóc|tệ|không ổn|ko ổn|cô đơn|áp lực|stress|lo)/i.test(v))return 'sad';if(/(vui|ổn|tốt|khỏe|tuyệt|yay|hạnh phúc|ok|được)/i.test(v))return 'good';return 'mid'}
function npcRespond(v){
  const low=v.toLowerCase();
  const named=talkable().find(b=>low.includes(b.c.name.toLowerCase()));
  // trả lời câu hỏi bot vừa hỏi
  if(pendingQ&&bots.includes(pendingQ.b)&&!named){const b=pendingQ.b,ty=pendingQ.type;pendingQ=null;const se=sentiment(v);let line;
    if(ty==='first')line=/(có|ừ|đúng|uh|vâng|lần đầu|yes)/i.test(v)?['Vậy chào mừng {P} nha! Có gì không biết cứ hỏi tụi mình','laugh','clap']:['Ồ người quen rồi, chào mừng quay lại 😆','happy','wave'];
    else if(ty==='mood')line=se==='sad'?['Thương {P} ghê… Ngồi đây với tụi mình, mọi chuyện rồi sẽ nhẹ hơn 🤗','sad']:se==='good'?['Nghe vậy mừng ghê! Giữ năng lượng tốt đó nha','laugh','clap']:['Ừm, có gì muốn kể cứ nói nha {P}','happy','nod'];
    else if(ty==='from'){const c=CITIES.find(c=>low.includes(c.toLowerCase()))||(/(sg|sài gòn|hcm|hồ chí minh)/i.test(v)?'Sài Gòn':/(hn|hà nội)/i.test(v)?'Hà Nội':null);line=c?[`Ồ ${c} hả! Mình từng đi ${c}, đồ ăn ngon dã man`,'surprise']:['Nghe lạ ghê, chắc ở đó đẹp lắm ha','happy']}
    else if(ty==='food')line=/(có|ok|đi|ừ|yes|được)/i.test(v)?['Đi thôi! Ra quầy ăn vặt lấy xiên rồi qua bếp nướng nha','laugh','clap']:['Ok, lúc nào đói thì rủ mình nha','happy'];
    else line=se==='sad'?['Ôm {P} cái 🤗','sad']:['Hay ghê! {P} kể thêm đi','happy','nod'];
    setTimeout(()=>{faceEach(b,player);act(b,line)},rnd(1100,2000));
    if(Math.random()<.5)setTimeout(()=>{const o=nearestBot(player,b);if(o){faceEach(o,player);act(o,pick(FALLBACK))}},rnd(3500,4800));return}
  const b=named||nearestBot(player);if(!b)return;
  let found=null,mood=null;for(const it of INTENTS){if(it[0].test(v)){found=it[1];mood=it[2];break}}
  const line=found?pick(found):pick(FALLBACK);
  setTimeout(()=>{faceEach(b,player);act(b,[fill(line[0],null,b),line[1],line[2]])},rnd(1000,2000));
  if(mood==='sad'||Math.random()<.35){const o=nearestBot(player,b);if(o)setTimeout(()=>{faceEach(o,player);const l2=mood==='sad'?pick([['Tụi mình ở đây với {P} nè 💛','sad'],['Mai sẽ tốt hơn thôi {P}','happy'],['Muốn đi thả đèn ước không, nhẹ lòng lắm','happy']]):pick(FALLBACK);act(o,[fill(l2[0],null,o),l2[1],l2[2]])},rnd(3200,4500))}

const skyTex=(()=>{const cv=document.createElement('canvas');cv.width=64;cv.height=80;const x=cv.getContext('2d');const g=x.createLinearGradient(0,0,0,80);g.addColorStop(0,'#ffcf7a');g.addColorStop(.5,'#fff1c9');g.addColorStop(1,'#ffb35a');x.fillStyle=g;x.fillRect(0,0,64,80);x.strokeStyle='rgba(150,80,20,.55)';x.lineWidth=2;x.beginPath();x.moveTo(24,30);x.lineTo(40,30);x.moveTo(32,24);x.lineTo(32,52);x.moveTo(22,44);x.quadraticCurveTo(32,54,42,44);x.stroke();return new THREE.CanvasTexture(cv)})();

  for(let i=0;i<8;i++){const a=i/8*Math.PI*2;const p=new THREE.Mesh(new THREE.ConeGeometry(.09,.3,4),i%2?pm:pm2);p.position.set(Math.cos(a)*.15,.1,Math.sin(a)*.15);p.rotation.set(Math.sin(a)*.7,0,-Math.cos(a)*.7);g.add(p)}

function lanternTick(dt,t){for(const L of lanterns){
  if(L.sky){const b=L.base;const tx=b.x+Math.sin(t*.12*L.sp+L.ph)*1.2,ty=b.y+Math.sin(t*.4*L.sp+L.ph)*.5,tz=b.z+Math.cos(t*.1*L.sp+L.ph)*1.2;
    if(L.launch>0){L.launch-=dt*.07;const k=dt*.25;L.g.position.x+=(tx-L.g.position.x)*k;L.g.position.y+=(ty-L.g.position.y)*k*1.2;L.g.position.z+=(tz-L.g.position.z)*k}
    else{L.g.position.x+=(tx-L.g.position.x)*dt;L.g.position.y+=(ty-L.g.position.y)*dt;L.g.position.z+=(tz-L.g.position.z)*dt}
    const s=2.4+Math.sin(t*3+L.ph)*.25;L.g.userData.flame.scale.set(s,s,1);continue}

  if(L.launch>0){L.launch-=dt*.25;const k=Math.max(0,L.launch);L.g.position.x+=(p.x-L.g.position.x)*dt*.4*(1-k*.5);L.g.position.z+=(p.z-L.g.position.z)*dt*.4*(1-k*.5)}
